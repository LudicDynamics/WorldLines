name: cla

# Contributor License Agreement check (CLA.md at the repository root).
# A contributor signs once by commenting the sentence below on a pull request; signatures are stored as JSON on the
# `cla-signatures` branch of this repository (create it once before enabling this workflow; keep it unprotected).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # pull_request_target runs with write access: this job never checks out or runs code from the pull request.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/LudicDynamics/WorldLines/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: nikoloside,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/LudicDynamics/WorldLines/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
