name: test

# The public repository's CI only tests (releases are cut upstream and published from there).
# Layout: neonrp/ (engine) · worldlines/ (product; web UI in worldlines/ui) · documents/ · benchmarks/
# Browser e2e (neonrp/scripts/e2e.sh) is not run here yet: its cases open worlds this repository does not ship.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ${{ matrix.os }}
    # Windows runs but does not fail the check yet: timing, path-separator and BOM assumptions in some tests.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: neonrp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest -q
        env:
          NEONRP_E2E_LLM: "0"

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldlines/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worldlines/ui/package-lock.json
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm run build:local
