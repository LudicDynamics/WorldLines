<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>WorldLines</title>
<style>
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    background: #0A0A0A; color: #F5F5F7;
    font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif;
  }
  .box { text-align: center; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  .logo span { color: #34E879; }
  .msg { margin-top: 12px; font-size: 12px; color: #6E6E76; font-family: ui-monospace, monospace; }
  .dot { display: inline-block; animation: pulse 1.2s infinite; color: #06B6D4; }
  @keyframes pulse { 50% { opacity: .2; } }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">World<span>Lines</span></div>
    <div class="msg"><span class="dot">●</span> 引擎启动中…</div>
  </div>
  <script>
    const err = new URLSearchParams(location.search).get('error')
    if (err) document.querySelector('.msg').textContent = '引擎启动失败:' + err
  </script>
</body>
</html>
