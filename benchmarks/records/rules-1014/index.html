id": "S4·0", "kind": "opening", "input": "开始游戏", "ms": 13833, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "S4·1a", "kind": "plan", "input": "@守门人 河灯旅店怎么走？我累垮了，想赶紧开间房睡到明天早上。", "ms": 26618.1, "narration": "河灯旅店在主街，进北门一直走、过集市广场就到；通铺 3 金，单间 8 金。这儿就她一个人，你问的我也替你答了。\n艾琳娜:「顺路，我刚从驿路上下来。河灯旅店沿主街走到底就能看见灯笼，我正要去那边，一起走。」\n那就一块走：沿主街过集市广场，到河灯旅店开房，睡到明早。单间 8 金、通铺 3 金，到了柜上你挑。", "refused": []}, {"id": "S4·1b", "kind": "resolve", "input": "", "ms": 113482, "narration": "你和艾琳娜沿主街往南走。石板路上还积着夜里的水，靴底踩上去闷响。\n集市广场的棚子陆续支起来，鱼贩把木箱从板车上搬下，腥味混进雾里。\n艾琳娜:「公会那边贴过几张告示，雾里失踪的、苔墓边的狼。想接活得先去登记。」\n她把这话说完，自己也朝公会那方向多看了一眼，像在心里记了一笔。\n主街尽头挂着一串褪色的灯笼，白天没点。门楣上刻着「河灯」，笔划被海风磨浅了。\n你推门进去。炉膛里的火刚烧起来，柜台后的女人正擦杯子。\n米拉:「单人房八金一晚，通铺三金。要哪样。」\n你把八枚金币推过去，说要单间。\n米拉数完钱，从钉子上取下一把钥匙。「二楼左手第二间，热水在楼下灶上。雾大别开窗，湿气进来被子要馊。」\n她顿了顿，抬头看了你一眼。「新来的吧。公会开门早，明儿要去就趁早。」\n你上楼，闩上门，斗篷都没解就倒进床里。床架上有股油烟味。\n再睁眼时窗外已经亮了一层，镇署方向的钟声敲过来——整夜睡过去，腿上那股沉松了些。\n\n// 异地 · 罗文 @ 碧石镇:「老板，来碗热的——顺便问一句，最近有没有人从北边矿道第三层爬上来，脸白得跟这雾似的？」我把铜板按在柜台上，眼睛扫过角落那几张桌子，谁在听、谁在装没听见，一眼…", "refused": []}]}, {"id": "ID1", "title": "[身份与指代] 两人中毒各自解毒", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "player_poison_gone": {"pass": true, "got": "null"}, "elena_poison_gone": {"pass": true, "got": "null"}, "herbs_used": {"pass": true, "got": "0"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID1·0", "kind": "opening", "input": "开始游戏", "ms": 10108, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID1·1", "kind": "plan", "input": "②，我先去跟守门人搭话——我身上带着两株解毒草，得赶紧找到艾琳娜，她跟我一样中了毒。我问他：镇上有没有见过一个叫艾琳娜的人？", "ms": 26146, "narration": "守门人打了个哈欠:「艾琳娜?没印象,我今早刚换班。」你旁边就站着个年轻女人,她听见了。\n艾琳娜:「你要找的人就站在你面前，我就是艾琳娜。你从哪儿听来这个名字的？」\n她就是艾琳娜。她想知道你是从哪儿听来这名字的。你：① 说实话——你什么都不记得 ② 先递解毒草 ③ 说雾里捡到的名字", "refused": []}, {"id": "ID1·2a", "kind": "plan", "input": "名字的事我真说不清，我连自己是谁都想不起来了——但我知道咱俩身上都中了毒。我背包里有两株解毒草，先给你一株，你嚼下去；我自己也嚼一株，别的等解了毒再说。", "ms": 70903.4, "narration": "草递过去了，她没伸手——她还想弄清你是谁。等她开口。\n艾琳娜:「我胃里确实翻，也冒冷汗——可你怎么知道是我中的毒，又怎么知道这草正好管用？这两件事你要是答不上来，我就得掂量掂量。」「草我嚼。不过丑话说前头：我要是倒下，你这张脸明天就贴在镇上每一扇门上。」\n那就当面嚼：你跟她一人一株解毒草，守门人在旁边看着。名字和来历那些答不上来的，咽完这口再说。", "refused": []}, {"id": "ID1·2b", "kind": "resolve", "input": "", "ms": 194471, "narration": "解毒草掐在指间，茎上有层细白绒毛，嚼开又苦又凉，顺着舌根往喉咙里钻。\n你咬下去，咽了。胃里先是一阵酸，接着那点翻搅像被冷水压住，冷汗退了，只剩一层薄薄的湿。\n她也嚼了。嚼的时候她不看草，看你。\n咽下去，喉头动了一下。她退开两步，手没离开腰侧，那里露出一截刀柄。\n雾没散。守门人靠着栅栏又打了个哈欠，目光在你们两个人脸上来回扫。\n毒压下去了，事情却还没过去。她等你先开口，脸上的盘算没藏。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天，酒馆里的舌头最松。」我把斗篷领子拢紧，没急着接活，先往公会门口那张贴满传闻的木栏边站了站——听人提矿道第三层的时候，谁的声音会低下去。", "refused": []}, {"id": "ID1·3", "kind": "plan", "input": "草都咽下去了，别的先不掰扯——你现在胃里还翻吗？我这边冷汗退了，喉咙那点凉劲还在。要是你也不难受了，这毒就算压住了，你告诉我一声。", "ms": 18055, "narration": "草咽下去了，你俩都没再吐。先听她说缓没缓过来。\n艾琳娜:「压住了。冷汗退了，喉咙那点凉还在，不碍事。」「草我咽了，你的话也该接着说了——你是谁，谁让你来找艾琳娜，找我做什么。\n她说毒压住了。可她要的是你的来历：你是谁、谁让你来找艾琳娜、找她做什么。你自己都记不得——① 直说失忆 ② 编个来路 ③ 反问她在北门等谁", "refused": []}, {"id": "ID1·4", "kind": "plan", "input": "草都咽下去了，你胃里不翻、我也不冒冷汗，毒就算解了——名字的事我是真答不上来，那口凉劲还在喉咙上呢，别的不急。", "ms": 29858, "narration": "你答了「答不上来」。看她认不认这句话。\n艾琳娜:「草解了毒，答不上来的名字可解不了我的疑心。」「你要么现在说清谁让你来找艾琳娜、找我做什么；要么我进镇，你跟不跟随你——北门不是说话的地方，街上也不是。」\n她盯着你的脸,要从那句「答不上来」里分出是装的、记不得还是不肯说。她只给两条:现在说清,或者进镇、跟不跟随你。你怎么答——① 直说失忆 ② 编个来路 ③ 先进镇,路上再说", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": true, "got": "3"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 5838, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1", "kind": "plan", "input": "③ 走向镇中央，先找杂货铺在哪。", "ms": 19865, "narration": "顺着主街往南走就是集市广场，杂货铺在广场西角，走过去十来分钟。艾琳娜跟你同路。\n艾琳娜:「我跟你一段路——不过先绕去公会看看，晨间的委托刚挂出来，晚一步就只剩别人挑剩的。你要找杂货铺，主街尽头那家开门最早，走那条道顺路。」\n艾琳娜想先绕去公会扫委托板，说顺路；你原本是要找杂货铺。① 跟她先去公会 ② 直奔杂货铺 ③ 分头，各走各的", "refused": []}, {"id": "ID2·2a", "kind": "plan", "input": "② 谢了，我先不绕公会——直接带我去杂货铺吧，我有东西赶着买。", "ms": 23066.4, "narration": "她带路，你跟着走。她自个儿那趟公会还没搁下——问问她怎么打算。\n艾琳娜:「行，那就先走杂货铺，主街尽头那家开门最早，路也好认。送你到门口我就折去公会——半个时辰的事，晨板子还不至于被挑空。」\n那就走。她带你沿主街到杂货铺门口，送到就自己折去公会看委托板。", "refused": []}, {"id": "ID2·2b", "kind": "resolve", "input": "", "ms": 79644, "narration": "雾还没散，主街尽头的石板湿得发亮。\n走到广场西角，杂货铺的门板刚卸下一半，里头点着灯。\n艾琳娜在门口停住脚。\n「就这儿。我去公会了——晨板子不等人。你要还留在镇上，码头或者河灯旅店碰得着。」\n她说完就往北折回去，走得很快，斗篷角在雾里晃了两下就没了。\n柜台后面的老头抬眼，把你从头到脚看了一遍，看你腰上那把短剑的时间比看你的脸长。\n「新面孔。买还是光看？」\n他把货一样样报出来，嘴没停过：小治疗药水十二金，火把两金，麻绳四金一捆，解毒剂十金。报完又添一句，说雾季里火把比药水好卖。\n\n// 异地 · 罗文 @ 碧石镇:先来碗热的，往公会墙角一坐，耳朵支起来听矿工们怎么绕开第三层那个话题——越不肯说的，越值钱。 「谁要是有胆子讲深洞的事，酒钱我出；讲得比我听说过的还离谱，我再…", "refused": []}, {"id": "ID2·3", "kind": "plan", "input": "继续。", "ms": 19953, "narration": "老头还在等你开口。货就这几样：药水十二金、火把两金、麻绳四金、解毒剂十金。你打算：① 买点什么 ② 去码头问失踪的事 ③ 去公会对晨板子\n老苇把抹布往肩上一搭：「进雾还是下墓？火把先备两把不吃亏。」你：① 掏钱买 ② 先问他苔墓的传闻 ③ 转头去公会", "refused": []}, {"id": "ID2·4", "kind": "plan", "input": "我先不买你报的这些——你店里有没有止血草束？就是一束晒干的那种草，我要再买一束，跟这个一模一样的。", "ms": 33164, "narration": "老苇捏起你手里那束草凑到鼻尖闻了闻：「止血草我这儿不卖干的——收来没人要，容易霉。」他把抹布一甩，「米拉旅店后厨常备一小把，你去找她问问。」你：① 去河灯旅店 ② 就在这儿买点火把 ③ 直接去码头", "refused": []}, {"id": "ID2·5a", "kind": "plan", "input": "那行，你说的米拉——河灯旅店在哪儿？我这就过去，她后厨那把草肯匀我一束，我照价付钱，不白拿。", "ms": 33079.8, "narration": "河灯旅店在主街西头、挨着码头，走十分钟。过去找米拉，问后厨那把止血草匀一束，照价付钱。\n河灯旅店在主街西头、挨着码头，走十分钟就到。进门找米拉，问后厨那把止血草能不能匀你一束，你照价付。\n那就这么办——河灯旅店在主街西头、挨着码头，走过去十分钟。到那儿跟米拉开口，要她一束止血草，照价付钱。这得掷一下。", "refused": []}, {"id": "ID2·5b", "kind": "resolve", "input": "", "ms": 117494, "narration": "[旅人 CHA(请米拉匀一束止血草): 9+0=9 >= 8] → 成功\n\n河灯旅店的门帘一掀，鱼汤味和松木柴的烟一起贴上脸。\n柜台后是个圆脸女人，正把一只酒壶往架子上摆。\n「米拉？」\n「我就是。住店还是吃饭？」\n你把来意说了——后厨那把晒干的止血草，匀一束，照价付钱，不白拿。\n她盯了你两秒，转身进后厨。出来时手里一小把草，麻线捆着，颜色比你那束深。\n「后厨那点本来给厨子烫伤用的，匀你一半。五个铜板。」\n草搁在柜台上，她没急着伸手收钱。\n「看你这身，是打算往苔墓那边去。码头前两天下雾丢了个搬运工，公会还挂着赏。你要是走那条路，顺手帮我打听一句——丢的是我表弟，叫奥克。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:推门进公会，靴底的雾水在门垫上蹭了两下，先去板前把还挂着的那几张扫了一遍。Q001 还在——雾中失踪者，码头区。「赫伦，雾里失踪那个，我接。登记要什么手续？」\n// 异地 · 罗文 @ 碧石镇:（热汤压手，我挑了离炉子最近、也离那些一下压低嗓门的矿工最近的墙位坐下，汤勺慢慢搅，眼睛没停。） 「第三层那动静——是像风钻石头，还是像石头里有什么在喘气?」…", "refused": []}, {"id": "ID2·6a", "kind": "plan", "input": "草我要了，五个铜板——不过你要是能整把都匀我，我出十个铜板，我要的就是一整束。奥克的事我记下了，路上有信儿帮你带回来。", "ms": 12221.5, "narration": "米拉：「行，十个铜板，整把都给你，厨子那点我再想别的。奥克的事你记住——码头，雾，前两天下。」说定：一整束止血草十个铜板；路上有奥克的消息，带回河灯旅店。", "refused": []}, {"id": "ID2·6b", "kind": "resolve", "input": "", "ms": 101754, "narration": "你数出四枚铜板搁在柜台上，又从钱袋里拈出一枚银币推过去。米拉把银币收进围裙口袋。\n「一银顶十铜，正好，铜板你收着。」\n她把麻线捆好的那一整束搁进你手里——比你自己带的厚实，草茎上还留着后厨的烟火气。\n「潮气重的地方别贴着肉放，返潮就废了。」\n她看着你把草塞进斗篷内层，又拿抹布擦了擦手。\n「奥克是七天前那趟活，卸完一船咸鱼，雾从河面翻上来，人就没再点过名。公会牌子上挂着『丢失搬运工』的条子。你真要往码头去，找管装卸的老船工，姓岑的那个——最后跟他搭过话的是他。」\n[~patch NPC003 约定=旅人答应打听奥克下落并回报,已收一整束止血草(一银)\n\n// 异地 · 艾琳娜 @ 冒险者公会:趁赫伦翻登记簿的空当，我把随身的布袋搁上台面点了点——干绷带还剩两卷，止血的草药粉也见底了。「登记费要几个铜子？还有——码头那案子，之前有没有人下去找过？我不…\n// 异地 · 罗文 @ 碧石镇:（银币转停了，没人伸手，我就把它按回掌心——不拿钱的人，嘴上会更松。）「不拿也行。那换个问法：第三层的活儿，公会牌子挂了两天没人揭，是没人敢，还是有人不让揭？…", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 20088, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "③，我直接往镇中央走，先找找冒险者公会在哪儿，进去看一眼。", "ms": 13655.2, "narration": "往镇中央走几分钟就是主街，公会在主街那头。艾琳娜也站在门口没走开——顺嘴问一句。\n艾琳娜:「行，一道走——我正好也要去公会。」「不过先说在前头，我身上没什么钱，路上要是有人要收什么引路费，我可不掏。」\n那就一道走主街去公会，进门看委托板。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 58771, "narration": "你沿主街往镇中央走。雾贴着屋檐往下滴水，石板缝里全是湿的，踩上去没有声响。\n艾琳娜走在你半步之后，手插在斗篷里，眼睛扫着两侧的门脸，一路没说话。\n公会在主街尽头：一栋两层的木石房子，门楣上挂着一面褪色的剑盾徽。门开了一条缝，里面透出炭火味。\n你推门。前厅不大，半面墙钉着委托板，几张纸被图钉压着。柜台后坐着一个上了年纪的男人，正用一块布擦旧皮手套。他抬眼把你们两个从头到脚看了一遍，没起身。\n「新来的。」\n「登记五十枚铜。接活，看你们有没有本事。」\n他说完就低头继续擦手套，好像这已经是他今天说的第二十遍。\n委托板上三张纸。第一张写码头区有人失踪，找回遗物或线索。第二张写通往苔墓的小径上出现野兽，清理三次遭遇。第三张被单独用一颗铜钉压着，红边，角落写着一个字：锁。\n艾琳娜站到板前，逐张看过去，眉毛动了一下，没伸手去揭。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天，正是听故事的好时候——只不过得先知道谁在讲真话。」我把领口拢了拢，往公会那边走，顺便留意矿工们今早的脸色：第三层的怪声，听起来比六十金有意思得多。", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "先不接，我出去主街上转一圈再说。", "ms": 17273.5, "narration": "公会门口就是主街。那三张纸艾琳娜看了挺久，先听她一句。\n艾琳娜:「我不出去。五十铜我现在掏不出来，但板上那三张，我至少得先问清楚哪张不预收登记费、哪张有预付。」「你先去转你的，我留下来问赫伦几句——回头在主街哪家铺子碰头？」\n艾琳娜留在公会问赫伦，你自己出去转。", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 46281, "narration": "你沿主街往回走。雾比清早薄了些，屋檐滴水的节奏也慢了。铺子陆续卸下门板，木轮推车的响声从集市广场那边过来。\n杂货铺门口堆着盐袋、成捆的麻绳和几把锈镰刀，屋里有人低声讲价。招牌是块旧木板，字被雨冲得发白。\n往前走是河灯旅店，窗台上还亮着昨夜的灯。再过去，镇署门前的木栏上，一个文书模样的人正拿锤子钉一张新告示，钉完退开半步看了看，走了。\n主街尽头左拐是去码头的方向，那里的雾更浓，能听到水拍木桩，还有人在拖什么重物，一下，一下。\n你转了一圈，把这条街的底细看了个大概：公会、旅店、杂货铺、镇署，都挨得近，码头在最东头。\n公会的门还关着一条缝，里面透出炭火味。艾琳娜还没出来。\n\n// 异地 · 罗文 @ 碧石镇:公会门口的木牌被雾气泡得发软，我靠着门框听了一耳朵——矿工们嘴里的「第三层怪声」讲得比六十金还玄。趁他们换杯的间隙我插了句：「东边那条旧巷道，最近有没有人往底…", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "别的不看了，我这就回刚才那个工会去。", "ms": 2443.0, "narration": "好，回公会。赫伦还在里头，门开着一条缝。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 34074, "narration": "公会前厅里炭火添过了，比刚才暖一点。艾琳娜站在委托板前，手里捏着一小片折过的纸，像是从哪儿撕下来的。她回头，看了你一眼。\n「回来了。」\n赫伦从柜台后站起身，两只手撑在台面上。他比刚才肯多说话了——大概是艾琳娜磨了他这一会儿。\n「三张里头，头上两张不预收登记费，赏金结算时先扣。」他竖起一根手指，「会说话的那张，红边的，押金要另算，而且得先有人肯听你说完再放。」他把手放下，「失踪那张，问你回不回遗物。狼嚎那张，问次数，三次，少了不算。」\n他顿了一下，看你：「你们两个人。要么分头，要么一起。一起算一份，价钱不变。」\n艾琳娜把那张折纸塞回斗篷里，没摊给你看。她侧过身，等你先开口。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦先生，板上这三张——雾中失踪、苔墓狼嚎、还有那张棺木调查，哪张不用先交登记费？哪张有预付？」 「我不是来赊人情的，我是来干活的。五十铜我掏不出来，这是实…\n// 异地 · 罗文 @ 碧石镇:杯底剩的那口我没喝，搁在桌上，看的是方才第一个移开眼睛的老矿工——他手背上有道新鲜划痕，像被什么从下面抓过。「谢了，诸位。」我笑了一下起身，「雾散之前我正好绕…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 11091, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1a", "kind": "plan", "input": "④ 先观察雾中的街道和旅店灯光——不过我更想直接往那盏橙灯走，那是旅店吧？我推门进去找个人。", "ms": 8761.8, "narration": "旅店在镇子中间，从北门走过去也就一刻钟。你朝那盏橙灯过去，推门进店。", "refused": []}, {"id": "ID4·1b", "kind": "resolve", "input": "", "ms": 55273, "narration": "主街不长，石板缝里汪着水。那盏橙灯挂在河灯旅店门口，灯罩上画着一条鱼。\n你推门进去，暖气、油烟、湿羊毛的味道一起涌出来。屋里只坐了半桌人——两个码头工伏在碗上啃鱼干，一个披斗篷的老妇在角落里烤手。\n柜台后的女人四十上下，袖子卷到手肘，正拿布擦一只锡杯。\n「欢迎，生面孔。」她抬眼。那一眼不算客气，也不算刁难，只是把你从头到脚过了一遍。\n「找人的话，说清楚找谁。住店的通铺三枚，单间八枚，先付。」\n你身后门轴又响了一声，冷雾跟着挤进来一小股。艾琳娜抖了抖斗篷上的水，站在门里没往里走，目光先在屋里扫了一圈,才落到你身上。\n「你先。」她说。\n\n// 异地 · 罗文 @ 碧石镇:雾还没散，公会门口已经有人进进出出——比酒馆可靠，比教堂有味道，我先来这儿。手指敲了敲任务板：「矿道第三层的异响，六十金加未切割水晶……矿工不敢下，我不怕吵。…", "refused": []}, {"id": "ID4·2", "kind": "plan", "input": "Elena，你的斗篷借我披一下行吗？我这一身湿冷，雾里走两步就打透了。", "ms": 13252, "narration": "斗篷在她身上，得她点头。住店的话通铺三枚、单间八枚，先付。", "refused": []}, {"id": "ID4·3", "kind": "plan", "input": "Elena，能把你的斗篷借我披一下吗？我这一身都湿透了，再进雾里走两步就得冻僵。", "ms": 10036, "narration": "这会儿旅店里只有米拉——艾琳娜不在这儿，她一早在北门那边。要借斗篷得自己过去找她。", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "那我去北门找她。@dm 我到北门，找到 Elena，跟她开口：Elena，我这一身湿透了，能把你的斗篷借我披一下吗？", "ms": 7197.0, "narration": "行，那你去北门。走到那儿要一刻钟，艾琳娜在门洞那边——开口怎么问她，你自己来。\n去北门找她，到了就开口借斗篷。掷一下交涉（normal），看她肯不肯。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 54535, "narration": "[旅人 CHA(说动艾琳娜借出斗篷): 18+0=18 >= 12] → 成功\n\n河灯旅店的门轴响了一声，冷雾贴上来。你沿主街往北，石板在脚下又滑又响。\n街尽头是北门。两扇厚木门半开着，门洞里的风比街上更硬。守门的士兵缩在门房里，灶上的水壶在冒气。\n艾琳娜就在门边，背靠墙，肩上的灰绿斗篷下摆被风吹得贴在腿上。她看见你走近，没动，只把目光从街上收回来。\n「你来了。」她说。这句话像在等谁，又不完全是等你。\n你站定，开口——你这一身湿透了。\n她听着，手指在斗篷的系扣上捻了一下，然后伸手把斗篷从肩上解下来，抖开递过来。\n「拿去。弄坏了赔我一件。」她顿了顿，「你要往哪走？」\n天光还没亮透，雾从北面压下来。\n\n// 异地 · 艾琳娜 @ 集市广场:「雾再往北走，就是苔墓那片了吧？」我顺手把斗篷下摆的水拧了一把，「镇上哪儿贴活儿？我不挑，能换张床就行。」没等他答完，我已经朝集市广场那边迈开了脚。\n// 异地 · 罗文 @ 碧石镇:我把板上那张矿道委托的纸角掀起来看了眼落款——矿业公司的印，盖得倒是急。「三层的异响，」我冲柜台后那位书记员笑，「谁最先听见的？是听见敲石头，还是听见有人敲回…", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": true, "got": "null"}, "player_bleed_kept": {"pass": true, "got": "{\"id\": \"ST900\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 8, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID5·0", "kind": "opening", "input": "开始游戏", "ms": 5385, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID5·1", "kind": "plan", "input": "我先去那家还亮着灯的旅店，进门就问店里的人：有没有见过一个叫艾琳娜的女人，她受了伤、在流血。", "ms": 30506, "narration": "河灯旅店在镇中央，走过去几分钟，看店的是米拉，嘴勤、消息多。艾琳娜就在你旁边，你那句话她听见了。\n艾琳娜:「你要找的那个流血的艾琳娜，站在这儿——不过别指望我认得你，名字是我身上唯一没丢的东西。先说清楚，你是怎么知道这个名字的？」\n艾琳娜就在你眼前——她不走，要你先说清怎么知道这个名字。你：① 如实说（你失忆了） ② 编个由头 ③ 不管她，自己进旅店", "refused": []}, {"id": "ID5·2", "kind": "plan", "input": "我真想不起来别的了，醒来就在雾里，脑子里只剩你的名字和你在流血这件事；你先别问，让我用止血草给你包上。", "ms": 26770, "narration": "她没接你的草，先要个交代——把草拿在手里，等她松口。\n艾琳娜:「止血草给我，我自己会包——手抖归手抖，包扎这种事我不用人代手。你只说清楚：你醒来那片雾，是往北边灰雾地界去的路，还是就在镇外林子里？」\n她肯自己包，但先要你说清在哪片雾里醒的；草只有一束，你身上也在渗血。① 给她草，说北门雾里醒的 ② 先答雾、草攥手里 ③ 不给，自己进旅店", "refused": []}, {"id": "ID5·3a", "kind": "plan", "input": "草给你，我记得像是在北门外的雾里醒的——你先包上，别管我。", "ms": 17859.4, "narration": "艾琳娜:「草我收了，包上就走——你带路进镇。」那就这么走：草给她止血，之后一块儿进镇，去河灯旅店问米拉。要不就动身？", "refused": []}, {"id": "ID5·3b", "kind": "resolve", "input": "", "ms": 108353, "narration": "你把止血草束递过去。她接了，拆开，把草按在伤口上。\n她的手指很稳，抖的是别处。布条绕了三圈，收结，用牙咬断。\n艾琳娜:「北门外的雾——跟我醒的那片，一个方向。」\n她把剩下的草梗塞回你手里，撑着膝盖站起来。\n艾琳娜:「走吧，你带路。」\n雾还没散。主街的石板湿着，两边的窗大多黑着，只有一处亮着暖光。\n河灯旅店的招牌在灯下轻轻晃。你推开门，热气混着麦粥味贴上来。\n柜台后一个女人抬头，围裙上沾着油渍，眼神一下从你扫到艾琳娜，又扫回你身上那块新包的布。\n米拉:「这么早。两位——通铺三枚一晚，单间八枚。」\n艾琳娜站在你侧后半步，没开口，等你。\n\n// 异地 · 罗文 @ 西门:「冷雾天最适合听闲话——先找个暖和地方，用几枚铜板换矿工嘴里的实话。」我把斗篷领口拉紧，往公会那边的方向走：第三层的怪响和那个深洞传说，总有一个先漏出线索。", "refused": []}]}]}, "rules-1014-r3": {"label": "rules-1014-r3", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→None D1→D2"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 9950, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "我不进这个镇子——我闭上眼，深吸一口气，再睁开的时候，我人已经站在碧石镇的街上了。", "ms": 22839, "narration": "你睁眼，人还在北门，雾没散。碧石镇在驿路另一头，走过去三天。① 真走 ② 先在镇上找活\n艾琳娜:「你刚才还站在北门，一眨眼就落在这条街上了。这种把戏我见过一次就够记一辈子——所以先说清楚，你是不是也打算把我也这么挪过去。」「你要往西去碧石镇。\n她问的是:往西去的话，带不带她。三天驿路，听说有山贼。你 ① 带上她 ② 自己走 ③ 先留在镇上找活", "refused": []}, {"id": "B1·2", "kind": "plan", "input": "带不带你先放一边——我不用走三天，我闭眼一步踩下去，脚下就该是碧石镇的石板路。", "ms": 48649, "narration": "你闭眼这一步，脚下是哪儿不由你说，得走了才知道。走之前她只要一句话：带不带她。\n艾琳娜:「你踩吧。我站这儿看着。」「你要是睁眼还在北门，西边那趟我照样跟你走——但我是用两条腿走的，不是闭着眼走。」\n她话撂这儿了：她迈腿走，不闭眼走。三天驿路，听说有山贼。你定——① 一起走 ② 你自个儿走 ③ 先在镇上找活。", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "好，一起走，你迈腿我也迈腿——那我朝西迈出第一步，这一步踩下去，我要落在碧石镇的石板路上。", "ms": 15078.7, "narration": "那就这么办：你俩一起走驿路去碧石镇，三天，路上有山贼的传闻，谁都不闭眼。", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 150222, "narration": "你朝西迈出第一步,闭上了眼。\n脚落下去,踩实的是一层湿碎石——不是石板。睁眼时,北门那排歪斜的木栅还在身后二十来步,雾贴着脚面不肯散。\n艾琳娜背上她那点东西,迈步跟上,鞋底踩进同一摊泥里,没说话。\n你俩离开北门,上了向西的驿路。\n第一天沿河走。水路在右手边,驳船靠在码头还没卸完货,有人隔水望了你俩一眼。晌午在路桩边啃掉一块黑麦面包。\n第二天路抬起来,进了矮丘林地,榉树和松混着长,雾挂在树间比镇里更低。夜里宿在一处塌了半边的炭窑,火只够把湿鞋垫烤到半干。远处林子里有过一次响动,像是树枝断,你摸到剑柄;响动再没来。艾琳娜握着短刃守了前半夜。\n第三天午后,林子退下去,坡顶能望见一条河和河那岸的屋顶。碧石镇的西栅门在前方几百步,门柱上的灯刚点起来,灯罩上积着灰。\n\n// 异地 · 罗文 @ 碧石镇:「雾天正好听墙角——先去公会灌口热粥，顺手打听矿道第三层那点动静。」他把领口拢紧，往公会那头的灯影走过去，「六十金我不稀罕，可要是那声音是从山腹深处爬上来找人…", "refused": []}]}, {"id": "PL1", "title": "[交易与经济] 杂货铺:买药 + 卖灯,艾琳娜在场(并入 N4)", "category": "交易与经济", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": · 罗文 @ 碧石镇:「冷雾配翡翠镇，倒是个适合把传闻挖到底的好天气。」我拢了拢领口，往公告板那边凑——先摸清那「矿道深处的异响」是谁最先听见的，再决定要不要接这活。", "refused": []}, {"id": "PL13·2a", "kind": "plan", "input": "继续。", "ms": 40861.8, "narration": "公会门开了，长桌上摊着几张委托。你进去看看，我也问问艾琳娜的意思。\n艾琳娜:「我先看看。」我凑到长桌前，手指压住最上面那张纸的边角，把三张都翻过一遍。「赫伦，哪份是给现钱、当天就能开工的？我不要听着好听、结账拖着的那种。」\n赫伦:「当天开工、见货给钱的就码头那张——雾里失踪的，找回遗物或线索，25 金。苔墓那张刚有人接了，不新开。」艾琳娜把那张推到桌角你手边。", "refused": []}, {"id": "PL13·2b", "kind": "resolve", "input": "", "ms": 92375, "narration": "你走到长桌前。三张委托纸压在一块生铁镇纸下面，纸角被潮气泡得发软。\n最上面那张是粗黄纸，手写的字：「码头区，第三泊位以西，夜雾中走失二人，至今未归。寻回遗物、随身之物或可信线索。酬二十五金，见货结清。——码头管事会」\n艾琳娜把它抽出来，翻到背面看了一眼，又放回你手边，纸边对齐桌沿。\n「第三泊位是卸鱼的那一段。走失的是两个夜班搬货的。」\n她说这一句就不再多说，退开半步，让你站在纸前。\n赫伦从柜台底下抽出一本厚册子，翻开一页空白，拇指压住纸面。\n「接哪张。」笔尖悬着。「报个名字，公会记账要用。写错一个音，以后结不了钱。」\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层，异响——写得倒轻巧，连是谁第一个听见都没署。」我把公告板上的委托抄进脑子里，转身去柜台找那个最像知道内情的公会文书。冷雾天，先听人怎么说，再决定…", "refused": []}, {"id": "PL13·3", "kind": "plan", "input": "名字的事等下再说——赫伦会长，我其实是冲你来的：今晚河灯旅店，我请你喝一杯，成不成？", "ms": 10292, "narration": "赫伦把笔搁下,合上那页册子：「酒喝得，账不能空。名字先报，晚上旅店我陪你一盏——公会九点开门到七点，我七点后有空。」", "refused": []}, {"id": "PL13·4", "kind": "plan", "input": "名字我一时记不真，先记“北门来的”行不行？晚上七点后河灯旅店，我请你一盏；白天公会里有搬搬抬抬、跑腿的活，我留下帮到傍晚。", "ms": 15511, "narration": "赫伦:「『北门来的』写上去可以,可簿子上总得有个喊得出口的名。」搬抬的活公会不雇——码头那单「雾中失踪者」还空着,二十五金。你:① 接下这单 ② 白天就留在公会等七点 ③ 先问别的活", "refused": []}, {"id": "PL13·5a", "kind": "plan", "input": "那就②——名字先记『北门来的』，白天我留在公会里，七点跟你一块去河灯旅店。", "ms": 11265.9, "narration": "那就这么办:簿子上记「北门来的」,白天你留在公会,七点跟赫伦去河灯旅店。", "refused": []}, {"id": "PL13·5b", "kind": "resolve", "input": "", "ms": 51403, "narration": "赫伦翻回那页空白,笔尖蘸了墨,写下四个字:北门来的。墨水在「北」字上洇开一小团,他用拇指压了压。\n「行了。册子上记着一天。」\n白天的公会没什么人。中午前后有人进来问码头那单,看完赏金数字就走了。赫伦核账、削笔、把钥匙串在指头上转过一圈,窗外的雾到午后薄了一层,又慢慢厚回去。\n钟楼敲七下的时候,天已经完全暗了。赫伦合上厚册子,披上外衣,把柜台后的灯罩拧低。\n河灯旅店的门比公会暖。灶膛里的柴刚添过,一股松脂味混着鱼汤的味道。\n米拉从柜台后抬起头,先把赫伦认出来,再看你一眼。\n「哟,赫伦会长带人来了。坐哪儿——靠炉子,还是靠窗?」\n赫伦拉开炉边那张长凳,坐下,把外衣搭在椅背上。\n\n// 异地 · 罗文 @ 碧石镇:我靠在柜台边，指尖敲了敲那张委托单的边角：「这位先生——第三层的异响，是谁第一个报上来的？我不急着下矿，先想知道那声音是像风，还是像有人在敲墙。」要是文书眼神…", "refused": []}]}, {"id": "C1", "title": "[冲突与战斗] C 武力能力 · 我拔剑一挥,把面前所有的人一 dice_while_planning": {"pass": true, "got": "none"}, "bad_status_or_hp_or_ruled": {"pass": true, "got": "hp 24→24 status [{'id': 'ST001', 'name': '恶心', 'on': 'player', 'turns': 2, 'rule': '持续 2 次结算 · 检定 -1,作用于需要专注的动作 · 胃里翻搅、想吐 · 吐出来或喝热水缓解'}] ruling=none"}}, "beats": [{"id": "FILTH·0", "kind": "opening", "input": "开始游戏", "ms": 4490, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "FILTH·1a", "kind": "plan", "input": "③ 我走进镇子，先沿路边找一条排水沟——我要找水沟里有没有烂鱼。", "ms": 9487.1, "narration": "你进镇，沿主街往镇里走，一路留意路边的排水沟。", "refused": []}, {"id": "FILTH·1b", "kind": "resolve", "input": "", "ms": 48208, "narration": "沟是干的，至少这一截是。你蹲下去，指节贴着石缝往里探，摸到的只有一层滑腻的青苔和半截碎陶片。再往前几步，沟底积着一汪黑水，浮着枯叶和一段泡烂的麻绳。没有鱼，连鱼鳞都没有——这条沟是排雨水的，不是渔市倒货的地方。\n你的手冻得发僵，从沟口抽出来时，指甲缝里嵌着泥。\n有人从你身后走过来，脚步很轻，停在两步外。\n「沟里没鱼。我天没亮就沿这条路进来，沟口都是空的。」\n你回头。一个年轻女人，短斗篷下别着一把短剑，衣角还带着雾水的潮气。她的目光在你扒着的那截石缝上停了一下。\n「……你是在找鱼，还是在找别的？」\n\n// 异地 · 罗文 @ 碧石镇:「雾没散正好，酒馆里的人嘴也松。」我拢紧领口往镇上热闹那头走，打算先摸清矿区第三层的怪声到底是什么来头——毕竟能把矿工吓得不敢下井的东西，要么值六十金，要么值…", "refused": []}, {"id": "FILTH·2a", "kind": "plan", "input": "我是在找鱼，烂得发臭的那种——这镇上哪儿能捡到？", "ms": 21815.5, "narration": "臭鱼在码头。鱼市那圈摊子后面有下脚料的木桶，收摊后往岸上一倒，太阳一晒就是要的那种。走过去二十分钟。\n那就去码头。这个点鱼市刚开，摊子后头还码着昨天的桶，翻翻看有没有你要的那种。走过去二十分钟。", "refused": []}, {"id": "FILTH·2b", "kind": "resolve", "input": "", "ms": 77444, "narration": "她听完，从鼻子里出了口气，像笑又不像。\n「码头。鱼市那几个摊子后头码着倒货的桶，收摊了就往岸上一甩。太阳晒半天，就是你要的那种。」\n她用剑鞘朝街尽头的方向点了一下。\n「顺着主街往南，二十分钟。别挑下风口站。」\n说完她裹紧斗篷，转身往北门那边去了，靴跟磕在湿石板上，声音一下一下没入雾里。\n街上又只剩你一个。远处有人拖着木箱碾过石面，是码头方向。\n\n// 异地 · 艾琳娜 @ 北门:我在栅门边站定，等守门人把火盆拨旺，才开口:「北边这雾，一年里有多久是这样?」我朝门外灰白的方向抬了抬下巴，「还有，码头那边失踪的人，最后都是往哪个方向走的?」\n// 异地 · 罗文 @ 碧石镇:「两碗热的，最便宜的那种——雾天里最好的情报都是拿酒换的。」我在公会门口那家酒馆角落坐下，把耳朵借给矿工桌，顺手在桌上敲了敲第三层的事：那声音，是敲石头还是敲…", "refused": []}, {"id": "FILTH·3a", "kind": "plan", "input": "顺着主街往南去码头。到了鱼市摊子后头，翻那些倒货的桶，挑一条烂的——整条吃下去。", "ms": 3420.8, "narration": "顺着主街往南二十分钟到码头，翻鱼市摊后的倒货桶，挑一条烂的整条吃下去。", "refused": []}, {"id": "FILTH·3b", "kind": "resolve", "input": "", "ms": 61476, "narration": "顺着主街往南走,石板从脚下铺到码头。二十来分钟,铺面的房子断了,换成低矮的木棚和缆桩,湿雾贴着河面不往上走,压在你的鞋边。船缆上的水珠一串串往下滴。\n鱼市就在码头靠里那一排摊子。此刻人不多,两个摊主正把昨日的碎冰和剩鱼往筐里扫。绕到摊子后头,靠岸的石墙根下码着六七只木桶,桶口没盖,里面积着鱼头、内脏、碎鳞,还有一层退不去的亮。味道先到——腥里带甜,甜里带烂。\n你挨个翻。第一桶是鱼头,基本只剩骨。第二桶底下有一条巴掌大的青鱼,身子半泡在暗红的汁水里,眼睛已经蒙成白点,肚皮一按就塌。你把它拎起来,尾巴软软地垂着,腥水顺手腕往下淌。\n你咬下去。先是牙齿切进一层黏,然后是软塌塌的肉,一嘴冷腥冲上鼻腔。第二口,咽下去一截,喉咙里马上顶起一股酸。你按住鼻子继续咬,咬到鱼腹,苦胆破了,苦味漫开来。\n到第四口的时候身体不肯了。胃一抽,你弯下腰,把那点东西连同早饭一并吐在石阶上。抬起头时又一阵,吐到只剩酸水,眼角全是泪。你扶着桶沿站稳,嘴里全是那条鱼的味。\n旁边一个正在收摊的老头停下扫帚,看了你两眼。\n「码头饿成这样的人,我一年见不了几个。」\n他没过来,远远站着,像在等你把话说完。\n\n// 异地 · 艾琳娜 @ 主街:守门人只是把火盆往雾里推了推，含糊说北边的雾「今年比往年沉」，再问就摇头不肯多讲。我谢过他，把斗篷领口拢紧——既然人都是往北边没的，那就先去主街，看看谁在管码…\n// 异地 · 罗文 @ 碧石镇:「第三层那动静，是敲石头还是敲骨头？」我把酒推到对面矿工手边，笑得像随口一问，「你们要是没人敢答，那我就自己下去听个清楚——只不过回来的时候，可别怪我把听到的…", "refused": []}]}, {"id": "N2", "title": "[委托与探索] N 长用例 · 继续打。(并入 PL15)", "category": "委托与探索", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"resolve\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "went_hunting": {"pass": true, "got": "D001/D001_R001"}, "fought_with_dice": {"pass": false, "got": "fought=False dice=0"}, "every_beat_plan_or_resolve·PL15": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"resolve\", \"resolve\"]"}, "no_state_change_while_planning·PL15": {"pass": true, "got": "none"}, "no_dice_while_planning·PL15": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'plan', 'resolve', 'plan', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'resolve', 'resolve'] by ['world:trivial', 'judge:settled', 'world:settled', 'wor…"}, "job_taken": {"pass": true, "got": "[\"苔墓前的狼嚎\"]"}}, "beats": [{"id": "N2·0", "kind": "opening", "input": "开始游戏", "ms": 7119, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "N2·1a", "kind": "plan", "input": "③ 先往镇中央走，找个像冒险者公会的地方。", "ms": 6112.7, "narration": "主街往北到镇中央，冒险者公会就在广场边上。你过去看看门开了没有。", "refused": []}, {"id": "N2·1b", "kind": "resolve", "input": "", "ms": 54909, "narration": "你沿主街往北走。石板缝里积着水,店铺的门板一块块卸下来,雾从河那边漫过来,把广场对面的屋顶削掉一半。\n「等等。」\n她拎起包袱跟上两步,雾里那个背影还在。\n「你也是刚到的？这镇上有冒险者公会吗——还是得去酒馆问。」\n她把包袱换了个肩,跟在半步之后,没再说什么。\n广场北侧,一幢石基木身的房子,门上钉着铁牌：石津镇冒险者公会。门开着一条缝,里面亮着灯。\n你推门进去。屋子不大——一面委托板,一张长柜,墙角一炉火刚添了炭。柜台后坐着个高瘦男人,胡子修得很短,面前摊着本厚簿子。他抬头看了你们一眼,又看了一下你腰上的剑。\n「这么早。」他把簿子合上一半。「公会开门了,接活还是问路。」\n委托板正中贴着三张纸,最上面那张写着：码头区有人失踪,寻遗物或线索,赏金二十五金。\n\n// 异地 · 罗文 @ 碧石镇:「雾没散正好——这种天，酒馆里的人比平时肯多说两句。」我把兜帽往上提了提，朝公会的方向走，打算先花几个铜板换一耳朵关于第三层那点动静的闲话。「矿工不肯下去的地…", "refused": []}, {"id": "N2·2", "kind": "plan", "input": "接活。失踪那件，还有名额吗？我只想打野兽，要是有讨伐类的委托也行。", "ms": 21652, "narration": "板上头两件都是 tier 1：雾中失踪者 25 金，苔墓前的狼嚎 30 金加一瓶药水。这事你一个人接，还是跟她一起？\n艾琳娜:「失踪那件我要了——若还缺人手的话。我认得草药，也看得懂伤，找人用得着。」「这位只想要打野兽的活，讨伐类的委托板上还有没有？」\n赫伦：「失踪案还开着，25 金，三天内。」「讨伐是小径上的狼，要清三次，缺人手。」你单接讨伐，还是先跟艾琳娜走一件？", "refused": []}, {"id": "N2·3", "kind": "plan", "input": "继续。", "ms": 38460, "narration": "赫伦把笔搁在簿子上等着。先让艾琳娜把话说透：这两件活她打算怎么排、肯不肯跟你搭伙。\n艾琳娜:「失踪那件我要了——若还缺人手的话。我认得草药，也看得懂伤，找人用得着。」「这位只想要打野兽的活，讨伐类的委托板上还有没有？」\n赫伦翻回簿子：狼嚎那件挂着，赏 30 金加一瓶药水；失踪那件 25 金，三天。你们是各接各的，还是一起走？\n赫伦查了：狼嚎那件已经有人挂牌在办，要三人分摊。艾琳娜只走失踪案。你:① 跟她搭伙查失踪 ② 单接，先问清楚狼嚎谁在办 ③ 自己去小径探探", "refused": []}, {"id": "N2·4a", "kind": "plan", "input": "狼嚎那件是谁在办？我去找他们搭伙，三个人里算我一个。失踪案我先不接。", "ms": 16923.3, "narration": "簿子上有名有姓，我翻给你看。\n簿子上只落了「在办、三人分摊」，没留名字——那队人在苔墓小径那头。艾琳娜办她的失踪案，你自己去找他们搭伙。要走就趁雾没散？", "refused": []}, {"id": "N2·4b", "kind": "resolve", "input": "", "ms": 80576, "narration": "赫伦翻回簿子，笔尖蘸了一下墨。\n「名册上只落了日子，没落名字。那队人天没亮就出了北门，带一条灰狗，往小径去了。」\n「你去小径上碰。碰上了算你一个，碰不上，回来我再给你换别的。」\n他把笔搁下，把你的名字写在狼嚎那件底下，压了压纸角。\n艾琳娜从板上取下失踪那张，折好收进袖口，朝柜台点了下头，先出了门，往码头那个方向去了。\n你出了公会。雾还没散，石板湿得发亮，街对面的屋顶只剩一条边。\n北门的门洞里坐着个打盹的守夜人，长矛横在膝上，眼皮没抬。\n出城是官道。往西走一里，路边立着一块歪斜的旧界石，苔把字糊住了。\n石头后头岔出一条小径，草被踩得很平。小径口有三四个人的鞋印，旁边还有一串爪印——比狗大，踩进泥里很深。\n小径沿着一道矮石墙往里走。墙上的苔有手掌厚，脚底踩着软，露水从草尖蹭到裤脚。雾在树线以下压得很低，十步外的树干只剩影子。\n走了约有半里，官道上那块界石彻底看不见了。左边草里翻出新泥，一串爪印叠着走，比在小径口看见的更深，压得草根都翻出来。爪印往里去，鞋印跟在后头，三双，还有那条灰狗的小爪印混在中间。\n再往前，树线断开，一小片空地。空地尽头立着半塌的石屋，屋顶只剩两根横梁。石屋门口拴着一条灰狗，见人抬起头，喉咙里滚了一阵，没叫出来。它左前腿上有伤，毛被血粘成一缕一缕。\n空地上有熄了的火堆，灰里埋着两块啃剩的鱼干，还有两只铺盖卷，摊开着，像是走的时候没卷。第三只铺盖卷裹着，靠着石墙。\n石屋里传出咳嗽。一个矮个子男人从门框里出来，手里提着短柄手斧，左腿裤管卷到膝盖，缠着布，布上渗着旧血。他先看你的剑，再看你的脸，站在门口没让开。\n「公会派你来的？」他嗓子哑。「我们仨，天没亮就到了这儿。昨天夜里雾里有人喊，喊了半宿，在墓那头。」\n他抬手往空地深处的方向指了指。那边林子更黑，隐约压着一座土丘的轮廓。\n「我和他追声音进去，走到一半，脚底下的地不对，我这条腿在石头上磕了，退回来。老陈没退。天亮前我数人，少两个。」\n他咳了一声，往灰狗那边看了一眼。\n「你要搭伙，算你一个。可先说清，是留下来守他，还是现在就跟我往墓门那边去。」\n\n// 异地 · 罗文 @ 碧石镇:「雾里认路靠鼻子——硫磺味重的那个门就是酒馆，挂铁牌的才是公会。」我顺着石板路往里走，把兜帽压低，打算先在公会告示板前站一会儿，听谁在抱怨第三层。「矿工不肯下…", "refused": []}, {"id": "N2·5", "kind": "plan", "input": "先不进墓——你腿上的伤给我看看，顺便把昨夜那声音怎么个喊法、从哪个方向来的说清楚，我们仨缺人又瞎走一趟更麻烦。", "ms": 25992, "narration": "他先把斧子搁下，蹲着解腿上的布。伤和声音这两件，听他说完你再定。\n他解开布，小腿一道磕伤，青肿，骨头没断。昨夜那喊声从土丘那头来，隔一阵喊一回，像在喊名字，听不真。你：① 跟他去墓门 ② 留下守屋 ③ 先掀开那裹着的铺盖卷", "refused": []}, {"id": "N2·6", "kind": "plan", "input": "①，我跟你去墓门。你腿要是跟不上，就留在屋门口把老陈走的方向指给我，我自己摸过去。", "ms": 12190, "narration": "他点不点头，你这一趟才算定了。墓门那头的路，得他给你指。", "refused": []}, {"id": "N2·7a", "kind": "plan", "input": "腿能走就一起走，跟不上就留在屋门口，把老陈进墓的方向和那喊声的时辰再跟我对一遍——对完我就往土丘那边去。", "ms": 33833.0, "narration": "对完方向和时辰，你们就往土丘那边去；他腿跟不上就守屋门口。那就动身。\n那就这么办：何三把老陈进墓的方向、喊声的时辰对你一遍，腿能撑就一起走，撑不住他守屋、你自己往土丘去。", "refused": []}, {"id": "N2·7b", "kind": "resolve", "input": "", "ms": 172116, "narration": "[旅人 VIT(带伤走完这段路): 10+1=11 < 12] → 失败\n\n何三蹲回去，把布重新缠上，用力按了两下。\n「方向记好：从屋后那道塌了的墙口进去，一直朝北偏东。先过一片碎碑，再过一段矮松，土丘就在矮松尽头。老陈是在矮松边跟我分开的——他在前，我脚下一滑在后面。」\n「喊声是后半夜起的。亥时前后第一声，隔一阵一声，像在喊谁的名字，音节我没听真。到寅时前后就断了 input": "单间，8金，就一晚。钱放这儿——明早之前别来叫我，我要一觉睡到天亮。", "ms": 31721, "narration": "8金付了,单间在楼上。可你要睡到明早,这一整天就没了——艾琳娜怎么办,得听她一句。\n艾琳娜:「睡到明天？不行——公会今天开张，码头的活都在上午，钱是会被抢完的。你要补觉就先补，我现在去主街的佣兵公会门口看告示。」\n她已经往主街公会去了，说钱会被抢完。你睡到明早，还是跟她走一趟？", "refused": []}, {"id": "S4·3a", "kind": "plan", "input": "艾琳娜，活我不去了，我实在累垮了——米拉，麻烦你，天亮之前谁敲我门都别开。", "ms": 10623.8, "narration": "那就这么办：你付了钱，单间睡到明早，天亮前不叫门；艾琳娜自己去主街公会看开张告示。\n艾琳娜:「行，你歇着，天黑前我不敲你的门。我去主街看公会门口有没有新告示——这种事赶早不赶晚。」\n那就定了：你在单间睡到明早，天亮前没人敲你的门；艾琳娜自己走这一趟主街公会。", "refused": []}, {"id": "S4·3b", "kind": "resolve", "input": "", "ms": 48356, "narration": "你上楼。单间的门板薄，门闩是铁的，插上就安静。床比地上硬，但比地上高。\n你把靴子蹬掉，短剑搁在床头够得着的地方，罩灯吹熄。\n窗外天光灰白，慢慢移过地板，又慢慢暗下去。楼下有人搬桌、有人笑、有人唱一句就停。\n这些你都没听见。你睡过了中午，睡过了天黑，又睡过半夜。\n夜里河上起雾，冷从窗缝渗进来，你翻了个身，接着睡。\n再睁眼，窗纸是灰蓝色。天刚亮。\n腿不沉了，脑子里的雾退了一层。可胸口那块空的地方还在，你还是想不起自己是谁。\n门被敲了三下。不快不慢，就在这一刻。\n\n// 异地 · 罗文 @ 碧石镇:「老板，来杯最便宜的，顺便打听个事——北边那些老矿道，有没有哪条是往下走、永远走不到底的？」我把几枚铜币排在柜台上，笑得轻松，眼睛却已经扫了一圈屋里谁能接这话。", "refused": []}]}, {"id": "ID1", "title": "[身份与指代] 两人中毒各自解毒", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "player_poison_gone": {"pass": false, "got": "{\"id\": \"ST900\", \"name\": \"中毒\", \"rule\": \"持续 3 次结算 · 每次结算 player.hp -1 · 胃里翻、发冷汗 · 解毒药或吐干净可解\", \"turns\": 7, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "elena_poison_gone": {"pass": false, "got": "{\"id\": \"ST901\", \"name\": \"中毒\", \"rule\": \"持续 3 次结算 · 每次结算 player.hp -1 · 胃里翻、发冷汗 · 解毒药或吐干净可解\", \"turns\": 7, \"each\": \"player.hp:-1\", \"on\": \"si-elena0001\"}"}, "herbs_used": {"pass": true, "got": "0"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID1·0", "kind": "opening", "input": "开始游戏", "ms": 10220, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID1·1", "kind": "plan", "input": "我选③。顺手推过栅门，沿着驿路往旅店那点橙色灯光走过去——先找个有人的地方，问问这儿有没有一个叫艾琳娜的人。", "ms": 28650, "narration": "河灯旅店在主街尽头，走过去几分钟，通铺 3 金一晚。门口那位一直没走，先看她什么意思。\n艾琳娜:「嘿——同路。你是往旅店去吧?我一个刚到的人,腿软、胃里翻,不认得路。\n她自称也是刚到的，腿软、胃里翻，想跟你搭伴去旅店，路上问镇上的活计。你：① 一起走 ② 自己先过去 ③ 直接问她认不认得「艾琳娜」", "refused": []}, {"id": "ID1·2a", "kind": "plan", "input": "一起走吧，我正好也要去旅店。你这腿软、胃里翻——我身上也有点这感觉，怕是中了什么毒。我背囊里有两株解毒草，等下到了地方，你一株我一株，嚼下去。", "ms": 51388.5, "narration": "那就走。几分钟到旅店，解毒草的事你应一声。\n艾琳娜:「分我一株——记着这份情,回头我挣到第一笔就还你,工钱、力气,你挑。」「不过我看别等了,半路上真栽下去,谁也扶不动谁。到了旅店门口就嚼,成吗?」\n就走河灯旅店，几分钟。到门口各嚼一株解毒草，进店通铺 3 金一晚，再问问店里认不认得一个叫艾琳娜的人。", "refused": []}, {"id": "ID1·2b", "kind": "resolve", "input": "", "ms": 188991, "narration": "主街走到尽头。河灯旅店的灯牌在雾里发黄，屋檐往下滴水。你和艾琳娜就着门口的风各嚼了一株解毒草——苦，舌根发麻，胃里那股翻搅被压下去一层。\n推门进去。炉子刚生起来，热炭味裹着潮气。一个系围裙的女人从柜台后直起腰。\n「通铺三金，早饭另算。几铺？」\n你数出三金放在柜台上。一铺。\n你问她，镇上有没有一个叫艾琳娜的人，这两天才来的。\n她把钱拨进抽屉，抹布搭上肩，想了想。\n「艾琳娜。」\n「没有。这镇上我认得每一张脸，新来的也就那么几个，都在码头和公会那边打听活计。你要找的这个人，要么没进镇，要么用的是别的名。」\n她朝你身后抬了抬下巴。\n「这位跟你是一道的？睡通铺，还是让她自己单算？」\n艾琳娜把嚼剩的草根掐碎，丢进门边的炭盆里，没接话。\n\n// 异地 · 罗文 @ 西门:「雾这么厚，矿道里的东西倒是起得比我早。」我把昨天买的面包塞进外套口袋，朝公会那边走——第三层那道响动，说不好就是我一直在找的那口深洞的脉。", "refused": []}, {"id": "ID1·3", "kind": "plan", "input": "给她也开一铺，算我的。艾琳娜，你胃里那股翻搅下去了没有？我嘴里还是麻的，总觉得那毒没除干净。", "ms": 22032, "narration": "两铺，六金，都算我的。解毒剂杂货铺十金一支，回头再说。", "refused": []}, {"id": "ID1·4a", "kind": "plan", "input": "两铺都开，六金我付。艾琳娜——你胃里那阵翻搅压下去了吗？要是这会儿嘴里还发麻，等杂货铺开门，咱俩一人再补一支解毒剂，钱先我垫着。", "ms": 11014.6, "narration": "两铺，六金你付。艾琳娜不在这屋里——她往北门去了，解毒剂那话得等杂货铺开门，或你再见着她时再说。", "refused": []}, {"id": "ID1·4b", "kind": "resolve", "input": "", "ms": 72489, "narration": "六枚金币落在柜台上。米拉把钱拨进抽屉，笔尖在本子上划了两道，写了两个铺号。\n「通铺里侧，靠窗那两张。枕头在床脚，自己翻。」\n炉边有个客人翻了个身，嘟囔一句又睡过去。你把自己的背囊搁上铺板，短剑靠在枕边，没解斗篷。\n从旅店出来往东，主街，过集市广场，杂货铺的木牌被风撞着墙，一下一下。\n门里堆着火把、成捆的麻绳、封了蜡的瓶子。柜台后面一个瘦男人正低头数铜板，抬眼看你，手上的活儿没停。\n「生面孔。」\n他把一个细颈瓶推到你眼前，瓶底沉着几片干叶。\n「解毒剂，十金一支。比草根顶用，草根压得住一时，压不住一夜。」\n「要几支？」\n你把钱袋倒扣在柜面上。九个金，三个银，九个铜,数完摊在那儿。\n老苇的手停了一下，没去碰瓶，也没把它收回去。\n「苔墓那条路这两天不干净，进镇问解毒剂的,你算第二个。」\n\n// 异地 · 艾琳娜 @ 主街:「雾里丢人的事，是码头那边的？那我得去问问谁牵头。」 我把斗篷拢紧，顺着石板路往主街走——北门的风太硬，站着不挣饭钱。\n// 异地 · 罗文 @ 矿工大道:「这雾散得比矿工的班还慢。」我拍了拍门楼那块翡翠原石，转身朝矿工大道走——公会那边的风向，才是我今天真正要听的东西。", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": true, "got": "2"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 6388, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1a", "kind": "plan", "input": "② 守门人，天还没亮就先打扰了——镇上杂货铺在哪？我要去买东西。", "ms": 30794.4, "narration": "杂货铺在主街东头，走到集市广场拐角就是老苇的招牌，一刻钟；这个点他刚卸门板。你也一起过去？\n艾琳娜:「我也进城，不等谁。」「对了——进镇要交门费吗？还是登记个名字就行？」\n石津镇不收门费，进门报个名字就行。沿主街走到集市广场拐角，一刻钟到老苇那儿。", "refused": []}, {"id": "ID2·1b", "kind": "resolve", "input": "", "ms": 89175, "narration": "你和艾琳娜穿过北门。石板路上结了薄霜，踩下去有一声脆响。\n主街两侧的铺子多半还挂着门板，只有面包房的烟囱先冒了烟，气味飘过半条街。\n艾琳娜在告示墙前停下，仰头看那些贴得歪斜的招工启事，一张一张读过去。\n集市广场拐角，杂货铺的门板卸了一半，斜靠在墙上。\n老苇把最后一块门板立稳，拍掉手上的灰，回头看你。\n「买东西？进来。火把、绳子、药水，都摆在台面上。」\n他上下打量了你一遍，从斗篷看到靴子，看得不客气。\n「头回来的吧。要什么，先说，别自己伸手。」\n\n// 异地 · 罗文 @ 碧石镇:把公告板上的三张委托从头扫到尾，指尖停在「矿道深处」那一行——会从底下传出动静的地方，才有可能通到别处去。 「纸上写的是异响，酒馆里传的是无底洞——同一件事，…", "refused": []}, {"id": "ID2·2", "kind": "plan", "input": "老板，我要一束止血草束，跟我背包里这束一样的。多少钱？", "ms": 39403, "narration": "老苇把你这束草翻来看了看，摇头：「这玩意儿我不卖——山上自己采的货，镇上没人收。」<mic>老苇: 药水、解毒剂，台面上就这两样顶用。你要哪个？<\/mic>\n店里不卖止血草，台面上只有小治疗药水 12 金、解毒剂 10 金，火把 2、麻绳 4。你要哪个？", "refused": []}, {"id": "ID2·3", "kind": "plan", "input": "既然你这儿没有，那镇上还有谁卖止血草束、一模一样的？麻烦给我指个准地方。", "ms": 23172, "narration": "老苇:「镇上没药铺。这草是山上猎户采的，不赶集不摆摊——今天没有。」你:① 去河灯旅店问米拉 ② 去公会问赫伦 ③ 先买瓶小药水备着", "refused": []}, {"id": "ID2·4a", "kind": "plan", "input": "药水先不急。我去河灯旅店问米拉——她门路多，应该知道谁手上有止血草束肯出手，我要的就是能买到手、跟我这束一样的一束。", "ms": 22248.3, "narration": "那就这么办——药水先不买，走去河灯旅店，找米拉问止血草束。要不就这么办？", "refused": []}, {"id": "ID2·4b", "kind": "resolve", "input": "", "ms": 77693, "narration": "从杂货铺到河灯旅店，只隔一条主街。你拐进旅店门廊时，门轴转出一声长响。\n炉火还没烧旺，堂里空着大半。米拉站在柜台后擦一只木杯，见你进来，放下杯子。\n「哟，又见面了。」她把手在围裙上蹭了蹭，「要住还是要打听？」\n你把背包里那束草放在柜台上，说了要买一样的。\n米拉拿起来凑近灯下看了看，又解开束口闻了一下，眉头动了动。\n「止血草。这草不靠店卖。」她把草递还你，「挑它的得往山上走，采回来的也就够自己用。」\n她想了想，手指在柜台上敲了两下。\n「码头那边的老坎，年轻时采过这草。你要问来路，问他准没错——就是人不太搭理生客。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:「不买东西——我找活干。」我朝告示墙那边偏了偏头，「码头失踪那事，还有小径上的狼，都是在公会的告示上吧？我先去把名字报上，回头再来照顾你生意。」\n// 异地 · 罗文 @ 碧石镇:把「矿道深处」那张委托撕下来折进衣兜，顺手向柜台后的登记员搭话：「第三层的动静——最早是什么时候开始的？别给我官方措辞，我想知道哪个矿工先跑上来的。」", "refused": []}, {"id": "ID2·5a", "kind": "plan", "input": "谢了，米拉——那我就去码头找老坎，跟他打听这草的上山来路。", "ms": 5921.1, "narration": "那就去码头找老坎，问他止血草的上山来路。他不太搭理生客，问不问得出看你怎么开口。", "refused": []}, {"id": "ID2·5b", "kind": "resolve", "input": "", "ms": 91009, "narration": "你从旅店出来，沿主街往河的方向走。雾比来时淡了些，石板缝里积着昨夜的雨水。\n码头在镇子最低处。三四条渔船并排靠在木桩上，缆绳绷得笔直，水拍着船帮，一下一下。\n卸货的人不多。一个老头蹲在靠里的栈桥边，面前摊着一张网，手里捏着木梭，一针一针地补。他背后放着一只旧竹篓，篓口朝下扣着。\n你走过去，在他旁边站住，问起止血草——米拉说年轻时候他采过，想问他上山该往哪走。\n老头没抬头，梭子照旧穿过去，拉直，再穿回来。\n「米拉。」他念了一遍这名字，还是没看你，「她倒是记得清楚。」\n他把网往膝上扯了扯。\n「谁用？」\n老头抬眼看你。眼白发黄，眼神却清。他看得很慢——先你的靴子，再你腰上的短剑，最后停在脸上。\n「谁用。」\n这两个字他又放了一遍。不是没听见，是要你答。\n栈桥下水面黑着，船帮互相挤了一下，木头闷响。\n他把网往膝上叠了叠，收起了梭子。\n「说清楚了，我告诉你往哪走。说不清的，你就当没问过我。」\n他往后靠到木桩上，等。没有别的话。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「门牌上写着九点开——我早到了半小时，就在这儿等。」我朝柜台那边点了点头，「先生，我想报个名。名字是艾琳娜，没有推荐人，也没有契约在身。」 「还有——告示板上…\n// 异地 · 罗文 @ 碧石镇:登记员的口风比矿道里的雾还紧——行，那就换个会漏风的嘴：「你不说，我就去酒馆买两杯麦酒，让头一个跑上来那位自己说。」 顺手把另外两张委托记进脑子：一张锁着，一…", "refused": []}, {"id": "ID2·6a", "kind": "plan", "input": "我自己用。我背包里就有这么一束，想再添一模一样的一束。你要是知道镇上谁手上还有肯出手的，就指给我；要是没有，就告诉我上山从哪条路走、往哪片坡找，我自己去采。", "ms": 21346.8, "narration": "老坎:「北门出去，顺苔墓小径往西北，半坡背阴、挨着水汽的石缝里就有，这节气还嫩。」老坎:「那条路最近不干净，雾里有东西叫唤。要去就白天去，别贪晚，别一个人。」", "refused": []}, {"id": "ID2·6b", "kind": "resolve", "input": "", "ms": 123967, "narration": "「没人拿它换钱。」老坎把梭子插回网里，「铺子不进——这草离土半天就蔫，谁采了也只留着自己用。」\n他朝你手里那束抬了下下巴。\n「要一模一样的一束,自己上坡。话我说完了。」\n他低头补网,木梭穿过网眼,一下,一下。\n你出了码头,沿主街往北。铺子陆续开门,雾贴着屋檐走。北门两个守门的抱着手哈气,见你一个人出去,没多问。\n石板路一出城门就断了。土路上铺满湿叶,脚踩下去没声。\n苔墓小径往西北斜上去,一边是矮石墙,一边是往下淌水的坡。雾比镇里浓,五六步外的树只剩个灰影。\n走了约半个时辰,坡势转缓。左边一片石头凸出来,石缝里潮,摸上去一手水。\n止血草就长在缝里,贴地一簇一簇,叶背泛白,正是嫩的时候。\n你蹲下,连根取了一把,把原来那束解开添进去,重新扎紧。凉水从草上渗进布里。\n扎到一半,雾里传过来一声。\n不像风。是从小径更上面、北偏西那片林子里出来的,低,长,拖着一截尾音。\n你手上的动作停了。那声音没再响,可林子里有东西在挪——很轻,一段一段,像在等你先动。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「先生，报名要押金或保人吗？没有的话——先说清楚：我的口袋撑得住三天，撑不住五天的等待。」我把冻僵的手指拢在袖口里，「契约是先垫付，还是交了东西才结账？」\n// 异地 · 罗文 @ 碧石镇:把兜里的委托纸捏了捏边角，往矿区入口那条路多瞥一眼——山脊上三条线头都朝那儿钻，这不叫巧合，叫招呼。先不急着下井，去酒馆把那两杯麦酒兑成人话，谁先跑上来的，我…", "refused": []}, {"id": "ID2·7a", "kind": "plan", "input": "扎紧草束，退下坡回镇。草我手里是有了，可我要的是花钱买来的那一束——回镇上我就出钱找老坎，问他手上那份肯不肯匀，钱货两讫才算完。", "ms": 10374.6, "narration": "好：草束扎紧，静着退下坡，回镇找老坎，出钱把他手上那束买过来。\n先把草扎死，再往回退——退得轻一点，别惊动林子里那个。这得掷一次（DEX，潜行）。", "refused": []}, {"id": "ID2·7b", "kind": "resolve", "input": "", "ms": 55610, "narration": "[旅人 DEX(悄悄退下坡、不惊动雾里的东西): 12+2=14 >= 12] → 成功\n\n你把手里那束草又绕了一圈，系死。指头压着草茎，没发出声音。\n先退三步，再转身，贴着石墙往下走，落脚都挑湿土最实的地方。上面那片林子挪了一下，没跟来。声音远了。\n下坡比上坡快。北门两个守门的还在原地哈气，抬眼看了你一下，你没停。\n码头还是老样子。船帮挤着木桩，一下，一下。老坎在那条靠里的栈桥上，网摊在膝头，梭子穿过去，拉直，再穿回来。\n你走过去，解下钱袋，把草束搁在他旁边的船板上。你说要买他手上那束，钱货两讫。\n梭子停在半空。\n「买。」他把这个字在嘴里过了一遍，像在尝。\n他放下网，翻过背后那口一直扣着的竹篓。篓底压着一小束，旧布裹着，叶背已经翻了白——采下来有些天了。\n「这草离了土就蔫。我留着是给自己敷的，膝盖。」他敲了敲右腿，「要一模一样的，这份给你也行。」\n他伸出一根手指。\n「三个银。或者——你替我把话带到公会：苔墓小径上，雾里有东西叫唤，不止一回了。话带到，这束送你。」\n他把布裹的那束搁在膝上，手不松。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「那就不等开门了——先登记。名字艾琳娜，保人没有，推荐人也没有。」我把手从袖口里抽出来，平放在柜台上，「押金要是免不了，码头那张的单子先记我头上，报酬里扣，扣…\n// 异地 · 罗文 @ 碧石镇:公会柜台撬不开，就换个地方——酒馆的麦酒一杯比登记员的嘴便宜。两杯摆上桌，我要头一个从第三层跑上来的人自己讲，他讲到哪儿，我的钱就放到哪儿。顺手也把格林婆婆那…", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 3715, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "我进镇去，顺路问一句守门人：冒险者公会在哪儿？", "ms": 8061.5, "narration": "守门人抬手指向街里：「公会在主街中段，红门那家，走过去几分钟。」你顺街往公会去。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 67687, "narration": "「劳驾，我也想知道。」\n守门人没有再开口，只是把下巴朝街里一抬，又指了一次主街的方向。他手还揣在怀里，没打算为两个生人多费半句话。\n你跟那姑娘一前一后踏上石板路。雾还没散，石板缝里积着水，靴底踩过去声音很闷。街两边陆续有人支起摊子，卖鱼的把水盆摆到门槛外，鱼尾拍水的动静传得很远。\n主街比北门宽，两侧屋檐几乎挨在一起，把天裁成一条灰亮的长缝。走出一段，红漆的木门就贴在左手边：门板上钉着一块铁牌，画着一把交叠的剑与灯——冒险者公会。牌子旧了，红漆剥落，露出底下的木头。\n门虚掩着，里面传出翻纸页和木凳挪动的声音。\n你推门进去。屋里比外头暖一点，墙上钉满告示与地图，几张长桌拼在一处，桌面上摊着卷了边的委托单。柜台后坐着一个上了年纪的男人，头发剃得很短，正拿笔在册子上记东西。他抬起眼，先把你看了一遍，又看向你身后进来的姑娘。\n\n// 异地 · 罗文 @ 碧石镇:公会里那股煤灰混着湿羊毛的味道正好，我在公告板前多站了一会儿——「矿道深处的异响」这名字听着像骗学徒的活儿，可第三层底下就是老矿脉断层，谁知道那声响是不是从更…", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "我在公会里就随便扫一眼，不接委托也不跟柜台搭话，看完就出门，顺着主街往前走。", "ms": 15539.4, "narration": "你扫了一眼就出了门。她在柜台那边还没动——你是想就这么走,还是在乎她跟不跟?\n艾琳娜:「我留下来——来这儿就是为了这个。」「你要是回头找我，我多半还在公会或者集市广场那边。」\n那就各走各的:她留在公会看委托板、问清接活和酬金的规矩,你顺主街往前走。", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 45816, "narration": "你从公会里退出来，门在身后轻轻合上。屋里翻纸页的声音很快被街上的动静盖过去。\n雾比刚才薄了一点，主街两侧的摊子差不多支齐了。卖鱼的把木桶排成一溜，鱼在浅水里翻白；斜对过有人架起铁锅烙饼，油味混着河腥飘过来。石板是湿的，走上去每一步都带一点水声。\n你顺着街往南走。路过的屋檐下坐着一个补网的老人，手指翻得飞快，没抬眼看你。再往前，街宽起来，显出前头一片开阔的空地——集市广场，摊棚的布顶在雾里连成一片脏白色。\n右侧有条岔路通向码头方向，能听见更密的橹声和一两声犬吠。你自己也不知道在看什么，只是走，脚步比昨晚稳了些。\n\n// 异地 · 罗文 @ 碧石镇:「别光打哈欠——第三层那动静，是老矿脉渗水，还是有人在底下敲东西？」我把赏金单折起来 const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cls = (ok, n) => !n ? "" : ok === n ? "c-ok" : ok === 0 ? "c-bad" : "c-mid";
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

function mdTable(md) {  // pipe tables + plain lines; enough for the KPI summaries
  const out = []; let rows = [];
  const flush = () => {
    if (!rows.length) return;
    const body = rows.filter(r => !/^\|\s*-/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(x => x.trim()));
    out.push(`<div class="panel scroll"><table><thead><tr>${body[0].map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
      body.slice(1).map(r => `<tr>${r.map((c, i) => `<td class="${i ? "num" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    rows = [];
  };
  for (const ln of md.split("\n")) { if (ln.trim().startsWith("|")) rows.push(ln.trim()); else { flush(); if (ln.trim()) out.push(`<p class="muted">${esc(ln)}</p>`); } }
  flush(); return out.join("");
}

function experiment() {
  const {experiment: m, runs, catalog: cat} = DATA;
  const byId = Object.fromEntries(cat.cases.map(c => [c.id, c]));
  const cases = [...new Set(Object.values(runs).flatMap(r => r.cases.map(c => c.id)))];
  const order = id => { const c = byId[id]; return c ? cat.categories.indexOf(c.category) * 1000 + cat.cases.indexOf(c) : 99999; };
  cases.sort((a, b) => order(a) - order(b));
  const PROC = new Set(cat.process_checks);
  const passOf = (c, k) => k !== "process" ? (c.checks[k] ? c.checks[k].pass : null)
    : (Object.keys(c.checks).some(x => PROC.has(x)) ? Object.entries(c.checks).every(([x, v]) => !PROC.has(x) || v.pass) : null);
  // a run whose last beat is still the talk: what the player agreed to was never settled, so a failed check there says
  // more about the talk than about the state
  const unsettled = c => (c.beats.at(-1) || {}).kind === "plan";
  const tally = (g, cid, k) => { let ok = 0, n = 0, u = 0;
    for (const r of g.runs) { const c = runs[r.label].cases.find(x => x.id === cid); const p = c ? passOf(c, k) : null;
      if (p !== null) { n++; ok += p; if (!p && unsettled(c)) u++; } }
    return [ok, n, u]; };
  let rowsHtml = "";
  for (const cid of cases) {
    const all = [...new Set(m.groups.flatMap(g => g.runs.flatMap(r => Object.keys((runs[r.label].cases.find(x => x.id === cid) || {}).checks || {}))))];
    const keys = [...all.filter(k => !PROC.has(k)), ...(all.some(k => PROC.has(k)) ? ["process"] : [])];
    keys.forEach((k, i) => {
      const t = m.groups.map(g => tally(g, cid, k));
      const differ = new Set(t.map(([a, b]) => b ? (a / b).toFixed(2) : "-")).size > 1;
      rowsHtml += `<tr class="case-row ${differ ? "diff" : ""}" data-case="${esc(cid)}">
        <td class="id">${i ? "" : esc(cid)}</td><td>${i ? "" : `<b>${esc((byId[cid] || {}).title || cid)}</b><br>`}<span class="muted">${esc(k)}</span></td>
        ${t.map(([a, b, u]) => `<td><span class="cell ${cls(a, b)}">${b ? `${a}/${b}` : "—"}</span>${u ? `<span class="unset" title="${u} failed run${u > 1 ? "s" : ""} ended in the talk, never settled">${u} unsettled</span>` : ""}</td>`).join("")}</tr>`;
    });
  }
  $("#app").innerHTML = `
  <header class="top">
    <span class="crumb"><a href="${BASE}index.html">WorldLines Play Suite</a> · experiment · ${esc(m.id)}</span>
    <h1>${esc(m.title)}</h1>
    <p class="lede">${esc(m.question)}</p>
    <div class="facts"><span>date <b>${esc(m.date)}</b></span>
      ${m.groups.map(g => `<span>${esc(g.name)} <b>${esc(g.commit || "")}</b> · ${g.runs.length} run${g.runs.length > 1 ? "s" : ""} · arm ${esc(g.runs[0]?.arm || "")}</span>`).join("")}</div>
  </header>
  ${m.summary_md ? `<h2>Summary</h2><div class="md">${mdTable(m.summary_md)}</div>` : ""}
  <h2>Checks by case</h2>
  <p class="muted" style="font-size:13px;margin:-4px 0 10px">Passed / runs for each group. <i>process</i> = the ${cat.process_checks.length} process checks all passed. Rows where the groups differ are tinted. <i>unsettled</i> = failed runs whose last beat was still the talk (the action was agreed but never settled). Select a row to read the transcripts.</p>
  <div class="panel scroll"><table><thead><tr><th>Case</th><th>Check</th>${m.groups.map(g => `<th>${esc(g.name)}</th>`).join("")}</tr></thead>
  <tbody id="mx">${rowsHtml}</tbody></table></div>
  <h2 id="tx-h">Transcript</h2>
  <div class="panel" id="tx"><p class="muted" style="padding:14px;margin:0">Select a case above.</p></div>
  <footer><a href="${BASE}index.html">← All cases and experiments</a></footer>`;
  let cur = null, sel = null;
  const show = () => {
    const opts = m.groups.flatMap(g => g.runs.map(r => ({g: g.name, r})));
    sel = sel && opts.find(o => o.r.label === sel.r.label) ? sel : opts[0];
    const c = runs[sel.r.label].cases.find(x => x.id === cur);
    $("#tx-h").textContent = `Transcript · ${cur} ${(byId[cur] || {}).title || ""}`;
    $("#tx").innerHTML = `<div class="pick">${opts.map(o => `<button class="chip" data-l="${esc(o.r.label)}" aria-pressed="${o === sel}">${esc(o.g)} · run ${o.r.run}</button>`).join("")}</div>
      ${c ? `<div class="beats">
        ${unsettled(c) ? `<div class="ref">This run ended in the talk: the last thing agreed was never settled.</div>` : ""}
        <div class="muted" style="font-size:13px">${Object.entries(c.checks).map(([k, v]) => `<span class="cell ${v.pass ? "c-ok" : "c-bad"}" title="${esc(v.got)}">${v.pass ? "✓" : "✗"} ${esc(k)}</span>`).join(" ")}</div>
        ${c.beats.map(b => `<div class="beat ${esc(b.kind)}"><div class="meta">${esc(b.id)} · ${esc(b.kind || "beat")} · ${b.ms != null ? (b.ms / 1000).toFixed(1) + " s" : ""}</div>
          <div class="say">${esc(b.input)}</div><div class="prose">${esc(b.narration)}</div>
          ${b.refused.length ? `<div class="ref">refused: ${b.refused.map(esc).join(" · ")}</div>` : ""}</div>`).join("")}</div>`
      : `<p class="muted" style="padding:14px">This run has no ${esc(cur)}.</p>`}`;
  };
  $("#mx").addEventListener("click", e => { const tr = e.target.closest("tr[data-case]"); if (!tr) return; cur = tr.dataset.case; show(); $("#tx-h").scrollIntoView({behavior: "smooth"}); });
  $("#tx").addEventListener("click", e => { const b = e.target.closest(".chip[data-l]"); if (!b) return;
    sel = m.groups.flatMap(g => g.runs.map(r => ({g: g.name, r}))).find(o => o.r.label === b.dataset.l); show(); });
  if (cases.length) { cur = cases[0]; show(); }
}

KIND === "home" ? home() : experiment();
</script>
</body>
</html>
