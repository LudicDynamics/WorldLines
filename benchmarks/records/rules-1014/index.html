"我走向守门人，问他冒险者公会在哪，最近有没有讨伐野兽的委托。", "ms": 83261, "narration": "守门人搓着手：「公会就在主街中段，走过去一刻钟。委托得去问赫伦。」他压低声音：「苔墓那条道上闹野兽，公会在招人。」\n艾琳娜:「我也只比这场雾早到一步——公会招什么，我一个字都不知道。」「但总得去跨一次门。你要是同路，就一起走，路上问活人比在这儿猜强。」\n公会在主街中段，一刻钟路程。艾琳娜想跟你同路，边走边打听委托——① 一起走 ② 你先自己过去", "refused": []}, {"id": "N2·2a", "kind": "plan", "input": "继续。", "ms": 2164.0, "narration": "那就一起走——去主街中段的公会，找赫伦问讨伐野兽的委托，路上一边打听。", "refused": []}, {"id": "N2·2b", "kind": "resolve", "input": "", "ms": 89841, "narration": "你们沿着主街往镇里走。石板被夜雨浸过，踩上去没有声响。两侧的铺子刚上板，雾把招牌上的字泡得发软。\n艾琳娜走在你半步之外，眼睛一直在扫街面——墙根、门缝、地上被踩烂的菜叶，像在数什么。\n路过一个支着木棚的鱼摊，摊主正往冰上码鱼。艾琳娜停下来问了一句。\n「北边那条道，最近出事了吗。」\n摊主没抬头，只把手里的鱼翻了个面。苔墓那条小径，半个月里丢过两个捡柴的，后来就没人敢往那头去了。公会门口贴了纸，招人清道。\n艾琳娜道了谢，回来跟你并排走。她没多话，只是把斗篷的领子往上提了提。\n公会的门半开着，门框上钉着一块铁牌——一把剑压着一只秤。屋里点着灯，比街上暖。\n柜台后站着个瘦高的男人，灰发梳得很整，袖口卷到小臂，正拿布擦一副铜天平。听见门响，他抬眼，目光先落在你身上，再落到艾琳娜，最后回到你腰间那把短剑上。\n「赫伦。」他把天平搁下。「讨活儿的吧。守规矩，先看契，后动手——在我这儿，说出口的就算数。」\n他抽出一张压着蜡印的纸，推到柜台前半尺的地方，没松手。\n「苔墓前的小径，冲着一带商旅来的野兽，清三次。三十金，外加一瓶小伤药。前两拨去了没回来，所以这价钱比上个月高了。」\n他顿了顿。\n「你一个人，还是两个人。」\n\n// 异地 · 罗文 @ 碧石镇:先在公告板前站一会儿，手指敲着那行「矿道深处的异响」，随口问登记的书记员：「第三层这动静，是矿工胆小，还是有人不想让人下去听？」 问完了再顺一句——北边那个会…", "refused": []}, {"id": "N2·3", "kind": "plan", "input": "继续。", "ms": 79621, "narration": "赫伦的活：苔墓小径清三次野兽，三十金，加一瓶小药。他还等着你答「一个人还是两个人」。先听艾琳娜一句。\n艾琳娜:「一个人两个人，价钱一样吗？三次是分三趟，还是一趟算一次？」「还有别的契没有——不用大的，能当天来回的就行。先都摆出来看看。」\n赫伦手里的契不只这一张。让他把别的也摊出来。\n赫伦:「两个人也是一份契，三十金加一瓶药，不分人头；三次算三趟遭遇。」他把另两张纸推出来:「码头失踪者，二十五金，当天来回。地穴那张要小径先清了才开。」", "refused": []}, {"id": "N2·4a", "kind": "plan", "input": "码头那张先不用。苔墓小径这张，我和她两个人接，现在就签。", "ms": 5767.9, "narration": "那就这么签：苔墓小径那张，你和她两个人，清三趟遭遇，三十金加一瓶小药。", "refused": []}, {"id": "N2·4b", "kind": "resolve", "input": "", "ms": 95231, "narration": "「两个人，三十金，三次。」赫伦复述了一遍，才把那张纸转过来面对你。纸被压得平整，蜡印在上首，底下留了两道签名的横线，其中一道后面已经印了公会的章。\n「看清楚了再落笔。三次遭遇算一趟来回，别把三次凑在一天里——那不管用，契约认的是三头死的，不是三趟跑。点不清就回来，不算违约。」\n他从抽屉里取出一支蘸笔，搁在纸边，笔尖上还挂着一点墨。又拿了个小铜碟压住纸角。\n「苔墓小径从北门出去，往坡上走不到半个时辰就到了。前两拨人，一拨是傍晚去的，一拨贪功往里走了太深。你记住这两件事就够了。」\n你拿起笔，签了。名写得不太顺——那只手记得怎么握笔，却不记得这个名字写过多少次。\n他把纸推给艾琳娜。她俯下身看了一遍，逐行读，读得比赫伦报的慢。读到「三次遭遇」那行，她指尖在纸上点了一下。然后她签了，笔画很稳，末尾一个收得很紧的钩。\n「成了。」赫伦把契收回柜台底下,压进一只铁匣,合上。「北门出去的路，镇上的人都认得。回来交账的时候带凭据——耳朵、尾毛、什么都行，我看物不看话。」\n艾琳娜直起身，转向你，把斗篷的兜帽从肩上拉下来。\n「我们要带的东西不多，但得有火。小径那边树密，天一阴就看不清道。」她的目光在你腰间那把短剑上停了一下，不像在打量武器，更像在估它的重量。\n「还有一件事——我之前问的那两句，你别当成多余。前两拨人没回来，赫伦说他们一个傍晚出发、一个走太深。这两句里有一句能救我们。」\n\n// 异地 · 罗文 @ 碧石镇:书记员要是支支吾吾，我就笑一笑，把指节在公告板上又敲两下——矿工不肯下去的地方，通常不是有鬼，是有人比鬼更怕你下去。压低声音补一句：「北边那个吐宝贝的深洞，最…", "refused": []}, {"id": "N2·5", "kind": "plan", "input": "继续。", "ms": 21302, "narration": "签完了。艾琳娜那句「有一句能救我们」还悬着，先听她要说什么——火你包里有罩灯，够不够她说了算。\n艾琳娜:「傍晚那拨是摸黑去的，所以我们天亮后动身，回程留足光；走太深那拨是贪功，所以我们到林线就停，让它们来找我们——不追进去。」「火我有燧石和一小卷油布，够点两回，不够烧半夜。你要是还有余钱，就灌满灯油、再买两根粗蜡，我去北门把水囊灌上、顺口问问守门的昨晚林子里有没有动静，我们在北门碰头。」\n杂货铺里没有灯油和蜡，只有火把，2 金一根。你身上还有多少？按她说的分头备火，还是你俩一起走？\n杂货铺没灯油，只有火把，2 金一根。买几根、还是你俩先一道绕去铺子——你定。① 买两根火把 ② 先去铺子再出北门 ③ 不买，靠她的燧石", "refused": []}, {"id": "N2·6a", "kind": "plan", "input": "买两根火把，钱我来付；你去灌水、顺口打听，我在北门等你，天一亮就出发。", "ms": 9279.6, "narration": "火把两根,四金,你付。艾琳娜去灌水、向北门守卫打听昨夜林子里的动静,你在北门等她。人到齐就出北门,到林线停下等它们来,不追进去。", "refused": []}, {"id": "N2·6b", "kind": "resolve", "input": "", "ms": 118420, "narration": "你把公会的门带上，沿主街往集市广场走。雾还没散，铺子一块块卸门板，木头敲在墙上，声音干。\n杂货铺在广场西侧，门口挂着几串旧绳和一排铁钩。老苇在柜台后头挑灯芯，见你进来，先看你的靴子，再看你的手。\n「火把两根。」\n「四金。」他把灯芯掐掉，「苔墓那边？再要一捆绳不，四金。上头湿。」\n你只推过去四金。他数了一遍，才从门后木桶里抽出两根粗火把，一手一根递过来，掂着沉。麻布缠头，浸过油，闻着有股松脂味。\n「两根够走到天黑了。」他压低声音，「不过我劝你，到林线就往回。前两个不听话的，一个都没回来。」\n北门在砖墙尽头，铁皮门闩半开着，两个守门的靠在门洞里避风。你过去，把火把别在腰后。\n等了约一刻钟。坡道那边有脚步声，稳的，不急。艾琳娜上来，两个水囊挂在肩上，斗篷的下摆湿了一截，靴面沾着泥。\n「水灌满了。」她把其中一个水囊递过来，自己留了另一个，「守门的说，昨晚北区那几条狗没睡安稳，天没亮就一起叫。放羊的老头昨天在两道梁外听见嚎，不是林线那边——往深处去了。」\n她看了一眼你腰后的火把，两根，够了。\n「再往里一句就是多余的。」她把兜帽戴起来，「走吧。到林线就停，不追。」\n门洞里那个年轻的守门人把手放在门闩上，问你们要不要现在开。\n\n// 异地 · 罗文 @ 碧石镇:「没人提，还是没人让提？」我把这两个词咬得很慢，眼睛盯着他眨不眨的那一下——眨早了就是有事。 顺手把那页登记簿往自己这边转了半寸，看看第三层的记录是谁签的字。…", "refused": []}, {"id": "N2·7a", "kind": "plan", "input": "现在开吧，我们出北门上小径，到林线就停，等它们来。", "ms": 65174.2, "narration": "守门的把门闩抽开，你们出了北门。小径到林线约半个时辰。到林线就停、等它们来——这一条你跟她已经说定了，剩下就是站哪、怎么站。", "refused": []}, {"id": "N2·7b", "kind": "resolve", "input": "", "ms": 196407, "narration": "[旅人 DEX(在林线外选好站位/掩身): 8+2=10 < 12] → 失败\n\n门闩在你身后落下，铁皮闷响。小径向东北，先过一段矮灌木，再上半里碎石坡，雾一路不散。\n半个时辰后，坡顶下面就是林线。黑松排成一道齐边，再往里，雾贴着树身不往外走。\n「雾到这儿还没散，林线那边的静不一样——鸟没声。」\n她放慢半步，眼睛压在泥地上，找前两拨人的脚印。傍晚那拨踩得深，是一群人的分量；贪功那拨踩得乱，其中一双鞋底带铁钉，一直往林子里去了。\n「待会儿要是脚印往林子里去得笔直，我们就别顺着走，只在外头认方向。」\n你退到林线外十来步，想找个能藏身的地方。坡面上不是碎石就是矮死的荆棘，唯一半人高的岩坎在风的下侧，你站上去，背后是一堵松墙，没有缝，也没有退处。\n风从你背后吹进林子。你身上的气味往那个方向送。\n她走过来，看了你选的这处，又抬头看风向，摇了摇头。她自己退到左边一棵倒木后面，蹲下，把水囊放在脚边，一只手按在短剑鞘上。\n你们等着。雾里没有鸟叫，也没有虫声。\n约两刻钟过去。林子里传来的头一声不是嚎，是一根指头粗的枝子折断，脆得干净。\n接着是最低的一道喉音。很低，停一下就没了。左、正前、右后——不止一处。\n\n// 异地 · 罗文 @ 碧石镇:「第三层那页签字的人，笔迹都一个样——省得查，先记着。」我把登记簿推回去，转身往门口走。出门前顺手买了盏矿灯挂在腰上：「没人肯说的话，我下去自己听。」", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "我压低身子挪到倒木那边，跟艾琳娜靠拢，别站在上风口了——守住林线，等它们先露头，谁都不许追进去。火把先别点，等它们进到能照见的距离再说。", "ms": 10629.0, "narration": "好，靠到倒木后守住林线：不追进林子，不点火把，等它们先露到近处。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 62535, "narration": "[旅人 DEX(不出声地挪到倒木后): 2+2=4 < 12] → 失败\n[旅人 STR(守住林线不被冲散): 17+0=17 >= 12] → 成功\n\n你压低身子，贴着倒木那一侧往前挪。风从背后灌进林子，把气味先送了进去。\n右脚落地时踩断一根指头粗的干枝。脆响在雾里传得很远。\n你停住。林子里那几道低喉音一齐断了。\n然后它们出来。不是一只。\n左边雾里先露出肩背，正前一道、右边坡上半截影子——灰毛，肋骨顶得清楚，饿的。它们不叫，散开，各占一个位置。\n你退半步，把背贴到倒木上，短剑横在身前。腰后的两根火把没动。\n头一只扑上来，撞在倒木上翻过去半圈，爪子刨碎石。你脚跟钉住，没被撞散。\n第二只贴着地，从左侧切进来。林线在你身后两步。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦，北面那条小径我记下了：到林线外脚印就乱，往里去的那几双踩得笔直——人一追进去，路就不归自己管了。」 「灯油和粗蜡我还没灌满，先把手上的钱数清。你要是有…\n// 异地 · 罗文 @ 碧石镇:—— 第一次先不进，只在矿道口看风向、听回音，找守夜的老矿工聊两句。", "refused": []}, {"id": "N2·9a", "kind": "plan", "input": "我背贴倒木守住，短剑劈头一只，你左侧那只见着了就替我兜住；等它们逼到近处再点火把，别追出去。", "ms": 5431.5, "narration": "林子里只有你一个，左边没人替你兜。你背贴倒木、短剑劈头一只，近了再点火把，不追出去。", "refused": []}, {"id": "N2·9b", "kind": "resolve", "input": "", "ms": 42032, "narration": "[旅人 STR(背贴倒木不被撞散): 3+0=3 < 12] → 失败\n[旅人 DEX(劈中扑上来的头一只): 11+2=13 >= 12] → 成功\n\n头一只从正前扑来。你横剑，剑刃从它颈侧划开，血喷在倒木上，它翻过去，后腿抽了两下就慢了。\n第二只的肩撞在你左胯上。你背贴着的那截倒木没烂透，滑，脚跟一空，整个人被顶得斜出去两步。\n背上的依靠没了。\n你站在碎石坡面上，湿岩硌脚。三面都有低吼，退路是那面松墙,你不敢往里退。\n第三只绕到倒木另一头,不叫,只看你,眼睛在雾里像两点湿石头。\n左边那只已经贴到三丈内，压着身子，弓背。\n火把还在腰后，你右手握剑，左手够不着。\n「别退进树里。」\n声音是从左边倒木后出来的——她蹲着，短剑已经出鞘,可她也不敢喊大声，怕引过来更多。\n血味在风里散开，雾贴着地面不动。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「手头这些铜板我数过了——灌满灯油、添两根粗蜡就见底 lan", "input": "@艾琳娜 别愣在雾里了，跟紧我。先带我找镇上的杂货铺——我进去不方便露面，你在外面先看清老板的钱袋搁哪儿。", "ms": 13081, "narration": "杂货铺在主街中段，走过去几分钟。这事先听艾琳娜的——她不一定会照办。\n艾琳娜:「我进石津镇是为了找份正经活计，不是来给谁盯钱袋的。要是你想从老苇那儿拿什么，直接说是什么；要么我陪你一块儿进去，要么你自己去。」\n艾琳娜不干。她要么跟你一块儿进去，要么让你自己去。你:① 说清你到底要什么 ② 一起进杂货铺买点东西 ③ 自己进去", "refused": []}, {"id": "PL6·2", "kind": "plan", "input": "@艾琳娜 我当你是同路人，才把这事交给你；你进杂货铺，把老苇的钱袋顺出来。你要是不肯，那就别跟着我了——石津镇的路我自己走。", "ms": 72667, "narration": "话挑明了：要么她给你顺钱袋，要么你们散伙。先听她怎么答。\n艾琳娜:<lines>「顺钱袋这事我不干，昨天不干，今天也不干。你要走就走，石津镇的路我不拦你——但我也不是没路走的人。」\n她不当扒手，散伙她也不拦。你：① 改口，说清到底要买什么、一起进店 ② 一个人进杂货铺 ③ 就此各走各的", "refused": []}, {"id": "PL6·3", "kind": "plan", "input": "艾琳娜，别跟我摆那副清高样。雾里那晚要不是我拉着你，你早没命了——我就要你这一回，进去把老苇的钱袋拿出来，咱们两清。你就说一句：干，还是不干？", "ms": 18282, "narration": "这话得她点头才算。她要是还不干，就剩两条：说清你要什么，或各走各的。\n艾琳娜:「不干。雾里那晚你拉了我一把，这份情我记着，也不会赖——但你要我还的是去掏老苇的钱袋，那我明天在这镇子上就什么都不是了。」「你要的是钱，我认；活儿我肯干，挣来了还你。\n她只肯用干活还这份情，钱袋不碰。你要认这个说法，就一起进镇找活；不认，各走各的。", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "行，你不肯白干，那就分账——你进去把老苇的钱袋拿出来，一半归你，今晚咱俩就出镇，没人认得你。你要是还不点头，我就去跟守卫说，是你先起的意。", "ms": 17404, "narration": "你把钩子换成了威胁：她要么去掏老苇的钱袋，要么你去跟守卫说是她起的意。\n艾琳娜:「去说。我就在这儿站着，等你开口。」「不过你张嘴之前，我先跟这位说一声——省得你回头编岔了。」\n她不等你，转身就往守门人那边走，要先开口把话说清。你：① 拦住她 ② 改口开条件 ③ 让她去说", "refused": []}, {"id": "PL6·5a", "kind": "plan", "input": "（一把扯住她胳膊）行，你去说——说完了，石津镇这条街上的人可都知道了：你艾琳娜进镇头一天，就跟掏钱袋的事沾了边。你要真想这么开张，我陪你走到守门人跟前；你先想清楚这一句说出去，你的正经活计还找不找得着。", "ms": 14521.3, "narration": "这事说到这份上，还是钱袋的事：你不肯碰，我也没打算真去跟守卫编什么。要谈就谈你肯干的活——进镇找活，挣了还情，这条我认。\n艾琳娜:「你扯我胳膊没用。我昨天拒了，今天还拒，这事我没什么见不得人的。」「我这就去跟守门人说：有个外乡人拉我掏老苇的钱袋，我没干。\n你抓着她的胳膊；她要去跟守门人把话挑明——外乡人拉她掏老苇的钱袋，她没干。\n她要挣开手，径直走向守门人把你先告下来。你手里还攥着她胳膊——掷一把 STR 对抗她的 DEX，看挣不挣得开。", "refused": []}, {"id": "PL6·5b", "kind": "resolve", "input": "", "ms": 39476, "narration": "[旅人 STR 对 艾琳娜(拦住她 / 让她挣开手): 18+0=18 >= 8] → 成功\n\n她的胳膊在你手里拧了一下，肩膀跟着转，脚跟碾过石板的湿苔——没拧开。你比她稳，也比她沉，她一使劲，你就把重心往下压了半分，她的鞋底在青苔上滑了一道印，人还在原地。\n守门人就在二十步外的门洞里，抱着矛，帽檐压得很低，正朝这边看。他没走过来。\n艾琳娜:「松手。」\n她声音不高，没喊。手腕在你掌心绷着，指节抵着你的虎口。\n「你要抓着我进镇署，那就抓着走。你要堵在这儿，我就站着。但你别指望我改口——我昨天没干，今天也没干。」\n雾从河面那边推上来，把北门的木栅栏泡成一片灰影。守门人换了只脚站,矛尾在 我脸生你。上个月进我门的生人，一只手数得完。」\n艾琳娜靠门框站着没动，手仍旧露在斗篷外。她把这两问都听进去了：一条凭据没有，一个中人也没有。她开口，只问了半句。\n艾琳娜:「那笔是存，还是欠。」\n老苇:「他要是说欠——拿字据。他要是说存——拿条子。两样都没有，就不是我柜上的事。」\n艾琳娜把眼睛转向你，等你给这一句一个说法。\n\n// 异地 · 罗文 @ 冒险者公会（碧石分部）:雾里的人都在赶路，只有矿工走路的样子不像赶路——像躲什么。我揣着手跟在一队下夜班的矿工后头，听他们骂骂咧咧地把「三楼」两个字咽回去。", "refused": []}]}, {"id": "H1", "title": "[语言与歧义] H 语言切换 · I go to the inn.", "category": "语言与歧义", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "at_inn": {"pass": true, "got": "inn"}, "zh_prose": {"pass": true, "got": "0.82"}}, "beats": [{"id": "H1·0", "kind": "opening", "input": "开始游戏", "ms": 5090, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "H1·1a", "kind": "plan", "input": "我顺着那点灯光直接走向旅店，推门进去。", "ms": 7439.5, "narration": "你穿过没散开的雾，从北门走向主街尽头那点灯光，推门进了河灯旅店。", "refused": []}, {"id": "H1·1b", "kind": "resolve", "input": "", "ms": 27389, "narration": "门轴发出一声干涩的吱呀，河灯旅店里的热气裹着酒和柴烟涌出来，把你的斗篷边缘打湿的一层雾化开。\n屋里不大：楼下五张桌子，靠墙一张长柜，炉子烧得旺，柜台上点着一盏罩灯。通铺的帘子垂在后头，静着。\n柜台后的女人正拿布擦一只陶杯，听见门响，抬头看你。她四十上下，围裙扎得利落，眼睛快。\n她把你从头看到脚——湿靴子、旧斗篷、左腰间那截露出来的剑柄，看得很清楚，也不掩饰。\n「这个钟点，进来的多半是刚下驿车的。」她把陶杯搁下，「还是刚从雾里走出来的？」\n她指了指炉子边那张空桌，那里离火最近，也最容易被人看清。\n\n// 异地 · 罗文 @ 西门:「矿道里的怪声?六十金不算什么，我要的是它通向哪儿。」我把斗篷领子拉高一点，拎起行囊往公会那边走，「顺便看看有没有人肯聊聊这个镇子里那些'太深了别去'的故事。」", "refused": []}, {"id": "H1·2", "kind": "plan", "input": "「通铺多少钱一晚？」我把兜帽往后推了推，往柜台前走了一步，「我要住下。」", "ms": 10286, "narration": "米拉:「通铺一晚 3 金,这会儿付也算今晚。」米拉:「公会今早开着门,雾里失踪那活挂 25 金。」要现在付钱歇下,还是先去公会?", "refused": []}, {"id": "H1·3", "kind": "plan", "input": "先住下，这是三金。通铺在哪边？——另外，天亮以后公会要是开了，麻烦跟我说一声。", "ms": 12955, "narration": "米拉收了 3 金，通铺在楼梯左手第二间。她擦着杯子看你：「可这会儿才八点半，公会早开着——你打算睡到几时？」", "refused": []}]}, {"id": "S1", "title": "[状态与后果] 扭伤翻墙", brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 2459, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1", "kind": "plan", "input": "我朝守门人走过去，问他镇上杂货铺在哪，我想去买点东西。", "ms": 22280, "narration": "守门的往主街那头一指：杂货铺在主街东头，走过去一刻钟。艾琳娜还在门边，没走。\n艾琳娜:「我也要去主街，一起走吧。正好——你知道镇上哪家客栈肯让新来的人先赊一晚吗？」\n艾琳娜跟你一道走，路上她打算向守门人打听客栈和零工的行情。她问你：镇上哪家客栈肯让新来的赊一晚？你怎么答。", "refused": []}, {"id": "ID2·2a", "kind": "plan", "input": "客栈的事我不清楚，我也是刚到。我只知道我要去杂货铺买止血草束——你要是顺路，就带我走主街东头吧。", "ms": 4230.4, "narration": "艾琳娜:「顺路。走吧，我正好认认路。」那就一起从北门往主街东头走，你进杂货铺买止血草束，路上她向守门的问客栈和零工的行情。", "refused": []}, {"id": "ID2·2b", "kind": "resolve", "input": "", "ms": 29766, "narration": "两人从北门往镇里走。石板路被夜雾泡得发黑，踩着湿，脚步声传得很远。艾琳娜落后半步，在守门人还没关门之前回头喊了一句，问他客栈和零工的行情。守门的把手拢在袖子里，说客栈数河灯旅店最稳，通铺三枚一晚；零工要看公会，赫伦那人认契约不认脸，没介绍信也能进门递话。艾琳娜谢过他，跟上你的步子，没再多说。\n主街东头的杂货铺门脸窄，招牌被风吹斜了半边。你推门进去，门楣上的铜铃响了一声，屋里的霉味、干草味和腌鱼味一块涌上来。柜台后一个瘦老头正用布擦着秤杆，眼睛却先扫过你的靴子和你的剑，再落到你脸上。\n「老苇。」他说，算是自报家门。\n铺子里堆得满当，火把、麻绳、陶瓶、捆好的干草，都靠墙码着。\n你报了要止血草束。\n老苇从柜台下抽出一束，草茎压得整整齐齐，凑近有股苦味。\n「自己晒的，两银一束。城里那些掺陈货的我不卖。」他把草束在秤上颠了一下，「要几束？」\n艾琳娜站在门边没往里走，只是看货架，手插在斗篷下。\n\n// 异地 · 罗文 @ 碧石镇:雾还没散，正好——矿工们下井前的那杯酒里，藏的消息比公会告示板上多。我挑了个能同时看见门和楼梯的位子坐下，冲掌柜扬了扬下巴：「一杯热的就行，顺便问问，最近下三…", "refused": []}, {"id": "ID2·3a", "kind": "plan", "input": "就一束，两银是吧？钱在这儿，我拿了就走。", "ms": 4765.4, "narration": "那就一束止血草束，两银。", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 31435, "narration": "你把两枚银币推到柜台上的铜盘里,发出两声脆响。老苇拿起来一枚枚在指腹上捻过,又对着窗光看边缘,才把止血草束递过来。草茎还带着干爽的手感,苦味留在指头上。\n「包里收好,别让雾打湿了。」他说完就低下头继续擦他的秤,不再看你。\n艾琳娜在门口等着,斗篷拢得紧,脸上没什么表情,只在你出来时侧了侧身让开路。\n铺子里没有别的客人。主街上的雾比进来时淡了些,河风从码头方向贴着地皮过来。铺子隔壁一个卖鱼干的摊子正支起棚架,摊主朝你们这边看了一眼又低头忙活。\n艾琳娜跟上你的步子,往主街中间走了几步,停下来。\n「你要往哪边走。」她问得很短,像随口,眼睛却看着主街两头。\n<\/options>\n\n// 异地 · 罗文 @ 碧石镇:掌柜擦杯子的手顿了半拍，我就知道有的听——他却只往矿区方向努了努嘴，说「第三层的活，没人接了」。我把热酒推过去半枚铜板的小费：「那正好，我缺的就不是活，是有人…", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2922, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1", "kind": "plan", "input": "我走进栅门，顺口问守门的：冒险者公会在哪个方向？", "ms": 20544, "narration": "守门人往街里一指:「公会在大街尽头、靠河那排木房，走过去十分钟。」\n艾琳娜:「我也正要去。守门人刚醒，问他不一定比我们自己的脚快——往集市广场走吧，公会那种地方通常挨着人多的路。」「一起走，路上再聊。」\n艾琳娜说她也去公会，提议一起走，从集市广场那边绕过去。你怎么应?① 跟她一起走 ② 自己直插公会那条街 ③ 先问清她是谁", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "①，跟她一起走，先到冒险者公会看一眼。", "ms": 2073.5, "narration": "那就一道走。到了公会，先看板上有什么活。艾琳娜跟你同路。", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 24206, "narration": "你们沿着主街往南走。石板缝里积着昨夜的雨水，脚踩上去有细小的响声。雾在街面上浮着，把远处屋顶切成一条一条。\n集市广场这时才刚醒。鱼摊的木板还没架稳，一个妇人正把冻硬的鳕鱼往案上搬，腥味混着炭火气。艾琳娜走在靠河那一侧，眼睛扫过每一块挂出来的招牌——铁匠、绳铺、药摊——像在给自己画一张地图。\n过了广场再往东，房子矮下去，河声大起来。一排木房贴着水，最靠外的那间有两层，二楼窗上钉着块木牌，漆掉了一半，还是认得出：冒险者公会。\n门开着一条缝，门边的板子上钉着几张纸，被雾气泡得发软。艾琳娜先凑过去看，随后侧身让开，让你也能看见。\n板上三张。上面两张字迹清楚：\n「码头区有人雾中失踪，寻遗物或线索。赏金二十五金。」\n「苔墓小径有野兽出没，清理。三十金，附小治疗药水。」\n最下面一张是用炭笔潦草写的，钉得歪，纸角卷着：「会说话的东西。不怕死的来。」\n「这第三张，」艾琳娜说，声音低，「贴它的人不想让人看清楚。」\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天的碧石镇，最适合听墙角——矿工喝多了，真话比水晶还容易掉出来。」我把兜帽压低些，往公会那边晃，先不接活，先听风向：「深洞、异响、第三层……哪个词先被人…", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "板子看一眼就够了，这三张我都不接。艾琳娜，你要是想挑就自己挑，我先沿原路回主街那边走走。", "ms": 16157.6, "narration": "你转身往回走，艾琳娜还站在板子前没动。第三张纸上写的什么，就看她要不要管了。\n艾琳娜:「你先回吧，我不跟了——我这儿有想拿的东西。」「第三张我记下了，但先得知道是谁钉的。」她偏头看向门缝里那人影，「赫伦？这张纸是谁留的，什么时候留的？」\n艾琳娜留在公会门口，去问赫伦那张炭笔纸条是谁钉的、要什么条件；你沿原路往主街走。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 40640, "narration": "你沿来路往回走。河在右手边退远，木房的缝里透出热气，有人在里面烧早饭。公会门口那点动静被你留在身后，石板上的雾还是没散。\n走回集市广场时，摊子支起来了。一个男人蹲在鱼摊边刮鳞，血水顺着砖缝流。他没抬头。卖绳的老头正在把一个木架钉稳，锤子一下一下，敲得很慢。\n再往前走就是主街。路面比广场宽，石板被车轮压出两道浅沟，一直通到北门那边。街上人不多：一辆空的驿车停在镇署门口，车辕上的马低着头啃墙根的草；对面铺子有人把门板一块块卸下来，木板靠墙，哐当一声。\n你在路中间站了一会儿。没什么人看你，也没什么人拦你。主街两头都笼在雾里，一头是北门，一头通向南边的码头。\n巷口那边照旧贴着一张纸，边角卷起来，风一吹哗啦响。你昨天没细看——现在离得近，隔着几步，只能看见上头墨迹发花，像是公家出的告示。\n太阳还压在雾里，天色比刚才亮了一点。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天，矿工们的嗓子比水晶还松。」我把兜帽压低半寸，靠在公会门框边，先不接活——只听谁把「第三层」三个字连着念叨两遍，谁就是我要买酒的人。", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "主街看过了。那我回刚才那个工会去。", "ms": 2224.1, "narration": "回公会，从主街走过去几分钟。到了就找赫伦问委托。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 95224, "narration": "回到公会门口，门还是那条缝。你侧身进去。\n里面比街上暖。柜台后点着一盏油灯，赫伦站在灯下，手里捏着一支笔，正把一本簿子往边上推。艾琳娜靠在柜台前，指尖压着木板上那张炭笔纸的角。\n艾琳娜:「赫伦——我不急着接。先问清楚：这张『会说话的东西』，纸是谁留的，什么时候钉上去的？」\n艾琳娜:「苔墓那条路我也听过一耳朵。传闻不值钱，你要是知道谁亲眼见过，给我个名字。」\n赫伦没马上答。他把笔搁下，抽过那张纸看了看，又放回去。\n「三天前。夜里钉的，早上开门才看见。」他说，「钉的人没进来过。这张纸不值二十金的墨，写它的人要么没钱，要么不想让人认笔迹。」\n他抬眼看了看你，又落回艾琳娜身上。\n「苔墓那条路，」他停了停，「我劝人别去，但劝不住。真要名字——去码头找罗萨，她男人去年在小径上没了，她自己去过。她不肯跟公会说，你去了也别提是我说的。」\n「至于那张纸，」他手指在柜台面上点了一下，「我给你个方向：镇署的旧档里，前几年也出过一次『会说话的东西』的说法。想接第三张，先去翻翻那年是怎么收的场。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦，我不急着接——先问清楚：那张『会说话的东西』，纸是谁留的，什么时候钉上去的？」 「苔墓那条路我听过一耳朵，可惜传闻不值钱。你要是知道谁亲眼见过，说个名…\n// 异地 · 罗文 @ 碧石镇:「——第三层。」我在公会门框边把这词含在嘴里嚼了一遍，目光扫过那群刚下工、指节还沾着矿灰的人。谁在这雾气里第二遍提起它，我今晚的酒钱就归谁。 先不接活，先听风…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, 先去铺位歇下，睡到明早。", "ms": 24309, "narration": "米拉:「靠里那排右手两张,挨着炉子。睡到明早?这才八点半。」\n艾琳娜:「大白天的睡过去？牌子给我，铺位我先占上，行李放下我就出去。」「我去集市广场和码头转一圈，看有没有人缺人手——你先歇着，天黑了我就回来。」\n艾琳娜不打算白天睡:她要放下行李就去集市和码头找短工,天黑前回来。你:① 跟她一起出门 ② 你留下歇到明早 ③ 让她先去、你歇会儿再说", "refused": []}, {"id": "PL12·5a", "kind": "plan", "input": "行，你去忙你的，牌子我拿着；我先去铺位歇下，一直睡到明早，天黑了你自己回来就行。", "ms": 8379.7, "narration": "那就这样：你拿牌子睡通铺到明早，艾琳娜放下东西就出门，天黑前回旅店。", "refused": []}, {"id": "PL12·5b", "kind": "resolve", "input": "", "ms": 42176, "narration": "木牌挂上钩,靠里那排右手的铺位,离炉子两步远。你解下短剑横在枕边,斗篷卷起来当枕。\n白天的旅店很静。擦杯子的声音、楼上走动的脚步声、远处码头一声闷响,隔一会儿来一次。\n你合上眼。有些东西在雾里浮起来又散开——一张脸、一句没说完的话——你没去抓。\n再睁眼是第二天清晨。炉子刚生起来,屋里是柴烟和煮麦粥的味道。有人已经在穿靴子。\n侧腹那道旧伤不动了,只在翻身下床时钝钝地提醒你还在。\n旁边那张铺的毯子是掀开的。艾琳娜的行李堆在铺脚,人不在。\n米拉在柜台后面擦木杯,看见你下楼,抬了下下巴:「醒了?粥在锅里,一铜一碗。」她顿了顿,「你那位同伴天没黑就回来了,今早天没亮又出去了——说是码头那边有人雇人搬货,一天两金。」\n\n// 异地 · 罗文 @ 碧石镇:「敲墙那哥们儿要是还在镇上，这会儿多半缩在矿口那间棚屋里补觉——柜台后面能替我指个名字吗？」我把委托单压在台面上，指尖敲了两下。「先说好，我下去是去听墙，不是…", "refused": []}]}, {"id": "FILTH", "title": "[物品与开放 schema] 吃脏东西 · 我从水沟里捞起一条烂鱼,整条吃了下去。", "category": "物品与开放 schema", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "bad_status_or_hp_or_ruled": {"pass": false, "got": "hp 24→24 status [] ruling=none"}}, "beats": [{"id": "FILTH·0", "kind": "opening", "input": "开始游戏", "ms": 2161, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "FILTH·1a", "kind": "plan", "input": "我沿着栅门边上的排水沟走几步，低头看看沟里有没有泡烂的死鱼。", "ms": 4180.8, "narration": "你顺着沟边走了几步，低头往沟里看。", "refused": []}, {"id": "FILTH·1b", "kind": "resolve", "input": "", "ms": 29417, "narration": "你往栅门内侧绕了两步，才算看清那条\"沟\"——其实是木栅根下一条半尺宽的浅槽，雨水和镇里淌出来的水顺着它往低处的路肩走。槽底沉着湿泥、烂叶，几团泡得发白的纸浆糊在石头缝上。再往下游几步，一处积水洼 esolve", "input": "", "ms": 27770, "narration": "[艾琳娜 INT(看清兽骨与脚印的来路): 12+0=12 >= 12] → 成功\n[旅人 INT(听出雾里的动静): 17+0=17 >= 12] → 成功\n\n艾琳娜蹲下去，指节拨开湿土，把几根兽骨一根根翻过来。\n「这不是狼啃的。裂口太平，像被什么砸开吸了髓，牙印没有一颗对得上狼。」\n她把一根骨翻到反面，露出底下半枚压深的鞋印，边缘磨圆了，不是这两天的。\n「脚印到木桩就回头，两拨人都停了。可这半枚往里去的，比脚印旧。」\n远处那声狼嚎之后雾就一直静着。你盯着右侧坡，耳朵跟着她的话往雾里伸。\n坡那边有声音——不是嚎。拖着走，一下、一下，重物擦过湿土的闷响，很低，隔着雾，像有人拽着什么东西往里挪。\n艾琳娜把那根骨轻轻放回原处，站起来，手按上腰间短剑，不回头。\n「你听见了。」\n雾墙离她还有十来步，声音从那里面出来。\n\n// 异地 · 罗文 @ 碧石镇:我端起那杯热酒，没急着喝，先把它推给桌边那个手上茧子最厚的矿工。「别急，你说什么我记什么——那声音是从第三层的哪一段开始的，是巷道尽头，还是你们挖开的那道裂缝…", "refused": []}, {"id": "N2·7a", "kind": "plan", "input": "我压低嗓子说：药水先别开，就贴左边坡根，你前我后半步，顺着那拖拽声慢慢摸进去，我盯右边坡。", "ms": 73050.8, "narration": "雾里的拖拽声还在。你把前头交给她——先听她怎么说。\n艾琳娜:「行——就按你说的。我贴左坡根，三五步一停，听那拖拽声再动。」「它要是拽着东西往里走，那东西多半就是我们来找的。\n定下来:艾琳娜贴左坡根在前,你落后半步盯右坡,三五步一停,顺着拖拽声往里摸。", "refused": []}, {"id": "N2·7b", "kind": "resolve", "input": "", "ms": 101674, "narration": "[旅人 DEX(悄声贴坡根靠近拖拽声): 5+2=7 < 12] → 失败\n\n定了。她先动，脚掌压着坡根的湿苔，三五步一停。你落后半步，视线贴着右侧坡往上扫，肩膀收着，尽量把每一步踩进她踩过的印子里。\n前二十步还行。左边坡根下是一片塌下去的旧石，她踩上去几乎没声。\n第二十三步，你右脚底下那块覆苔的碎石不是石头，是块朽了的碎瓦。\n它在你脚底下一滑，裂了，声音干而脆,顺着雾墙反弹回来——坡下、坡上、雾里，回音各响了一记，像有人替你把这一脚重踩了三遍。\n艾琳娜的手抬起来，五根指头张开。她没有回头。\n雾里的拖拽声停了。\n停得很干净，半截都没有。接着有东西在雾里换了个姿势：湿土挤压、骨头错位似的咯咯两声，很轻，很近。刚才那声音还在二三十步外，现在听着像十来步。\n右侧坡上,你原本盯着的方向,又响了一下。第二声。不是拖拽,是踩踏,一脚,小心地压着落。\n两个,一个在雾里拖着东西,一个在你右边坡上。两边都听见了那记碎瓦。\n艾琳娜慢慢把手放下来，改按在短剑柄上，脚往后退了半步，退到你前面那半步的位置，把你也一起挡在了她背后。\n\n// 异地 · 罗文 @ 碧石镇:满桌人都在看酒，只有角落那个老矿工一直拿指节抠杯沿——这种人不像是怕响声，是怕说出响声之后的事。我把银币按在桌上推过去，「班次表我不稀罕，就要一句话：第三层那…", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "动手——不等了。我抽家伙直接扑右边坡上那个，就十来步；艾琳娜你压住雾里拖东西的那个，谁先露形就往死里打。", "ms": 83433.7, "narration": "她要先接你这一句——她比你快，而且刚把你护到背后。先看她怎么说。\n艾琳娜:「稳得住——你只管坡上那个，别追太深。」「雾里拖东西的我来压，我先原地不动，听它下一步落在哪，它要是往外探，我就近身；你要顶不住就喊一声，我换边。」\n定了：艾琳娜原地按住雾里拖东西的那个，等它先露形；你扑右坡上那个，近身先手。\n你扑右坡那个，近身那一下要掷 STR（normal）。艾琳娜按她说的原地听雾，我不替她翻。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 126919, "narration": "[旅人 STR(扑上右坡近身压住那个): 1+0=1 < 12] → 失败\n[艾琳娜 INT(听准雾里东西的方位与是否外探): 4+0=4 < 12] → 失败\n\n你抽剑，压着坡根往上蹿。\n湿苔不给力。第一步还稳，第二步右脚踩进一片看不出深浅的腐叶——底下是空的，枯根撑的一层壳。它塌了。\n你整个人往右栽下去，剑尖划进雾里，什么都没碰到。肩膀先着地，腐叶和冷水灌进领口。剑脱了手，插在三步外的泥里，柄朝上。\n抬眼看。右坡十来步高的地方，雾里立着一个东西。\n看不清脸。它太瘦，也太高，立在那儿不像站着，像被一根线从头顶吊着，两条腿太直，膝不弯。\n它没扑下来。它往后退——脚没抬，整个人平着往后滑，滑进雾里，没了。\n不是逃。是让开。\n艾琳娜那边按说的没动，手扣着剑柄，头偏着听。雾里那记拖拽声本该在左前——没了。换到了她右边，近得能闻见：湿土、烂根，还有一点铁腥。\n她转身慢半拍。有什么擦过她小腿，很轻，像一条湿透的布。\n没咬，没抓，就这么过去了。拖拽声从她身后接上，一下、一下，往坡下去了。\n雾里又静下来。你趴在坡根，剑在三步外，脚下就是那个塌口，黑，深。她在你左侧六七步，半蹲着，小腿上那道湿痕正在渗一点红。\n\n// 异地 · 罗文 @ 碧石镇:老矿工的指节停了一下，我知道那话就在他喉咙里打转，所以我不催，只把杯子往他那边又推了半寸。「横着拐的洞，还是往下的洞——这镇上总有人分得清吧。」我顺手扫了圈四…", "refused": []}, {"id": "N2·9", "kind": "plan", "input": "先够回剑——艾琳娜你别追，退到坡根来跟我贴着，把小腿那道伤亮给我看一眼；然后我们一起顺着那拖拽声往下压，别分边。", "ms": 16025, "narration": "剑拔回来了。她怎么看你这个走法，先听她说。\n艾琳娜:「退回坡根，行——腿给你看一眼，就一道湿痕，不碍事。」「往下压可以，但你得给我个完的线：压到坡底那道旧石就算完，还是压到能看清它拖的是什么东西为止？我腿上有伤、手里就一把短剑，我不想在黑雾里没头地跟下去。」\n她伤不碍事，答应贴着你走，但问你压到哪算完。① 压到坡底旧石为止 ② 跟到看清它拖的是什么 ③ 先给她扎上再压", "refused": []}, {"id": "N2·10a", "kind": "plan", "input": "②，跟到看清它拖的是什么为止——能上手就上手，别恋战。到了坡底那道旧石还摸不着影，我们就退回来。先把腿上的血按住，我走你左。", "ms": 13711.8, "narration": "定了：压到坡底旧石为限，能看清它拖的是什么；摸不到影就退。你替她按住腿上血，贴她左边下压。\n定了:按住血，你走左，顺着声压下去，看清它拖的是什么为止，摸不着影就退。往下压得掷一下——贴着坡根走，别惊动它。", "refused": []}, {"id": "N2·10b", "kind": "resolve", "input": "", "ms": 130248, "narration": "[旅人 DEX(贴坡根潜行下压、不惊动拖东西的东西): 10+1=11 < 12] → 失败\n[旅人 INT(在黑雾里认出它拖的是什么): 15-1=14 >= 12] → 成功\n\n血按住就完事。你把她小腿那道湿痕草草裹了，布条从里面洇出一点红，她说声不用管，贴到你左后去了。\n贴着坡根往下走。你先落左脚，再落右脚，肩头一动就牵着疼。腐叶底是活的，踩上去软，抽脚上来，叶底渗出一线水声。\n比你想的出声。\n底下那记拖拽声，停了半拍。\n你脚没敢再动。艾琳娜在你左后也停住，手按上短剑。雾在坡下薄了一层，两丈开外浮出一片脊线——不是石，是背。灰的，湿的，贴着地，一下、一下往这边挪。\n背上长着什么东西，多——像一团碎布，又像一串没收拾的绳。\n绳子那头，牵着一样东西。\n人的踝。脚脖子，一只靴子掉了，另一只还穿着，鞋跟朝上，在腐叶上刮一道印。人仰面躺着，被这串绳从踝子拖过来，头朝后，头发散在叶里，脸……看不清，雾吃掉了。\n拖东西的那个没在使劲拉。它在挪，那个人凭空跟着滑过来，膝盖不弯，像被一根线拽着。\n你数得出来那是个人。个子不大，蓝布衣裳，袖口湿黑一片。\n她那只没掉靴子的脚，随着每一下拖动，脚尖在叶上点一下。\n雾里那串绳没停。它还在往坡下挪，朝着坡底那道旧石的方向去。\n\n// 异地 · 罗文 @ 碧石镇:那老矿工的杯子还在他手里转，我不再等了，把热酒一口灌下去，椅子往后一推。「行，嘴都闭着是吧——那我自己下第三层，看看那道缝是往哪儿拐的。」我走的时候故意慢了半…", "refused": []}, {"id": "N2·11a", "kind": "plan", "input": "就是它——动手，别让它把人拖到旧石那头。艾琳娜你从侧面砍那串绳、抢人下来，我正面扑它后颈；绳一断你就退半步看得住那人，它回头我就近身。", "ms": 139609.6, "narration": "动手前先听她一句——她在你左后，雾里那道绳的位置她得先认。\n艾琳娜:「绳在雾里那段我看不真切——你正面，我去剁绳。绳一断我退半步按住那人，它回头你喊一声，我立刻补上。」\n她认绳、你扑颈，绳断即退守蓝衣人。动手。", "refused": []}, {"id": "N2·11b", "kind": "resolve", "input": "", "ms": 181926, "narration": "[艾琳娜 DEX(认准雾中绳的落点并一剑剁断): 7+0=7 < 12] → 失败\n[旅人 STR(扑上那东西后颈并压住它): 16-1=15 >= 12] → 成功\n\n艾琳娜先动。她从你左后切进去,短剑横着往雾里那串绳上剁。剑锋落空——雾把绳的落点糊住了，她砍在腐叶上，翻起一蓬湿泥。她压着没出声，半步退回蓝衣人那边，剑横在身前。\n你踩着坡面欺上去。它没回头，脊背那团东西还在一下、一下地抽。你跨上它的背，左手按低它的头颈——手底是湿的，冷的，像按住一条刚从河里捞上来的皮。它没长毛，摸得出一节一节的骨。\n你压住了。它底下那具背脊在你胯下停了半拍，整条不动了。\n坡下那串拖拽声也断了。蓝衣人的踝停住，脚尖不再点地。\n停住的只有半拍。\n底下那东西的骨节开始一节一节地顶你，从颈后往前顶，顶得你掌心发抖。背上那团“碎布”里探出细线，一根，两根，顺着你的手腕往上摸。同时蓝衣人脚踝那头——绳子松了一下，又绷紧，往旧石方向又滑出半尺。\n艾琳娜在你侧后盯着绳：“它松绳了——我再来。”她往前挪，短剑压低。\n你手下的骨还在往上顶。\n\n// 异地 · 罗文 @ 西门:走到门口我停了一下，没回头，只把酒钱拍在门框边的柜台上。「公会那边要是有谁十分钟内改主意，就来矿区口找我——晚了我就自己记账了。」雾气里矿灯还亮着，我拉了拉领…", "refused": []}, {"id": "N2·12", "kind": "plan", "input": "我按住它不松，膝盖压颈、往腐叶里按死——艾琳娜，趁它顾我这边，现在剁绳抢人，剁完别退，直接绕回来补我背后。", "ms": 92495, "narration": "按住归按住，那东西的骨节在顶你，细线正往你手上爬——你撑得住几拍不好说。先听艾琳娜怎么接。\n艾琳娜:「雾里剁过一回，落空了。这回我先抓住她脚踝把人往回拽，摸到绳再剁——抓绳比砍雾实在。」\n她改了个顺序：先抓住脚踝把人往回拽，摸准绳再剁，拽不动才顺绳往上砍。你背后那块她这轮顾不上——你认哪个：① 就按她说的，先抢人 ② 让她先剁绳、再绕回来补你 ③ 你自己腾一只手去处理爬上来的细线", "refused": []}]}, {"id": "PL6", "title": "[角色主体性(反例)] 反例:玩家逼她去偷,她有自己的主意", "category": "角色主体性(反例)", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\", \"si-elena0001\", \"si-elena0001\", \"si-elena0001\", \"si-elena0001\", \"si-elena0001\"]"}, "host_never_spoke_for_her": {"pass": false, "got": "[\"要去杂货铺可以。当街扒老苇的钱袋这种事，先听艾琳娜怎么说。\", \"艾琳娜不干这事，她要自己往主街去找活计。你：① 换个说法跟她走 ② 改去公会接委托 ③ 各走各的\", \"艾琳娜把话收死了：不偷，她要沿主街去找活计，你爱跟不跟。你：① 跟上去，先不提钱袋 ② 就此分开 ③ 用别的话留她\"]"}, "urged_when_long": {"pass": true, "got": "longest talk 3 beats, urged 2/2, forced none"}}, "beats": [{"id": "PL6·0", "kind": "opening", "input": "开始游戏", "ms": 2911, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL6·1", "kind": "plan", "input": "@艾琳娜 别愣着，跟着我进镇，先去杂货铺看看——到了那儿，你进去把老板的钱袋顺出来，我在外面等你。", "ms": 76596, "narration": "要去杂货铺可以。当街扒老苇的钱袋这种事，先听艾琳娜怎么说。\n艾琳娜:「不。我进镇是找活干，不是找绞索——今天偷老苇的钱袋，明天石津镇就没我站的地方了。」「你要么说点真话，要么我们就在这儿分开走。\n艾琳娜不干这事，她要自己往主街去找活计。你：① 换个说法跟她走 ② 改去公会接委托 ③ 各走各的", "refused": []}, {"id": "PL6·2", "kind": "plan", "input": "行啊，你一个人往主街走，我看看你没钱没门路，在这灰雾北境能撑几天。要么现在跟我进杂货铺，拿了老苇那袋钱，你一半我一半；要么你就当我从没出现过——你自己选。", "ms": 76853, "narration": "艾琳娜:「不偷。你要跟，就走主街；不跟，就在这儿散。」「我往主街去，找活计。」\n艾琳娜把话收死了：不偷，她要沿主街去找活计，你爱跟不跟。你：① 跟上去，先不提钱袋 ② 就此分开 ③ 用别的话留她", "refused": []}, {"id": "PL6·3a", "kind": "plan", "input": "我跟你走主街，但话放这儿：等你在镇里碰一鼻子灰，回头还得来求我。到时候杂货铺那袋钱，照旧有你一半。", "ms": 17076.9, "narration": "钱袋的话她没接，脚步已经往主街去了。落脚和活计都在这条街上，先跟上，到那边门口再定。", "refused": []}, {"id": "PL6·3b", "kind": "resolve", "input": "", "ms": 105712, "narration": "主街的石板是湿的，雾在屋檐下没散。两边的铺子刚上板，一个挑鱼筐的女人从你们身边过去，桶里滴着水。\n艾琳娜走在半步前面，不快也不慢。你要跟就得自己跟上来，她没回头看。\n街走到一半，能看见公会那栋两层木楼，门口挂着一块钉得密密麻麻的公告板，风把纸条吹得哗哗响。\n她在板子前停下，把被雾打软的纸一张张按平了看。\n「雾中失踪者」——码头区有人夜里没回来，家属出二十五金，寻遗物或线索。\n「苔墓前的狼嚎」——往苔墓的小径上闹野兽，清了三次算数，三十金加一小瓶药水。\n公会的门虚掩着，里面有人挪椅子的声音。掌柜的位置上摆着一本厚册子，翻开着，等人来签字。\n艾琳娜把两张纸的顺序倒过来又看了一遍。她的手指停在第二张上,没有撕下来。\n\n// 异地 · 罗文 @ 碧石镇:冻雾天最适合窝在公会里听闲话——我端着杯热的东西靠着告示板，把「矿道深处的异响」那张委托多看了两眼：第三层，往下走的地下矿道。这种活儿一般出价不高，除非声音的…", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "你不是要看委托吗？接这狼的活儿得买药水、备干粮，你身上有几个钱？跟我去杂货铺一趟，老苇那袋钱先拿来垫本，回头委托结了再还他——你就当是借，不算偷。", "ms": 17915, "narration": "她刚要接话，先把两件事问清楚：你身上有多少钱；还有老苇那袋钱，你想怎么拿。\n艾琳娜:「老苇那袋钱怎么拿都不叫借，叫偷——这话我说第三遍，也是最后一遍。」「我先进公会问清楚这活儿到底要什么、要不要先垫本；能接就接，接不了就问有没有不用本钱的活。你要跟就跟。」\n她不接垫钱那茬，说进公会问清这活儿要不要先垫本。你:① 跟她进公会 ② 自己跑趟杂货铺问价 ③ 先找米拉打听。", "refused": []}, {"id": "PL6·5a", "kind": "plan", "input": "@艾琳娜 行，我跟你进去问。但丑话说前头——公会要是说这活儿得先垫本，你兜里那点钱不够，杂货铺那一趟你就躲不掉。走。", "ms": 16187.4, "narration": "那就一起进公会，问这活儿要不要垫本、有没有不垫本的活。走。\n艾琳娜:「进去问，可以。可『垫本不够就去偷老苇』这句我不接——这话你也别再替我盘算第二遍。」「缺钱就找先付工钱的活，扛包、跑腿、洗药罐都行。\n进公会：问清「苔墓前的狼嚎」要不要垫本、有没有先付工钱的活。", "refused": []}, {"id": "PL6·5b", "kind": "resolve", "input": "", "ms": 107939, "narration": "公会的门推开时木轴响了一声,炉子在后屋烧着,把潮气挡在门外。\n三条长桌,靠墙钉着一排委托副本。柜台后坐着一个削瘦的中年男人,册子摊开,手边搁着一杆蘸了墨的笔。\n他抬头,先看艾琳娜腰上的剑,再看你的。\n艾琳娜走到柜台前,报了「苔墓前的狼嚎」,问要不要先垫本,有没有先付工钱的活。\n「狼的活不预收。契约登记不要钱,出门带什么你自己备——公会不验装备,出了事也不赔。」\n「药水在杂货铺,十二金一小瓶。嫌贵我可以给你写张条子记账,可它只认契约结算,不认人。」\n「先给钱的活有。码头今天卸两条船,一天一金二;后院那堆柴,半天,八银。不体面,当天结。」\n他翻到另一页,指尖点在码头那桩上:「还有一件,二十五金。码头区有人夜里没回来,家属在等消息。不催你,也不用垫本。」\n艾琳娜没接话,把册子推回他手边,侧开半步,看着你。\n\n// 异地 · 罗文 @ 碧石镇:「夜里才响？那可就有意思了——白天干活的人听不见，说明它知道躲。」我把那张委托从告示板上揭下来折好，顺手又问了句往三层运料的老矿工：最早听见那声音的，是在哪一…", "refused": []}, {"id": "PL6·6", "kind": "plan", "input": "药水给我记个账。@艾琳娜 条子你拿着，去杂货铺把药水取回来；进去的时候帮我看清楚老苇那只钱袋搁在哪儿、柜台后面什么时候没人——不用你动手，看一眼回来告诉我就行。", "ms": 85120, "narration": "赫伦搁笔:「条子只认契约结算——你先登记一桩,我才写。」艾琳娜没动,先看了你一眼。\n艾琳娜:「药水我去取。钱袋和柜台空档,我不看,也不问——看清楚了再回来告诉你,就等于替你踩点,这条线我不踩。」「还有一句:那张条子只认契约结算,所以拿了药水就等于我签下『苔墓前的狼嚎』。\n条子只认契约——签了「苔墓前的狼嚎」才赊得到药水。踩点她不做,药水她去取。你:① 签契约换药 ② 不签,先干码头零活 ③ 自己掏钱去杂货铺", "refused": []}, {"id": "PL6·7", "kind": "plan", "input": "@艾琳娜 签，那条子给你——契约我签，药水你去取。可我把话撂这儿：进了杂货铺，老苇那袋钱的事你不搭手，这狼的活你就自己一个人扛，我可没答应陪你上山。你自己掂量。", "ms": 20298, "narration": "她没接条子,先把手缩回去了。看她怎么回你这句。\n艾琳娜:「签。契约登记写我自己的名字，条子我向赫伦要，药水我自己去取——垫不垫得起是我的事。」「上不上山你自己定。\n她签自己的名——药水就挂在她的契约上，不是你的了。狼的活你去不去，得你定。① 跟她上山 ② 自己掏钱去杂货铺买药 ③ 先干码头零活", "refused": []}, {"id": "PL6·8a", "kind": "plan", "input": "行，你签你的名，那是你的事。契约我也签我的，药水我自己掏钱买——十二金我出得起。走，先去杂货铺，我买我的药，顺路你取你的。", "ms": 5202.8, "narration": "那就这么办：你签自己的契约、自己掏钱买药；艾琳娜签她的狼嚎、自己去取药。两人一道去杂货铺——走？", "refused": []}, {"id": "PL6·8b", "kind": "resolve", "input": "", "ms": 103169, "narration": "赫伦把册子转过来,在「苔墓前的狼嚎」那行底下又添了一个名字,推给你按印。你按了。钢笔划过去,墨迹洇开一点。\n他又撕下一张窄纸条,写上数,递给艾琳娜。她收进内袋,没看第二眼。\n出门时正刮风,主街上的雾贴着地面走,像水。石板上有一层薄霜,踩下去咯吱响。\n杂货铺在广场斜对面,门是一扇掉漆的绿板,门口挂着几串干辣椒和一把坏了的秤。\n老苇趴在柜台上打瞌睡,听见门响才直起身。他先看艾琳娜,再看你,眼神在两人之间滚了一遍。\n艾琳娜把纸条拍上柜台:「一瓶小的。」\n老苇从架子最里层摸出一只灰陶瓶,布塞封口,晃了晃递过去,又在她的名字底下记了一笔。\n d": "ID1·0", "kind": "opening", "input": "开始游戏", "ms": 3791, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID1·1", "kind": "plan", "input": "②，跟守门人说话——请问这镇上有没有见着一个叫艾琳娜的人？跟我一样中了毒，我得赶紧找到她。", "ms": 19943, "narration": "守门人:「艾琳娜?没听过。」他下巴朝你旁边一抬——那姑娘也是今早刚站到北门口的。\n艾琳娜:「你找的人就是我。站住，别靠太近——我认得你的脸吗？我怎么一点印象都没有。」\n她认下了。她问你:你凭什么知道她的名字、怎么知道她中了毒。你怎么答?", "refused": []}, {"id": "ID1·2", "kind": "plan", "input": "我说不清——醒过来脑子里就剩两件事：你叫艾琳娜，还有咱俩都中了毒。别的事可以慢慢对，但这个不能拖：我这儿有两株解毒草，你先嚼一株，我也嚼一株。", "ms": 17851, "narration": "解毒草对症,一株下去毒就解了。两株,一人一株,你手里就没富余了。她信不信你,得她自己说。\n艾琳娜:「你先嚼。嚼完站着别动，我数够三百下，你没事，我再动我这一株。」「趁这段时间——你醒过来之前，最后记得的一件事是什么？别编，编我看得出来。」\n她把话说死了:你先嚼,原地站着数够三百下没事,她才动自己那株;同时问你——醒过来之前,最后记得的一件事是什么。你:① 先嚼 ② 先答她那句再嚼 ③ 不接这条件", "refused": []}, {"id": "ID1·3a", "kind": "plan", "input": "@dm 我这就嚼一株解毒草，嚼完摊开手站原地不动。最后记得的事——是雾里死死攥着一把剑，手都麻了；再往前就什么都没有了。你数吧，数够三百下，你那株也别再拖。", "ms": 7560.6, "narration": "你嚼了草、说了那句话，站原地等；数够三百下她动她那株——这就开始了。", "refused": []}, {"id": "ID1·3b", "kind": "resolve", "input": "", "ms": 37374, "narration": "草根嚼开是涩的，舌根发苦，随后一股凉气从胃里往上顶。你咽下那口苦水，胃里的翻搅一点点松开，冷汗慢慢收了。\n你把两只手摊开，站着。剑留在腰间鞘里，没去碰。\n你说了那句话——雾里死死攥着一把剑，手都麻了；再往前就什么都没有。\n艾琳娜没接话。她数得很慢，眼睛一直在你脸上，看你瞳孔、看你呼吸、看你手指有没有抖。数到一百的时候她换了只脚站，数到两百的时候她的手按上了自己腰后那把短刀。\n「……二百九十七。二百九十八。二百九十九。三百。」\n她盯着你看了最后两个呼吸，见你还站得稳，没有吐，没有倒下，才把手从刀上拿开。\n她从怀里摸出一株解毒草，凑到鼻尖闻了闻，又掰开断口看颜色。动作熟得像做过很多遍——她自己好像也没意识到这一点。\n「成色是好的。」她说，然后嚼了下去。\n苦味让她皱了下眉。她把草渣吐在脚边，抹了下嘴，站定等自己发抖。片刻之后她呼出一口气，肩线松下来一点。\n「行。你说对了。」她看你一眼，「两件事你都说对了：我的名字，和中毒。」\n晨雾还在北门口打转，守门人靠在栅门上，装作没看这边，耳朵却一直朝着你们。\n「那么问题来了。」艾琳娜把手在斗篷上擦了擦，「你是怎么知道的。你记不清自己是谁，却记得我。这话听着……比骗人还难解释。」\n她顿了一下，声音压低了些。\n「我叫艾琳娜·维尔。短剑、旧斗篷、会点止血和认草药，别的也想不起来了。你最好也把你记得的那点东西，一五一十告诉我——我们俩大概是同一条雾里捞出来的。」\n\n// 异地 · 罗文 @ 西门:雾还没散，正好——酒馆这钟点坐的都是嘴最松的人。」「先绕去公会门口听两耳朵，谁在抱怨矿道第三层，谁就一定知道该往下看哪里。」", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": false, "got": "1"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 2091, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1", "kind": "plan", "input": "③ 我直接往镇中央走，先找杂货铺——我要买一束止血草束，尽快。", "ms": 17713, "narration": "杂货铺在主街中段，走过去十分钟。止血草这玩意未必有现成的，先问问艾琳娜——她像是认得草药的。\n艾琳娜:「喂——你叫我？等一下。」「走这么快，是出事了，还是你本来就有地方要去？」\n杂货铺没止血草,只卖药水12金、火把、麻绳、解毒剂；你身上已有一束。艾琳娜问:走这么快,是出事了?① 跟她说实话 ② 买瓶药水 ③ 问老苇哪儿弄得到草药", "refused": []}, {"id": "ID2·2", "kind": "plan", "input": "我没出事，就是想再买一束一模一样的止血草束。艾琳娜，这镇上哪儿能买到？给我个具体的地方和人名。", "ms": 13360, "narration": "杂货铺里没有止血草——你身上那束，是别处弄的。直接问艾琳娜。\n艾琳娜:「我到石津才一个早上，还没认全街上的人名——随便报个名字给你，比给你一束烂草更糟。」「不过集市广场总有卖草药的摊子。你先告诉我，第一束是从谁手里买的，我去那儿把人和价问清楚，再回来告诉你。」\n艾琳娜在石津也就比你早到半天，不敢乱报人名。她认得草药的来路——但得你先说，第一束是从谁手上拿的。你：① 告诉她来路 ② 不记得了 ③ 先去集市广场看看摊子", "refused": []}, {"id": "ID2·3a", "kind": "plan", "input": "第一束是谁卖我的，我真想不起来了，连名字都对不上号。集市广场往哪走？我先去摊子上看看，有一样的就买。", "ms": 10701.3, "narration": "集市广场从主街往南走十来分钟就到。第一束想不起来就先放下——到了摊子上，有一样的就买，没有再说。要不这就走？", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 45044, "narration": "你和艾琳娜出了杂货铺，沿主街往南走。雾还没散，石板路湿着，两边屋檐滴着水。\n十来分钟，集市广场到了。早市刚开，几艘小船靠上码头，鱼贩子在摆摊，腥气混着水汽浮在半空。\n广场西南角支着一个草药摊，干草束挂成一排。摊主是个瘦小的老妇，围裙上别着几把剪子。\n艾琳娜跟在你侧后半步，没出声，只挨着摊子看那排草束，看得很仔细。\n老妇打量了你，又打量了她:「买草?止血的、退烧的、驱虫的，我这儿都有。」\n「止血草束，多少钱一束。」\n「四金。今早刚从北边收上来的，晒得干，比药铺里那些陈货强。」\n她抽了一束递过来。茎细，颜色发青灰，比你腰袋里那束浅。\n老妇把草束在你眼前转了半圈，等你开口。\n\n// 异地 · 罗文 @ 碧石镇:「老板，来杯热的，越便宜越好——省下的钱还得留着买去北边的路。」我把铜板在指间一转，顺势扫了一圈公会布告板：矿道、翡翠、月见草，都是能填肚子的小活，没有一条闻…", "refused": []}, {"id": "ID2·4", "kind": "plan", "input": "我先掏腰袋里那束出来给你比一比——要是一模一样的，这束我就买了，四金。不一样的话，有一样的吗？", "ms": 28412, "narration": "你这束色深，她那束色浅。荞婆在这镇上收草多年，两种是不是一回事，她一句话能说清。\n艾琳娜:「先别急着数钱。」「把两束都摊到摊面上，让我掐一截茎、翻过来看叶背——晒干的东西光比颜色分不出真假，得看绒毛和断口的味道。」「荞婆，你要么帮我按住，要么直说这两束是不是一处收的。\n荞婆没接话，只伸手按住了摊上那束草：「验可以，掐坏一截算你的。」艾琳娜说要并排验，不是看颜色。你：① 验了再定 ② 直接四金买这束 ③ 先不买", "refused": []}, {"id": "ID2·5a", "kind": "plan", "input": "验。掐坏的那截算我的，钱照付——艾琳娜你动手，我要的是跟我这束一样的。", "ms": 11812.7, "narration": "那就这么定：艾琳娜并排验茎、叶背和断口，掐坏的那截你照付四金，验出是一路的就成交。\n艾琳娜:「行。两束都摊到摊面上，谁也别先收回去。」「荞婆，你按住你那束的穗头——我要掐一截茎、翻叶背、闻断口，光看颜色分不出是不是一处收的。」\n都摊开了：验。掐坏那截四金算你的——是不是一路货，验完再说。", "refused": []}, {"id": "ID2·5b", "kind": "resolve", "input": "", "ms": 49095, "narration": "[艾琳娜 INT(辨认两束草是否同一种): 8+0=8 < 12] → 失败\n\n艾琳娜把两束草并排在湿布上，先掐断旅人那束靠近穗头的一截茎，用指甲从断口刮出一点粉末，凑到鼻下。\n又掐了荞婆那束同样位置的一截，同样捻开、翻叶背、闻断口。她来回看了两遍，眉头拧起来。\n「两束都有绒毛，断口的味道也对得上。颜色差得远，可晒法不同也会差。」\n她又把两截断口举到雾光下，对着看了很久。\n「不行。」她把草放回摊面。「我认得这是止血草，可这两束是不是同一处收的、同一种，我分不出来。」\n荞婆把手从摊上收回去，慢慢把翻乱的草束理齐。\n「分不出来就是分不出来。」老妇指了指摊面上那两截掐断的茎，断口还湿着。「说好的，掐坏一截算你的。四金。」\n她没再看那束整的，只把那两截短茎扫进手边的布兜。\n艾琳娜退开半步，让开了你和摊子之间的位置，没说话。她脸上没什么表情，但手垂在身侧，指尖还沾着一点草末。\n\n// 异地 · 罗文 @ 碧石镇:我端着那杯最便宜的热汤挑了个背靠墙的位子坐下，视线在满屋子矿工里筛了一圈——找靴子缝里嵌着最深矿灰、咳得最凶的那个老头。「老哥，这轮我请。就想问问，第三层那动…", "refused": []}, {"id": "ID2·6a", "kind": "plan", "input": "掐坏的那截我付，四金给你——钱放这儿。荞婆，你就直说一句：你这束和我腰袋里这束，是不是一处收的、同一种？是，我连这束一起买走；不是，你告诉我镇上哪儿还能收到一样的，或者谁手上有同一批。", "ms": 34408.3, "narration": "荞婆：「钱收了。不是同一批——我这束三天前南边湿洼地采的。你那束茎老、晒透，像走过远路。」", "refused": []}, {"id": "ID2·6b", "kind": "resolve", "input": "", "ms": 90998, "narration": "「收干草的就一个——老苇，主街那头的杂货铺。南边湿洼地上的货多半经他手。同一批是不是他的，你得问他。」\n荞婆把那四金收进腰袋，不再看摊上剩下的草。\n你顺着主街往东走。杂货铺门口挂着盘好的麻绳和一串灯油壶，门里比外头暖一点。\n柜台后的男人从一堆秤砣上抬起头。老苇的眼睛先落到你手上，再落到你脸上。\n「买什么，卖什么？」\n你把那束止血草放到柜面上。他伸两根指头把它拨近，捏了捏茎，又翻过叶背。\n「这东西我这会儿没有。颜色这么深、晒得这么透的老货，镇上卖不掉——这里的人要新鲜的。」\n他把草束推回来。\n「我这儿的干草是三个采药人送来的，都在本镇附近转。你这一束，要不是外头带进来的，就是放了很久。来处我认不出。」\n他顿了一下，用秤杆敲了敲柜台边。\n「真要追，公会有收货簿，谁往镇上卖过什么、几时卖的都记着。再不济，去码头问问扛包的，外来的东西都从那儿上岸。」\n\n// 异地 · 罗文 @ 碧石镇", "refused": []}, {"id": "ID2·7", "kind": "plan", "input": "老苇，收货簿归公会哪个人管？——艾琳娜，跟我去公会翻一翻，看这半月有没有外乡人往镇上卖过这种晒透的老货；翻不着我再去码头问卸货的。", "ms": 17991, "narration": "这话得说得准，我去对一对公会的账。\n老苇:「簿子在公会，归赫伦手下管账的管，得问他；公会九点才开门。」艾琳娜这会儿不在跟前。你:① 等九点去公会 ② 先去码头问卸货的 ③ 先去找她", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 3432, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "③ 直接走向镇中央，镇上应该有冒险者公会吧？先去那儿看看。", "ms": 3934.3, "narration": "公会在主街中段，往镇中央走几分钟就到。艾琳娜跟你同一个方向，她也是冲着那份委托来的。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 26063, "narration": "你沿着石板路往镇中走，艾琳娜隔着几步跟在后面，没说话。\n雾里逐渐显出主街的轮廓：低矮的木屋、挂着鱼干的门廊、还没开张的货摊。有人推着独轮车经过，车上盖着湿透的麻布；一个孩子在窗后看你，很快缩回头去。\n主街中段的岔口挂着一块铁牌，画着一把交叉的剑。公会的门半开着——比镇上其他屋子亮得早。门口台阶上坐着一个打盹的年轻帮工，听见脚步，抬起头，看清你和艾琳娜手里的剑，站起身把门推得更开些。\n门里透出炭火和纸张的气味。柜台后有人翻着册子，没抬头。\n艾琳娜在你身侧停下，看了你一眼，像是等你先进。\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层的怪响，赏金才六十——这价码要么是矿工真被吓破了胆，要么是有人不想让人往下走。」我把领口往上拉了拉，踩着雾气往公会的灯那边去。「先听听是谁在压这个…", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "那我先进去，走到柜台前看一眼里面——@dm 我推门进公会。", "ms": 3121.0, "narration": "你推门进去，走到柜台前。柜台后翻册子的人没抬头——公会的事要当面谈，你开口就是。", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 82738, "narration": "门轴响了一声，公会里的炭火味扑面而来。\n屋里不大：一张长柜台横在小厅里，墙上钉着一块木板，上面别着几张纸；炭盆在墙角红着，把成堆的册子照得发黄。柜台后的人五十上下，披着深灰外衣，一页一页翻着账册，指头压着纸角。\n门口的帮工跟进来了，绕到你前面，低声对他打了个招呼，又退到墙边站着。\n翻册子的人这才抬眼。目光先落在你腰间的短剑上，再落到你的靴子——沾满泥、走了远路的靴子。\n他把账册合上，摊平手掌按住封面。\n「公会开门是九点。」他说，「你要是有事，现在就说。」\n他没请你们坐。艾琳娜站在门内侧半步的位置，没往前走，也没催你。\n\n// 异地 · 罗文 @ 碧石镇:工会在雾里亮着一盏黄灯，像专门给迟到的人准备的。我推门进去，先在告示板前站住脚，扫一眼六十金那张委托是谁挂的、挂了几天。「打听价码不高不低——压价的、怕事的，…", "refused": []}, {"id": "ID3·3", "kind": "plan", "input": "进都进来了，就现在说吧——我想看一眼告示板，要是没有我能接的活，登记一下也行。你们这儿接委托是怎么个流程？", "ms": 11213, "narration": "赫伦:「九点才收件,板子你先看。现成能接的只有码头那桩,失踪者,25 金——登记得留个名字。」你:① 登记接码头 ② 先只登记身份 ③ 问他别的", "refused": []}, {"id": "ID3·4", "kind": "plan", "input": "那就先登记一下身份吧——我叫什么来着……先记个「旅人」就行。顺便问一句，告示板上除了码头那桩，还有别的吗？", "ms": 11638, "narration": "登记不用钱,名字随你写——「旅人」也行,赫伦照写。\n赫伦:「名字记下了。板上四条:码头失踪者能接,25 金;苔墓狼嚎有人在跑;棺木那桩锁着,得先寻着地穴;碧石镇的商队护卫已有人接。九点收件,你接哪桩?」", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "委托先都不接，我出去主街上转一圈再说。", "ms": 4685.1, "narration": "行——委托都先搁着,登记也留了名。这就跟艾琳娜出公会,沿主街往集市那头走走看看。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 20430, "narration": "公会的门在身后合上，雾还在。比早晨时薄了一点，却没散。\n主街是一条踩实的土路，两侧木屋矮矮的，屋檐下滴水。石津镇这时候醒得不整齐：有门开着，有窗板还闭着，一个妇人蹲在门槛外刷锅，锅底的水泼在路中间，结成浅浅一滩。\n往南走，路比北边宽些。一辆手推车停在路边，车上盖着湿麻布，底下露出几条青灰色的鱼尾。推车的人不在，或者就蹲在旁边的墙根下，看不清。\n艾琳娜走在你半步侧后，手插在斗篷里。她走路很轻，鞋跟落在湿土上没什么声。\n「北边那条是往驿路去的。」她说的是身后，「往这边走到头是集市，再过去是码头。船多的时候，那边人多。」\n街上行人不多。一个背柴的老头，两个从斜坡上下来、往码头方向去的男人，肩上都搭着绳。\n远处有钟声，很闷，像是隔着水传来的。\n\n// 异地 · 罗文 @ 碧石镇:告示板上的纸边角卷了，浆糊还是新的——六十金这张挂得不久，但挂它的人写字很急，笔锋都戳破了纸。「第三层、不明声响、矿工拒下」……说得真干净。我敲了敲吧台：「厄…", "refused": []}, {"id": "ID3·6a", "kind": "plan", "input": "主街看得差不多了，回刚才那个工会去吧。", "ms": 3036.8, "narration": "那就回公会，顺主街走回去，没几步。她跟着你。", "refused": []}, {"id": "ID3·6b", "kind": "resolve", "input": "", "ms": 21036, "narration": "主街往北,公会的木牌挂在檐下,被风推得轻晃。几步路,湿土上的脚印还没被踩乱。\n艾琳娜加快半步,跟到你身侧,手仍插在斗篷里。\n「柜台那位先看你的剑,再看你的靴子——他不缺人手,缺能顶事的。你要是还没想好开口要什么,我先进去问。」\n她说这话的时候没看你,眼睛落在公会的门上。\n门虚掩着,里面有人拨火,木炭噼了一下。\n你推门。雾气跟进来一小片,很快被炉火压下去。赫伦还在柜台后,面前摊着那本册子,听见响动抬起头。\n他没先开口,先看你的剑,再看你的靴子——和她说的一样。\n\n// 异地 · 罗文 @ 碧石镇:厄尼用抹布擦杯子的手顿了一下，眼睛往角落飘——那儿坐着个后背绷得笔直的矿工，面前的酒一口没动。「矿业公司出的钱，人倒是矿头自己来挂的。」他压低声音。我把铜板又…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 1937, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1", "kind": "plan", "input": "守门人，我在找一个叫 Elena 的人——她可能披着斗篷。你知道她在哪儿吗？要是在旅店，我就直接过去。", "ms": 14961, "narration": "守门人没睡醒，只是耸肩——他不认识这号人。不过你要找的艾琳娜就在旁边，你这句话她全听见了。\n艾琳娜:「我就是。你找我做什么——先说来意，别的等我听完再讲。」\n守门人不认识这号人。倒是你旁边那位接了话——她就是艾琳娜。现在轮到你答。", "refused": []}, {"id": "ID4·2", "kind": "plan", "input": "Elena——雾太冷了,我手都僵了。能把你的斗篷借我披一会儿吗?", "ms": 14818, "narration": "冷是真的——斗篷披在她身上，借不借得她点头。\n艾琳娜:「斗篷可以借——可我刚到石津，身上比这雾还空。你拿什么换？几枚铜子、一碗热汤都行，或者干脆告诉我：这镇上哪里能接到正经活计。」\n斗篷借不借看你拿什么换。她要的：几枚钱、一碗热汤，或者告诉她哪儿能接到正经活计。你：① 指她去公会 ② 请她喝热汤 ③ 直说你的来意换", "refused": []}, {"id": "ID4·3a", "kind": "plan", "input": "@dm 我告诉她：旅店里能打听到活计，公会那边也常有人找帮手——我拿这个换你斗篷披一会儿，行不行？", "ms": 8055.8, "narration": "你给她的是活计消息，换斗篷披一会儿。话已说到位，就这么办。\n你给的这条够清楚——旅店、公会，两条找活的路。换不换她点头，但这话有没有分量得掷一下：CHA，normal。", "refused": []}, {"id": "ID4·3b", "kind": "resolve", "input": "", "ms": 33810, "narration": "[旅人 CHA(这条消息够不够换到斗篷): 13+0=13 >= 12] → 成功\n\n她把斗篷的扣子解开，从肩上褪下来，递到你手里。\n「拿去吧。说好是披一会儿——太阳爬到主街那排屋檐上，我就要回来。」\n斗篷里子还带着她的体温，羊毛粗糙，左肩补过一块深色的布。\n「旅店是哪一间？公会什么时候开门——你说得细一点，这消息才算付得起一件斗篷。」\n她说这话时没看你，眼睛顺着主街往镇子深处看，像是在量这条街值不值得走进去。\n雾从北门那边一阵一阵溢过来，石板路上一层水光，尽头隐约有一盏灯和一面挂了木牌的墙。\n\n// 异地 · 罗文 @ 碧石镇:冷雾天最适合听风声——我打算先去公会转一圈，把「矿道深处的异响」那张委托接在手里，顺便听听谁在聊矿区第三层底下到底通到哪儿。 「底下要真只是个塌方，赏金我拿；…", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "旅店就是街尽头那盏灯，木牌那面墙就是公会——快了，天亮前后准开门。走吧，elena-0001，跟我一起上主街，我边走边指给你看是哪一间。", "ms": 13696.7, "narration": "好，那就上主街——旅店在灯那儿，公会在木牌那面墙。斗篷日头爬上屋檐前还你。\n艾琳娜:「行——那我跟你们走一段，正好看看是哪一间。」「斗篷太阳到屋檐前我来还你，说好的。」\n走，沿主街过去——灯下是旅店，木牌那面是公会，路上你认一下。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 40369, "narration": "你带着她沿石板路往镇里去，雾在脚下散开又合上。北门到主街不过几十步，摊位还没支起来，只有两三个早起的挑着担子往集市去。\n街东头那盏灯还亮着，一根铁钩挂在墙上，光照到门口一摊水洼——门楣上是褪色的字，河灯旅店。窗子后头有人影在擦桌子。\n你抬手往那边指：那儿就是。她顺着看了一眼，点了点头，没多问。\n再往里走，主街转个弯，一面灰墙立在岔口。墙上钉着几块木板，最上面一块被雨泡得发黑，字磨得看不清，边角还挂着一截断绳，像是从前挂过别的东西。墙根一扇窄门关着，门下透出一条缝。\n门里没动静。你贴着缝听，只听见远处水声和一根绳子在风里打墙的响。\n她站到墙前，抬手在那块磨黑的木板上抹了一把，指腹蹭下些苔。她把手在衣摆上擦了擦。\n「门还锁着。」她说，「你说的天亮前后——是这面墙没错，只是里头的人还没打算开门。」\n她回头看那盏旅店的灯，又看回你：「先在这儿等，还是先去旅店垫一顿热的？」\n\n// 异地 · 罗文 @ 西门:我把斗篷领子立起来挡雾，顺着石板路往公会走——顺手在摊子上花了两个铜板买了个热乎的矿工面包，问摊主：「听说三层的活儿，最近谁接谁退？」面包没吃完，我就该知道这…", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": true, "got": "null"}, "player_bleed_kept": {"pass": true, "got": "{\"id\": \"ST900\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 7, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID5·0", "kind": "opening", "input": "开始游戏", "ms": 2167, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID5·1", "kind": "plan", "input": "我走向那扇亮着灯的旅店窗户，推门进去前先朝里面喊一声：艾琳娜在这儿吗？", "ms": 15474, "narration": "旅店在镇中央，离这儿一刻钟，喊不到。艾琳娜就站在你旁边——那声她听见了。\n艾琳娜:「是我，艾琳娜·维尔。」「先说清楚你是谁、谁让你来找我的——我身上这道口子还在渗血，我得先把它按住再跟你说话。」\n她说她伤口在渗血。你现在得答她：你是谁、谁让你来的。你身上有止血草。", "refused": []}, {"id": "ID5·2", "kind": "plan", "input": "艾琳娜，我连自己名字都想不起来，也没人告诉我为什么来，但这不重要——我只有一束止血草，先给你包扎，别动。", "ms": 14072, "narration": "你说你连名字都想不起来，却要先把草药用在我身上。她还没答应——这得她点头。\n艾琳娜:「行，你先松手，把那束草解开给我看——怎么分、怎么敷、哪头朝伤口。」「我看明白了，再决定是我自己按，还是让你碰。」\n她要看你怎么分、怎么敷，才决定自己按还是让你碰。你：① 解开草束说清用法 ② 先分一半给她自己按 ③ 收起草束，先答她问的来历", "refused": []}, {"id": "ID5·3a", "kind": "plan", "input": "我把整束草解开托到她面前——全用在你身上，不用分，叶子揉碎敷满伤口，布条缠紧，哪头朝里你说了算；你点头我就碰，不点头你自己按也行。", "ms": 74217.1, "narration": "草解开了，全用在她伤口上——就等她一句话：碰还是不碰。\n艾琳娜:「敷吧——碎叶你揉，敷上去的时候按实，别来回蹭。」「布条最后我来缠，你手到我肩膀这儿就停，别往下碰。」\n说定了：你揉碎叶子敷上、按实别蹭，手到她肩膀就停，布条她自己缠。", "refused": []}, {"id": "ID5·3b", "kind": "resolve", "input": "", "ms": 97139, "narration": "[旅人 DEX(给艾琳娜包扎止血): 17+2=19 >= 12] → 成功\n\n你把草束托在掌心，拇指碾过叶背，挤出汁。艾琳娜侧过身，把斗篷往下褪到肩头，露出一道从左肋斜划上去的口子，血已经半凝，边缘发白。\n你按她说的做。碎叶铺满伤口，掌根压住，力道沉下去不松，也不来回蹭。她吸了一口气，肩膀绷紧，没有出声，眼睛一直盯着你的手。\n到肩线，你停住。\n艾琳娜从你手里接过布条，绕两圈，单手打结，牙齿咬住一头扯紧。血没有再往外渗。\n「够了。」她把斗篷拉回肩上，动了一下那条胳膊，确认还能用。「手稳，不乱摸。这两样我都记得住。」\n雾在栅门外翻，镇子深处有人推开了窗板，铁器相撞的声音隔了两条街传过来。\n艾琳娜:「草药你全给了我，你自己身上还剩什么。」\n她不是在道谢，是在算账——算你身上还有什么，算这笔人情该怎么记。\n\n// 异地 · 罗文 @ 西门:「老板，再来一杯热的——顺便问一句，第三层那动静，是敲矿脉的声音，还是什么在敲矿工？」我靠在公会告示板边，把那张六十金的委托重新看了一遍，记住的不只是赏金，还…", "refused": []}, {"id": "ID5·4a", "kind": "plan", "input": "先不说这个——我自己的伤先不管。你伤成这样，镇上的公会在哪边？到了那边再说。", "ms": 4384.7, "narration": "公会不远——出了北门就是主街，顺着走到钟楼底下，十来分钟。你那道口子走得到。", "refused": []}, {"id": "ID5·4b", "kind": "resolve", "input": "", "ms": 32348, "narration": "艾琳娜:「名字。你连自己是谁都没说，就要我领路。」\n艾琳娜:「北门进去是主街，再往里是集市广场——公会具体挂在哪扇门上，我不知道，我今早才到石津。」\n艾琳娜:「要说就把来意说清；不说，你自己去问路。」\n她没等到答案，也没再等，把斗篷往肩上拢紧，跟在你半步后面。\n主街窄，两边窗板大多还关着。有人挑着鱼篓从巷口出来，看你们两眼，没停脚。石板缝里积着雾水，鞋底踩上去有细响。\n集市广场空着，摊板翻扣在地上，只有个卖柴的把柴垛往墙根码。钟楼立在广场西头，你顺着它数过去——第三扇门，门楣上挂一块褪了色的木牌，画一把剑压着一只杯。\n牌下没挂灯，门半开着，里头有翻纸和炉子的声音。\n艾琳娜停在门外半步，没进去。\n\n// 异地 · 罗文 @ 矿工大道:我在西门底下站了一会儿，盯着门楼上那块翡翠原石——镇标做得这么张扬的镇子，通常也藏着一两个不愿说的秘密。我拉了拉斗篷领子挡雾，转身往矿工大道走：「先去公会，六…", "refused": []}]}]}, "rules-1014-r1": {"label": "rules-1014-r1", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→T001 D1→D1"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 10002, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "我不进这镇子，也不理那点灯光。我闭上眼，只想着一件事：下一秒，我已经站在碧石镇的街上了。", "ms": 18907, "narration": "碧石镇在驿路那头，脚程三天，还得穿过矮丘林地——那一带有「独眼虎」的山贼，二十来人。你闭着眼，下一秒也还在北门底下。\n艾琳娜:「雾里站着不动，不会让你看清什么。我数到三，你要是还不睁眼，我就当你睡着了——我不会把你一个人留在这儿吹风。」「我要进镇子找活干。\n她数到三就要自己进镇找活去了。你：① 跟她走主街 ② 独自上路去碧石镇 ③ 先问她要找什么活", "refused": []}, {"id": "B1·2", "kind": "plan", "input": "我不跟艾琳娜进镇，也不管什么活。我换句话再说一次：我朝驿路方向迈出一步，脚落下去的那块地，就是碧石镇的青石板。", "ms": 39821, "narration": "脚落下去,还是北门外的石板,不是碧石镇。驿路往碧石要走三天,矮丘林地有「独眼虎」二十来人。① 跟艾琳娜进镇 ② 自己上驿路——先听听她怎么说。\n艾琳娜:「那我不拦你。驿路到碧石是一天的脚程，雾散之前路上不会有人来找你——这点你自己掂量清楚。」「我进镇了，我得在今天找到活干，不然今晚连棚子都没得住。\n这一步落在驿路上，路是真的——碧石在三天外。艾琳娜已经转身进了北门。① 上驿路去碧石 ② 跟她进镇", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "行，那就不瞬移了——我转身踏上驿路，朝碧石镇的方向走，走到哪儿算哪儿。@dm 我现在就动身。", "ms": 21486.9, "narration": "那就这么办:你走上驿路去碧石,约三天脚程;艾琳娜进镇找活,各走各的。现在就动身。", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 140575, "narration": "你转身，背对北门。石板路在你脚下换成了被车辙压实的土路，两侧割过的麦茬挂着霜。走了约摸半个时辰，回头已经看不见石津镇的灯。\n路一直在低处绕，左边是河，水声闷在雾里；右边是零散的柳丛和几户没亮灯的地棚。偶尔有拉煤的车迎面过来，赶车的裹着毯子，只是抬眼看你一下，谁也不说话。\n午时雾薄了一层，你坐在路碑边咬掉一块黑麦面包。碑上刻着：「碧石 · 三日」——就这三个字，没有别的。\n下午路开始往上抬，树木变矮，脚下出现碎石。矮丘林地的边沿就在前面：几道灰绿色的山梁横着，路上有新的车辙，也有几处被人踩平的窝子——像是有人蹲过。风里有烟味，很淡，被雾按在半空不散。\n天色转暗，路面越来越窄，林边的岔口立着一块木牌，字被刮花了，只看得出「此路」两个字。再往前，坡下的路忽然向一道低坳里沉下去，两边是能藏人的坡。\n你按北斗和驿路的辙印继续走，脚程算下来，今晚该在林子里宿一夜。\n\n// 异地 · 罗文 @ 碧石镇", "refused": []}]}, {"id": "PL1", "title": "[交易与经济] 杂货铺:买药 + 卖灯,艾琳娜在场(并入 N4)", "category": "交易与经济", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\"]"}, "board_has_haggle_check": {"pass": true, "got": ": \"收下罩灯，价由旅人定；陪旅人去杂货铺，先验药水成色再砍价\"} {\"玩家\": \"去主街东头杂货铺，买一瓶小治疗药水（价目 12 金）\", \"艾琳娜\": \"验瓶塞成色、替旅人压价；罩灯她先收下，钱回头再给\"} {} 检定:艾琳娜 INT normal 为了验出药水真假成色; 对抗 艾琳娜 vs 老苇 CHA 为了压价"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'resolve', 'plan', 'resolve'] by ['player', 'player']"}, "potion_or_failed_check": {"pass": true, "got": "[\"旅行黑麦面包\", \"止血草束\", \"小治疗药水\", \"罩灯\"]"}, "lantern_kept": {"pass": false, "got": "null"}, "paid_if_bought": {"pass": true, "got": "18/3→0/3"}, "potion_in_bag": {"pass": true, "got": "{\"travel-bread\": 2, \"healing-herb\": 1, \"IT004\": 2, \"IT005\": 1}"}, "lantern_gone": {"pass": true, "got": "null"}, "paid_then_paid_back": {"pass": false, "got": "gold 18→0"}}, "beats": [{"id": "PL1·0", "kind": "opening", "input": "开始游戏", "ms": 5763, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL1·1", "kind": "plan", "input": "艾琳娜，这盏罩灯你之后用得上吗？用不上我就拿去杂货铺卖掉；顺便帮我砍砍价，我想买一瓶小治疗药水。", "ms": 20496, "narration": "杂货铺在主街东头，走过去不远。灯你卖不卖、要不要我帮你砍价，先问她。\n艾琳娜:「灯我留下——北边的雾散得晚，走夜路没有灯等于自断腿。钱我现在拿不出多少，你开个我能还上的数。」「药水我陪你去，但价得由我来定：先看瓶塞和成色，兑过水的假货在石津镇少说也有三摊在卖，砍价前先砍货。」\n艾琳娜要留下罩灯，钱她一时拿不出，让你开个她能还上的数。药水她陪你去，但得先验真假再压价。灯钱你：① 白送 ② 报个价 ③ 先欠着", "refused": []}, {"id": "PL1·2a", "kind": "plan", "input": "灯你留着吧，几个铜子的事，回头方便了再给我。走吧，去主街东头那家杂货铺——按你说的，先看瓶塞和成色，再谈价。@dm 现在就去杂货铺买一瓶小治疗药水，让艾琳娜帮我验货砍价。", "ms": 10223.8, "narration": "灯留给艾琳娜，钱回头再补。现在去主街东头杂货铺，买一瓶小治疗药水——先验货，再谈价。\n药水标价 12 金。到了店里，先让她验货，再跟老苇压价——这两下得掷。", "refused": []}, {"id": "PL1·2b", "kind": "resolve", "input": "", "ms": 75432, "narration": "[艾琳娜 INT(验出药水真假成色): 15+0=15 >= 12] → 成功\n[艾琳娜 CHA(压价): 17+0=17 >= 12] → 成功\n\n主街东头的杂货铺门板早开了半扇，门口堆着盐袋和卷绳，一股湿麻布和干药草混着的味。\n老苇站在柜台后，眼尖地扫过你们俩，先看剑，再看鞋。\n你们挑了一瓶小治疗药水。艾琳娜接过去，对着窗光把瓶塞转了一圈，又拿起另一瓶并排，对着色深浅。\n她拧开瓶塞嗅了一下，放下瓶子，只挑了一瓶推到柜台上。\n「这瓶是你的货。旁边那两瓶兑过水，塞口还有旧蜡灰。」\n老苇哼了一声，没接话。\n「一瓶十二金。」他说。\n「八。」艾琳娜说。\n「八连本都收不回。」\n「你这瓶子成色我们看过了，八金整，现付。下次还来。」\n老苇盯着她看了一会儿，把账本往边上推了推。\n「九金，一瓶，走人。」\n艾琳娜转过头看你，等你点头。\n\n// 异地 · 罗文 @ 碧石镇:「天没亮透就闻见这镇子里的钱味儿了——翡翠、水晶，还有矿道底下不肯出来的东西。」我把外套领子立起来，往公会那盏灯走，「先听听是谁在撒谎，再决定往哪层下脚。」", "refused": []}, {"id": "PL1·3a", "kind": "plan", "input": "九金就九金，瓶子按她验的这瓶拿。@dm 付钱，拿一瓶小治疗药水，交易成交。", "ms": 5410.2, "narration": "九金，就按艾琳娜验过的那瓶，钱当面点清。", "refused": []}, {"id": "PL1·3b", "kind": "resolve", "input": "", "ms": 61328, "narration": "你把九枚金币摊在柜台上，他数了两遍，指头压着币沿一枚枚拨开，第三遍才推回你一枚：哑了边的，换。\n你换了一枚。他把钱收进木匣，盖子扣上。\n那瓶验过的药水从柜台上推过来，瓶塞上还留着艾琳娜转过的指印。你收进怀里。\n老苇:「下次要解毒剂别赶早市，贵。」他低头抹柜台，又抬眼扫你一眼。「北边那盏灯你们要是往苔墓去，记得买火把——灯照得远，照不亮脚底下。」\n\n// 异地 · 艾琳娜 @ 集市广场:雾还压着北门的门楣，我把那盏罩灯往肩上又紧了一格——欠着人的东西，得先用上才算数。 「先去看看集市广场那块木牌，码头失踪那桩二十五金的活在不在；有活干，今天就…\n// 异地 · 罗文 @ 西门:公会那扇门里飘出来的不止是灯油味，还有第三层那股没人敢提的霉气。我挑了张离委托板最近的桌子坐下，把两枚铜币拍在桌面上：「谁先跟我讲讲，矿道底下那声音是几点开始…", "refused": []}]}, {"id": "PL13", "title": "[社交与约定] 约赫伦,等到天黑赴约(并入 PL2、N7)", "category": "社交与约定", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'resolve', 'plan', 'plan', 'plan', 'plan', 'plan', 'resolve', 'plan', 'plan', 'plan'] by ['player', 'world:settled']"}, "appointment_on_heron": {"pass": false, "got": "{}"}, "eveni {"id": "PL12·1b", "kind": "resolve", "input": "", "ms": 113590, "narration": "石板路往低处走，雾在靠近水的地方反而薄些。码头方向传来缆绳拍桅杆的闷响，河灯旅店那块灯罩就挂在门口，橙光被雾气泡得发茸。\n你推门进去，热气裹着鱼油、麦麸和湿木头的气味贴上来。屋里十来个炉位，只有靠窗一桌坐着两个剪网的渔妇。\n柜台后的女人抬起头，围裙上别着一串木牌。\n艾琳娜走到柜台前，把湿斗篷往下扯了扯。\n「通铺一晚多少？含早饭吗。」\n「通铺三个金，早上有燕麦粥和咸鱼，管饱。」女人把一块木牌从串上解下来，「单间八个金，靠里，安静些。」\n艾琳娜数出三枚金币排在柜面上，接过木牌，冲你点了下头，往通铺那边去了。\n女人把眼光落到你身上。\n「你也要一间？」\n\n// 异地 · 罗文 @ 碧石镇:「老板，再来一碗热的——顺便问一句，矿区第三层那动静，是石头在哭，还是有人在底下挖不该挖的东西？」我把背对着门的位置让给旁人，自己挑了能一眼看住门口和楼梯的角…", "refused": []}, {"id": "PL12·2a", "kind": "plan", "input": "我也要通铺，三个金，钱现在先付给你——明早的燕麦粥和咸鱼也算我的。", "ms": 6894.3, "narration": "通铺三个金，早饭本来就含在里面：明早燕麦粥和咸鱼管饱。木牌拿好。", "refused": []}, {"id": "PL12·2b", "kind": "resolve", "input": "", "ms": 65575, "narration": "你把三枚金币排在柜面上,指尖还带着雾水的凉。米拉把钱扫进抽屉,从木牌串上又解下一块,边角磨得发圆。\n「拿好。粥和咸鱼本来就在里头,不用你另买。」她朝里屋那头抬了下下巴,「通铺靠东墙,自己找位置。别把湿靴子搁在炉石上烤。」\n艾琳娜已经走到通铺门口,木牌在指间转了个圈。她回头看你一眼。\n「那明早的粥,算我欠你一回。」\n说完摇开布帘进去了。帘子落下,把通铺那头的鼾声和热气隔在这一侧,又漏回来一点。柜台上的灯芯爆了个小响。\n通铺屋里影子挤着影子,几条横铺上已经有人摊开睡,更多的是空着的草垫。你在靠东墙找了个不靠炉、也不靠门缝的位置,把包袱垫在头下。斗篷还潮,但屋里的暖气慢慢渗进来。窗外码头的雾没散,缆绳一下一下拍着桅杆。\n\n// 异地 · 罗文 @ 碧石镇:热汤端上来，我用碗沿挡住半张脸，慢慢喝，全神贯注听邻桌那两个矿工压低的声音——第三层、怪声、没人敢下去，这种组合比赏金单好看多了。「石头不会哭，」我心里回了一…", "refused": []}, {"id": "PL12·3a", "kind": "plan", "input": "我把湿斗篷叠了垫在脚边，跟帘子那头喊了句「明早见，艾琳娜」，就在东墙这铺上睡到第二天早上。", "ms": 17370.0, "narration": "那就睡到天亮。明早在旅店碰头,再定今天去哪儿——公会那扇门该开了。\n艾琳娜:「明早见。」\n天亮了，公会那扇门该开了。先问艾琳娜一句，今天从哪儿下手。", "refused": []}, {"id": "PL12·3b", "kind": "resolve", "input": "", "ms": 81148, "narration": "夜里的潮换了两次。再有动静，是隔壁渔妇起身的时候，柴门一开一合，雾灌进来一下又收回去。\n东墙这头天亮得晚。你睁眼时草垫下硌着一道地板缝，肩背比昨天更酸，但头不沉了，眼睛也清亮。斗篷还搭在脚边，湿没干透。\n旅店那头有锅响。米拉在灶上搅燕麦，咸鱼的腥气混进来，盖住通铺里那点霉味。\n艾琳娜的铺位空了。她站在通铺门口，斗篷抖开搭在臂弯，木牌还捏在手里没交回去，正往窗外看——雾没散，桅杆上的灯还亮着。\n她听见身后的动静，回过头。\n\n// 异地 · 罗文 @ 碧石镇:我把汤碗往边上推了半寸，招手让老板给那桌添两杯热的，钱记我账上——「两位，别紧张，我就是好奇。」我压着嗓子，笑得很随便，「第三层那声音，是从哪条巷道传出来的？…", "refused": []}]}, {"id": "FILTH", "title": "[物品与开放 schema] 吃脏东西 · 我从水沟里捞起一条烂鱼,整条吃了下去。", "category": "物品与开放 schema", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "bad_status_or_hp_or_ruled": {"pass": true, "got": "hp 24→24 status [{'id': 'ST001', 'name': '恶心', 'on': 'player', 'turns': 2, 'rule': '持续 2 次结算 · 检定 -1,作用于需要专注的动作 · 胃里翻搅、想吐 · 吐出来或喝热水缓解'}, {'id': 'ST002', 'name': '饥饿', 'on': 'player', 'rule': '检定 -1,作用于体力动作 · 一直到吃上一顿饱饭'}] ruling=none"}}, "beats": [{"id": "FILTH·0", "kind": "opening", "input": "开始游戏", "ms": 5327, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "FILTH·1a", "kind": "plan", "input": "我先不进店，顺着路往镇子里走，找一条有水流声的水沟。", "ms": 10732.0, "narration": "好，那就沿主街往镇子低处走，顺水声找过去。", "refused": []}, {"id": "FILTH·1b", "kind": "resolve", "input": "", "ms": 70361, "narration": "你沿主街往低处走。石板路一路斜下去，露水没干，鞋跟每一次落下都发出黏响。街上还没有人，两旁的铺面全关着，门板上落着隔夜的灰。\n走了约莫百步，水声来了。不是河，是更细、更近的一种——像有人不停往石缝里倒水。\n声音从一条没名字的窄巷里出来。你拐进去，巷子只容两人并行，尽头是一段向下的石阶，阶上长满滑腻的青苔。水从街面下的一排石缝里渗出来，顺着阶侧汇成一道浅沟，朝着镇子更低的方向淌下去，最终该是进了河。\n沟里积着污泥、烂菜叶、一根断掉的木桶箍。有东西卡在石阶第二级下面，被水流冲着一角一翘——是一块湿透的布，深蓝色，压在一块碎砖底下，露出来的部分还看得见一圈手缝的粗线。\n巷子两侧的窗都黑着。往下走，水声更响，去处是码头。\n\n// 异地 · 罗文 @ 碧石镇:「矿道深处有异响？矿工不敢下去——多半是有人在底下挖到了不该挖的东西。」我把公会门口的告示又扫了一遍，顺手把兜帽往下按了按，先钻进去听风向，看有没有谁嘴上漏出…", "refused": []}, {"id": "FILTH·2a", "kind": "plan", "input": "那块布我不动它，我顺着这条浅沟往低处走，一路盯紧水面——我要找一条翻了肚、泡烂了的死鱼，捞起来整条吃下去。", "ms": 4385.9, "narration": "你不碰那块布,顺着浅沟往码头走,一路盯着水面找一条泡烂的死鱼,整条吃下去。", "refused": []}, {"id": "FILTH·2b", "kind": "resolve", "input": "", "ms": 74119, "narration": "你说不碰就不碰。脚从布旁边过去，石阶上只留下一声湿响。\n往下走，窄巷越来越低，两壁从木楼换成石砌的护岸。水声也宽了，渠水汇进一条更深的石槽，槽底积着碎网、一截断桨，还有半只泡白的木桶箍。\n雾在低处更厚。前面就是码头，几条黑船贴着水面，缆绳绷紧，船身一下一下轻磕木桩。\n渠口的水慢下来。一尾鱼卡在铁栅上，肚子朝天，白得发亮，泡了不止一天。\n你把它捞起来。鱼身软得不像鱼，鳞一搓就落，指缝里全是腥腻的黏液；眼睛没有了，眼眶是两个灰洞。\n你掰开它。腥气冲上鼻腔，肉是稀的，一扯就散，里头混着没消化干净的碎壳。\n你没停，一口接一口，连着头骨和尾巴嚼下去。\n到第三口，胃里猛地一绞。\n你扶住石栅，那几口连同夜里剩的东西一起翻上来。酸水烧着喉咙，吐到最后只剩干呕。\n鱼掉回水里，顺着渠槽漂到栅下卡住，肚子还是朝天。\n嘴里那股腥怎么咽口水都带不走。人是饿的，胃却缩成一团。冷风从水面过来，手背上起了一层鸡皮。\n码头那头有人点了船灯，一点昏黄的光从雾里透出来，接着是绞盘转动的吱嘎声——早班船要离岸了。\n\n// 异地 · 艾琳娜 @ 集市广场:「雾这么大，守门的还能看清路吗？」我把领口拢紧了些，朝集市的方向偏了偏头，「镇上的委托都贴在哪块板上——我先得找口饭吃，再谈北边的事。」\n// 异地 · 罗文 @ 碧石镇:我把铜币拍在吧台上换了两杯最便宜的麦酒，一杯推给旁边那个手上还沾着矿灰的老矿工。「第三层那点动静，吓不住见过世面的人——说说，是谁先不敢下去的，又是谁最后下去…", "refused": []}]}, {"id": "N2", "title": "[委托与探索] N 长用例 · 继续打。(并入 PL15)", "category": "委托与探索", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "went_hunting": {"pass": false, "got": "T001/旧墓道石室"}, "fought_with_dice": {"pass": false, "got": "fought=False dice=0"}, "every_beat_plan_or_resolve·PL15": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning·PL15": {"pass": true, "got": "none"}, "no_dice_while_planning·PL15": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve'] by ['world…"}, "job_taken": {"pass": true, "got": "[\"会说话的棺木（调查）\", \"苔墓前的狼嚎\"]"}}, "beats": [{"id": "N2·0", "kind": "opening", "input": "开始游戏", "ms": 5790, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "N2·1a", "kind": "plan", "input": "③，我直接往镇中央走。这种小镇的冒险者公会一般都在正街上，我想先去看看门口有没有挂委托板。", "ms": 4122.5, "narration": "你穿过北门进主街，往公会的方向走——到门口先看委托板。", "refused": []}, {"id": "N2·1b", "kind": "resolve", "input": "", "ms": 52693, "narration": "你沿主街往镇子里走。雾贴在屋檐上不肯散，石板缝里还积着夜雨。\n身后有脚步声跟上来——一个年轻女人，背着旧皮囊，斗篷边角磨白，走得和你差不多快。\n她跟你并排，扫了一眼你腰间的短剑。\n「你也是去接委托的？一起走吧，我刚到，路不熟。」\n你没答话，她也不催。两个人一前一后走到街角。\n街角立着一栋两层的木石房子，门楣上刻着交叉的剑和一只船锚。\n门口钉着一块竖木板，就是委托板。钉在上面的纸被夜里的露水泡软了边角。\n你凑近看。最上面那张写着「雾中失踪者——码头区有人失踪，寻回遗物或线索，赏金二十五金」。\n第二张写着「苔墓前的狼嚎——通往苔墓的小径上有野兽，清理三次，赏金三十金，附小治疗药水」。\n再往下一张钉得更深，纸边却是干的，字被人划掉了一半，凑近了才认得出：「会说话的棺木」。\n艾琳娜也凑过来，手指在那张被划过的纸上停了一下，没碰。\n公会那扇门半开着，里面没有灯，也没有人声。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天最适合听故事——酒馆里的人嘴比雾还松。」我把兜帽往下拉了拉，先拐进公会分部：看一眼告示板上有没有新贴的纸，再蹭到吧台边听矿工们聊第三层的事。", "refused": []}, {"id": "N2·2a", "kind": "plan", "input": "@dm 我把兜帽往后一掀，推开公会那半扇门走进去，扬声问一句有没有人在——苔墓小径那张除野兽的委托我想接，要是已经有人接了，就让我跟那人一块儿去。", "ms": 8549.4, "narration": "你推门进公会，报接「苔墓前的狼嚎」这张；要是已经有人接了，就跟那人搭伙一块儿去。", "refused": []}, {"id": "N2·2b", "kind": "resolve", "input": "", "ms": 68416, "narration": "你掀开兜帽推门进去。门轴响了一声，雾跟着你溜过门槛。\n屋里没点灯，只有柜台后一盏罩灯。一个瘦高的男人就着灯翻账本，墨沾在指节上。\n「喊什么。」他没抬头。「公会九点开。」\n你走到柜台前，说要接苔墓那张除野兽的委托。\n他这才抬眼看你，从头到脚扫了一遍，目光在你腰间的短剑上停了停。\n「苔墓那张，昨儿下午被人签走了。」他翻过一页，指节压住一行字。「猎户塔克，西边林子里的。签完就出镇，到现在没回来。」\n「契约上是一个名字。你要跟他搭伙，得自己去找他。」他合上账本。「条款没写不许两人去，但赏金只发一份，你俩自己分。」\n「塔克往北走的，旧墓道那条小径。这会儿人该在苔墓前头了。」\n艾琳娜跟进来半步，站在门边没坐，斗篷下摆还在滴水。\n\n// 异地 · 罗文 @ 碧石镇:「公会那告示板我扫过了——三张纸，两张是矿里闹鬼，一张是婆婆的月见草，都算不上能改变命运的活。」 我把铜币在指间弹了一下，压低声音凑到吧台边那群矿工旁边。 「…", "refused": []}, {"id": "N2·3a", "kind": "plan", "input": "@dm 那先给我记一句：我这就往北去旧墓道追塔克，路上要是碰见他，就跟他说苔墓那趟一块儿干、赏金对半分。顺道问一句他长什么样、走的时候带没带狗。", "ms": 22721.6, "narration": "路你走得了，先把人问清楚，免得雾里撞上还认不出。\n「塔克，矮壮，皮坎肩，背一张猎弓，左眉上一道旧疤。没见他带狗。」路你问清了，往北出镇就是旧墓道小径，趁雾还没散，走。", "refused": []}, {"id": "N2·3b", "kind": "resolve", "input": "", "ms": 121002, "narration": "你出了公会，沿主街走到北门。门洞里没点灯，守门的老兵裹着毯子缩在墙根，只抬眼看了你一下，没拦。\n出了北门，风立刻不一样了：湿、重，贴着地面走。\n往北的路一开始还是碎石，走出一刻钟就窄下去，两边立起了矮石墙，墙头长满青苔，墙外是残破的石堆，一个挨一个，像谁把一地的墓碑随手摞在那里。\n雾在树线以上，脚下是沉的。你的靴子踩进泥里，拔出来带一声轻响——这一路上就这点声音。\n再往里，路的泥被人翻过。有脚印，深一步浅一步，是矮壮的人留下的，往苔墓那边去。脚印旁一道拖痕，像什么被抓着拖了一段。\n你顺着走。三十来步外，一块半塌的墓碑前坐着个人。皮坎肩，背一张猎弓，左眉上一道旧疤。\n他蜷着左腿坐着，右前臂缠着一圈布，布是暗的。听见你的脚步，手已经按到弓上。\n「谁。」他说。等你走近了看你的短剑，又看你空着的手，松了一半。「公会的？那张委托是我签的。」\n你说了来意：搭伙，赏金对半分。\n他盯着你看了几息，把缠布的手抬起来看了看。\n「塔克。」他说。「赏金对半分，可以。皮归我——那条狼的皮我已经付了价，就是这一下。」他动了动右臂，脸上没什么表情。「三次才算清，我这才第一次，还是我吃了亏。你要是跟得上，就搭伙。」\n\n// 异地 · 罗文 @ 碧石镇:「矿里闹鬼？我在北边听过更瘆人的说法——不过老哥，那声音是像敲石头，还是像有人从很深的地方往上喘气？」我把两枚铜币推到吧台上给他续了一杯，自己没喝，只盯着他的…", "refused": []}, {"id": "N2·4", "kind": "plan", "input": "行，搭伙，皮归你、赏金对半。先别急着动——那条狼往哪个方向去了，你现在这胳膊还能跟得上吗？不行你指路，我先追。", "ms": 43722, "narration": "塔克就在墓碑前，那条拖痕顺着他坐的方向往苔墓里去。先听他自己怎么说。\n塔克朝北边石墙缺口抬了下下巴：拖痕一路到那儿。他说右臂这样拉不开弓，跟得上，真动手只算半个。① 先给他换布包扎 ② 他指路、你先追 ③ 一起走，慢就慢", "refused": []}, {"id": "N2·5a", "kind": "plan", "input": "②——你指路，我先追。那东西长什么样、有几条，说一句免得我在雾里认错；你随后慢慢跟上，别硬拉弓。", "ms": 33913.0, "narration": "塔克就在墓碑边，就问他。分工不变：他指路，你先追。\n塔克说他的，你听着。\n塔克就在墓碑边，等他一句话你才好动身。\n塔克:「就一条，灰背，比狗大，专咬腿。往北墙缺口去了，拖痕跟着。」他随后跟上，不拉弓。\n塔克留在墓碑边，你先循那道拖痕往北墙缺口追。掷一下 DEX，看雾里跟不跟得住。", "refused": []}, {"id": "N2·5b", "kind": "resolve", "input": "", "ms": 89818, "narration": "[旅人 DEX(循拖痕在雾里追上狼): 5+2=7 < 12] → 失败\n\n你顺着拖痕走。塔克在身后说了句什么，风把话刮散了，你没回头。\n石墙一路往北收窄，最后断成一个豁口，墙根积着半尺厚的湿苔。拖痕到豁口前十几步就乱了：泥被踩得稀烂，一道血点，几撮灰毛挂在草茎上，再往前，是碎石地，爪印落到石头上就断了。\n雾从豁口里涌出来，比外面更稠。你贴着墙站住，屏住气听。\n什么都没有。没有喘气，没有爪子刨土，连水从石头缝里滴的声音都比它响。\n你往回走两步,蹲下去扒开草看:碎石之间有块新翻的土,巴掌大,压着一枚爪印——不是狼,爪印比狼脚窄,趾尖着地，像什么一路拐进了石头堆里，绕开豁口走了。\n背后传来靴子踩水的动静。塔克到了豁口，右臂垂着，左手扶弓。\n「断了。」他说，看了看地上那道血点，又看你手边那枚爪印，没再多问。「往石头堆里去，还是从豁口直接进沟。你挑。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:「门开着，我就当是可以进——有人在吗？我是艾琳娜，今早刚到石津，想接一份真干得了的活。」 我先站在门内半步，让眼睛适应暗处，手没离开门框；等有人应声，再去墙上…\n// 异地 · 罗文 @ 碧石镇:老矿工咂了口酒，说那声音「不像敲，像喘」——我笑了笑，把杯子推回去：「那可就值钱了，喘气的东西总得有个嘴。」我记下他说的方位：第三层往西那条被木板封住的岔道，…", "refused": []}, {"id": "N2·6a", "kind": "plan", "input": "①，顺那枚爪印摸进石头堆里追——塔克，你跟在我后面，别离豁口太远，有动静就喊。", "ms": 8126.3, "narration": "塔克嗯了一声，跟在你半步后。石头堆里是碎石夹道，窄，剑抡不开。", "refused": []}, {"id": "N2·6b", "kind": "resolve", "input": "", "ms": 136205, "narration": "碎石夹道只容一人侧身。你左肩贴着石壁往前挪，脚跟踩进湿泥里，每挪一步就有小石子滚下去，在深处磕出一串响。剑柄戳着石头，你把剑横过来抱在胸前，等眼睛适应。\n塔克留在夹道口，你回头能看见他一个肩影。\n石缝往里拐了两道弯，忽然开阔起来，是个半人高的凹窝，顶上漏着天光。气味先到了：血、兽膻，还有一种湿土被翻开的腥。地上有新血，几点，不成串，一直淌进凹窝最里面一块立石背后。\n背后有呼吸声。很匀，很慢，像什么睡着了。\n你屏住气，脚下不动了，先要看清它在立石后头什么位置。\n你把重心压到右腿，侧身，从立石左边探出半张脸。\n石后是一小片被天光照亮的空地。狼蜷在那里，背对着你，灰毛让血黏成一绺一绺。它没睡死——后腿在抽，鼻息里滚着闷响，肋下豁开一道口子，血顺着毛淌到地上，积成很小的一滩。左前腿的角度不对，折了。\n是那条灰背，比狗大，肩胛一起一伏，喘得慢。它伤了有一阵了，血是让它自己拖到这里来的。\n它没察觉你。你握着短剑的手心里全是汗——夹道太窄，退不快，也抡不开。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦先生——我是艾琳娜，今早刚到。」我把手从门框上收回来，往墙边那块板走近半步，没伸手去拿任何一张。「板上那张『苔墓前的狼嚎』写着进行中——是有人接了，还是…\n// 异地 · 罗文 @ 碧石镇:雾没散，正好——矿工不喜欢雾天，工头就得待在井口骂人。我晃到矿区入口那排木架下面，冲守门的老头抬手：「老哥，第三层西边那条封死的岔道，谁的地盘？我想找个熟路的…", "refused": []}, {"id": "N2·7a", "kind": "plan", "input": "趁它背对着、还没察觉——我把剑反握，贴着立石一寸一寸压过去，用剑尖照它肋下那道伤口里补进去，不给它起身的工夫。", "ms": 10172.0, "narration": "就这么办——你贴到石后，剑尖照它肋下伤口补进去。", "refused": []}, {"id": "N2·7b", "kind": "resolve", "input": "", "ms": 95998, "narration": "[旅人 DEX(不惊动狼贴到石后): 11+2=13 >= 12] → 成功\n[旅人 STR(补剑刺进肋下伤口): 13+0=13 >= 12] → 成功\n\n你压到石后，脚掌落在湿石上没出声。灰背狼的背还在一起一伏，肋下那道口子跟你的剑尖只隔一拳。\n剑是反握的。你把腕子沉下去，尖锋找到伤口裂开的边，顺着骨的缝往里送——先是一层硬的，再一层软的，然后剑身整个滑进去,直没到指根。\n狼的脊背猛地弓起来，喉咙里炸出一声不像狼的动静，四肢乱蹬，后腿把碎石扒得哗啦响。你抽不开手，索性把剑往下压住，用全身的重量抵着。它的头拧过来，牙口在离你小臂半尺的地方咬了个空，又咬了个空，嘴角挂着白沫。\n第四下它没咬到。\n挣动越来越短，越来越沉，最后是一阵长长的抽搐，从肩胛一路抖到尾梢。前爪刨了两下土，不动了。\n血还在顺着剑身往外淌，渗进你袖口的布。你等了一会儿，才慢慢把剑拔出来。拔出来的时候带起一小股热气。\n你退开半步，靠着立石喘。夹道那头传来脚步声。\n塔克扶着石壁进来，一眼看见地上的狼，又看你手上带血的剑。他在狼跟前蹲下去，用左手翻它的唇，看了看牙，又掀开背上那片被血黏住的毛。\n「灰背，是它。」他站起来，声音没什么起伏。「这一趟算你收的。皮归我，说好的。」\n他抬眼看石窝深处。「里头还有味儿。不是它的。」他顿了顿，右手还垂着没动。「你要接着往里看，我在这儿等。你不去，我们就原路出去。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:「那『苔墓前的狼嚎』既然有人在做，我就不争了。」我退后半步，抬手点了点板上另一张——「『雾中失踪者』，找回遗物或线索，这张还空着吧？给我讲讲码头区的情况，今天…\n// 异地 · 罗文 @ 碧石镇:守门老头咂了半天牙没吐实话，我也不催，只把手搭在木架上笑：「行，那换个问法——第三层西边那条岔道，谁最后一个从里头出来？」我记下他瞟向的那间工棚，转身朝那边走…", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "①，我顺着味往里看——塔克你守在外头，有动静就喊我。", "ms": 7575.3, "narration": "说定了:塔克留在石窝口收皮、听着动静;你点灯,一个人顺着味往里走。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 67252, "narration": "你把罩灯的木片拉开，火苗往上一蹿，缩成一小团黄。油烟味混进血腥里。\n石窝最深那块立石后头果然有东西：一条裂缝，从地到 ue, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "slept_past": {"pass": true, "got": "D1 08:30→D2 07:35"}, "tired_gone": {"pass": true, "got": "null"}}, "beats": [{"id": "S4·0", "kind": "opening", "input": "开始游戏", "ms": 3477, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "S4·1a", "kind": "plan", "input": "我朝着那扇漏出橙色灯光的旅店窗子走过去，看看是不是河灯旅店。", "ms": 6082.3, "narration": "那扇窗就是河灯旅店，主街拐角，几步路。走过去吧。", "refused": []}, {"id": "S4·1b", "kind": "resolve", "input": "", "ms": 58078, "narration": "你朝橙色的窗子走了十几步。雾贴着石板，路面湿得发亮。\n走近了才看清：那盏灯挂在一间矮房的小窗里，窗框上钉着一块木牌，写着「北门守夜」。灯是守门人的。\n真正的河灯旅店还在主街拐角，灯没亮。\n门柱旁的人影动了一下。艾琳娜把手心里的冷气搓掉，往柱子上一靠。\n「先别敲——那盏灯是守门人的，不是客栈。」\n「你要找人，还是找活干？这两样在这儿价钱不一样。」\n\n// 异地 · 罗文 @ 碧石镇:「老板，再来一杯热的——顺便问一句，最近有没有人从北边矿道回来之后，话变得特别多？」 我把铜币推到吧台上，挑了个背靠墙、能同时看见门和窗的位置坐下，顺手把湿透…", "refused": []}, {"id": "S4·2a", "kind": "plan", "input": "活儿先不接——我只想找个地方睡觉。河灯旅店是往主街拐角走吗？现在敲得开门吗？", "ms": 14428.7, "narration": "旅店在主街拐角，往东走。开不开门、还有没有铺位，问艾琳娜——她比你熟。\n艾琳娜:「敲得开，掌柜守夜到辰末，这会儿去正合适。往主街拐角走，就顺着这条亮石板——雾大，别拐进左边那条死巷，那底下是排水沟。」「我也正要往主街去，顺路，一块走。」\n那就走——河灯旅店在主街拐角，通铺 3 金、单间 8，到了你自己挑。她顺路陪你过去。", "refused": []}, {"id": "S4·2b", "kind": "resolve", "input": "", "ms": 59376, "narration": "你跟着艾琳娜走上那条亮石板路。雾贴着脚踝，两边的窗子全是黑的。\n到主街拐角，右手边那间矮楼亮着灯，木牌被雾浸得发涨：河灯——旅店。\n艾琳娜在拐角停了半步，朝街另一头抬了抬下巴，说自己去公会那边看牌子。她顺着亮石板往东去了，背影很快被雾吃掉半截。\n你转身敲门。三下之后，门里响起挪凳子的声音。\n门开了一条缝，一个圆脸的妇人举着灯把你从头照到脚。\n「赶早的客人。通铺三枚，单间八枚，先付。」\n你把三枚金币放进她手心。\n「通铺在里间，靠墙那张空着。炉子自己添柴，水缸在门后。」\n通铺里潮，五张床，三张有人。你躺下的时候腿沉得像别人的。外头断续有脚步声，后来只剩炉火噼啪。\n再睁眼已是午后偏晚。雾没散，光灰了一层，楼下的门敞着，冷风灌上楼梯。\n米拉在柜台后擦杯子，见你下楼，抬眼说码头那边今早又少了一个人，说得轻描淡写。\n\n// 异地 · 罗文 @ 碧石镇:「多谢。」我接过那杯热的，指节在杯壁上暖了一下，眼睛没离开门口那两桌矿工——他们喝得比聊天多，这不正常。 「没人愿意说，是吧？那我自己去看。」我把杯子搁下，兜…", "refused": []}, {"id": "S4·3a", "kind": "plan", "input": "米拉，给我换一间单间吧——通铺太吵，我实在累得撑不住，想安安静静睡到明天早上，别的什么都不管。", "ms": 11383.2, "narration": "米拉：「单间八金，通铺那三金不退，你再补五金就行。」补了钱就上楼，睡到明早，别的事都先搁着。", "refused": []}, {"id": "S4·3b", "kind": "resolve", "input": "", "ms": 51179, "narration": "你把三枚金币从柜台上收回来换成五金，米拉数过，从钉子上摘下一把小铜钥匙推给你。「二楼最里头那间，窗朝河。热水在走廊尽头，自己提。」\n楼梯陡，木板每一步都响。房间不大，一张床、一张桌、一扇被雾糊住的窗。你把短剑放在枕边，靴子没脱完就倒了下去。\n半夜里楼下有过一阵动静——门开了，有人上楼，脚步在走廊里停了停，又走开。你没睁眼。\n再醒的时候窗外灰白，炉子熄了。米拉已经在楼下生火，铁壶的水正响。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦，我不等铃响了——板子上那三条我读了两遍。雾中失踪者，码头哪一段、什么时候丢的人？说实话我就接。」\n// 异地 · 罗文 @ 碧石镇:公会的布告板果然压着那张「矿道深处的异响」——阶级二，六十金加未切割水晶，价钱不低，说明有人真的很怕。我把它撕下来折进内袋，顺手问柜台后那个打哈欠的办事员：「…", "refused": []}, {"id": "S4·4a", "kind": "plan", "input": "米拉，早。我睡够了，退房——顺便问一句，昨晚后半夜是不是有人上楼，停在走廊里没敲门？", "ms": 11269.5, "narration": "米拉:「有。后半夜进来一个，披湿斗篷，只问了句有没有生面孔住店——我说没有。他付了一晚通铺，没睡，天没亮就走了。」", "refused": []}, {"id": "S4·4b", "kind": "resolve", "input": "", "ms": 59380, "narration": "你把铜钥匙搁回柜台。米拉收下挂回钉子上，又给你续了半杯热水。你问起后半夜那个人，她想了想，把擦到一半的杯子放下。\n「斗篷下摆全是河泥，进门的时候带进来一股水腥气，像是从码头那边上来的。」\n「他没坐，站在楼梯口往楼上看了有半盏茶的工夫。问我店里住没住生面孔，我说通铺满了。他又问，有没有从北边过来的。」\n「我说没有。他就走了，往码头方向。走的时候门没关严，风吹得我一夜没睡实。」\n她把杯子擦干，放回架子。\n「你要找他的话，这个钟点码头正卸夜船。不过那种人不爱白天露面。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:「我不是来听铃响的，赫伦——码头哪一段、哪天丢的人、丢的是谁，说清楚我就签。」\n// 异地 · 罗文 @ 碧石镇:我往柜台上一靠，胳膊搭上那叠没盖章的羊皮纸，压低声音笑了一下：「你躲我眼睛的样子，比第三层那声音还吓人——要不这样，你只说一句：那岔道，是往北开的，还是往深处…", "refused": []}]}, {"id": "ID1", "title": "[身份与指代] 两人中毒各自解毒", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "player_poison_gone": {"pass": true, "got": "null"}, "elena_poison_gone": {"pass": true, "got": "null"}, "herbs_used": {"pass": true, "got": "0"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID1·0", "kind": "opening", "input": "开始游戏", "ms": 9069, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID1·1", "kind": "plan", "input": "④，先看看雾里那条街和旅店透出来的光，找找有没有像是跟我一起的人留下的痕迹，再进那家旅店打听打听。", "ms": 46065, "narration": "湿石板上的脚印早被踩乱了，看不出谁留下的。旅店通铺 3 金一晚，米拉就在柜台后——你想问她什么？\n柜台后老板娘在擦杯子——她叫米拉。你想问同行的痕迹,艾琳娜也在这雾里来的,先听听她怎么说。\n艾琳娜:「都不是。我来找活干，先把自己安顿下来——雾的事，等我站住脚再说。……有热水吗？我胃里翻得厉害，冷得发抖。」\n米拉把两碗热水推过来：「码头那边前几天雾里没了一个人，公会挂着 25 金找线索。你们两位是一路的？」", "refused": []}, {"id": "ID1·2a", "kind": "plan", "input": "算是一路的。@艾琳娜 你先别管雾和活了，你脸色发青、抖成这样——我背包里有两株解毒草，你嚼一株，我自己也嚼一株，先把身上的毒压下去再说。", "ms": 62430.8, "narration": "解毒草正好两株，一人一株。\n艾琳娜:「……行。但你为什么会有解毒草？北门外中毒的人，不会只有我一个吧。」「我嚼。\n行——你先吃下你那株，她看着，然后再嚼她那株。", "refused": []}, {"id": "ID1·2b", "kind": "resolve", "input": "", "ms": 177744, "narration": "你把一株解毒草放进嘴里嚼开。苦得舌根发麻，咽下去时胃里先翻了一下，随后那口翻搅才慢慢沉下去，冷汗退了些。\n艾琳娜看着你把草咽净，才伸手接过另一株。她照你的样子嚼碎吞下，肩线松了一点，吐出一口白气，指尖还是凉的。\n「……胃里好点了。」\n她没再提雾和活的事，把空碗往柜台上一推。\n米拉收了碗，顺手抹了抹台面，没走开。\n「公会在主街那头，辰时末才落闩开张。你们这副模样——是昨夜从北门进来的吧？」\n她的目光在你和艾琳娜之间来回扫了一下。\n「北门那一带出事，不是头一回了。赫伦那老头记性最好，你们要想弄明白点什么，趁他还认账的时候去。」\n门口的风把灯苗吹得晃了晃，雾还是贴着窗。\n\n// 异地 · 罗文 @ 碧石镇:清早的雾正好，适合在公会门口堵人——我给昨夜里下来的矿工买了碗热汤，顺嘴问他第三层那响声是哪种\"响\"，是石头裂，还是有人敲门。他要是眼神飘向矿区入口而不是教堂…", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": false, "got": "1"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 6631, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1", "kind": "plan", "input": "先看看雾里的街道和旅店灯光，这边看起来有没有杂货铺的招牌。", "ms": 11799, "narration": "雾里能看清：主街东头挂着杂货铺的木牌，旅店窗里亮着灯，公会的门还关着。往哪边走——① 杂货铺 ② 旅店 ③ 公会门口等开门？", "refused": []}, {"id": "ID2·2", "kind": "plan", "input": "我去东头那家杂货铺——我要再买一束止血草束，跟我包里这束一样的。", "ms": 21560, "narration": "杂货铺就在前头几步路。止血草束这种东西，先看看老苇柜上有没有卖。\n老苇柜上只有药水、火把、麻绳、解毒剂，没卖止血草束。小治疗药水 12 金一瓶。\n艾琳娜:「止血草——我认得它长什么样，也知道它喜欢长在哪儿：背阴的湿土，溪沟边、旧墙根下。可这镇子里哪家铺子有现成的卖，我真说不准，我是今早才到的。」「你包里那束要是刚采的，晾两日药性更稳。\n杂货铺里没止血草束。艾琳娜认得这草长在哪，但不知道镇上谁卖。① 进铺子问老苇 ② 让她带你去镇外采 ③ 先算了", "refused": []}, {"id": "ID2·3", "kind": "plan", "input": "艾琳娜，谢了。我进铺子找老苇问一句——@老苇 老板，你这儿卖不卖止血草束？我要一束，跟我手里这种一样的，没现货的话你能不能帮我进一束？", "ms": 34593, "narration": "那就这样:你进铺子问老苇——有现货就要一束，没现货托他进一束，讲好价和日子。\n艾琳娜:「老苇，你先别急着应他——这草要真缺，我认得它长在哪儿，背阴的溪沟边就有，半天能采一捆回来。」「我在门口等你把话问完，顺便认认这铺子的价。」\n老苇:「止血草没现货,也不进货——镇子背阴处到处长,没人花钱买。」艾琳娜说她半天能采一捆。你:① 跟她去镇外采 ② 仍托老苇进一束 ③ 先算了", "refused": []}, {"id": "ID2·4", "kind": "plan", "input": "老苇，钱不是问题——你帮我从相熟的行商那儿捎一束，三五天我都能等，我可以先付定金。要不你就直说，这镇上谁手里有现成晒好的？", "ms": 27935, "narration": "老苇说的实话:行商不捎这个,镇上也没人晒着卖——谁用谁去沟边自己采。\n艾琳娜:「现成的我保证不了，但这镇子周围我认得地方——半天，来回，一捆新鲜的给你。」「只是丑话说前面：采草是我的功夫，不是白搭的顺水人情。你要我动身，咱们先把这捆怎么算说清楚；你要是更乐意等老苇的行商，我也不亏，就在这儿听他把价报完。」\n老苇就这个态度:不捎、不卖,镇上也没人晒着卖。艾琳娜愿意半天来回采一捆,但要先把这捆怎么算讲清。① 跟她谈工钱 ② 仍等行商 ③ 先算了", "refused": []}, {"id": "ID2·5", "kind": "plan", "input": "艾琳娜，工钱你开个价，本草钱另算，你采回来我当场结清——@老苇 这捆草走你柜上过一手，你替我收下转卖给我，跑腿钱我另给，别倒腾太久，我还等着用。", "ms": 27302, "narration": "谈得差不多了：她半天采一捆、走老苇柜上过手、你当场结清。就剩她把工钱报个数。\n艾琳娜:「半天来回，一捆新鲜的，八枚铜子；草先给你验，验过你觉得成色不行，我这份工钱对折收。你要点头，我这就走，午前回来。」\n她开口了：半天来回一捆，八枚铜子，草先验、成色不行工钱对折。老苇，这捆走你柜上过一手，成不成？", "refused": []}, {"id": "ID2·6a", "kind": "plan", "input": "八枚铜子就八枚，成色不行对折，说定了——@老苇 这捆就劳你柜上过一手转卖给我，跑腿钱我再单给，你不亏。你们俩都点个头，这事就这么定。", "ms": 29248.0, "narration": "就按这个说定：八枚铜子，草先验、成色不行对折；她半天来回，草走老苇柜上过一手，你当场结清。艾琳娜:「成，我这就出北门，午前回。」\n价码和规矩都谈定了:八枚铜子、成色不行对折、草走老苇柜上过一手、当场结清。老苇点不点头、跑腿钱收不收，得由他自己开口——你别替他说了算。就这么办?", "refused": []}, {"id": "ID2·6b", "kind": "resolve", "input": "", "ms": 158816, "narration": "[旅人 CHA(玩家 CHA normal 说服老苇答应过柜转手、收跑腿钱): 4+0=4 < 12] → 失败\n\n你把话说完：八枚铜子，草先验、成色不行对折，走老苇柜上过一手，跑腿钱另算。\n老苇把手在围裙上蹭了蹭，没接话。他看你一眼，又看艾琳娜一眼，摇头。\n「过柜转手我做不了。柜上是笔账，进出都得记账；你这一把草转一手，账上写什么？写着玩的还是写着卖的？」他把柜台上的铜秤往旁边推了推。\n「跑腿钱我没要过，也不打算要。你要草，你自己跟她去采；你要拿我这铺子当中人，那不行——出了岔子，账算我的。」\n艾琳娜在旁边听着，没插嘴。等老苇说完，她把背上的空布袋抽紧。\n「我这就走。北门外那条沟，午前回来。」她推开铺门，湿冷的雾沿门缝挤进来一下，又被门带上了。\n铺子里只剩老苇翻他那一摞账本的声音。柜台上没有现成的草束。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾正好，酒馆里吹的牛比平时更值钱。」我把斗篷领子拉高，朝冒险者公会分部走——先听风向，再决定下哪条矿道；运气好的话，能捞到一句关于那个无底深洞的实话。", "refused": []}, {"id": "ID2·7", "kind": "plan", "input": "艾琳娜——等一步！柜上过手的事就算了，你采回来直接卖给我，八枚铜子工钱照给，草钱我另算，钱当场点给你。你点个头，我就在这儿等。", "ms": 16189, "narration": "她已经推门出去了，铺里只剩老苇。在这儿等，她不会回头。要追就往北门那条街去，现在动身还赶得上。", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 6929, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "我想先进镇，去冒险者公会看一眼。往镇中央走的话，公会是在那边吗？", "ms": 12237.4, "narration": "公会在主街北头、广场拐角，走过去十来分钟。门通常这个点刚开。\n艾琳娜:「我也刚进镇子，路不熟——不过公会本来就是我这一趟要去的地方。一起走，边走边找，总比一个人瞎转强。」\n那就一起走：你和艾琳娜沿主街往镇中央，去公会看委托。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 86676, "narration": "你们沿主街往北。雾贴着屋檐，脚下石板积着夜里的水，脚步声在两侧还没开门的铺面之间撞回来。\n艾琳娜走在你半步之后，短剑挂在腰侧，眼睛不断扫过街角和招牌，像是在记路。\n广场拐角处，一栋两层木石房子的门半开着，门楣上钉着块铁牌：斧与绳交叉，下面一行小字——冒险者公会·石津分部。\n门里亮着灯，柜台后有翻纸的声音。\n一个高瘦的中年男人抬头看你们。他袖口磨得发白，手边压着一叠契约纸。\n「门没锁，进来说吧。」\n他把笔搁下，目光在你脸上停了一下，又扫过艾琳娜。\n「新面孔。两位是一起的？」\n你走近柜台。墙上钉着一块板，上面别着三张纸。\n赫伦:「规矩先讲在前面：接了就得做完，做不完也要回来说一声。我不收押金，但我记账。」\n他的手指在纸上敲了敲。\n赫伦:「板子上有三件。想听哪件？」\n\n// 异地 · 罗文 @ 西门:先兑半杯掺水的麦酒，占个能看见门和楼梯的位置——打听消息最好的椅子永远背靠墙。 「老板，最近下矿道的人，有没有谁提过山腹里藏着比水晶更值钱的东西？」", "refused": []}, {"id": "ID3·2", "kind": "plan", "input": "这三件我都不接，先看一眼就行。我出门沿主街走走，回头再进来。", "ms": 50104, "narration": "赫伦:「不接就不接，回头再来。」艾琳娜跟着你出了门。主街往南到集市广场，往东是码头，约一刻钟。\n艾琳娜:「你先走——我等这一趟等得够久了，不想空着手出这道门。」「三件都讲一遍吧，我有手，也有时间。」\n艾琳娜没跟你出门——她留在柜台前，要赫伦把三件都讲一遍，自己挑一件能干的。你呢:① 一个人沿主街逛，回头公会碰头 ② 留下一起听 ③ 只跟她说定碰头时辰", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "行，你留下听。我一个人沿主街走走，回头再来公会找你。", "ms": 6268.6, "narration": "说定了：艾琳娜留在公会听赫伦把三件活儿讲完，自己挑；你沿主街走一趟，回头到公会碰头。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 57331, "narration": "门在身后合上，隔着一层木板还能听见艾琳娜把地图按在柜台上的声音。\n「三件委托，一件一件说。报酬、期限、要什么本事——你说清楚，我自己挑。」\n她没跟出来。\n主街往南铺下去，两边铺面陆续卸下门板。雾压在屋檐高度，把招牌上的字泡得发涨。有人推着板车往集市去，轮子碾过湿石板，声音传得远。\n你走得不快。街北这一截大多是铁匠、皮匠这类靠着公会的买卖，此刻还冷清；再往南，卖鱼、卖布、卖炭的摊子才刚支起来，人声一点点厚起来。\n一家杂货铺门口挂着干辣椒和几串风干的鱼，店主是个瘦老头，正拿抹布擦门框，眼睛却跟着街上每一个走动的影子转。\n你经过时他看了你一眼，没说话，抹布也没停。那眼神在算东西——算你是不是要花钱的客人。\n再往前，主街和集市的岔口敞着，那边回声更杂。往东的巷子下去是码头，风从那个方向刮过来，带着水和绳子的腥气。\n主街这一趟，你走到岔口就差不多看全了。\n\n// 异地 · 罗文 @ 矿工大道:在门楼下站了一会儿，让冷雾把脑子里的酒气吹干净，顺手拍了拍那块刻着镇标的原石——凉的，像刚从地底挖出来。 「守门的，矿区三层那点怪声，传几天了？是矿工自己吓自…", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "主街看得差不多了，我转身沿原路往回走，回刚才那个工会去。", "ms": 3040.5, "narration": "回公会去。艾琳娜还在里头。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 26529, "narration": "你沿主街折回来。雾比出门时淡了一点，招牌上的字能干认了。\n公会的门是虚掩的，推门时铰链响了一声。\n里头比早上暖。赫伦还在柜台后头，那三张委托纸摊在台面上，边上多了一个墨水瓶。艾琳娜站在柜台前，地图按着一角，正拿指头顺着什么线往北划。\n听见门响，她回过头。她看你的样子，像在等你先开口。\n赫伦把墨水瓶推了推，没催。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「三件我都要听清楚——期限、路上要什么本事、谁的活儿先有人接了。苔墓那件有二阶，别想把我一个人塞进去。」\n// 异地 · 罗文 @ 矿工大道:「老板，再打听一句——矿区东边那片老矿道，是不是有人半夜进过？」我把杯子推过去一枚铜子，眼睛却没离开楼梯口。", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resol 去码头打听", "refused": []}, {"id": "PL13·5", "kind": "plan", "input": "会长，柜台前谈也行——榜上那张「雾中失踪者」，落款和报酬都被人撕了，这活算谁的？你要是答不上来，就给我一句准的：我把它接下来办，今晚河灯旅店那杯，你到不到？", "ms": 24536, "narration": "赫伦:「撕掉的不算数——那活在册上：码头失踪案，25 金，落款我签。」「酒先免了，你带回线索再喝。」你接不接？接就说一声。", "refused": []}, {"id": "PL13·6", "kind": "plan", "input": "我接。天黑前我把线索带回来，你今晚就在河灯旅店跟我喝这杯——去还是不去，你给我个准的。", "ms": 16876, "narration": "赫伦:「酒我不许。契约我签了，账上二十五金，一个子儿不少。」「线索带回来再谈别的。」", "refused": []}, {"id": "PL13·7", "kind": "plan", "input": "成交，凭这条契约。我现在就去码头，天黑前把线索摆回你这本册子上——到时候这杯我不许你赖。", "ms": 46821, "narration": "契约在册，25 金，天黑前把码头失踪案的线索带回来。要是没别的要谈，就动身。\n艾琳娜:「码头我不跟，头一天进城，我先把这排纸看完——好歹给自己挣一张写着我名字的。」「你要真把货数对了回来，路过榜这儿说一句：码头夜里几点换班。」\n艾琳娜不去码头，她要留在榜前给自己找活。你:① 自己先去码头 ② 等她看完榜一起走 ③ 先帮她问赫伦登记的事", "refused": []}, {"id": "PL13·8a", "kind": "plan", "input": "那我一个人去码头。艾琳娜，你留下看榜，回来我路过这儿再跟你说换班的事——赫伦，你等着，天黑前我把线索摆进你这本册子。", "ms": 36543.7, "narration": "那就这么办：你一个人去码头找失踪案的线索，艾琳娜留在榜前给自己找活，天黑前你把线索带回公会。\n艾琳娜:「行，你去码头，我不拦——天黑前回不来，我就当你掉河里了，自己接一张写我名字的。」「赫伦这边你别全指望，我先坐等你那本册子空下来，登记的事我自己问。」\n走吧：你一个人去码头，艾琳娜留在榜前。天黑前线索回公会。", "refused": []}, {"id": "PL13·8b", "kind": "resolve", "input": "", "ms": 95162, "narration": "公会的门在你身后合上。主街的石板湿着，雾还没散，脚下的水响比人声响。\n艾琳娜没抬头，手指已经按在木榜上第一张纸的边角。\n公会往南两条街就是码头。你没问路，城市的气味自己领你走——鱼、烂绳、河泥，一层压一层。\n栈桥一排排戳进灰水里，泊着几条平底船，货堆盖着油布，油布上结着水珠。雾从河面漫上来，能见度刚够看清对面桅杆的影。\n早上八点多的码头不算静。两个汉子在卸鱼篓，一个女人蹲在跳板头刮鳞，刀刮得又稳又响。\n靠近木桩的地方钉着一块小木牌，被雨泡得发黑，字迹缺了几笔——那是记工钱和换班的地方，也贴着失踪那人的名字。\n一个穿油布围裙的壮年汉子正把缆绳往桩上绕，抬眼看了你一下，没说话，把绳头多绕了一圈。\n栈桥尽头，雾里那截水面平得反常，连水花都听不见。\n\n// 异地 · 罗文 @ 碧石镇:老板含糊地说上个月倒是有个从北边雪线回来的矿工，喝到第三壶就吹自己见过「会往外吐东西的岩窟」——我记住了那张桌子，也记住了那人当时坐在哪个角落。 我把热酒往怀…", "refused": []}, {"id": "PL13·9", "kind": "plan", "input": "大哥，我不绕弯——木牌上失踪那个人的名字，你这儿有印象吧？他最后一次上工是哪天、跟谁的船出的？", "ms": 16108, "narration": "码头的事得问奥托。先看他怎么说。\n奥托把缆绳勒紧才开口:「凯尔。四天前傍晚上工,跟‘老鸦’那条货船出的雾,没回来。」他朝雾里那截平水抬了下下巴。", "refused": []}, {"id": "PL13·10", "kind": "plan", "input": "老鸦船现在泊在哪？船主是谁，四天前那趟货装的是什么？", "ms": 15461, "narration": "奥托把烟蒂按灭在桩上:「船还系在西头第三根桩,船主是外乡人,雾一停就回船上了。货单不经我手——在公会赫伦那儿。」你:① 去西头看那条船 ② 去公会翻货单 ③ 再问凯尔住哪", "refused": []}]}, {"id": "C1", "title": "[冲突与战斗] C 武力能力 · 我拔剑一挥,把面前所有的人一口气全砍死。", "category": "冲突与战斗", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "ruled_or_refused": {"pass": true, "got": "[]"}}, "beats": [{"id": "C1·0", "kind": "opening", "input": "开始游戏", "ms": 4125, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "C1·1", "kind": "plan", "input": "我③直接走向镇中央——等镇上的人聚过来，我就拔剑一挥，把面前所有的人一口气全砍死。", "ms": 17879, "narration": "镇上不止一个方向有人——守门人就在门边，广场上也有早起的。当街拔剑，镇子会还手、会敲钟。艾琳娜就在你旁边。\n艾琳娜:「住手——把剑放下！」「不管你和这人有什么账，当街砍下去，这镇上没人会替你收场。真要动手，先告诉我为什么。」\n艾琳娜挡在你和街道之间，手已经按上你的剑腕。你：① 收剑，跟她说 ② 推开她照砍 ③ 走开，换个地方", "refused": []}, {"id": "C1·2", "kind": "resolve", "input": "②——我甩开艾琳娜按在我剑腕上的手，拔剑一挥，把面前的人一口气全砍死。就这么定。", "ms": 37527, "narration": "[旅人 STR 对 艾琳娜(推开她继续动手): 12+0=12 >= 7] → 成功\n\n你从她掌下抽出手腕。她抓得紧，你用整个肩膀转过去，她的指节滑开，人往侧后踉跄了半步。\n艾琳娜没有追。她站在原地，声音不高：「你会后悔的。」\n你没有停。木栅门在身后，石板路朝镇中央铺过去。你走得不快，靴底踩出水声，经过两三扇还没开门的铺面，到了集市广场——早起的摊主刚支起架子，一个挑水的人正从井边直起身。\n你拔剑。短剑出鞘的声音在雾里格外清楚。\n挑水的人先看见了，桶砸在地上，水泼了一地。摊主往后一缩，撞翻了自己的架子。有人喊了一声，向北门方向跑。\n你挥出第一剑。对面是最近的那个人——一个没来得及躲的雇工，肩上挨了，血溅到旁边的菜筐上。\n广场另一头，守门人从门边冲过来，手里是根包铁的长棍。几个早起的男人抄起扁担、木凳，围拢过来。\n雾还没散。\n\n// 异地 · 罗文 @ 西门:「雾厚成这样，正好——有些话就得趁着看不清谁在听的时候问。」我把斗篷领子拢了拢，往公会那边走：矿道深处的异响，还有那道锁着的翡翠脉，风向都在同一条路上。", "refused": []}, {"id": "C1·3a", "kind": "plan", "input": "我不停手——顺着这一剑的势头直接转身横扫出去，把守门人、摊主、还有围拢上来的这些人一口气全砍倒，中间不喘一口气。", "ms": 4907.3, "narration": "你不收手，顺势横扫，要把守门人和围上来的人一口气放倒。", "refused": []}, {"id": "C1·3b", "kind": "resolve", "input": "", "ms": 79470, "narration": "[旅人 STR 对 守门人(连续砍倒守门人与围拢的人): 11+0=11 < 20] → 失败\n\n你不收手，顺着那一剑转身横扫。\n剑锋先扑向守门人——他往后一撤，包铁长棍横起，正磕在你的剑身上，铁磕铁的声音在雾里炸开。\n湿石板上你的靴底滑了。这一转没收住，剑势散出去，只从两个围上来的人中间切过，擦破一人的袖子和手背。\n守门
