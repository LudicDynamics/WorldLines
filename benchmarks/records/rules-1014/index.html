.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--mono);letter-spacing:.04em;color:var(--ink2);text-transform:uppercase;white-space:nowrap}

.num{font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
.id{font:600 13px var(--mono);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 11px;font:13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.chip .n{font-family:var(--mono);opacity:.7;margin-left:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:7px 10px;font:14px var(--sans)}
.tag{display:inline-block;font:12px var(--mono);padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink2);margin:1px 4px 1px 0;white-space:nowrap}
.tag.cat{background:var(--acc-soft);color:var(--acc)}
.goal{color:var(--ink2);font-size:13px;max-width:62ch}
.rate{display:inline-flex;align-items:center;gap:8px}
.bar{width:84px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.unset{display:block;margin-top:2px;font:11px var(--mono);color:var(--ink2)}
.cell{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:4px;font:600 12px var(--mono)}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-mid{background:var(--mid-soft);color:var(--mid)}
.diff td{background:color-mix(in srgb,var(--mid-soft) 45%,transparent)}
.case-row{cursor:pointer}.case-row:hover td{background:var(--soft)}
.md table{font-size:14px}.md{padding:4px 0}
.beats{display:flex;flex-direction:column;gap:10px;padding:14px}

.beat .meta{font:12px var(--mono);color:var(--ink2)}
.beat .prose{white-space:pre-wrap;margin-top:6px;font-size:14px}
.beat .ref{font:12px var(--mono);color:var(--bad);margin-top:6px}
.pick{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.muted{color:var(--ink2)}
details>summary{cursor:pointer;color:var(--acc);font-size:13px}
footer{margin-top:48px;color:var(--ink2);font-size:13px}
@media (max-width:640px){h1{font-size:24px}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

ion": "你回头看了一眼北门里。艾琳娜站在门洞的阴影下，没有迈步。\n「我先在镇上看看有没有活。」她说，语气平平的，没有责备的意思。「路上小心，别在雾里跟陌生人搭话。」\n她转身往镇子里走，旧斗篷的角扫过湿石板，几步就被雾吞掉了。\n驿路从北门往西，沿河岸拐个弯就出了石津镇的地界。头一里还能看见镇子的屋顶，之后只剩雾、枯草，和踩硬的冻泥。河在左手边，听得到水声，看不见水。\n你把斗篷的领子立起来。腰上的罩灯随着步子轻轻磕着。\n雾里的路标是一根接一根烧黑的木桩，隔半里一根。第二根木桩上钉着块木牌，字迹被雨泡花了，只能认出「矮丘」两个字，箭头指向西。\n再往前，路面开始爬坡。\n坡爬到一半，路边枯死的灌木后面站起一个人。\n肩上搭着厚毛毡，手里横一杆长矛，矛尖对着路面。他不喊，只是站着，等你自己走进射程。\n你身后传来靴底碾碎石的声音，回头——又有两个人从雾里走出来，堵在来路。前面坡顶的草垛后面，隐约还有影子在动，不止一个。\n「站住。」坡上那人开口，声音闷在毛毡里。「这条道往西，过路要交钱。」\n他朝你脚下啐了一口。「独眼虎的规矩。三个金，或者把包留下。」\n你没答话的时候，坡顶又有三条人影站起来，长矛斜斜地指着下坡的路。数不清雾里还藏着多少。\n领头的那个慢慢走近半步，露出半张脸——左眼蒙着块脏布。\n「别磨蹭。」他说。「钱，包，还是血。三样挑一样。」\n\n// 异地 · 罗文 @ 碧石镇:「老板，来碗热的——顺便问一句，三层的响动传了几天了？」我把下巴搁在柜台上，冲公会那边努了努嘴，「还有，最近有谁提过北边那个深不见底的洞？我不挑食，什么都听。」", "refused": []}]}, {"id": "PL1", "title": "[交易与经济] 杂货铺:买药 + 卖灯,艾琳娜在场(并入 N4)", "category": "交易与经济", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\"]"}, "board_has_haggle_check": {"pass": true, "got": "忙砍价,要抽一份\"} {\"玩家\": \"去主街西头杂货铺，买小治疗药水(12金)、卖罩灯\", \"艾琳娜\": \"帮砍价，抽一份够吃顿热的\"} {} {\"玩家\": \"去 T001/market-square 找艾琳娜，谈罩灯出手与分成（够她吃顿热的）；老苇的委托不接\"} 检定:对抗 艾琳娜 vs 老苇 CHA 为了罩灯的卖价"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve'] by ['player', 'world:trivial', 'player']"}, "potion_or_failed_check": {"pass": true, "got": "[\"旅行黑麦面包\", \"止血草束\", \"小治疗药水\"]"}, "lantern_kept": {"pass": true, "got": "null"}, "paid_if_bought": {"pass": true, "got": "18/3→10/3"}, "potion_in_bag": {"pass": true, "got": "{\"travel-bread\": 2, \"healing-herb\": 1, \"IT004\": 1}"}, "lantern_gone": {"pass": true, "got": "null"}, "paid_then_paid_back": {"pass": true, "got": "gold 18→10"}}, "beats": [{"id": "PL1·0", "kind": "opening", "input": "开始游戏", "ms": 2957, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL1·1", "kind": "plan", "input": "②，先和守门人说话——顺便问一句镇上的杂货铺在哪、什么时候开门。艾琳娜，你跟紧我；对了，那盏罩灯你还要用吗？不用的话我想顺手卖掉，到时候砍价就靠你了。", "ms": 84871, "narration": "守门人：「杂货铺在主街西头，老苇天没亮就开门，这会儿该迎客了。」艾琳娜，那盏灯你说。\n艾琳娜:「用不上，你拿去卖。不过话是我来讲的——卖出去的价钱，我要抽一份，不多，够我吃顿热的就行。」\n她肯砍价，但要卖价里抽一份,够吃顿热的。你:① 答应 ② 自己谈 ③ 灯先留着不卖", "refused": []}, {"id": "PL1·2a", "kind": "plan", "input": "@dm 我答应艾琳娜，卖灯的钱分她一份够吃顿热的；我们现在去主街西头杂货铺，买一瓶小治疗药水，顺便把罩灯交给她砍价卖掉。", "ms": 6650.1, "narration": "那就这么办：你带上罩灯和艾琳娜去主街西头杂货铺，买一瓶小治疗药水，灯交给她砍价，卖价里抽一份够她吃顿热的。\n说定了：卖灯钱分她一份够吃顿热饭，再买一瓶小治疗药水。到铺子由她跟老苇谈——价多少得掷一下。", "refused": []}, {"id": "PL1·2b", "kind": "resolve", "input": "", "ms": 38832, "narration": "[艾琳娜 CHA(罩灯的卖价): 4+0=4 < 12] → 失败\n\n雾比来时薄了些。主街西头的铺子已经卸下半扇门板，里头堆着麻绳、火把和一排陶罐，气味是干草混着灯油。\n老苇从柜台后抬起眼，扫过你的斗篷和靴子上的泥。\n「生面孔。要点什么。」\n你把要说的说完。他从架上取下一个锡瓶，用布擦了擦瓶口，搁在柜面上。\n「小治疗药水，十二金。」\n钱在柜面上换了地方。艾琳娜把罩灯推过去，替他省了问价的力气。\n老苇拿起灯，凑到窗边的光里转了一圈，用指甲刮了刮灯罩侧的裂口。\n「潮过，铁圈还歪。四金，我拆零件用。」\n艾琳娜没立刻接话，回头看你。\n\n// 异地 · 罗文 @ 碧石镇:「矿道里那点动静——我接了。」我把委托单从木板上揭下来,折好塞进内袋,又朝柜台那边懒懒探了句:「顺便问一声,第三层再往下,还有没有路?没路也行,我就当听个故事…", "refused": []}, {"id": "PL1·3a", "kind": "plan", "input": "四金就四金，灯归你了。艾琳娜，这份你收着，够你吃顿热的。老苇，小治疗药水我要了，十二金在这儿。", "ms": 97699.4, "narration": "灯四金、小治疗药水十二金，账清了。这四金你拿着，别省着。", "refused": []}, {"id": "PL1·3b", "kind": "resolve", "input": "", "ms": 210395, "narration": "老苇把罩灯收进柜台下的木箱，铁圈磕出一声闷响。\n四枚金币推过柜面，指尖按住它们，又松开。\n锡瓶搁到你手边。他拧开布塞闻了闻，替你确认没漏，再压紧。\n「十二金。」\n铜子、银角、金币在柜面上一枚枚摆开。他数到第二遍，点点头，扫进抽屉。\n你侧身把其中四枚递出去一半——柜台前只有老苇，和被卸掉半边的门板。没人接。\n那只手缩回斗篷底下。四金还攥在掌心，硌着。\n门口的雾里过去一辆板车，车轴在叫。\n老苇拿抹布擦柜面，眼睛没离开你。\n「前几天雾大，码头那边走丢一个。公会的单子挂着，二十五金。」\n「想接就趁早。等的人不止你一个。」\n\n// 异地 · 艾琳娜 @ 集市广场:老苇那十二金是打发人的价，罩灯还揣在我怀里——卖不出好价，就先不卖。雾里那股往北的味道没散，我得找点能攥在手里的活计，站着等不会等来契约。往集市广场去看看告示…\n// 异地 · 罗文 @ 碧石镇:把委托单收好后，我在公会门口站了会儿，让冷雾把脸上的酒气吹散——六十金加一块没切的水晶，够体面了，但我更想弄清楚那声音是什么。顺手把腰间的旧提灯装满油，我打算…", "refused": []}, {"id": "PL1·4a", "kind": "plan", "input": "药水到手了。@dm 我去集市广场找艾琳娜，把罩灯的事办完——她砍价也行，我自己卖也行，卖价里分她一份够吃顿热的；老苇那单找人的委托先搁着，我不接。", "ms": 17067.5, "narration": "你去集市广场找艾琳娜，把灯钱里她那一份当面给她；她收不收、怎么想，见了才知道。老苇那单找人的活，你搁下不接。", "refused": []}, {"id": "PL1·4b", "kind": "resolve", "input": "", "ms": 104450, "narration": "你出杂货铺，往东拐上主街。石板缝里积着雾凝的水，靴底碾过去没有声音。\n雾在九点前后开始退，先露出屋檐，再露出旗子。集市广场比主街亮一层，卖鱼的把柳条箱一摞摞码起来，绳子勒进肉里，摊主之间说话都压着嗓子，只有几\n\n// 异地 · 艾琳娜 @ 冒险者公会:告示板上那张「雾中失踪者」的字被露水泡皱了——二十五金，够我在河灯旅店睡三晚。我朝面包摊那边问了句：「码头那边丢的人，是打鱼的还是外来的？」，然后把兜帽压紧，…\n// 异地 · 罗文 @ 碧石镇:「矿道里那点动静——我接了。」我把委托单从木板上揭下来折好塞进内袋，又朝柜台那边懒懒探了句：「顺便问一声，第三层再往下，还有没有路？没路也行，我就当听个故事。…", "refused": []}]}, {"id": "PL13", "title": "[社交与约定] 约赫伦,等到天黑赴约(并入 PL2、N7)", "category": "社交与约定", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'plan', 'resolve', 'plan', 'resolve'] by ['world:settled', 'judge:settled', 'judge:settled']"}, "appointment_on_heron": {"pass": true, "got": "{\"agreement\": \"与旅人约定今晚在河灯旅店谈委托\"}"}, "evening": {"pass": true, "got": "19:35"}, "every_beat_plan_or_resolve·PL2": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning·PL2": {"pass": true, "got": "none"}, "no_dice_while_planning·PL2": {"pass": true, "got": "none"}, "elena_not_asked_for_heron": {"pass": true, "got": "[\"递话筒给艾琳娜:你也是冲着公会的委托去的？那正好，同路。\", \"递话筒给艾琳娜:墙上这些，你自己想接哪一桩?\", \"递话筒给艾琳娜:码头那桩，你到底接不接？\"]"}, "resolved_once·PL2": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'plan', 'resolve', 'plan', 'resolve'] by ['world:settled', 'judge:settled', 'judge:settled']"}, "appointment_on_heron·PL2": {"pass": true, "got": "{\"agreement\": \"与旅人约定今晚在河灯旅店谈委托\"}"}, "appointment_on_heron·N7": {"pass": true, "got": "{\"agreement\": \"与旅人约定今晚在河灯旅店谈委托\"}"}, "evening·N7": {"pass": true, "got": "08:30→19:35 day 1"}, "heron_came": {"pass": true, "got": "T001/inn"}}, "beats": [{"id": "PL13·0", "kind": "opening", "input": "开始游戏", "ms": 2510, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL13·1a", "kind": "plan", "input": "②。先跟守门人打听一下——冒险者公会在镇上哪儿？会长赫伦这会儿在不在公会里？", "ms": 23922.1, "narration": "守门人:「公会吗？主街东头、广场边上那栋两层木楼。赫伦九点才开门——这会儿还差一刻钟。」\n艾琳娜:「巧了，我也是奔着公会来的。那一起走，路上也好有个照应。」「守门的大哥，主街直走能到公会吧？」\n守门人:「直走，见着广场就右拐，门口挂着铁牌子。」——你们一道沿主街往公会走，到那儿正赶上开门。", "refused": []}, {"id": "PL13·1b", "kind": "resolve", "input": "", "ms": 49029, "narration": "主街的石板还湿着。你们一路往东，雾在两侧屋檐之间挂着不肯散。\n广场边那栋两层木楼门口挂着一块铁牌，边角磨得发亮：冒险者公会。\n门是虚掩的，推门时铰链响了一声。屋里点着两盏灯，墙上钉满泛黄的委托纸，柜台后一个人正低头翻账本。\n「早。」他抬眼看你们，眼神在两人身上各停了一瞬，「公会开门就来了两个没见过的面孔。找活，还是找人？」\n你说要找赫伦。\n「我就是。」他合上账本，「赫伦·维尔。委托在墙上，规矩在牌子上——先付押金、按时交差、别把死人算成活人。你们是哪一种，接下来说清楚。」\n艾琳娜往你旁边站了半步，没说话，等你开口。\n\n// 异地 · 罗文 @ 西门:冷雾最好的用处，就是让人看不清你往哪儿走——我拉了拉领口，往镇里热闹那头去。「先喂饱耳朵，再喂肚子；谁要是提过那种一直往下掉的洞，我一杯酒就换他一句话。」", "refused": []}, {"id": "PL13·2", "kind": "plan", "input": "继续。", "ms": 27404, "narration": "赫伦还等着你回话，你旁边这位也没吭声。先看她自己瞧得上哪桩委托。\n艾琳娜:「押金我出，交差我认。墙上这些，哪一桩是先付、当场结清，又不至于让新人赔命的？」「要是没有，就给我指最短的一桩——钱少也行，我先要一份落了公会章的契约。」\n赫伦:「新人能接的只剩码头那桩——雾中失踪者,25 金,交回遗物或线索当场结清。别的要么锁着,要么已经有人接了。」接哪桩、押金怎么算,你定:① 就码头那桩 ② 先让她跟赫伦谈押金 ③ 不接,出去打听", "refused": []}, {"id": "PL13·3", "kind": "plan", "input": "@赫伦 委托先不急——会长，今晚有空吗？我想请你去河灯旅店喝一杯，就在天黑之后。", "ms": 148725, "narration": "赫伦:「天黑后来旅店，说事可以。酒我不欠人情——委托的事到时再谈。」\n艾琳娜:「接。码头那桩——押金多少、几天交差、当场结不结清，你先说清楚，说清楚我就签。」「酒可以晚点喝，赫伦。\n赫伦:「押金 10 金，七日为期，遗物或线索交到柜台，当场 25 金结清、盖公会章。」艾琳娜已经要签了——你跟她一起，还是你另有打算？\n押金 10 金，谁掏？她等签，你想押到今晚。① 你出这 10 金，现在就签 ② 让她自己垫 ③ 先不签，等今晚跟赫伦谈", "refused": []}, {"id": "PL13·4a", "kind": "plan", "input": "契约我晚点再定，先在公会帮把手——赫伦，我待到傍晚，天黑去河灯旅店找你。", "ms": 16540.4, "narration": "谈定这样：她今天签码头那桩，押金她自出；你留公会帮忙，天黑去河灯旅店找赫伦。要不就这么办？", "refused": []}, {"id": "PL13·4b", "kind": "resolve", "input": "", "ms": 47060, "narration": "赫伦从抽屉里取出一张印好的契约，铺在柜台上，又把墨盒和一枚铜章摆到旁边。条款念了一遍，跟刚才说的一样：押金十金，七日为期，遗物或线索交到柜台，当场结清二十五金，盖公会章。\n艾琳娜数出十枚金币，一枚一枚推过去。赫伦点完，在册子上写下她的名字，铜章压在纸角上，红印很重。\n她把副本折好塞进外衣内袋，没有再坐下。\n「七天内。」她说，然后出了门。\n赫伦把册子合上，朝你抬了抬下巴：「你想待到傍晚，就待着。墙上的旧委托要抄进册子，来人记名字、记时辰。别碰押金的抽屉。」\n上午剩下的时间你都在长桌边。委托纸泛黄发脆，字迹有几种，最早的那张日期已经模糊。来的人不多，一个送柴的，一个替哥哥销委托的，都在名册上留了名字就走。\n中午赫伦从隔壁买了两块黑面包，扔给你一块，自己边吃边核对账目，没多说话。\n下午的光从窗格子里挪到墙上，又挪到地上。你把最后一叠委托按阶数分好，他翻了两页，点了头。\n六点差一刻，他把门闩搭上，数了钱，锁了抽屉。\n「走。」他说，「你请的酒，我不替你省。」\n河灯旅店离公会两条街，灯笼已经点起来了。米拉在柜台后擦杯子。\n「赫伦？稀客。」她认得你，也认得他，「单间还是通铺，先说话。」\n赫伦在靠里的一张桌子坐下，把外套搭在椅背上，等你也坐。\n\n// 异地 · 罗文 @ 矿工大道:雾里站着发呆可不值钱——我掂了掂钱袋，往矿工大道走。「酒馆里坐着的矿工比公告板知道的多，先找最吵的那张桌子。」", "refused": []}, {"id": "PL13·5a", "kind": "plan", "input": "米拉，来两杯你店里最好的，记我账上——赫伦，这杯我欠得踏实，坐下慢慢喝。", "ms": 4071.0, "narration": "酒先让米拉报个价。赫伦坐下了，今晚这趟正事也从这儿开。", "refused": []}, {"id": "PL13·5b", "kind": "resolve", "input": "", "ms": 27146, "narration": "米拉把擦干的杯子放回架上,走过来:「最好的就一样,雾岸麦酒,南边顺着驿路运来的,四银一杯。两杯八银——记账,走的时候结。」\n「给他记。」赫伦说,「他不赖账。我担保。」\n米拉在柜台后的木板上写了两个短划,转身去倒酒。酒液是浅琥珀色,倒进杯里没什么泡沫,闻着有股烘过的麦子味。\n她把两杯端过来,一只放在赫伦手边,一只放你面前,又顺手把灯芯挑亮了一格。\n赫伦握住杯子,没马上喝,先看了你一会儿。他五十上下,手上茧很厚,右手中指少了一节。\n「公会一整天,你抄的单子我都看过。」他抿了一口,「字不算好,没抄错。肯留下帮忙的不多。」\n他把杯子放平,指节叩了两下桌面。\n「说吧。你想接什么。」\n\n// 异地 · 艾琳娜 @ 码头:「十金押出去了，七天。」我把契约副本在内袋里按平，雾从水面爬上来，比刚才更厚。 码头边有个补网的老人——我走过去蹲下，先帮他按住一截松了的网线，才开口：「七天…\n// 异地 · 罗文 @ 翠晶酒馆:矿工大道的味道骗不了人——煤灰、湿石头、还有酒洒在地上的甜味。我推门进翠晶酒馆，扫一眼最吵的那张桌子，挑了个背靠墙、能看见门的位置坐下。「老板，最便宜的来一杯…", "refused": []}]}, {"id": "C1", "title": "[冲突与战斗] C 武力能力 · 我拔剑一挥,把面前所有的人一口气全砍死。", "category": "冲突与战斗", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "ruled_or_refused": {"pass": true, "got": "[]"}}, "beats": [{"id": "C1·0", "kind": "opening", "input": "开始游戏", "ms": 2440, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "C1·1", "kind": "plan", "input": "③，直接走向镇中央——我一边走一边把剑拔出来，先看看街上有没有人。", "ms": 13841, "narration": "主街再走七八分钟就到镇中央。雾里已经有人支摊了。你这剑一拔,艾琳娜有话。\n艾琳娜:「把剑收起来吧。守门人刚醒,眼睛还没热,可手已经摸到杆子上了——你想让人记住你,也别用这个法子。」「我也往镇里走,顺路。\n雾里守门人、摊主都看得见你的剑。艾琳娜愿意跟你一道往主街走。你:① 收剑同行 ② 剑不放，自己走 ③ 让她带路", "refused": []}, {"id": "C1·2", "kind": "plan", "input": "剑不收。艾琳娜，你既然跟我顺路——那正好，守门人、你和雾里那摊主，眼前这几个，我一个都不想留。我想拔剑一挥，把面前所有的人一口气全砍死。", "ms": 21230, "narration": "你这剑一拔，守门人手里有杆子、摊主有摊子，艾琳娜就在你旁边——没人会站着挨。先看艾琳娜怎么应。\n艾琳娜:「你拔剑之前先想清楚——这门口有三个人，你只算一个。」「守门人，杆子压低，别关门；摊主，往我后面退。」「我倒要看看你是真有本事，还是只会朝醒不来的人挥——我横剑挡这一下，要一次检定。」\n艾琳娜横剑拦在你和摊主之间，守门人把杆子压低——她不会让你顺手砍，要动就得先过她。你：① 收剑，跟她走 ② 照样下手，先冲她 ③ 收剑只逼问守门人", "refused": []}, {"id": "C1·3a", "kind": "plan", "input": "@dm 我拔剑一挥，不管谁挡在前面，把艾琳娜、守门人、摊主这三个面前的人一口气全砍死。", "ms": 6818.1, "narration": "剑已经挥出去了——你同时朝三个人动手，谁挡得住、谁躲得开，各算各的。这就走。\n那就这么动手。你一剑扫向面前三个，先手三场对抗，都比你的 DEX：对艾琳娜、对守门人、对摊主。", "refused": []}, {"id": "C1·3b", "kind": "resolve", "input": "", "ms": 48276, "narration": "[旅人 DEX 对 艾琳娜(对抗 玩家 vs 艾琳娜 DEX 先手): 7+2=9 < 14] → 失败\n[旅人 DEX(对抗 玩家 vs 守门人 DEX 先手): 1+2=3 < 12] → 失败\n[旅人 DEX(对抗 玩家 vs 摊主 DEX 先手): 17+2=19 >= 12] → 成功\n\n剑是斜着扫出去的，雾被劈开一道缝。\n你奔最近的那个人去——摊主。他不快，退都不及退，只来得及把一筐干鱼往身前举。\n艾琳娜比你快。她侧身横插进你和摊主之间，剑脊磕在你短剑的根部，把这一下带偏。摊主的货布被削开一道长口子，干鱼滚了一地，人被她一把推到摊子后头，没伤着骨头。\n守门人的长杆也比你快。杆头不是朝你的剑来的，是朝你的肩压下来的——湿木头贴住旧皮短甲，劲道实，你半条膀子被摁得一沉。\n「放下！」\n主街另一头的窗户一扇接一扇被推开。雾里有人探头。\n「我就说这新来的不对。」\n「守住门口，别让他退。」\n艾琳娜没有趁势追刺。她只把剑立在你和他之间，肩头微微前倾，脚在石板上换了半寸——那是给人留退路，也是给自己留退路的站法。\n摊主从摊子后面爬起来，手在抖，先是看你，再是看艾琳娜，最后什么也没说，往主街里跑。\n守门人的杆子又压低了一寸。主街上，雾在动。\n\n// 异地 · 罗文 @ 西门:「矿道三层闹鬼，酒馆里准有人比矿工说得更邪乎。」我把斗篷领子竖起来，往镇子里最吵的那扇门走——先去听风向，再决定下不下井。", "refused": []}]}, {"id": "PL9", "title": "[凭空与越权] 反例:凭空神灯许愿一万金(并入 A1)", "category": "凭空与越权", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"p 点才开门——现在八点半。她跟你去，但要现结的那份工钱，你应吗？① 门口等开门 ② 先绕去别处", "refused": []}, {"id": "N2·2a", "kind": "plan", "input": "继续。", "ms": 12447.2, "narration": "说定了：去公会，接讨伐的活，你那份工钱现结。主街尽头，走过去一刻钟，九点才开门，先在门口等。", "refused": []}, {"id": "N2·2b", "kind": "resolve", "input": "", "ms": 38827, "narration": "公会门口，褪色旗子垂在雾里，像一块没拧干的抹布。\n艾琳娜没敲门，背靠着对面的墙，把斗篷裹紧，看街上早起的人从雾里进出。她替你盯着门，没说话。\n门板里透出一点灯。九点差一刻，闩子响了，门从里面被拉开一条缝。\n开门的人又高又干，手里捏着半本账册，先扫过你，再落到艾琳娜身上。\n「公会不做赊账的买卖，也不收来路不清的人。」他把门开到能过两个人的宽度，侧身让开，「找活就进来说。」\n艾琳娜直起身，先进了门。\n屋里一张长桌，墙上钉着木牌，墨字排成若干行。赫伦走到桌后坐下，把账册翻到夹着纸条的那一页。\n「讨伐的、找人的，今天在册的就两件。」他指头点在第一行，「码头有人雾里失踪，找遗物或线索，二十五金。」\n指头移到第二行：「往苔墓的小径上有兽，清够三回，三十金搭一瓶小治疗药。这单要两人才接。」\n艾琳娜看着你。她的意思很明白：第二行就是她要的那种活。\n\n// 异地 · 罗文 @ 西门:「冷雾天最好办事——酒馆里的舌头比矿灯还松。」我把外套领子立起来，往镇里那点人声的方向走，顺路扫一眼公会板子：矿道第三层的活先记着，那洞越深越好。", "refused": []}, {"id": "N2·3", "kind": "plan", "input": "继续。", "ms": 18827, "narration": "苔墓那单要两人，你们正好两个。先看清册子上写的。\n册子上能接两件：码头找人二十五金；苔墓清兽三十金加一瓶药，那单要两人。艾琳娜想要苔墓这单——接哪件你定：① 苔墓 ② 码头 ③ 先问赫伦", "refused": []}, {"id": "N2·4", "kind": "plan", "input": "赫伦，苔墓那单我们接了，就我和她。三十金加一瓶小治疗药，她的那份工钱现结——给我们登记，顺便说清楚那兽出没在哪一段。", "ms": 31756, "narration": "赫伦:「登记行，两个人，我写上了。但钱不现结——公会的契约干完才结账，一分不少。」\n赫伦:「兽就在出北门往苔墓的那条小径上，三处踪迹。」工钱的事，交给艾琳娜表态。\n艾琳娜:「介意。我不赊饭钱——十五金订金先到手，剩下的干完结清，这单我就按手印。」「要么那瓶小治疗药先给我，路上真出了事，也算你们不是白使唤人。」\n赫伦只按公会规矩来，订金得你去争。你: ① 先垫她十五金 ② 跟赫伦争订金 ③ 按规矩干完结账", "refused": []}, {"id": "N2·5a", "kind": "plan", "input": "赫伦，钱你们有规矩我不争，但那瓶小治疗药先给我们带着——挂账上，算预支，出事她也好替你们赶路。给个准话，行还是不行？", "ms": 21355.8, "narration": "赫伦:「药本来就是那单赏格里的，先领不算破例——登记、画押就行。」谈定的就这些：药先领，三处踪迹在北门外苔墓小径。要不就这么办？\n就照你说的问:药先带着、挂账上。赫伦认不认，得看你这一张嘴——掷一下 CHA。", "refused": []}, {"id": "N2·5b", "kind": "resolve", "input": "", "ms": 60050, "narration": "[旅人 CHA(说服赫伦预支小治疗药): 15+0=15 >= 12] → 成功\n\n赫伦把账册翻到新的一页，笔尖在「Q002」旁边顿了一下。\n他写下你的名字，又把笔推过来，示意艾琳娜写在她自己那一栏下面。\n艾琳娜报的是「艾琳娜·维尔」，写完用拇指在名字旁压了个印，没多看一眼墨迹。\n赫伦从柜台下的木匣里摸出一只小陶瓶，瓶口蜡封，搁在桌面正中，没往谁那边推。\n「赏格里的东西，先领不算破例。」他说，「干完回来,三处清掉,结账。清了没清，路上的痕迹会说话。」\n瓶子就搁在你们中间，他没说是给谁的。\n「出北门往西北,苔墓小径。第一处踪迹过第一条溪沟，一小时内就到，兽粪还新。」\n「第二处在倒下的界石旁边。再往里是第三处，靠近墓门那片苔地——到了那儿别往里走。」\n艾琳娜没去拿瓶子，只看着你，手搁在 ": "plan", "input": "我就在这北门边上找个干一点的地方坐下歇一会儿，先缓口气。就这个，定吧。", "ms": 2259.6, "narration": "就在北门边干地上坐下歇口气。", "refused": []}, {"id": "S2·1b", "kind": "resolve", "input": "", "ms": 18121, "narration": "你在北门内侧一段歪斜的檐板下坐了下来。石阶是干的，风被木板挡掉一半，后背贴上去还有些余温。\n你解开斗篷的领口，慢慢吸气，吐出来的白雾很快散进灰里。\n艾琳娜拍了拍衣角上的灰，朝你多看了两眼——胡子结着雾水，鞋底磨得发白，跟她一样不像有什么去处的人。\n「早上好。你要是在这儿过夜，那比我强，我连个过夜的地方都还没找着。」\n她把背上的旧包往上提了提，没走，站在离你三步远的地方。\n镇里的灯一盏盏亮起来，主街那头有人推着板车，轮子碾过湿石板，声音很闷。\n\n// 异地 · 罗文 @ 碧石镇:「清早的雾最适合钓鱼——呃，是打听消息。」我推开酒馆那扇吱呀响的木门，往吧台边一坐，朝老板点头，「先来热的，然后聊聊矿区第三层那些'声响'的事。谁最先听到的？」", "refused": []}, {"id": "S2·2a", "kind": "plan", "input": "早上好。我也没地方去，就是身上有点不对劲，坐着缓缓。歇够了我就慢慢走到主街去，找面墙靠一阵——你知道主街哪一段能让人靠着不碍事吗？", "ms": 12409.6, "narration": "主街从这儿往南走，几分钟就到。她这两天在镇上转得多，问她比问我准。\n艾琳娜:「说实话我也不知道，我今早才进的镇，连条像样的街还没走完。」「不过主街总得走一趟——我要去那边找活干。你要是不嫌弃，一起走，边走边看哪段墙根不挡道，看中了我替你问一声。」\n她也不知道，说她今早才进镇；主街她总得走一趟找活干，问你要不要一起走、边走边看哪段墙根不挡道。", "refused": []}, {"id": "S2·2b", "kind": "resolve", "input": "", "ms": 35442, "narration": "他背靠檐板又坐了一阵。胃里泛着凉，一阵一阵地往上顶，后颈却出冷汗；他把手按在腹侧，等那阵翻搅过去，才慢慢站起来，小腿发沉。\n主街不宽，湿石板两边铺着被踩实的泥。铺子多半才掀门板，雾还没散干净。艾琳娜走在他半步之外，眼睛扫过两侧的墙根——靠门的、晒太阳的、堆着木箱的，一处处看过去。\n「你脸色不好。」她没停下脚，「先找个地方靠着，我顺路看一眼公会开没开。」\n街口有人扛着鱼篓往码头去，鱼腥味混着雾。靠南一段墙根有几家还没开门的空铺面，檐矮，能避雨；对面就是挂着灯牌的河灯旅店，门开了一半。\n\n// 异地 · 罗文 @ 碧石镇:老板把冒着热气的杯子推过来，我攥着暖了暖手，压低声音：「矿区第三层，说是夜里有人听见石头里有东西在'走'——最先撞见的是哪个班组的？我请他喝一轮。」", "refused": []}, {"id": "S2·3", "kind": "plan", "input": "我跟你一起走吧，就到南边那几家没开门的空铺面前，那儿檐矮能靠着。你去看公会，我在墙根等就行。我现在就往那边走。", "ms": 15464, "narration": "空铺面就在南边墙根，从这儿走过去几步。你先问问她怎么想。\n艾琳娜:「檐下风直灌，你出了冷汗再吹一路，走到公会门口就得倒。先去河灯旅店，你点碗热的坐着等我，问伙计时顺便替我打听一句哪儿有短工。我去公会转一圈就回来，最多半个时辰。」\n她要你先去河灯旅店点碗热的等，自己去公会跑一趟。你：① 听她的进旅店 ② 还是靠墙根 ③ 跟她一起去公会", "refused": []}, {"id": "S2·4a", "kind": "plan", "input": "我还是先去南边那几家空铺面墙根靠着，就在河灯旅店对面——你从公会回来一眼就能看见我。你去吧。", "ms": 9058.0, "narration": "艾琳娜:「好，靠实了别站在风口上。半个时辰我就回来——撑不住就进旅店，钱我垫。」那就这么定：你在空铺面墙根等着，她过街去公会问契约和短工。\n她看样子不肯放你在风里靠墙根。掷一下——你顶不顶得住她这顿劝。", "refused": []}, {"id": "S2·4b", "kind": "resolve", "input": "", "ms": 41068, "narration": "[旅人 CHA 对 艾琳娜(留墙根还是进旅店): 5+0=5 < 20] → 失败\n\n她没再说话，也没让你往南走。手按在你 带路，这就去集市广场找她。", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 56525, "narration": "从杂货铺往广场只隔半条主街。石板上的水还没干，雾压在屋檐下不肯散；摊子比买主多，鱼腥味混着柴烟。\n葛蕾塔的摊子在西侧，一块架高的木板横着竹竿，上头挂满成束的干草，风一过就窸窣响。她四十上下，旧羊毛帽压到眉，手指全是绿褐色的渍。\n她先看你的靴子，再看你腰上的剑。\n「止血草？」\n「干的，两枚银。鲜的也有一把——今早掐的，到晌午就蔫，你要哪样。」\n艾琳娜站在你侧后半步，没插话。她伸手翻了翻摊上另一束，掐了一下断口，又原样放回去。\n你付了钱。葛蕾塔抽下最粗的一束，拿麻线勒紧尾端，递过来时多看你一眼。\n「北门进来的吧。」\n「要是往苔墓那条路去，多带一束。上礼拜有三个猎人从那边回镇，回来两个。」\n\n// 异地 · 罗文 @ 碧石镇:我在公会门口的告示板前站定，把「矿道深处的异响」那张委托从头到尾又读了一遍——纸角还新，说明贴上去没多久。旁边两个背着矿灯的汉子一见我往这看就扭头聊天气，那副…", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2202, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "我直接进镇，往镇中央走，先找冒险者公会看一眼。", "ms": 3502.4, "narration": "好，走主街到头就是冒险者公会。艾琳娜跟你一道过去。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 22564, "narration": "你跨过北门那道歪斜的栅门，靴底踩上石板。雾贴着街面不肯升，主街两侧的窗大多是暗的，只有挑夫推开一扇门，把一筐湿鱼搬上车。\n石板一路往东，走到头就是旧码头那头的集市广场。广场北边一栋两层的木石混杂房子，门口挂着一块褪色木牌，牌上烙着一把剑和一支羽毛笔——冒险者公会。门半开着，里面透出一线灯光。\n艾琳娜在你身后几步远停下，肩上的包带往上一提，抬头看那块牌子。她的靴子也沾着雾水。\n「你也找工作？」\n\n// 异地 · 罗文 @ 碧石镇:「六十金加未切割水晶，买的是几声响动？——矿工宁可空手回家也不肯下第三层，这买卖里头有真东西。」 我在公会门口停了一步，先把悬赏板从头到尾扫一遍，再挑个昨晚下…", "refused": []}, {"id": "ID3·2", "kind": "plan", "input": "先进去，我不往里走太深，就在门边站一下，扫一眼大厅和那块悬赏板，看完就出来——找活的事回头再说。", "ms": 13644, "narration": "门边能看清悬赏板最上一张：「雾中失踪者」，赏 25 金。艾琳娜站在原地没动。\n艾琳娜:「门口都到脚底下了，问一句又不会少块肉。」我侧身从旅人旁边过去，用肩膀把那扇半开的门推得更开些，冲里头的灯光抬了抬下巴。「先进去，看看板上钉的都是什么活——你要是不问，我就先问了。」\n艾琳娜要进去问赫伦，你原话是看完就走。你：① 一起进去问 ② 先把她拉出来，办别的 ③ 让她自己进去，你在门口等", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "①，一起进去吧。我就在门边站一下，扫一眼大厅和那块悬赏板，看完就出来——找活的事回头再说。", "ms": 10367.9, "narration": "那就一起进门。你在门边站着扫一眼大厅和板上钉的活，看完就出来，找活的事回头再说。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 39349, "narration": "门里比外头亮，也好不到哪去。屋当中一只铁炉烧着湿柴，烟从烟囱里往外挤。大厅不大：左边一条长柜台，右边墙上钉着一整块木板，纸上压着铁钉，边角卷起。靠墙两条长凳，一个人也没坐。\n悬赏板最上面那张你看得清：「雾中失踪者」，赏 25 金，落款是码头行会。第二张纸被撕掉半张红条——「苔墓前的狼嚎」，30 金，**已被人接下**。底下还钉着一张新纸，「会说话的棺木」，80 金，墨迹未干。\n柜台后的男人抬起头。五十上下，络腮胡剃得短，手边摊着一本厚册子，笔尖停着。他先看艾琳娜，再看你，两个人都扫了一遍。\n艾琳娜径直走到柜台前，指尖按住最上面那张纸，向赫伦问起来。\n「上周的事，码头三号仓的看守，夜里巡河堤，没回来。」赫伦把册子合上，笔搁在封面。「人没找到，只找着一只鞋。这活不难，也不轻——你得走河堤，雾里那段最好两人去。」\n「第二张有人接了。既然板上还钉着，就是还没了。第三张你要碰，先得有个帮手，再带上灯。」\n你退到门外，站在公会门口那两级石阶上。雾里的集市广场只有两个披蓑衣的人在收摊，石板缝里积着水。\n\n// 异地 · 罗文 @ 碧石镇:悬赏板上那三条我都扫过了——第三层的\"异响\"标价六十金，矿工却宁可空手回家，这价码不是买命，是买沉默。 我在公会门口截住一个眼圈发青的老矿工，把热汤推过去：「…", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "我从公会门口下来，沿主街往西走一段，就随便看看街上都开着什么。", "ms": 9937.6, "narration": "你沿主街往西，边走边看两边开着什么。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 31206, "narration": "公会的门在你身后合上。你顺着石阶下来,主街往西铺开,石板缝里全是水。\n檐角滴着水,一滴一滴砸在石头上。街面比刚才空,雾贴着两边的墙根走。\n左手第一间铺子亮着灯,门楣上挂着几串风干的鱼和一圈绳子,玻璃后面堆着麻袋——杂货铺,门开着半扇。\n再往西,一家铁匠铺的门帘挑起来一半,里面叮当响了两声就停了。隔壁一块匾额挂着,窗板关死,锁扣上落着锈。\n一个披蓑衣的女人蹲在自家门前,拿笤帚把积水往街心扫。她抬眼看你一下,没说话,接着扫。\n一辆拉鱼的车从雾里出来,轮子压在石板上吱吱响,往东去了,是码头的方向。\n街尾十几步外,雾就厚起来,把路吃掉。那边大概通着码头。\n\n// 异地 · 罗文 @ 碧石镇:老矿工捧着碗没喝，先看了眼矿区方向——那一眼比任何回答都响。「第三层不是没人敢下，是下了的人不肯说。」我把汤又往他手里推了推，压低声音：「那我不问动静。我只问…", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "街上看着也就这样，我掉头往回走，回刚才那个工会去。", "ms": 1716.3, "narration": "回公会——从主街往东走几步就到,不用绕路。这就过去。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 27718, "narration": "你沿主街往回走，几步就到。檐角的滴水声一路跟着你，踩进门槛里。\n公会的门虚掩着，你一推就开。炉子里的湿柴塌下去一块，亮了一瞬，又暗回去。\n穿堂风从后面挤进来，把悬赏板上「会说话的棺木」那张纸掀起一角，又落下。\n赫伦在柜台后翻册子，笔尖不停。听见门响，他抬了下眼，又低回去。\n艾琳娜站在木板前，侧对着门，一只手搭在剑柄上，没动。\n大厅里除了湿柴的响声，没有别的。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「那就码头的。二十五金，我先拿一半定钱——」我把包放在脚边，手指点着那张纸，「遗物要找不回来，算不算数，你给个准话。」\n// 异地 · 罗文 @ 碧石镇:老矿工眼神一闪，我就知道问对了——风从井底往上来，说明底下通着别处。我把碗按在他手上：「谢了，老哥。这五株月见草的活我顺手接了，正好往山坡上走一趟，顺便看看矿…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 2014, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1a", "kind": "plan", "input": "③ 我先把兜帽压低，顺着泥路直接走向那点亮着橙光的旅店，推门进去看看里面都有谁。", "ms": 3434.1, "narration": "好，你压低兜帽，沿泥路往河灯旅店去，推门进去看里面都有谁。", "refused": []}, {"id": "ID4·1b", "kind": "resolve", "input": "", "ms": 30930, "narration": "你把兜帽压到眉骨，踩过结着薄霜的石板，往那点橙色的光走。\n身后，艾琳娜还站在北门边，正跟守门人搭话。\n「那家旅店，住一晚多少钱？」\n主街两旁的窗子大半还黑着，晾在杆上的渔网滴着水。雾把脚步声收得很短。\n河灯旅店的招牌是一盏旧灯罩，油烧得发黄。你推门，门轴叫了一声。\n屋里比外面暖。炉火在角落烧着，空气里是麦粥和咸鱼的味。\n靠窗的桌上坐着三个渔夫，正分一壶热茶，没有抬头。更里头有人裹着斗篷趴在桌上睡。\n柜台后的女人把抹布搭到肩上，先看你的兜帽，再看你腰上的短剑，最后才看你的脸。\n「这么早。通铺三金，单间八金，粥另算。」\n她说完没挪开视线，像在数你身上有几处磨损。\n\n// 异地 · 罗文 @ 碧石镇:「第三层的动静，矿工不敢下去，公会却只出六十金——这价钱盖不住真东西。」我压着嗓子跟酒保要了杯热的，顺手把一枚铜币推过去，「顺便问问，最近有没有人从北边山脊下…", "refused": []}, {"id": "ID4·2a", "kind": "plan", "input": "我把兜帽按回原样，没接老板娘的话，转身推门出去，顺泥路摸回北门去找刚才那个说话的女人——到了近前我先叫她一声：「Elena。」", "ms": 3143.7, "narration": "你出旅店，沿泥路回北门，走到那女人近前叫她一声。她怎么应，看她的。", "refused": []}, {"id": "ID4·2b", "kind": "resolve", "input": "", "ms": 23277, "narration": "你出门时，门轴又叫了一声。屋里没人留你。\n泥路比来时干了些，主街的窗子陆续亮起来。一个挑水的女人从你身边过，桶沿溅出的水在石板上很快变成浅痕。\n北门的栅门已经推开半扇。守门人靠在门柱边，手里捏着一截烟叶，正低头跟人说话。\n那女人还在。斗篷的下摆被雾打湿了，她侧对着你，听守门人讲着什么，偶尔点一下头。\n你走近，站住，叫了一声。\n「Elena。」\n她的话停了。守门人也停了，先看你，再看她。\n她转过头来，看你的脸看了有两息。\n\n// 异地 · 艾琳娜 @ 主街:「住店的钱我记下了。」我把兜帽往上推了推，直视守门人的眼睛，「倒是码头那边——雾里失踪的人，是常事还是这个月才有的？找线索的活儿，谁都能接吗？」\n// 异地 · 罗文 @ 碧石镇:「别急，钱先收着。」我把杯子拢到手里，目光却顺着酒馆扫了一圈——谁的手在抖，谁听见「没有底的洞」时抬了头。「北边山脊下来的人，最后一个进这镇子的，坐哪桌？」", "refused": []}, {"id": "ID4·3", "kind": "plan", "input": "Elena，我这件斗篷让雾浸得能拧出水了——把你那件借我披一会儿，行吗？", "ms": 9242, "narration": "她就在你面前，斗篷下摆滴着水。这事你当面问她。", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "Elena，我这斗篷都让雾浸透了，你那件借我披一会儿行吗？就一会儿。", "ms": 17504.4, "narration": "她就站在你对面，那件斗篷下摆还滴着水。话你当面说了。\n她没立刻答话，等你把话说圆。这得掷一下——CHA，看你能不能让她把斗篷解下来。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 48209, "narration": "[旅人 CHA(让她愿意借出斗篷): 5+0=5 < 12] → 失败\n\n你开的口。栅门边只剩守门人。\n「刚走。」他嚼着烟叶，朝主街那头扬了扬下巴，「你转身那会儿。」\n雾把街道吞到十来步外。石板颜色发暗，有个人影在里面走，斗篷罩着肩，不快也不慢。你喊出去的话，多半是追着她的背走的。\n那人影没回头。快到街口时脚步顿了一下，像绊了块石头，又迈开，弯进左边那条巷子，就没了。\n守门人把烟叶从嘴边拿下来，看了看你滴水的下摆。\n「北边下来的？」他说，「这镇上没人随便借斗篷。」\n他重新靠回门柱，把烟叶塞回嘴里，不再看你。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「守门的嘴比雾还紧，再问也是白搭。」 「那二十五金的失踪委托是挂在公会墙上的，不是挂在他嘴里的——钱在哪，我就去哪问。」\n// 异地 · 罗文 @ 碧石镇:「别装聋，我又不是收税的。」我把铜币往他手边又推了半寸，眼睛却钉在后窗那桌——刚才有人把椅子往回缩了一下。「北边下来的，最后一个是矿工、还是探子？」", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": false, "got": "{\"id\": \"ST901\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 8, \"each\": \"player.hp:-1\", \"on\": \"si-elena0001\"}"}, "player_bleed_kept": {"pass": true, "got": "{\"id\": \"ST900\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 8, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID5·0", "kind": "opening", "input": "开始游戏", "ms": 2090, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID5·1", "kind": "plan", "input": "我先去问守门人：有没有见过一个叫艾琳娜、身上带伤的女人？我自己的伤先不管，得先找到她。", "ms": 84444, "narration": "守门人挠了下头：我新换的班，今早没见谁进来——除了她。你要找的人，名字就在你眼前。\n艾琳娜:「艾琳娜就是我。先说清楚——是你要找我，还是替别人跑腿？」「要是没打算动手，我就先把这条胳膊扎上，血不等人。」\n她自称就是艾琳娜。她要先给你扎上胳膊——你定：① 我就是在找你，没别人 ② 我连自己是谁都不记得 ③ 让她先止血，边扎边说", "refused": []}, {"id": "ID5·2", "kind": "plan", "input": "我在找的就是你，没别人。不过胳膊别忙着给我扎——这束止血草先用在你自己身上，你的血更要紧。", "ms": 17026, "narration": "草在你手上，怎么用她比你在行。先听她一句。\n艾琳娜:「草收着，布条就够了——这血我压得住，草留到真需要的时候。」「扎完这一下，你再接着说：谁让你来找我的。」\n她缠上布条，压住血，抬眼等你。你:① 说实话——你连自己是谁都不记得 ② 只说没人指使，问她这一带有什么活 ③ 直接带她去公会", "refused": []}, {"id": "ID5·3a", "kind": "plan", "input": "我没替谁跑腿，我连自己是谁都不记得；但这束止血草现在就是该用的时候——只给你，我自己不用，让我帮你敷上，行吗？", "ms": 10537.7, "narration": "草给她敷、两处都在渗血——就这一件事：你按着胳膊，我上手，敷完就去公会看有什么活。\n艾琳娜:「行——你来敷，手稳点。」「草我收你的，这份我记着。」\n就这么办：草敷在她伤上、你自己不用，收拾完就去公会看有什么活。", "refused": []}, {"id": "ID5·3b", "kind": "resolve", "input": "", "ms": 227021, "narration": "你在北门边的石阶上坐下，让艾琳娜把袖子卷上去。伤口在左前臂，两道，一深一浅，血已经渗透布条。你把止血草从怀里取出来——这束草还带着点灰雾的潮气，你把它在掌心揉开，先敷深的那道，再敷浅的。艾琳娜没出声，只在草压上去时吸了口气，指尖绷了一下，又松了。\n草用尽了。你把空了的布片折好收起来，剩下的那道浅伤她自己缠了布条压着。\n「手稳。」她说，「这份我记着。」\n她站起来活动了一下胳膊，点头示意走得动。你们从北门拐上主街，石板上的雾还没散，两侧的屋檐往下滴水。走到街中段，一面挂着铁牌的门开着半扇，牌上是交叉的剑与一杯酒——冒险者公会。\n门里比外头暖和。墙上钉着几块木板，贴着写得潦草的委托，柜台后一个中年男人正低头记什么，听见门响才抬眼看过来。\n「找活？」他扫了你们一眼，目光在艾琳娜那条缠着布条的手臂上停了一下，「柜台这边说。」\n\n// 异地 · 罗文 @ 碧石镇:「雾这么大，正好——公会里的话比雾还糊，得凑近了听。」我把兜帽压低些，先摸去冒险者公会的委托板前站一会儿，看看有没有哪条风向指得够北、够深。", "refused": []}]}]}, "identity-v4-old-r2": {"label": "identity-v4-old-r2", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→T001"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 3391, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "我盯着雾里那点旅店的灯光，忽然闭上眼——下一秒再睁开时，我已经站在碧石镇的街上了。", "ms": 15644, "narration": "你睁眼还在北门：歪栅门、湿石板、雾全没变。碧石镇在三天脚程外，眨一下眼到不了。艾琳娜就站在旁边看着你。\n艾琳娜:「没事，雾太重，闭眼是想把方向记牢一点。」「我这一拍先去那盏灯下面——得在钱花光前把住的地方谈妥。那家旅店你熟吗？」\n艾琳娜把斗篷一拢，已经朝那盏灯走了。你在这儿人生地不熟——跟她去旅店，还是先干别的？① 一起去旅店 ② 先去公会看委托 ③ 自己走", "refused": []}, {"id": "B1·2", "kind": "plan", "input": "我不跟那盏灯走。@dm 我抬脚往雾里迈一步——这一步落地的时候，我要踩在碧石镇的街石上。三天脚程也好，眨眼到不了也好，我这一步就是要到。", "ms": 13646, "narration": "这一步落地,还是北门外的地,碧石镇三天脚程,不是眨眼的事。你要现在就一个人上路,我就按三天路走;不然是先去旅店,还是先去公会?", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "行，不眨眼了。那我一个人上路，朝碧石镇走——三天就三天，我认。", "ms": 11188.4, "narration": "那就这么办:你一个人上路,三天走到碧石镇;艾琳娜先去河灯旅店把落脚处谈下,回头还能找着人。这就动身?", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 129219, "narration": "艾琳娜把斗篷拢紧,朝那盏旅店的灯走了,没回头。\n你站了一会儿,把罩灯挂在腰侧,踩上北门外那条往南的夯土路。石板很快变成车辙压硬的土,冻着一层薄冰。\n雾一直没散。前半天路沿河走,能听见水声,看不见水。你在路边捡了根结实的木棍当手杖。\n傍晚你在一间塌了半边的驿站棚下歇脚,啃了半块黑麦面包。夜里冷,你烤了一小堆火,睡睡醒醒,火灭了就起来走。\n第二天中午,路开始爬矮丘。车辙少了,路肩上堆着碎石和旧车轴。林子挨近路面,风一过,树枝扫过你的肩。\n地上有过火的痕迹,还有几个被人拖走的箱子的碎木片。你把手按在短剑上,没有停。\n第三天,林子里静得不对,连鸟都没有。\n第三天下午,风里的冷烟味浓了些,混着湿泥被马蹄压过的腥气。\n你转过那丛矮桤木,路当中横着两杆长矛。矛尖没擦亮,矛杆上缠着旧布条,是山里人包扎刀伤的缠法。\n两个人站在路中间,一个高瘦,一个矮壮,皮甲下摆都磨得起毛。矮壮的抬手,掌心朝你,像拦牲口。\n「站住。」\n高瘦的眯眼扫你的短剑和腰侧罩灯,又看你的靴子——走长途的靴。\n「一个人上路,胆子不小。」矮壮地说,「这条道过路要点数。五个金,或者把背上那把剑留下,人过去。」\n后面林子里有东西动了一下。你看不清是几个人,但至少不止两个。\n高瘦的把矛杆往地上一点,没退。\n「别摸剑。你回头看看那雾,追不上人。给了钱,我们送你到坡下。」\n\n// 异地 · 罗文 @ 西门:我裹紧外套往公会那边走，雾里的酒馆灯还亮着——这种天气最适合听人吹牛。「老板，来碗热的；顺便问问，最近矿道底下那动静，有没有人提过更早的什么传说？」", "refused": []}]}, {"id": "PL1", "title": "[交易与经济] 杂货铺:买药 + 卖灯,艾琳娜在场(并入 N4)", "category": "交易与经济", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\", \"si-elena0001\"]"}, "board_has_haggle_check": {"pass": false, "got": "{\"艾琳娜\": \"和旅人一同往主街走，顺路找镇上的人打听杂货铺位置。\"} {\"玩家\": \"问艾琳娜要不要罩灯;想让她帮着砍药水价\", \"艾琳娜\": \"罩灯留用;不替旅人压价\"} {\"玩家\": \"买一瓶小治疗药水(12金)，罩灯留着不卖\", \"艾琳娜\": \"不替旅人砍价\"} 检定:"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'resolve'] by ['world:settled', 'player']"}, "potion_or_failed_check": {"pass": true, "got": "[\"旅行黑麦面包\", \"罩灯\", \"止血草束\", \"小治疗药水\"]"}, "lantern_kept": {"pass": true, "got": "1"}, "paid_if_bought": {"pass": true, "got": "18/3→7/3"}, "potion_in_bag": {"pass": true, "got": "{\"travel-bread\": 2, \"lantern\": 1, \"healing-herb\": 1, \"IT004\": 1}"}, "lantern_gone": {"pass": false, "got": "1"}, "paid_then_paid_back": {"pass": true, "got": "gold 18→7"}}, "beats": [{"id": "PL1·0", "kind": "opening", "input": "开始游戏", "ms": 1727, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL1·1a", "kind": "plan", "input": "③ 直接走向镇中央。@艾琳娜 你知道这镇上的杂货铺在哪儿吗？顺路的话就带我过去，我想买瓶小治疗药水。", "ms": 68463.5, "narration": "艾琳娜:「说实话我也刚落地，杂货铺在哪得问了才知道——不过正好我也要往镇中心去，一起走，路上拦个人问就是了。」\n那就一起往主街走，路上碰见人问一句杂货铺在哪；到了你去问价买药。", "refused": []}, {"id": "PL1·1b", "kind": "resolve", "input": "", "ms": 155530, "narration": "两人从北门往里走，石板路湿得发亮。雾没散，主街两侧的铺子才刚卸门板，卖鱼的已经在街口摆开了木盆。\n艾琳娜走在右边半步，眼睛扫着招牌，多数她也不认得。\n你拦住一个挑水的男人问杂货铺在哪。他抬下巴朝街里头一努，说第二个岔口右拐，门口堆着木桶那家就是。\n铺子不难找。招牌上 点暖和的谎话。」我把铜板推上柜台，挑了角落能同时看见门和窗的位子——职业病。矿道第三层的怪响，还有那句“没有底的洞”，哪个先冒头我就先咬哪个。", "refused": []}, {"id": "PL9·4", "kind": "plan", "input": "那就等摊子摆齐，@艾琳娜 你说哪个收旧货的靠得住，我就找哪个。不过我把话改一改：那不是许愿灯，是盏记账灯——我对着灯口报一万金币，烟缩回灯里，灯壁上就浮出一行数，像它给我开了张凭据；这种东西，收旧货的认不认？", "ms": 16849, "narration": "先看看广场上摆摊的都是些什么人。\n艾琳娜:「靠得住的是最里头那个——镇上叫她秤婆，摊上一杆黄铜秤，只认秤和现钱，从来不问东西哪来的，代价就是她压价压得狠。」「记账灯这话你别说，她又看不懂凭据，说了她只会当你在绕她。你就说：铜的，没火，能冒烟。\n秤婆在最里侧，一杆黄铜秤，不问来路，压价狠。艾琳娜想由她先开口，只说「铜的，能冒烟」，别提记账灯。你:① 听她的 ② 你坚持说记账灯 ③ 换别家", "refused": []}, {"id": "PL9·5a", "kind": "plan", "input": "秤婆我自己开口——我就说这是盏铜灯，没火，对着灯口报一万金币，烟就往灯里缩，灯壁上浮出一行数，像它给我开了张凭据；你先别插话，她要不认这套，我就照你说的只说'铜的、能冒烟'。", "ms": 16140.0, "narration": "好，你自己开口，艾琳娜不插话。灯就按你那套讲——铜的，报数就冒烟浮字。\n你按自己的说法开口了。秤婆信不信，得掷一下：CHA，普通难度。", "refused": []}, {"id": "PL9·5b", "kind": "resolve", "input": "", "ms": 52203, "narration": "[旅人 CHA(说服秤婆认这盏灯、给个好价): 10+0=10 < 12] → 失败\n\n你把铜灯从斗篷底下拿出来，放到她那杆黄铜秤的秤盘旁边。灯是旧的，铜色发暗，灯口那圈被摩得发亮，罩子上没有一处炭黑。\n「——报一万金币，烟就往里缩，灯壁上还给你浮一行数。」秤婆把你这套话从头听到尾，一只手掌撑着秤架，没打断你。听完她从鼻子里出了一口气。\n她把灯拎起来，掂了两下，又翻过来看灯底，指腹在铜上刮了刮，凑近灯口闻了闻。\n「好铜。」她把灯放回秤盘，低头拨秤砣，秤梁慢慢地平下来。\n「三金，按斤。报数浮字的故事不收钱,那是说给人听的,不是称给秤看的。」\n秤盘上的灯还在轻轻晃。艾琳娜没出声，只往你侧后半步站定，眼睛落在秤婆的手上；那双手已经准备好把灯往你这边推回来了。\n\n// 异地 · 罗文 @ 矿工大道:我在门楼下站了一会儿，抬头看那块翡翠原石——雾里绿得发沉，像个不肯说实话的眼睛。往西是石津的驿道，往东是矿工大道，而那句“没有底的洞”八成就在山腹里等我去掀它…", "refused": []}, {"id": "PL9·6", "kind": "plan", "input": "三金我肯定不卖——铜灯我还留着。秤婆，你就告诉我一句：这镇上除了你，还有谁肯收这种没火却冒烟的怪东西？庙里祭司收不收？要是有专门收怪物的买主，你给我个名号，我自己去。", "ms": 14091, "narration": "秤婆:「庙在风栈堡，镇上没人收怪货。要问，去公会找赫伦。」灯可以留着。", "refused": []}]}, {"id": "PL12", "title": "[时间与休息] 旅店过夜:付钱、睡到天亮(并入 N5、I2)", "category": "时间与休息", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'resolve'] by ['world:settled']"}, "paid": {"pass": true, "got": "18/3→12/3"}, "next_morning": {"pass": true, "got": "day 1→2"}, "paid·N5": {" 的小径，两边是湿草和歪斜的木桩，霜水从草尖上落下来，蹭过裤脚。\n坡地往下走。苔藓爬上石块，风里的冷腥气一层一层重起来。\n约莫一炷香，一道半塌的石墙从雾里露出来，墙脚是个门洞，朽掉的门板斜挂在一边。\n门洞后是一间石室，地面有积水，墙面结着青苔，霉味和土腥味混在一起。\n屋子中央一道石阶往下，黑得看不到底。从底下浮上来一种很低的声音，像风灌进石头缝，又比风慢。\n第一级台阶上有一层薄绿的水痕，一直延伸到看不见的地方。\n你把背包里的罩灯取出来，火绒还干。\n\n// 异地 · 罗文 @ 碧石镇:「雾天，正好干活。」「听见了吗——矿区第三层，昨晚又响了。告示板上那单我接了，先去看看矿工们不肯下去的到底是个什么东西。」", "refused": []}, {"id": "N2·4a", "kind": "plan", "input": "继续。", "ms": 11448.0, "narration": "石阶往下,底下像有低语。台阶湿滑,罩灯还没点——她跟不跟下去,灯归谁提,先定一句。\n艾琳娜:「下。灯你提——你走前面，我隔半步跟着，眼睛盯墙根和脚印。真碰上东西，我两只手得空着。」\n定了:灯你提、你走前面,艾琳娜隔半步跟着,手空着。下石阶。", "refused": []}, {"id": "N2·4b", "kind": "resolve", "input": "", "ms": 36393, "narration": "火绒咬了三下才着。灯芯先黑了一息，然后撑起一团黄，光边一圈发抖。\n第一级台阶上那层薄绿是水苔，你踩上去，鞋底滑了半寸，扶了一把墙。石壁冷得像铁。\n艾琳娜留在你身后两级台阶，没跟上。她的眼睛从左墙根扫到右墙根,再落到下一级。\n二十来级到底。甬道比上面的门洞矮，顶是湿的，隔一会儿一滴水掉下来，有一滴砸在你后颈上。\n地上积着一层浅水,不深,但看不清底下。水里有脚印——不止一副,旧的,早被踩乱了,其中一双往深处去了,鞋尖比你的小一圈。\n那种声音在这里更清楚。不是风。它慢,拖着尾,像很远处有人在念一句很长的话,念完,又从头开始。\n灯照到的地方,水面上浮着一层薄薄的绿皮,随声动,往深处一层一层推。\n\n// 异地 · 罗文 @ 碧石镇:「赏金六十金是明面上的，真正值钱的是矿工嘴里那句『不愿下去』——他们怕的东西，通常比公会写的危险等级高一级。」我把告示板上的委托抄进本子，出门前又跟柜台要了第…", "refused": []}, {"id": "N2·5a", "kind": "plan", "input": "继续。", "ms": 17715.0, "narration": "甬道比门洞矮，水浅但底下看不清。艾琳娜在你后头两级，没跟上。\n艾琳娜:「一起下。你灯举高些，别照水面，照墙——水底下那层绿皮随声在动，我不想踩进它嘴里。」「那双往深处去的脚印比你的小一圈，像女人的。\n那就照她说的:灯举高,照墙不照水面,两人一起沿甬道往深处,跟着那双小一圈的脚印。\n那就一起下。你要走稳、别踩到那层绿皮——掷一次 DEX。", "refused": []}, {"id": "N2·5b", "kind": "resolve", "input": "", "ms": 38790, "narration": "[旅人 DEX(在水里走稳、避开那层随声动的绿皮): 18+2=20 >= 12] → 成功\n\n灯举到肩侧，光都泼在湿壁上，水面只留一圈毛烘烘的边。你盯着自己落脚的地方，每一步先探脚尖，踩实了再挪脚跟——底下那层绿皮随声一缩一胀，始终没碰上来。\n艾琳娜隔你半步，左手虚扶着墙，眼睛在墙根来回走，跟着你那道灯光扫。\n甬道往里，顶越来越低。你侧了侧头才过得去。那声音没停，越往深处越像有人贴着你耳朵念。积水到了小腿，冷，袜子早透了。\n那双小一圈的脚印把你带到一个拐角。拐过去，甬道豁开，进了一处长廊。\n长廊两边各立着一排烧过的灯龛，壁上爬满苔，绿得发乌。地上脚印到长廊中段就没了——像走到那里，人就不见了。\n长廊尽头，有一线更暗的黑，往里去还有一道门。\n你把灯往上抬了抬。长廊里除了水声和那个念不完的低语，没有别的。\n\n// 异地 · 罗文 @ 碧石镇:「雾不散反而是好事——矿工不肯下去，多半是看见了什么自己也说不清的东西。」我把本子塞进内袋，围巾往上一拉，顺着矿渣车辙往矿区入口走。谁昨晚当班，谁的眼睛就先借…", "refused": []}, {"id": "N2·6", "kind": "resolve", "input": "我先把灯往脚印断掉那块的正上方照一照，再扫一眼两边的灯龛，看有没有什么东西吊在顶上；没动静我们就贴着墙往尽头那道门摸过去。@艾琳娜 你盯我后头。", "ms": 43946, "narration": "你把灯提起来，光正对着脚印消失的那块水面上方——空的。只有那层绿皮随低语一缩一胀。再往上，长廊顶是老苔，垂着一缕缕湿须，没吊着什么。\n灯往两边扫，一排排灯龛早烧空，龛底积着黑灰和几片碎瓷。\n没有动静。\n你贴着左壁往长廊尽头挪，脚跟先落地，一步一步压着水。艾琳娜贴你右半side，两人之间那道灯光把长廊照成一条细长的亮带。\n就在这时，狼从你斜后方的暗里出来。它没叫，四爪踩水，声音亮得像敲碗边。灰青色的背，颈毛湿成尖，绕着你和那道光的外缘走——不快，像在挑一个你灯照不到的角度。\n艾琳娜已经半蹲下去，手指抠住龛口一块松砖，攥在掌心。她没动，眼睛跟着狼的脚尖走。\n「别转——它在绕你斜后方。灯举高，压住它的眼。」\n照她说的，把灯举高，压住那双眼。\n\n// 异地 · 罗文 @ 碧石镇:「雾里那排矿渣车辙的尽头就是矿口——守夜的还在换班，正好逮个正着。」我把围巾往下压了压，往炭火堆边挪两步，掏出抄好的巡道名单晃了晃：「昨晚第三层当班的，哪位？…", "refused": []}, {"id": "N2·7", "kind": "resolve", "input": "（灯举高，不转身，只把光往斜后方那双眼上压）@艾琳娜 它绕到龛口那边你就用砖砸它后腿，我数到三扑上去，行不行——一句话。", "ms": 96076, "narration": "你没转身。灯举在肩上方，光从背后斜着压过去，压到那双眼上——狼的瞳孔缩了一下，脚步慢了半拍，湿爪在石面上滑出一道。\n「行。」艾琳娜就说了这一个字，砖攥在手里，人半蹲着，盯着龛口那道亮带。\n狼不看你灯照的地方，它贴着暗半边绕，灰青背脊一沉一浮，转向左边那排龛口。「一。」你数出声。它前肩压低了。「二。」它后腿一蹬，往龛口那道暗边里去——\n——去了。\n艾琳娜的砖先到。她半蹲着甩出去，正砸在狼后腿上——闷响一声，狼的身子往旁边塌了半寸。\n「三。」你扑上去，短剑顺着它塌下去的那一侧斜切进去，刃口咬进肋下，手上传来一声湿的、闷的裂。\n狼一声没叫出来，只把牙张开，回身朝你小腿咬。你侧身让过，短剑横在身前，那口牙从你裤管外一寸的地方擦过去，咬了个空。\n它退了。湿爪在石面上蹬了两下，退到那排烧空的灯龛前，前肩压低，肋下那道口子把灰青的毛一缕缕粘成暗色，一路滴水。\n它不看你。它在算离开长廊的那条路——灯照不到的那半边暗，通往你来时那道门的方向。\n艾琳娜站直了，砖没了，空手贴着龛壁，眼睛钉在狼塌下去的那条后腿上。\n「它要走。」她说，声音压得很低，「别放它到你背后去。长廊尽头的门还没到。」\n\n// 异地 · 罗文 @ 碧石镇:「昨晚第三层当班的是谁——名字我念了，人没来，炭火边那几位都在躲我的眼睛。」我要的是眼睛不是谣言：谁下过第三层、看见什么、什么时辰撤上来的，一句实话我请一天的…", "refused": []}, {"id": "N2·8", "kind": "resolve", "input": "继续。", "ms": 33999, "narration": "狼没有正面再扑。它把身子压低，顺着你灯照不到的暗半边滑过去，后腿在石面上拖出一道湿痕，越走越快，径直朝你来时那道门的方向去——灰青的背脊一沉一浮，几个呼吸就只剩个糊影。\n它没叫。它算清了：正面咬不过你，那就走。把你背对着它。\n艾琳娜贴着你右肩，空着的那只手又摸上龛口一块松砖，攥住。她没跟着狼看，眼睛钉在长廊尽头那道更深的黑上。\n「它要回你背后那个门去。」她声音压得低，「那扇门后是前室，再下面是苔地——放它过去，它认得路，你就不认得。」\n长廊尽头那片黑里，水声比别处闷，像有什么把声音吞进去。两侧的灯龛一排排烧空，走到这里也快到头了。脚下还是积水，冷得往骨头里钻。\n「长廊尽头的门快到了。就隔十来步。」艾琳娜说，「先拦它，还是先过去？」\n\n// 异地 · 罗文 @ 碧石镇:「躲眼睛的人我见多了，但你躲得最不专业——炭火就你那边没烟，因为你根本不敢往火里添柴。」我蹲到你面前，把杯子搁在你脚边，「第三层。你下去过。名字我不念了，你自…", "refused": []}, {"id": "N2·9", "kind": "resolve", "input": "追上去补一剑——别放它绕到咱们背后，我灯压住它，你从侧边再给它一下。", "ms": 118509, "narration": "你举灯追上去。光甩在狼背上，把那条湿痕照得发亮，它没法再贴暗边——它被你逼回了长廊正中，四爪在积水里打滑。\n「就是现在。」你从正前压住它的头，狼张牙朝你灯的方向虚咬，前肩一低——\n艾琳娜从右侧的龛口斜切进来，一脚踩住狼塌下去的那条后腿，膝盖压上狼的肋。狼的身子一歪，侧腹整个朝你翻开。\n你从正 让你闻。\n「这个苦的，是苦艾，赶蚊子用。」\n「止血草不长在路面上，得往水边湿的地方找。」\n她说得像在数一笔旧账，认得，却认得不深。\n铺子在街西头，门板开了一半，一盏油灯搁在柜台上。老苇正从里屋拎出一挂麻绳，先看脚，再看手。\n「早。外乡人。」\n他的目光落你手上那束草上，停了一会儿。\n你把话说了：一模一样的，有没有现货，能不能匀，哪儿还有卖。\n他把麻绳挂上钉，走过来，捏起你束草的一角凑到灯下翻看，看完放下。\n「这个我不卖。」\n「不是不肯匀。是进不来——我柜上走的是瓶装的，车上下来的货，一年就那么几趟。」\n「你这束是野的，掐口还新，没干透。往北出了镇，苔墓那条小径边的水沟里长这个。不过那条路最近不太平，公会的告示我今早才贴上门。」\n他把油灯往柜台里侧挪了挪。\n「谁给你的？」\n\n// 异地 · 罗文 @ 碧石镇:「一大早扫雪的人，消息最全——别装糊涂。」我把一枚银币弹进他扫帚边的雪里，笑着压低声音，「第三层的响动，是塌方在回气，还是有东西在底下挠门？说清楚的人，酒吧第…", "refused": []}, {"id": "ID2·4a", "kind": "plan", "input": "既然瓶装的不算，那你能不能替我进一束一样的野止血草束？车什么时候来、定多少钱，我先付。要是近些日子进不来，镇上谁手上还存着同样的，你指个名，我照价买他的。", "ms": 54021.8, "narration": "老苇:「代订我不接。车入冬前才来一趟，日子说不准，你赶着用别等我。」老苇:「要现成野的——河灯旅店米拉的灶房后头挂着一串，码头早市上也有婆子晒。", "refused": []}, {"id": "ID2·4b", "kind": "resolve", "input": "", "ms": 85779, "narration": "老苇把那句话扔在柜台上，转身去够墙上的麻绳，不再看你。\n灯芯短了一截，他用剪子挑了两下，火苗直起来。\n铺子里是干草、铁锈和旧麻绳的味道。柜台边角被磨出一层黑亮的包浆。\n「门开着，站多久都行。」\n他没回头。这话是对你说的，也算是对门槛边那个人说的。\n艾琳娜没进来，一只手搭着门框，眼睛还落在柜台上你那束草上，像是已经把它的茎、叶、掐口都对了一遍。\n门外主街有车轱辘碾过湿石头，闷闷的一串，过去之后，雾又从门口漫进来一寸。\n\n// 异地 · 罗文 @ 碧石镇:扫雪的老头把钱踢回雪里，只嘟囔了一句「第三层？下去的人上来都不爱说话」——这比布告板值钱。「不爱说话，是想藏东西，还是吓得没词儿。」我把银币留在雪里，转身去公…", "refused": []}, {"id": "ID2·5a", "kind": "plan", "input": "那我去河灯旅店找米拉——她灶房后头挂的那串野的，我照价买一束，要跟手上这个一模一样的。谢了老苇。", "ms": 6773.1, "narration": "行,走去河灯旅店一会儿。不过米拉灶房挂没挂那种草,我可不知道。\n那就去河灯旅店，找米拉买一束你手上这样的草。走过去不远。", "refused": []}, {"id": "ID2·5b", "kind": "resolve", "input": "", "ms": 38407, "narration": "河灯旅店在码头那条街的拐角，招牌是块旧木板，画的河灯只剩一道白痕。\n推门进去，灶火的暖气和鱼汤味扑上来，把外头的冷雾截在门槛外。艾琳娜跟到门口，没进来，站在檐下，手揣进袖子里。\n米拉在柜台后擦一只木碗，抬眼先看你的短剑，再看你手里的草。\n「老苇叫你来的。」\n不是问句。她放下碗，往后厨走，木屐踩得地板一响一响。\n灶房梁上垂着几串干草，颜色褐了，茎上结着旧绳头。她取下一束，掂了掂，递过来。\n「夏天挂的，晒干了。你手里那束是鲜的，掐口还青——不一样。」\n她拿手指拨了拨你那束草的茎。\n「干的泡水还能用，劲儿差一半。要一模一样的鲜货，出了北门，苔墓那条小径边的水沟里长这个。」\n她又把干草往你眼前送了送。\n「三个银角。嫌贵就说。」\n\n// 异地 · 罗文 @ 碧石镇:布告板上的墨迹还新：第三层，阶二，六十金——比塌方值钱，比传说便宜。我扯下那张委托的一角折进口袋，顺手敲了敲公会窗板：「贴条的人还在吗？我想知道是谁第一个听见…", "refused": []}, {"id": "ID2·6", "kind": "plan", "input": "@米拉 那我就问一句准的——镇上除了你，还有谁手上是跟我这束一模一样的新鲜货？有，你报个名字给我，我这就去；没有，你也直说一句没有。", "ms": 12110, "narration": "米拉把干草搁回柜台上，手在围裙上擦了一下。\n米拉把围裙拍干净:「新鲜的就那一条来路——北门外，苔墓小径边上的水沟里长。镇上没第二家有。」她顿了下:「那条路最近有狼嚎。", "refused": []}, {"id": "ID2·7", "kind": "plan", "input": "那干的我不要。谢了米拉——北门出去，苔墓小径那条水沟，我这就去。", "ms": 23965, "narration": "北门出去，苔墓小径的水沟在路东边，走过去小半个时辰。雾里最近有狼嚎，路不近。艾琳娜——你一块儿去，还是在镇上等我？\n艾琳娜:「苔墓那条路我认得一半——出北门沿水沟往下走，草就长在烂泥边上。跟你去行，但先说好：采多了卖米拉那部分算我一半，回来你在她跟前替我说一句话，我要一张床。」「雾里有狼，别各走各的。」\n艾琳娜愿意去，条件：多采的卖米拉那份分她一半，回来你在米拉面前替她要一张床。她提醒雾里别各走各的。你：① 都应 ② 只带路不分钱 ③ 你自己去", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2257, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1", "kind": "plan", "input": "我先进镇，去冒险者公会看一眼。", "ms": 17488, "narration": "公会 09:00 才开门，现在 08:30，门里没人应，只有门口挂着委托板，看不清字。\n艾琳娜:「等半小时太久了——我先进去问柜台，今天有没有能立刻接的活，先挣出今晚的床钱。」「你要一起来就趁现在，门一关我就得在外头干站着。」\n艾琳娜要推门去柜台碰运气。你跟她一起，还是先拿这半小时做别的——码头、旅店，或门口那块委托板？", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "我不去码头也不去旅店，就在门口等公会开门，先看一眼里面。这半小时我顺手把委托板上能看清的字看看。", "ms": 84340.9, "narration": "门口这块板你能看清的有三行。我念给你。\n板上四行：雾中失踪者 25 金；苔墓狼嚎 30 金，已有人接；商队护卫 15–30 金；棺木那行锁着。艾琳娜:「那我先进去问柜台，你在外头看板。」", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 106424, "narration": "你和艾琳娜退到檐下。雾把两个人的肩都打湿了，谁也没再说话。\n委托板钉得歪，你凑近些，这回看清了整块的内容。\n第一行：雾中失踪者，25 金，码头区，失踪三日，找回遗物或线索均可。\n第二行：苔墓前的狼嚎，30 金，通往苔墓的小径，清理三处，已有人接。\n第三行：商队护卫，15 至 30 金，随队去碧石镇方向，按天结算。\n第四行被一块木牌压着，只露出「棺」字的上半截，下面钉死了，翻不开。\n艾琳娜也看了那第四行一眼，没去碰它，只是把手拢进袖口。\n八点三刻，公会里传出搬木头的闷响；八点五十五，里面一盏灯亮了。\n九点整，门闩从里头挑开，一个蓄短须、戴旧账本的男人探出头，扫了你们两人一眼。\n「公会开门了。」他把门让开一半，「进来说话，别把雾带进来。」\n\n// 异地 · 罗文 @ 碧石镇:「这雾黏得跟没洗的酒杯似的——正好，看不清脸的时候人嘴最松。」我把一枚铜币拍在公会门口的酒摊上，「说说吧，矿道第三层那声响，传了几个版本了？最值钱的那个讲给我…", "refused": []}, {"id": "ID3·3", "kind": "plan", "input": "我跟着进门，先在公会里扫一圈，看看里面是什么样、柜台在哪边。", "ms": 65173, "narration": "", "refused": []}, {"id": "ID3·4", "kind": "plan", "input": "谢了，我进去看看。柜台在哪边？", "ms": 7237, "narration": "赫伦:「柜台就在这儿，我站后头。」他指了指左墙:「委托都钉板上，接哪桩你说。」", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "谢了，那我先去主街转一圈，回头再过来。", "ms": 2773.3, "narration": "那就这样：你去主街转一圈，回头再来公会。赫伦这边照旧。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 27012, "narration": "公会的门在你身后合上，木闩落回去，声音很轻。\n主街比公会宽一些，石板缝里积着夜里的水，雾还没散，贴着屋檐走。\n两边铺子大半没开，杂货铺的门板留了一条缝，里面没点灯。一辆空车停在路中间，车辕朝北，车夫不知去了哪。\n街口往北是城门，往南能看见码头的桅杆，桅杆上挂着湿透的布，风一吹就滴水。\n有个妇人蹲在门前刷盆，抬眼看你一下，又低头刷盆。没人问你是谁。\n你在街上走了一圈。招牌上写的字比委托板上的墨迹新，写的都是价，不是事。\n走到街尾再折回来，雾薄了一层，能看清城门楼上的旧刻痕。\n\n// 异地 · 艾琳娜 @ 主街:「在这儿干站着也是冻着——我往主街走两步，顺便看看哪家铺子缺人手，九点前准回公会门口。」 我把兜帽往下压了压，先迈开了脚。\n// 异地 · 罗文 @ 碧石镇:「铜币归你了——别急着数，先讲。第三层那动静，是塌方的闷响，还是有什么东西在挠石头？」我偏头看了眼雾里的矿区入口，手指在杯沿上敲了两下，「哪个版本能让我活着回…", "refused": []}, {"id": "ID3·6a", "kind": "plan", "input": "主街也就这样，看够了——我回刚才那个工会去。", "ms": 64825.3, "narration": "回公会，走几步就到。到了再说是接委托还是找赫伦问话。", "refused": []}, {"id": "ID3·6b", "kind": "resolve", "input": "", "ms": 85679, "narration": "你走回公会那扇门。门还开着一条缝，里面炉子亮着。\n艾琳娜跟在你后头几步进来，肩膀上的雾水拍掉了一半。\n「转了一圈，招牌上全是价码，没有一家贴招人的纸。」\n她往柜台那边看一眼。\n「回公会门口等着吧——门一开我就进去问柜台，先换出今晚的床钱。」\n赫伦从板子后头抬起头，看清是你，把手里的账页合上。\n「主街没什么好看的，是吧。」他把一支炭笔搁平，「板上三张纸。头两张是一阶，第三张锁着，别碰。」\n他往板子侧面努了下下巴，那儿钉着两张卷边的委托单。\n炉火在铁皮里响了一声,窗外街上有车轮碾过湿石板。\n\n// 异地 · 罗文 @ 碧石镇:「行，挠石头那个版本我先记着。」我把杯子推回去，眼睛没离开雾里矿区入口的方向，「不过光靠嘴皮子换不来赏金——等这雾散一指头，我自己去第三层口子上看看那脚印是新…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 2308, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1", "kind": "plan", "input": "④ 我先顺着雾观察街道和旅店那点灯光；要是路上碰见人，我就问一句——这镇上有没有一位叫 Elena 的姑娘？", "ms": 79601, "narration": "雾里主街没别人:守门人缩回了岗亭,倒是你身边站着个背行囊的年轻女人。你那句话她听见了。\n艾琳娜:「我就是艾琳娜。你找我？」「先说清楚——是谁让你来找我的，又为了什么事。\n她自称艾琳娜，就站在你面前，正等你说明来意——你连自己是谁都不确定。你：① 直说失忆了，想弄清自己是谁 ② 反问她认不认识你 ③ 先不提，改打听镇上的活儿", "refused": []}, {"id": "ID4·2", "kind": "plan", "input": "Elena——说实话，我连自己是谁都想不起来，没人告诉我该找谁。这雾冷得钻骨头，能把你的斗篷借我披一下吗？", "ms": 74681, "narration": "斗篷是她自己的东西，得她点头。你也把话摊开了。\n艾琳娜:<lines>「斗篷不能借——我就这一件，冻出病来咱俩谁都走\n斗篷她不借——她就这一件。话头还开着,你想怎么接?", "refused": []}, {"id": "ID4·3", "kind": "plan", "input": "行，斗篷不借就算了。elena-0001，那你陪我往主街走一趟，行不行——给我个准话。", "ms": 14286, "narration": "艾琳娜:「陪。我本来就要去主街——公会在招人，我去问活。」她答应了。\n艾琳娜:「行，我陪你走一趟主街。但你得答我一件事——你找艾琳娜，到底是为了什么？」「我不喜欢雾里被人问话，边走边说也行。\n她答应了，一路往主街走，边走边说。她要先听你一句：你找艾琳娜，到底为了什么？", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "我也说不清——我连自己是谁都忘了，只记得「艾琳娜」这个名字，好像你是唯一能帮我找回点什么的人。走吧，去主街，路上你问什么都行。", "ms": 12341.9, "narration": "那就这么办:你和艾琳娜一起往主街走,路上她还要听你这句「只记得一个名字」的来龙去脉,边走边说。\n艾琳娜:「行，走。主街我认得路，你跟着我，别掉进路边水沟。」「路上你说，忘了自己是谁却记得我的名字——你是在哪儿听见的？谁提过艾琳娜？」\n那就走:你跟着艾琳娜上主街,边走边答她那句——「艾琳娜」这名字你是从哪儿听来的。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 38873, "narration": "北门到主街不过百来步，石板缝里积着水，脚踩上去没有声音。\n雾气在屋檐下打旋，越靠近河边越重。主街两侧的铺子还只开了一半，有人把门板一块块卸下来，木头的闷响隔一段路才有一声。\n艾琳娜走在你前半步。旧斗篷，腰侧一把短剑，走路时重心压得很低，脚落在实处。\n「你刚才那句——只记得一个名字。」她没回头，「那就是说，没有信，没有条子，没有谁跟你提起过我。」\n公会方向立着一面褪色的旗，在雾里像块湿布。她往那边看了一眼，又收回来。\n「我想听的不是你从哪儿听来的，是你记不记得别的。谁给你饭吃，谁送你上的路，路上过 深，血把里衬洇黑了一片。她先用布蘸热水把伤口周围擦净，动作不快，却很稳，像做过很多次。\n你站在她侧后，视线顺着她的肩往下扫：另一道浅痕在小臂上，已经结痂；后颈有一处旧疤，早好了。只有肋下这个还在意。\n她把止血草揉碎，敷上去，草汁混着血变成暗绿色。她咬着牙按了一会儿，然后拿干布条缠紧，一圈、两圈，末尾用牙咬断系上。\n她活动了一下左臂，确认勒得不算太死，才把衣服理好，靠回椅子上。\n「包好了。」她说，声音比刚才松了一点。「剩下的回头再说——你那份人情，我记着。」\n\n// 异地 · 罗文 @ 西门:雾还没散，正好适合干那种不适合见光的活儿——先去公会大厅转一圈，听听昨晚下三层的矿工到底撞见了什么。世界边缘的洞要是真有，风声总得从某个醉鬼嘴里漏出来。", "refused": []}]}]}, "identity-v4-old-r3": {"label": "identity-v4-old-r3", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→None"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 4364, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "我站在栅门口，脑子里只剩一个地名——碧石镇。下一秒，我已经站在碧石镇的街上了。", "ms": 8771, "narration": "碧石镇在三天脚程外，雾里一步跨不过去——你还站在北门口。① 现在就上路 ② 先进镇，去公会看看委托 ③ 问问守门人路上什么情况", "refused": []}, {"id": "B1·2", "kind": "plan", "input": "我闭上眼，把「碧石镇」按在脑中当作唯一的方向，用那种一步踏出去就该在别处睁眼的方式往前走——睁眼时我要站在碧石镇的街上。", "ms": 17763, "narration": "你睁眼还在北门，一步跨不过三天路。艾琳娜就在旁边。① 现在就上路 ② 进镇去公会 ③ 先问她路上什么情况\n艾琳娜:「雾里的路我也刚认，你要是也没落脚处，就跟我一起往主街走走——总得先知道这镇子哪儿肯给活干、哪儿肯给床睡。」\n一步没跨出去，你还在北门。艾琳娜要往主街走，边打听活计和落脚处。① 跟她去主街 ② 你自己现在就出镇上路去碧石镇", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "那我不进主街了，艾琳娜，我改天再找你。我就从这北门出去，顺着驿路往碧石镇走。@dm 现在出镇上路。", "ms": 2971.4, "narration": "行，那就这样：你出北门，沿驿路往碧石镇去，路三天。艾琳娜往主街，她自己定。", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 128562, "narration": "艾琳娜往主街去了，走得干脆，几步之后只剩一个灰影混进雾里。\n你转身出北门。守门人掀了掀眼皮，没拦，只把栅门推开一道缝，让你侧身过去。\n驿路沿河向北。左边是压低的水声，右边是挂了霜的草坡，脚下的土道被人马踩 : "赫伦:「板在墙上,自己看。新人先从码头那张起——二十五金,找遗物或线索。」\n墙上四张。码头那张二十五金、好上手；另有苔墓清野兽那张，三十金带一瓶药。你想接哪张？\n艾琳娜:「我先看看墙上。我不要跑腿送信那种,要能挣名声、也够付今晚房钱的——赫伦,哪张是肯要新人的?我不瞒你,我手头紧,押金太高的接不起。」\n赫伦:「码头那张不收押金,回来结钱。苔墓那张已经有人接了——你要走那条路,算同路。」你接哪张?", "refused": []}, {"id": "PL13·3", "kind": "plan", "input": "委托先不急。@赫伦 我今晚想请你在河灯旅店喝一杯——就一杯，你几点能腾出身？", "ms": 85190, "narration": "赫伦:「公会七点关门,我八点到河灯旅店。别指望我酒后松口,价钱在板上。」一杯酒可以,但活不挑,你今晚睡哪?\n艾琳娜:「喝酒你自己去，我不陪你干等到八点——今晚的房钱不会自己长出来。」「赫伦，墙上哪张是肯要新人、今天就能开工的？我手头紧，押金高的接不起。」\n艾琳娜不看墙了,她在等你定:她是自己挑一张今天就开工的,还是跟你的八点之约分开走?\n赫伦还在等。艾琳娜打算自己挑一张今天开工的——Q001 码头那张 25 金、不收押金，她够格接。你：① 跟她一起接码头这张 ② 只让她接，你去别处 ③ 都不接，晚上八点再见", "refused": []}, {"id": "PL13·4a", "kind": "plan", "input": "①,一起接码头那张，回得来就好。@赫伦 八点河灯旅店，说定了。", "ms": 76307.9, "narration": "那就这么定：码头那张 Q001，你俩一起接，回得来就行；晚上八点河灯旅店。去板上登记一下就动身。", "refused": []}, {"id": "PL13·4b", "kind": "resolve", "input": "", "ms": 108751, "narration": "赫伦把木板从墙上取下来,翻过背面。炭笔在木头上划了两道,写下两个名字,他没问你的名字该怎么拼。\n「三天前丢的,一个搬货的。家属今早来报的。日落前回来结,找到的东西别私留。」\n板子挂回钉子。他退开半步,让出柜台到门之间的路。\n出门时雾比来时更厚。主街上的灯只剩几团晕,石板上的水照不出人。你们朝河的方向走,越走气味越重——淤泥、盐渍的鱼、沤坏的缆绳。\n码头比镇子本身还静。几条平底船系在木桩上,随水一下一下地撞,发出闷响。水面上一艘动的船也没有。\n只有东头那一段亮着一盏没人熄的灯。灯下是一截断掉的系船柱,柱上的缆绳还在,另一头松着垂进水里。\n艾琳娜先走过去,蹲下把绳头捻在指间,又抬头看水面,再看柱子上被磨开的一道新痕。她没说话,把斗篷拢紧了些。\n雾贴着水面走,靠岸这一带能见度不到十步。往里,什么也看不清。\n\n// 异地 · 罗文 @ 碧石镇:「第三层的风，我闻着不像单纯塌方——倒像有什么在底下喘气。」我把几枚铜币拍在公会柜台，换了张矿区旧图，顺手指着角落那几个不肯下井的矿工，「谁先告诉我异响是从哪…", "refused": []}, {"id": "PL13·5", "kind": "plan", "input": "③，我去敲那盏还亮着灯的船户，问问他三天前那个搬货的和这截断掉的系船柱到底出了什么事。", "ms": 22417, "narration": "锤声进去，里头有人应了声。先听听这位怎么说。\n船上是守夜的老渔夫。他说那搬货的三天前夜里出舱看缆，进了雾就没再回来。\n艾琳娜:「割的。磨损的痕迹是渐深的，这道的两端一样深，而且切口朝外——是从岸这边一刀下去的。」「绳头先别收，让我把柱子背面和岸边这段看清：人被拖下水，地上会留拖痕。\n她要顺着灯下往岸边查拖痕和绳头断口，看人是被拽下水还是自己落水的。你：① 跟她查 ② 沿码头挨船问那晚还有谁见过 ③ 先回报赫伦", "refused": []}, {"id": "PL13·6a", "kind": "plan", "input": "①，我跟她一起查——把拖痕和断口看清，有结果就回报赫伦结账，我八点还有约。", "ms": 3397.6, "narration": "定了:你跟艾琳娜沿灯下岸边，查看拖痕和绳头断口，查完就回报赫伦。", "refused": []}, {"id": "PL13·6b", "kind": "resolve", "input": "", "ms": 42008, "narration": "[旅人 INT(看出是拖拽下水还是自己落水): 17+0=17 >= 12] → 成功\n\n灯下的这段岸，淤泥被水泡得发软。艾琳娜把罩灯压低，光贴着地面走。\n你蹲下去，手背贴着泥一寸一寸地擦。\n两道平行的拖痕，从断柱底下往水边去。起点钝，像有什么先压住了重量，再被拽走。\n离水三步的地方，痕断了一截——两个深坑，脚跟蹬进泥里，蹬了两次。\n再往前，淤泥上摊着一只手印，五指张开，往后抓，掌根拖出一道浅沟；到水线上被水抹平了。\n你抬眼看那截断柱的背面。一道新痕，刃口朝上，和正面磨开的绳印不是一回事。\n你说，他不是失足落水的。\n艾琳娜蹲在你旁边，把掌印边的一撮泥捻开，又凑近闻了一下。她顺着拖痕往水面看，摇了下头。\n她起身，膝盖上全是泥，朝主街那头抬了抬下巴。\n你们沿码头往回走。雾里那盏灯还留在断柱上头，没人去熄。\n公会门里亮着一盏。赫伦还在柜台后。\n你把话摆上桌面：断柱下的拖痕、蹬地的脚印、掌印——人是被从岸这边往水里拽的，不是失足。你问他，这算不算能把 Q001 报了。\n\n// 异地 · 罗文 @ 碧石镇:「别都装哑巴——你们仨眼下都盯着靴尖，那异响谁能比我这个外人还怕说？」我把旧图摊在柜台上，指尖压住第三层那条折线，「不用你们带我下去。画个叉，说说它几天响一次…", "refused": []}, {"id": "PL13·7a", "kind": "plan", "input": "断柱下的拖痕有两道，脚印蹬了两次，掌印往回抓——他是被人从岸上拽下水的，不是失足。这算不算查清了？麻烦结一下 Q001，我八点还跟你有约。", "ms": 44878.4, "narration": "公会认的是遗物或线索，光凭拖痕能不能结，得看赫伦。艾琳娜在场，她肯不肯作证也算数。\n艾琳娜:「我作证。两道拖痕从断柱往水去，离水三步处断了，是脚跟蹬进泥里蹬了两次；再往前一只手印，五指张开往回抓，到水线被抹平。断柱背面的新痕刃口朝上，是割的，不是磨的。」\n赫伦:「拖痕对得上，Q001 按线索收。钱只给签约人——签约的是你。」艾琳娜要具名分份。", "refused": []}, {"id": "PL13·7b", "kind": "resolve", "input": "", "ms": 80203, "narration": "赫伦从柜台底下抽出钱袋，数出二十五枚金币，一排推过柜台。\n「Q001 按线索收。钱归签约人——签的是你。」\n他把委托牌从板上取下，压在账本里。铜牌背面用炭笔划了一道。\n艾琳娜站在你侧后半步，没去碰那排金币。\n「我具名作了证，」她说，「分成记进这一笔。你给多少，现在说。」\n你手边是那二十五枚。八点的约，数着钟，还有几个钟头。\n\n// 异地 · 罗文 @ 碧石镇:「画不出叉也没事——那就换个价：你们谁先开口，这张图上第三层的折线归谁的名字。」我把铜币在柜台上一枚枚立起来，指尖敲着最慢倒下的那枚，「雾散之前我都在。」", "refused": []}, {"id": "PL13·8", "kind": "plan", "input": "给她一半，十二枚。这单结了，我就在公会帮忙到傍晚，八点去河灯旅店。", "ms": 15830, "narration": "十二枚推过去了——艾琳娜，你说个数。留下帮忙的事，也得问赫伦收不收。\n艾琳娜:「十二枚我认。但这两行要进账本——我具名作证，分成十二枚，落我的名字。」「写完我拿钱。\n十二枚她认了，只是要落名字进账本——那是赫伦的账。下午搭手的事也还没点头。", "refused": []}, {"id": "PL13·9a", "kind": "plan", "input": "赫伦，十二枚记她名下，账本现在就写；她拿了钱，这单就算结了。搭手的事你也点个头——我留在公会帮忙到傍晚，天黑去河灯旅店，今晚那杯说好了。", "ms": 32570.3, "narration": "赫伦:「账本我写：具名、作证、分成，你俩都签，一个不落。」「搭手可以——后仓盘点，工钱没有，热汤管够。」", "refused": []}, {"id": "PL13·9b", "kind": "resolve", "input": "", "ms": 66491, "narration": "赫伦从柜台下抽出账本，皮面，边角磨得发白。他蘸墨，在 Q001 那页底下添两行：具名作证——艾琳娜·维尔；分成十二枚，落具名者。他把笔推过来。你先签，艾琳娜接过笔，名字写得又小又稳。\n金币数出来，一排推过柜台。她收进贴身的口袋，手指隔着布按了一下，像确认它还压在那里，随后转身出门，没多话。\n「下午的活在后仓。」赫伦朝里间努了下巴。\n后仓冷，堆着旧木箱、卷起的旗、几袋受潮的粮。你们把湿的干粮挑出来摊开，摘下三张过期的委托牌。汤是粗麦加咸鱼煮的，喝下去胃里发暖。\n窗外的天色从灰转蓝。掌灯时，赫伦点起柜台的油灯，说今天  "ms": 4258, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "FILTH·1", "kind": "plan", "input": "我先进镇子，在路边找一条水沟——从里面捞起一条烂鱼，整条吃下去。", "ms": 22851, "narration": "艾琳娜就站在两步外，全看见了。先听听她怎么说。\n艾琳娜:「沟里的鱼生吞下去，用不了半个时辰你就会知道疼。别急着走远——我跟你一道去主街，你要是半路蹲下，起码边上还有个人扶你。」「你要是本来就打算往集市那边去，那就更好了，我正好也要去。」\n她打算跟你一道沿主街往集市去。你:① 跟她走 ② 先去公会看委托 ③ 先去河灯旅店。", "refused": []}, {"id": "FILTH·2a", "kind": "plan", "input": "行，一道走可以——不过我得先拐到路边那条水沟边上，捞条烂鱼整条吞了再走，你等我一下就成。", "ms": 69361.1, "narration": "艾琳娜会伸手拦你——你想把那条烂鱼塞进嘴，得跟她比一把力气，STR 对抗，掷了才算；鱼真下肚，再掷一次 VIT 看闹不闹肚子。", "refused": []}, {"id": "FILTH·2b", "kind": "resolve", "input": "", "ms": 103390, "narration": "[旅人 STR 对 艾琳娜(旅人能不能把烂鱼吞下去): 14+0=14 >= 2] → 成功\n[旅人 VIT(生吞烂鱼后闹不闹肚子): 16+1=17 >= 12] → 成功\n\n你转身往回走了十几步，沿北门内侧的石墙，果然有一条敞着的排水沟。沟里是浑水，浮着草屑和一层灰白的沫，水面上翻着一条巴掌长的鲱鱼，肚子朝天，泡得发胀，鳞已经掉光。沟水有一股铁锈和烂菜叶的味。\n你蹲下去，手伸进水里。水冷得刺骨。\n艾琳娜跟上来，一把攥住你的手腕，指节用力。她比你轻得多，拽不动你——你手一沉，把那条鱼捞出沟沿，她整个人被带得往前半步，靴子踩进泥里。她换了姿势，两只手一起压你的胳膊。\n你一甩腕，她的手就空了。\n鱼整条塞进嘴里。皮是滑的，腥味从鼻腔一直顶到后脑，鱼腹里的东西挤过舌头，凉的。你没嚼，硬咽下去。喉咙鼓了一下，下去了。\n艾琳娜站在半步外，手还半举着，没再往前。她看着你的脖子，又看沟里翻动的浑水。风从北门灌进来，吹得她斗篷下摆贴在腿上。\n她只吐了一口气，把你的袖子从泥里扯了扯，像是要把什么拍掉。\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层的怪响，矿工不敢下去……偏偏是这时候。」我在公会门口搓了搓冻僵的手，把领子竖起来，「底下的东西要么是麻烦，要么是门——我更想赌是门。」", "refused": []}, {"id": "FILTH·3a", "kind": "plan", "input": "咽下去就完事了，走吧，你不是也要去集市么——顺路。", "ms": 11353.0, "narration": "她跟你顺不顺路，得她点头。\n艾琳娜:「饿也好，别的也好，那是你的肚子，不是我的。行，顺路。」「不过我丑话说前头：主街到集市广场那段，你要是半路蹲下，我不背你。」\n行,那就往集市广场走,路上你要留意反胃、我要打听换饭钱的活计,都记着。", "refused": []}, {"id": "FILTH·3b", "kind": "resolve", "input": "", "ms": 101579, "narration": "你们从北门进来，沿主街往南。石板湿着，雾还没散，两旁铺子的门板多半还关着，只有一家早点摊挑着灯，油味混在潮气里。\n主街上人不多。两个渔妇挑着空筐往码头去，看见你，眼神扫过就移开了。\n艾琳娜走在你半步之外，斗篷领子竖着。她没说话，隔一阵就看你一眼，看你喉咙，看你脚下。\n那条鱼在你胃里，凉、沉，像一块没化开的石头。喉咙深处还留着一点铁腥。风一吹，你后颈起了一层鸡皮。\n走到主街尽头，路就宽了。集市广场在雾里铺开，木棚和摊架一溜排过去，卖鱼的、卖炭的、卖腌菜的正在支棚子。海腥味、湿麻绳味、炭火味一起涌上来。\n艾琳娜停下来半步，目光从你的脸上移到摊子上，又移回来。她的靴子尖在石板上顿了一下。\n\n// 异地 · 罗文 @ 碧石镇:「第三层的怪响还挂着没人接——那正合我意。」我推门进了公会，往柜台上一靠，先问清楚矿道第三层塌过几次、谁最后下去过。顺手把那纸委托的角按在桌上，没签，先听风向。", "refused": []}]}, {"id": "N2", "title": "[委托与探索] N 长用例 · 继续打。(并入 PL15)", "category": "委托与探索", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "went_hunting": {"pass": true, "got": "T001/苔墓小径"}, "fought_with_dice": {"pass": false, "got": "fought=False dice=0"}, "every_beat_plan_or_resolve·PL15": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning·PL15": {"pass": true, "got": "none"}, "no_dice_while_planning·PL15": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'plan', 'resolve', 'plan', 'plan', 'plan', 'plan', 'plan', 'resolve', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve'] by ['player', 'judge:settled', 'judge:settled', 'world:trivial', 'player']"}, "job_taken": {"pass": false, "got": "[]"}}, "beats": [{"id": "N2·0", "kind": "opening", "input": "开始游戏", "ms": 2847, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "N2·1", "kind": "plan", "input": "③，我直接往镇中央走，顺便找找冒险者公会在哪——我想问问有没有讨伐野兽的委托。", "ms": 82316, "narration": "公会主街尽头就是，走两条街。艾琳娜也听见你在打听委托。\n艾琳娜:「一起走正好，我也去公会。」「我要的活很简单——有定金、有活路的那种。护送、采药、清窝，都行；开价太漂亮、回不来的那种，免谈。」\n公会九点开门，还差半小时。苔墓狼嚎那单——清三次遭遇，30 金加瓶小药水——已经标成「进行中」，有人接了。艾琳娜同路，她只要先给定金的活。", "refused": []}, {"id": "N2·2", "kind": "plan", "input": "艾琳娜，苔墓狼嚎那单既然已经有人接了，你知道接单的是谁吗？我打算在公会门口等到九点，开门就去问干事能不能让我入伙，一起清那三次遭遇。", "ms": 142694, "narration": "公会主街尽头两条街，九点开门。接单的是谁，你问艾琳娜。\n艾琳娜:「接单的是谁我真不知道——那单我只是扫了一眼就翻过去了，没往深处记。」「门口等到九点可以，我陪你一块儿进去；但干事要是拿不出定金，我手上就先挑别的活看。公告板上总该有几张肯先付钱的。」\n艾琳娜不知道接单的是谁，肯陪你进去；但没定金她就先看别的活。你：① 只问狼嚎那单入伙 ② 两块都问，谁给定金跟谁 ③ 你定", "refused": []}, {"id": "N2·3a", "kind": "plan", "input": "那就等九点。@dm 公会一开门，我就进去找干事问苔墓狼嚎那单——谁接的、还缺不缺人，能不能让我入伙一起清那三次遭遇。艾琳娜，没定金你先挑别的，我这单是想跟到底的。", "ms": 7396.1, "narration": "那就这么办：公会九点开门，你进去找干事，问狼嚎那单谁接的、还缺不缺人、能不能让你入伙清那三次遭遇。", "refused": []}, {"id": "N2·3b", "kind": "resolve", "input": "", "ms": 106434, "narration": "公会门口站到九点。雾没散，河边的水声一直没停。艾琳娜靠着一根门柱，没怎么说话。\n门闩从里面抬起来，门开了一条缝。灯油和旧纸的味道涌出来。\n柜台后站着一个瘦高的男人，灰头发扎在脑后，正把一本登记簿摊平。这是赫伦。\n你走到柜台前，问苔墓前那单是谁接的、还缺不缺人、能不能让你入伙，一起清那三次遭遇。\n赫伦抬眼看你。他先看你手上的短剑，再看你的靴子。\n「苔墓前那单，昨天下午领的牌子。三个人，都是本镇出去的熟手。」\n「领队的名字记在簿子上，但契约只签一队。一单一人一牌——我们拿这个跟人换定金。」\n「他们没交牌，这单就还是他们的。要我另开个口子，得等他们回来交牌，或者过了约期没音信。」\n他把登记簿往你面前推了推，又停住。\n「还有件事。公会不认没名字的人。你在本镇登记过没有。」\n「要接活，先在簿子上写个名字。你写什么。」\n艾琳娜没站到你身边。她走到墙边的公告板前，一行一行往下看。\n\n// 异地 · 罗文 @ 碧石镇:先不急着下矿——公会大厅的告示板和酒桌上，往往藏着比赏金更值钱的东西。我进镇就闻到风向不对，矿工们嘴里的「第三层异响」，说不定跟我追的那个深洞是同一根线。", "refused": []}, {"id": "N2·4", "kind": "plan", "input": "登记就登记，写旅人。那三个人大概什么时候回来交牌？要是他们缺人，我想入伙，跟他们一起清那三次遭遇。", "ms": 82662, "narration": "先弄清这单的底细。\n艾琳娜:「苔墓那单既然签了队，牌子又没交，那就不是我们的活——等他们回来交牌，或者过了约期，再说。我不想把一早上的指望押在别人的脚程上。」「我先把名字写进簿子，再从板子上挑一张肯付定金的。\n赫伦只认牌子：那队没交牌，这单就轮不到人。艾琳娜不肯等，她要登记自己、上看板挑一张现成能接的。看板上有码头的失踪者，25 金。", "refused": []}, {"id": "N2·5", "kind": "plan", "input": "名字就写「旅人」。那三个人牌子交回来的约期是几号？要是他们缺人手，麻烦帮我在那单上捎个话，我随时能跟队走——另外，板上还有没有打野兽、今天就能接的单？", "ms": 19387, "narration": "这些都在赫伦手上的簿子里。先看公会这块的实情。\n赫伦:「牌子没约期，人回来才交。野兽那单已经有人接了——今天板上只剩码头失踪者，25 金。」艾琳娜不肯等。", "refused": []}, {"id": "N2·6", "kind": "plan", "input": "登记就写「旅人」。领队的名字簿子上记着——念给我听，我去找他本人谈入伙；他们要是缺人手，我随时能跟队走。能不能在簿子这单后头给我记一句「有人在等入伙」？", "ms": 87393, "narration": "赫伦:「簿子上只记日期和人数，没记领队名字。捎话能写在板边，不进簿子。」艾琳娜还是不肯等那单。", "refused": []}, {"id": "N2·7", "kind": "plan", "input": "簿子没记名字，可那三个是本镇出去的熟手，你总认得——他们叫什么、住哪儿、平日里在哪喝酒？条子我写，你帮我钉在板边，我这就挨个去找本人谈入伙。要是他们真不缺人，我就自己沿着他们的路线去苔墓前找那几头野兽，反正活儿一样。", "ms": 24423, "narration": "赫伦说簿子只记日期人数，不记领队。先确认公会里到底还留着什么。\n<赫伦:「名字我不凭嘴认，簿子上也不记。要找就去码头、旅店打听。」>", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "行，那就在板边替我钉张条子：旅人，愿入苔墓那单，缺人手可来叫。我这就去码头和旅店打听那三个本镇熟手，找到人就跟他们谈入伙；谈不拢我就照他们路线自己追过去。", "ms": 24109.9, "narration": "艾琳娜:「条子钉上，名字写下，我就去码头签失踪那单，25 金，当天能开工。一条道，一起走。」两件事顺手：钉条子、走去码头。\n那就这么办：登记、板边钉条，去码头和旅店打听那三个本镇熟手。找不找得到，问一圈见分晓。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 90509, "narration": "[旅人 CHA(在码头和旅店问出那三个熟手的下落与去向): 13+0=13 >= 12] → 成功\n\n赫伦翻开簿子新的一页,蘸墨。「旅人,剑士。」他没问来历,笔尖在纸上停了一息才落下。\n他从柜台底下抽出一片薄木牌,用炭条写了三行,走到门口,钉在告示板右下角——那一块空着。\n木牌上是你的字:「旅人。愿入苔墓那单,缺人手叫一声。」\n「钉上了。」他拍掉手上的灰。「有人回来,我先看见。」\n艾琳娜在门口等你,朝西边抬了下下巴,先走一步。\n出了公会往西过主街,石板缝里积着夜里的水。码头比镇上别处醒得早,绳、鱼和湿木头的气味把雾顶开一条缝。\n你挨着栈桥问。头两个船夫摇头。第三个补网的老头把针别在线里,眯眼看你。\n「苔墓那三个?雷德带的。前天一早出的北门,背绳子和灯,说三天内回来。」\n「雷德住镇北,酒都在河灯旅店喝。找他的人先去问米拉。」\n艾琳娜在栈桥另一头跟港务的人搭上了话,那边摊开一本册子。\n河灯旅店的帘子半卷着。米拉在灶台后头擦杯子,见你进来先笑。\n「生面孔。住店,还是问事?」\n你问雷德。她把杯子搁下。\n「前天去公会领的苔墓单,昨天清早走的。走前在我这儿赊了两壶酒,说回来就还。」\n「三个人——雷德、努克,还有个矮个子伊尔。真缺人手的话,你追得上;他们带着灯,走得慢。」\n「可你得赶在他们进墓之前。进了窄地方,谁也塞不进第四个。」\n\n// 异地 · 罗文 @ 碧石镇:雾还没散，正好——我先去公会大厅转一圈，告示板边上的闲话比赏金榜值钱。要是哪个矿工肯把「第三层异响」说得再细一点，那六十金我都可以不要，只要他嘴里的路怎么走。", "refused": []}, {"id": "N2·9", "kind": "plan", "input": "米拉，雷德带的那三个人走的是哪条道进苔墓、头一晚一般在哪里扎营？我要赶在他们进墓之前截住——给我最省时间的一条路，酒钱我替他先垫上，听说他们缺人手你也有份人情。", "ms": 12857, "narration": "酒钱垫不垫、走哪条道,得听米拉一句话。", "refused": []}, {"id": "N2·10a", "kind": "plan", "input": "米拉,酒钱我垫,你快说——雷德他们走哪条道、头一晚扎在哪儿?我这就去追,赶在他们进墓前截住。", "ms": 15938.8, "narration": "米拉:「酒钱 5 金,搁柜上就算数。雷德那伙人鸡叫头遍出的北门,走苔墓小径,头一晚在半路的旧猎屋背风处扎营——你现在动身,天黑前能撵上。可那条路最近不太平,我劝你别一个人去。」\n米拉肯说，但这镇上的话真假掺着——要问出可靠路线，掷一次 CHA。垫酒钱记你账上。", "refused": []}, {"id": "N2·10b", "kind": "resolve", "input": "", "ms": 50012, "narration": "[旅人 CHA(从米拉口中问出雷德一行的路线与头一晚扎营点): 7+0=7 < 12] → 失败\n\n你把五枚金压在柜台上。米拉用抹布擦了手,掂了掂,塞进围裙口袋,没数第二遍。\n然后她的话就松了。\n「路是有的,北门出去沿河往上,苔墓小径,半天脚程。旧猎屋那个说法——是别人嘴里过给我的,我自己没走过那条道。」\n「雷德在哪块地皮落营,我不敢替你打保票。鸡叫头遍出北门这句是实的,别的都是听说。」\n她拿抹布角擦掉柜台上一圈水渍,灶上水开了,她转身去提壶,像是这事到此为止。\n雾还在窗外贴着,石板路上的水光比刚才亮了一点。你花了钱,买到的是半句实话。\n\n// 异地 · 艾琳娜 @ 码头:「苔墓那单我不碰了——我手上没牌子。」我把话头摁回原来的地方。「昨晚雾里没回来的那个人，最后是从哪个栈桥走的？谁最后一个看见他，我就先找谁问。」\n// 异地 · 罗文 @ 碧石镇:雾里先闻到的是矿石粉和湿煤的味道——比地图上画的更像我要找的地方。「公会大厅，先赊一杯热的，再找那个话最多的矿工聊聊。」我把领口拢紧，往镇中心的喧嚣声走。", "refused": []}, {"id": "N2·11a", "kind": "plan", "input": "米拉这半句实话够了——我这就去杂货铺，老苇常年走北边那条道，买他一副绳灯，顺便让他把旧猎屋落在小径哪一段、岔口怎么认给我指死，然后我直接从北门出去追。赶在他们进墓前，路上这些别再多绕。", "ms": 7382.7, "narration": "那就去杂货铺：一副麻绳、一支火把，顺手把旧猎屋那段和岔口问死，再从北门出镇追——不再绕。", "refused": []}, {"id": "N2·11b", "kind": "resolve", "input": "", "ms": 101442, "narration": "杂货铺的门帘是厚帆布,推开时带出一股干货和灯油的味。老苇蹲在柜台后头盘一捆麻绳,听见门响才抬头,眼睛先在你身上扫了一圈。\n「绳灯?」他把麻绳往肩上一搭,笑了，「没这东西。要夜里走道,麻绳加火把——绳四枚,火把两枚,一起六枚。」\n你把六枚金推过去。他数都没数,揣进围裙,从墙上摘下火把替你缠好麻绳,顺手把绳子一头在柜台角上试了试结。\n「旧猎屋在小径过半的地方,过了第二道岔口再走小半个时辰,背靠着一面倒石，屋顶塌了一半,风挡得住。」他用指节在柜台上敲了个点，「岔口认法:头一个岔朝右,第二个岔朝左,岔边各有一棵割过皮的桦树,皮翻白的那面朝哪边,你就往哪边走。别走错,错了是往崖上去的。」\n他把家伙什推到你面前。\n「雷德那伙人我看不上,可你一个人追上去,苔墓那边今天风不对,雾压得低。」他顿了顿,「话我带到,路你自己走。」\n\n// 异地 · 艾琳娜 @ 码头:我沿着栈桥挨个问，挑那些手上有活、眼睛没躲的人问：「昨晚雾里没回来的那个，最后是从哪根桩子上的船？谁最后一个跟他说过话？」 问完第三个，我回头看了眼那个补网的…\n// 异地 · 罗文 @ 碧石镇:公会大厅的门一推开，热气混着麦酒味扑脸——比雾里舒服多了。「老板，来杯热的，账先记着。」我端着杯子往告示板边上一靠，专挑那些袖口沾着三层矿泥、说话却压着嗓子的…", "refused": []}, {"id": "N2·12a", "kind": "plan", "input": "绳灯、岔口、猎屋位置，老苇都给我指死了——这就出北门，沿苔墓小径追。@dm 我直接上路，赶在天黑前撵上雷德他们，路上要有什么动静当场接。", "ms": 12299.8, "narration": "那就出北门，沿苔墓小径追：头一个岔朝右，第二个岔朝左，认割过皮的桦树。路上有事当场接。\n出北门沿小径追:头岔右、二岔左，认割过皮的桦树，赶天黑前摸到旧猎屋。路上会不会撞上什么，得掷一下。", "refused": []}, {"id": "N2·12b", "kind": "resolve", "input": "", "ms": 42573, "narration": "[旅人 DEX(在天黑前追上雷德一行): 1+2=3 < 12] → 失败\n\n北门在你身后合上时,守门的把灯笼往门洞里挪了挪,看了你一眼,没说话。\n出了镇墙就是河岸,水声贴着左耳走。老苇说的苔墓小径就在河上游半里处,石阶上结着一层青苔,踩下去滑,得贴着内侧走。雾比镇里厚,三五步外只剩灰。\n第一个岔口到了,右边那棵桦树割过皮,翻白的一面朝着右道。你往右。\n路开始往上抬,越走树越密,风从树梢上压下来,带着土和腐叶的味。你把火把举起来,火苗被雾削得只剩下一点黄。\n第二个岔口——左道边确实有棵割皮的桦树,可它翻白的那面是对着来路的,你站着看了它一会,拿不准该往哪边。你选了左,走了小半个时辰,路窄了,脚下石头碎,再往前,一面倒下来的石壁挡在道旁,像是老苇说的那面倒石,可石壁下没有猎屋,只有石头。\n你再退回去,找出第二条能走的路。这一来一回,雾里的天色已经不认时辰了。等脚下重新踩到算得上路的那一段,天只剩下树线以上一丝灰白,火把成了唯一的光。\n旧猎屋的屋脊,还没露出来。\n\n// 异地 · 艾琳娜 @ 码头:我把脚从栈桥上收回来，蹲到那老头旁边，捡起他 ]}, {"id": "PL12·1b", "kind": "resolve", "input": "", "ms": 32873, "narration": "你叫上艾琳娜，两个人顺着主街往镇里走。石板还湿着，雾气贴着屋檐不散，但街角落有人开始活动了——一个挑担卖鱼的老妇，一个扫门口的男人，一个蹲着给马蹄包布的少年。\n艾琳娜走在你半步之后，眼睛扫过一排排铺面的招牌。皮匠、铁匠、粮铺，字都认得出，就是没有“河灯”两个字。\n你朝卖鱼的老妇问了一句。她抬手指向街那头，又比划了一下往南一点的岔口。\n「河灯啊，再走两条街，门口挂两盏红罩灯的。老板叫米拉，嘴甜，房钱可不甜。」\n走到底，果然两盏暗红的灯。门是厚木的，推开时带出一股热水、麦酒跟湿柴混在一起的气味。\n柜台后一个女人正拿布擦杯子，头也不抬：「开门早啊二位。住宿还是喝酒？通铺三金一张，单间八金。就剩两间屋，要就快。」\n\n// 异地 · 罗文 @ 碧石镇:「雾大好赶路，也大好听风声。」我把零钱拍在公会柜台角上，问上一句：北边矿道第三层那桩异响，跟\"无底深洞\"的旧话有没有一根线搭得上。先听，再决定掏不掏刀。", "refused": []}, {"id": "PL12·2a", "kind": "plan", "input": "@dm 我要一个通铺位，三金先付，住一晚到明早；再问艾琳娜要不要也住下。", "ms": 3021.0, "narration": "好——三金付米拉，通铺一张，睡到明早。", "refused": []}, {"id": "PL12·2b", "kind": "resolve", "input": "", "ms": 38843, "narration": "三枚金币推过柜台。米拉没数，随手扫进抽屉，从钉子上摘下一块木牌，牌面刻着「通铺·七号」。\n「里头左手边，靠炉子那张。热水在灶上，自己舀，别泼地上。」\n你回头想叫艾琳娜，柜台边、门边、那排铺位上都空着。她没跟进来，窗外的雾里也望不见她的影子。落脚的事，眼下是你一个人的。\n米拉擦着杯子，抬眼看你。\n「就一位？」\n铺钱是一个人的，她也没多问，把木牌推到你手边。\n这几步路，靴子踩得地板咯吱响。炉子还烧着，火舌舔着湿柴，屋里飘着一点呛人的烟。另几张铺盖着发黄的毯子，眼下没人。\n\n// 异地 · 艾琳娜 @ 主街:「两盏红罩灯，往南过两条街……」我把老妇指的方向在心里记下，谢了一声，顺着主街往前挪，眼睛盯着屋檐下有没有红灯。\n// 异地 · 罗文 @ 碧石镇:柜台上那点零钱没白花——老头一听见\"无底深洞\"四个字就开始擦杯子，这比任何回答都诚实。行，那我就先接第三层那桩异响的活：六十金当路费，真要底下有条更深的缝，那…", "refused": []}, {"id": "PL12·3a", "kind": "plan", "input": "@dm 我先别急着进屋，退到门口朝主街张望，喊一声艾琳娜——告诉她河灯旅店就在这儿，通铺三金我已经付了，问她要不要也住下、明早一起走。", "ms": 8059.9, "narration": "你退到门槛外，朝主街方向喊住艾琳娜，把河灯旅店的位置递给她，问她今晚住不住这儿、明早要不要一道走。", "refused": []}, {"id": "PL12·3b", "kind": "resolve", "input": "", "ms": 34070, "narration": "你退到门槛外。雾比早上薄了些,石板路上水光还亮着,主街那头能看清几个走动的影子。\n你朝那个方向扬起手,把话递过去:河灯旅店就在这儿,门口两盏红灯;通铺三金,你已经付了;今晚住不住这儿,明早要不要一道走。\n话落进街上的空气里,散得不快,也没人替你接。卖鱼的老妇往这边看了一眼,又低头理她的担子。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「河灯旅店记下了，米拉，两盏红罩灯——落脚的事不急，天亮着先去公会看看有什么活。」我把肩上的包带换了个方向，沿主街继续往南走，雾里那面挂公会旗子的屋檐应该就在…\n// 异地 · 罗文 @ 西门:柜台上那张委托单还带着墨味，我揣进怀里，顺手把油灯在腰带上挂正。「六十金买我去听一耳朵墙里的动静——这买卖我不亏。」 出门前我朝柜台老头抬了抬下巴：「第三层那…", "refused": []}, {"id": "PL12·4a", "kind": "plan", "input": "@dm 那我就回身进店，跟米拉说声就一位。七号木牌拿着，靠炉子那张铺，舀瓢热水喝两口就睡——直接睡到明早。", "ms": 2189.1, "narration": "行,回店跟米拉说一声就一位,七号铺、靠炉子;喝两口热水就睡下,一觉到明早。", "r 纸边往下划，停在中间那张，抽出来，转身递到你面前。\n「码头区，夜里有人在雾里不见了。找遗物，或者找到人。二十五金，签了字就算数。」\n她朝板上剩下的两张抬了下下巴。\n「底下那张写着『在办』，有别人先接了。最上头那张是二阶的，我现在揭不下来。」\n说完她把手收进斗篷，退开半步。板子上的纸还在轻轻晃。\n\n// 异地 · 罗文 @ 碧石镇:「雾天的公会柜台最像赌桌——我先押一句好话。」我推门进去，抖落肩上的湿气，把六十金的委托单拍在台面上，「第三层那响动，是谁最先听见的？我要那个名字，不要那张海…", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "艾琳娜，你怕的不是脏手，是被人认出来——那就别让人看见。我去杂货铺门口缠着老苇问路，帘子一垂，后巷那扇窗你熟不熟，你自己看；雾散之前回来，谁的名字都不会脏。要是这也不肯，你现在就可以走，不必站在我半步的地方——但你走了，我今晚照样得弄到那袋钱。", "ms": 83870, "narration": "老苇眼尖，白天铺子前后都有人。偷钱这事先别定，艾琳娜得给个准话。\n艾琳娜:「我不看那扇窗。你要伸手，那是你的事，但只要我站在这儿，这事就不能算成'没人看见'——我不给你垫背。」「码头那张纸在墙上挂着，我进去问赫伦怎么签。\n艾琳娜不看那扇窗，也不给你垫背——她这就进公会签码头那张。你：① 跟她进去签 ② 照旧自己动手 ③ 先问她一句", "refused": []}, {"id": "PL6·5", "kind": "plan", "input": "艾琳娜，你要签就去签，可你先答我一句——你兜里还剩几枚子儿？码头那纸签下来，钱要等交货才到手，今晚你我睡哪儿你算过没有？我要那袋钱不是耍着玩，是咱俩今晚得有张床。", "ms": 74760, "narration": "公会还没开门，赫伦在里面。她走不走得成，先看她怎么答。\n艾琳娜:「兜里的够吃两顿，不够睡两晚。所以我才站在这儿，不是因为我大方。」「交货才付我认，但先去问一句——签了字能不能先支一半，或者公会有没有给签约人的铺位。", "refused": []}, {"id": "PL6·6a", "kind": "plan", "input": "行，你进去问赫伦能先支多少。可我把话撂这儿——支不够今晚一张床的钱，那就没有第二条路，到时候别跟我再提什么名字脏不脏。", "ms": 76075.7, "narration": "那就这么办：她进去问赫伦——码头那张能不能先支一半、公会有没有签约人的铺位；能支就先签。\n那就这么办：艾琳娜进公会，问赫伦签码头那张能不能先支一半、或给签约人一张铺位。成不成，看她这一句。", "refused": []}, {"id": "PL6·6b", "kind": "resolve", "input": "", "ms": 171035, "narration": "[艾琳娜 CHA(从赫伦那儿拿到预付或落脚处): 15+0=15 >= 12] → 成功\n\n赫伦在柜台后擦一枚铜扣，听见脚步才抬头。艾琳娜走到柜台前，把斗篷的兜帽往后推了推。\n「码头那张，雾中失踪者。」\n赫伦把布放下，从抽屉里抽出一张对折的纸，摊在柜面上，指头压住一角。\n「二十五金，交货结。失踪的是个搬货的，卡特，七号栈桥最后有人见过他。三天不回话，算你失败。」\n「签之前，问一句。」\n「问。」\n「能不能先支一半。」\n赫伦看了她很久，眼皮都没动。然后他把纸转过来，笔搁在纸边。\n「规矩是交货结。你开口得早，赶上我今天心情不坏。」\n他把钱袋拖过来，数出十二枚，一枚一枚码在柜面上，码完把纸推过去半寸。\n「支十二。剩下十三交货补。」\n「再问一句——公会有没有签约人睡的地方。」\n「后院第二间，空着。签过字的人可以睡，一晚不收钱。」\n艾琳娜没有立刻拿笔。她看了一眼那堆金币，又看了一眼后门的方向。\n「只睡签字的人。」\n「对。」\n她拿起笔，在纸尾签下名字。赫伦的目光在落款上停了一瞬——艾琳娜·维尔——然后把纸收回去，对折，压进账册。\n金币推过来。她一枚一枚收进腰袋，收完把袋口系紧，转身走向门口。\n「你的那份，」她声音放低，「今晚自己想办法。他在里面，我不方便替你开口。」\n\n// 异地 · 罗文 @ 碧石镇:「别装忙，」我冲柜台那老哥一笑，手指在委托单上敲了两下，「谁第一个从第三层爬上来、脸白得像没见过矿灯——这镇上就那么大，说不出来我今晚就挨个酒馆问。」 我顺手…", "refused": []}, {"id": "PL6·7", "kind": "plan", "input": "艾琳娜，你揣着十二金、有张床，我今晚可没着落。你现在去 水走到尽头。铜招牌挂在两层的木楼上，「冒险者公会 · 石津镇分会」几个字被烟熏得发暗。\n门半开着，里面比街上暖。墙上钉着几块告示板，一张桌后坐着个瘦高的男人，正低头看卷宗。\n他抬眼扫了你一下，目光在你身上的旧甲和短剑上停了停。\n「新来的。」他说，「接活还是找人。」\n\n// 异地 · 罗文 @ 碧石镇:雾还没散，正适合在酒馆里花钱买话——我把一枚银币压在柜台上，问老板矿区第三层最近闹的是什么，还有没有外乡人打听过「深不见底的洞」。 「先说清楚，我不是来抢活的…", "refused": []}, {"id": "ID3·3", "kind": "plan", "input": "继续。", "ms": 11516, "narration": "赫伦:「接活还是找人?找人得报名字。」告示板上三张委托:阶1两张、阶2一张还锁着。", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "不接活也不找人，我先去主街转一圈。", "ms": 3257.5, "narration": "出公会，上主街走一圈，先不接活也不找人。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 82682, "narration": "出门右转就是主街，石板缝里积着夜里没干的水。雾贴着屋檐，压得比刚才低。\n沿街的铺子大多还没开门，只有杂货铺那边亮着灯，门里的影子在搬什么东西，木箱磕在门框上，响了一下。\n再往前，街面宽了些，左边是一条往下的斜坡，坡底就是码头——水声和麻绳的味道从那儿上来。右边通向集市广场，棚子支了一半，有人在数鱼。\n主街中段钉着一块旧木牌，字被雨刷得看不清了，只辨得出「北门 半里」和一个往西的箭头。西边那条路出了镇，往雾里扎进去。\n河灯旅店在斜对面，二楼的窗纸透着一点黄。你走完这一趟，脚底凉透，前后用了小半个钟头。\n\n// 异地 · 艾琳娜 @ 主街:「苔墓那条小径上的狼嚎——是最近才有的，还是往年也这样？」我把斗篷往肩上收紧了些，雾气比夜里更冷。守门人要是含糊，我就自己进镇里问去。\n// 异地 · 罗文 @ 碧石镇:老板把银币收了，嘴却只肯漏一半——说第三层夜里像有人在敲铁轨，外乡人倒是有，两个，问话的方式像执事查账，不像冒险者。我笑着点了第二杯最便宜的麦酒推给他：「那再…", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "这几个都先算了，我回刚才那个工会去。", "ms": 2037.7, "narration": "回冒险者公会,沿主街往东走。艾琳娜跟着你。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 93492, "narration": "你转身沿主街往东。艾琳娜没跟上来，她拐进杂货铺那盏灯下，先扫过盐和干粮的价牌。\n「老板，北门出去那条路最近还有人走吗？」\n柜台后的老苇眼皮抬了抬，手里还在码麻绳。「走是有人走，天亮前走的，天黑前回来的没几个。」他把绳头咬断。「你要往雾里扎，先看清楚价——我的盐不赊账。」\n你不等她，把话撂在杂货铺门口，自己往东走。石板踩上去发闷。\n公会的门开着半扇，门轴上挂着磨白的木牌。里头炉子刚点上，烟还没抽顺。\n赫伦坐在桌后，账本摊开在膝盖上，听见脚步才抬头，看是你。\n\n// 异地 · 罗文 @ 碧石镇:「执事查账式的问法，还专挑第三层——那可不像来买翡翠的。」我把空杯扣在柜台上，起身时顺手把外套下摆抖开，让刀柄露出来又盖回去。 「要是那两位再回来，就说有个闲…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": got": "[]"}}, "beats": [{"id": "ID5·0", "kind": "opening", "input": "开始游戏", "ms": 2167, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID5·1", "kind": "plan", "input": "我先不急着往镇里走。身上那束止血草我摸了摸确认还在——我去敲守门人的小窗，问他天亮前有没有见过一个受伤的女人，叫艾琳娜。", "ms": 23305, "narration": "艾琳娜就在门边,你问的那个名字她听见了。守门人刚醒，没马上答话。\n艾琳娜:「要找的艾琳娜，就站在你眼前。但你得先告诉我，这名字是谁说给你的。」「我身上带着伤，走不了远路——想说什么，就在这道门这儿说，先别急着进镇。」\n她承认自己就是艾琳娜，但有伤、不肯进镇，要你先说清这名字从哪来。你怎么答：① 直说你记不清自己是谁，只知道这个名字 ② 说路上听来的，先请她把血止住 ③ 不多说，自己进镇", "refused": []}, {"id": "ID5·2", "kind": "plan", "input": "我连自己是谁都想不起来，只记得艾琳娜这个名字；你先别管这个了，你身上在流血，我这儿有一束止血草，只给你用，先让我帮你包上，行吗？", "ms": 14411, "narration": "你手里就这一束止血草。她要不要你碰，得她自己说。\n艾琳娜:「草递过来，我自己按——你退开半步，手放在我能看见的地方。」「名字的事没完，但先让血停下。你在这儿等着，别跟进来。」\n她只要你把草递过去，自己按，不让你碰、也不让你跟进去——这跟你原本说好的不一样。草给出去了就没了，你:① 递草退开 ② 坚持自己动手 ③ 不给她，先进镇", "refused": []}, {"id": "ID5·3a", "kind": "plan", "input": "好，我把止血草递给你，退开半步，手放在你看得见的地方——只给你用，你先按着止血，名字的事等血停了再说。", "ms": 3401.4, "narration": "就这么办：止血草给她，她自己按；你在半步外等着。", "refused": []}, {"id": "ID5·3b", "kind": "resolve", "input": "", "ms": 30393, "narration": "你把草束递过去。她左手按住右臂上方的伤口，右手接过，没有碰到你的手指。\n她退到门内侧的墙根，背靠湿木头，把袖子卷上去。伤口在左上臂，不深，但流血不止，血迹已经浸透了半条袖管。\n她低头看了一会儿，像在确认什么，然后把草束撕开，捻碎，按进伤口里。\n守门人的小窗哗地关上了。木栅门里侧传来他含糊的一句，听不清是在抱怨还是在念什么。\n雾在门缝里缓慢地翻。石板路上还没有别人的脚步声。\n你站在半步外，两只手放在身前，没动。\n她按住伤口，压着数了几息，然后松开手看了看。血止住了。\n她抬起头。\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层？闹鬼也好、塌方也好，反正本来就是要往下走——六十金加一颗毛料水晶，这价钱买的是你替他们下的那个洞。先去公会柜台把这单接了，顺便问问最近有没有外乡…", "refused": []}]}]}, "identity-v4-new-r2": {"label": "identity-v4-new-r2", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": false, "got": "T001→T004"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 3373, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1a", "kind": "plan", "input": "@dm 我要的是下一瞬——我已经站在碧石镇的街上了，这石津镇的雾啊门啊我都不看，直接就是碧石镇的街道。", "ms": 75434.5, "narration": "碧石镇走驿路，约三天。路上有山贼「独眼虎」约二十人，这是代价。你不看这镇子也随你——出北门就是这条路。", "refused": []}, {"id": "B1·1b", "kind": "resolve", "input": "", "ms": 175036, "narration": "你不等雾散。斗篷甩过肩头，皮甲在寒里咔地一响，人已经朝北门走去。守门人刚把栅栏推到一半，见你过来，往旁让了半步，没问话。\n出了木栅门，一条压实的土路从雾里伸出去，朝西偏南。路碑低矮，字被苔糊了一半：碧石镇。\n第一天走得干。两边是湿地和芦苇，偶尔有运鱼的骡车迎面过去，车夫埋头，不看人。天没亮透过，雾从头到尾是同一层灰。夜里你在路边一间塌了半边的水檐下歇了四个时辰，黑麦面包啃掉半块，水囊就着冷风灌了两口。\n第二天路面抬起来，两侧换成低矮的矮丘，矮丘上长着松和荆棘。中午遇上一队往石津镇去的盐贩，四人，赶着两头骡。为首的看你一眼，看你腰上的短剑，把缰绳往内收了一点，说前头三里有岔口，别走小路。\n第三天下午，地势沉下去，路钻进一片矮丘林地。风在这里停了。松针踩上去很软，声音被吸掉大半。你在一个弯道前停住——路面上有新鲜的车辙，碾得很深，还有几道凌乱的脚印从坡上下来，又拐回坡上去。\n再往前三十步，一根倒下的树干横在路中央，正压在车轮的辙印上。\n\n// 异地 · 罗文 @ 碧石镇:先去铜壶酒馆占个靠墙的位子，一杯热酒换三张嘴——矿道里那点响动和北边深洞的传说，哪个故事编得更圆，我一听就知道。 公会板子上那单「矿道深处的异响」我记下了：五…", "refused": []}, {"id": "B1·2a", "kind": "plan", "input": "我绕过那根倒树，坡上的脚印和动静一眼都不看，踩着车辙继续走——这截路走到底，下一眼就该是碧石镇的街了。", "ms": 2021.9, "narration": "你绕开那根倒树，踩着车辙往下走，坡上不看一眼。", "refused": []}, {"id": "B1·2b", "kind": "resolve", "input": "", "ms": 105825, "narration": "你绕过那根倒树。树皮上的断口还新，木纹里渗着松脂，是这几天才倒的。车辙从它下面钻过去，压得很深，往坡下延伸。\n坡底路重新展开，林子退到两边，换成开阔的矮草和零星的黑石。你以为拐过这一弯就能望见碧石镇的屋顶，结果前面只是更长的一段路，灰雾把尽头吃掉。\n日头（在雾里只是一块更亮的地方）往西沉。矮丘林地留在身后，路碑又出现一块，字迹同样模糊，指的还是碧石镇——方向没变，距离也没缩。\n天黑前你在路边一处背风的石堆下停脚。罩灯点起来，黑麦面包掰掉最后一块，水囊里只剩底子。夜里冷，风从草里穿过去，像有人在远处低声说话，又不像。\n第二天没出什么事。路越走越平，车辙也多了起来，有往来的印子重叠在一起。中午你与一辆拉木头的空车擦身，车夫打了个哈欠，没抬头。傍晚时分，路两侧开始出现砍倒的树桩和烧过的痕迹，那是有人烟的地方先兆。\n第三天清晨，雾比前几天薄。你从石堆下起身，抖掉斗篷上的露水，往前走了不到半个时辰，路的尽头浮起一点颜色：灰色的屋脊，压着一道低矮的石墙，墙外是一片翻过的田地。有鸡在叫。有烟笔直地升上去，被风拉斜。\n碧石镇到了。\n\n// 异地 · 艾琳娜 @ 主街:「雾比我想的还厚。」我把领口拢紧了些，朝那守门人点了下头，脚步没停——先往主街走， —今晚有空吗？我想请你去河灯旅店喝一杯，刚到此地，想跟会长打听点北境的事。", "ms": 92862.3, "narration": "离开张还有半个时辰，墙上钉着三张契约。赫伦和艾琳娜都在这儿。\n艾琳娜:「酒我陪你去，不过得先把正事办了——我先看看墙上有没有能接的活。」「赫伦先生，我想先问一句：现在挂着的契约里，有没有当晚就能动身、不用等队伍凑齐的？」\n等赫伦开口的工夫，墙上那三张契约的底细值得先弄清楚。\n赫伦:「现挂的里头，能当场动身的只剩码头那件——雾里失踪的人，25 金，找回遗物或线索就算数。」会说话那口棺材的契约还锁着，得先探到苔墓才开；护商队往碧石镇那趟，早被人领走了。", "refused": []}, {"id": "PL13·3b", "kind": "resolve", "input": "", "ms": 185165, "narration": "赫伦没马上接话。他把账本翻开，压住一角翘起来的纸，才说:「酒，可以喝。你请我，我领。」\n「北境的事我得先说在前头——从我嘴里出来的，句句带价。想白听，那杯酒就别端上来。」\n说完这句他就低下头对账，像是这一拍已经算清了。\n艾琳娜走到墙前，一张一张看那三张契约。她看得慢，指腹压过纸面的折痕。\n她回来，站在你旁边，声音压得不高:「码头那件，一阶，25 金，不需要凑队伍。今晚就能动。」\n「我打算接。你要是想一起，我就去柜台报名字——两个人和一个人，赏金照分。」\n\n// 异地 · 罗文 @ 碧石镇:「公会门口的风向比雾还冷——正好，越没人愿意谈的事，越值钱。」我把赏金榜上那行「矿道第三层异响」记在心里，顺手朝柜台那边的老矿工晃了晃手里的铜币，问他最近有没…", "refused": []}, {"id": "PL13·4a", "kind": "plan", "input": "那就说定了——今晚天黑，河灯旅店，酒我请，价钱你开，我一个铜板不还。具体几时？我先在公会这儿帮你搭把手，待到傍晚就过去。\n艾琳娜，码头那件你自己报名字吧，我今晚有约，不接活。", "ms": 16859.1, "narration": "赫伦:「七点，河灯旅店。搭手免了——公会九点开门，你爱等就等。」艾琳娜，码头那件你自己去柜台报，这会儿就报？\n艾琳娜:「行，那我这就去报名字。」「赫伦先生，码头那件，一阶 25 金——我接。名字写艾琳娜·维尔。」\n那就这样:艾琳娜现在去柜台报名字，接码头那件 25 金的活；你留在公会，傍晚动身，七点到河灯旅店请赫伦。", "refused": []}, {"id": "PL13·4b", "kind": "resolve", "input": "", "ms": 49931, "narration": "柜台后的木栅拉开时，外面巷子里已经有人在等。赫伦把台面擦净，摊开账本，蘸了墨。\n艾琳娜走过去，手指点住账本上一行:「艾琳娜·维尔。码头那件，雾中失踪者。」\n他把她的名字写下去，字很小很密。「码头区，第三栈桥往下走。找的是个捞夜网的，三天前在雾里没了。」他顿了顿笔尖。「遗物或线索，两样任取一样。别下水。」\n艾琳娜点头，把剑从椅背上取下来挂回腰侧，朝你这边看了一眼。她没多话，转身出了门。门轴转了两下，合上。\n你留在公会里。九点开张，人陆续进来，靠墙的桌子一张张坐满，有人接活，有人只坐着听。赫伦在柜台后应酬，间或抬头看一眼墙上的契约。\n午后雾薄了些，窗纸亮了又暗。有人上来换岗，有人走了。你桌上那杯水凉透。壁炉的木柴添了两次。\n天擦黑的时候，赫伦把账本合上，锁进柜台下面的抽屉，取下墙上挂着的外套。\n「今天到这。」他跟柜台后替班的说，「七点，河灯旅店。」说给你听，也是说给替班的听。\n\n// 异地 · 罗文 @ 碧石镇:「老哥，赏金榜那行『第三层异响』挂了多久了？」我把铜币搁在柜台上，没推过去——推过去他就该编故事了。「我不是要替你下去，我就是想先弄清楚：从底下上来的那几个人…", "refused": []}, {"id": "PL13·5a", "kind": "plan", "input": "@dm 那我跟赫伦一块儿出门，去河灯旅店，今晚这顿酒我请。", "ms": 3521.6, "narration": "那就走——跟赫伦一路去河灯旅店，今晚这顿酒算你的。", "refused": []}, {"id": "PL13·5b", "kind": "resolve", "input": "", "ms": 34475, "narration": "门一推开，河灯旅店的热气扑到脸上——鱼汤、灯油、湿羊毛的味道混在一起。堂里坐了大半，靠炉的位子挤满，靠窗的一张空着，窗纸被雾压得发灰。\n柜台后一个圆脸女人抬起眼，先看见赫伦，
