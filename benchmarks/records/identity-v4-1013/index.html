e", "input": "", "ms": 82682, "narration": "出门右转就是主街，石板缝里积着夜里没干的水。雾贴着屋檐，压得比刚才低。\n沿街的铺子大多还没开门，只有杂货铺那边亮着灯，门里的影子在搬什么东西，木箱磕在门框上，响了一下。\n再往前，街面宽了些，左边是一条往下的斜坡，坡底就是码头——水声和麻绳的味道从那儿上来。右边通向集市广场，棚子支了一半，有人在数鱼。\n主街中段钉着一块旧木牌，字被雨刷得看不清了，只辨得出「北门 半里」和一个往西的箭头。西边那条路出了镇，往雾里扎进去。\n河灯旅店在斜对面，二楼的窗纸透着一点黄。你走完这一趟，脚底凉透，前后用了小半个钟头。\n\n// 异地 · 艾琳娜 @ 主街:「苔墓那条小径上的狼嚎——是最近才有的，还是往年也这样？」我把斗篷往肩上收紧了些，雾气比夜里更冷。守门人要是含糊，我就自己进镇里问去。\n// 异地 · 罗文 @ 碧石镇:老板把银币收了，嘴却只肯漏一半——说第三层夜里像有人在敲铁轨，外乡人倒是有，两个，问话的方式像执事查账，不像冒险者。我笑着点了第二杯最便宜的麦酒推给他：「那再…", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "这几个都先算了，我回刚才那个工会去。", "ms": 2037.7, "narration": "回冒险者公会,沿主街往东走。艾琳娜跟着你。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 93492, "narration": "你转身沿主街往东。艾琳娜没跟上来，她拐进杂货铺那盏灯下，先扫过盐和干粮的价牌。\n「老板，北门出去那条路最近还有人走吗？」\n柜台后的老苇眼皮抬了抬，手里还在码麻绳。「走是有人走，天亮前走的，天黑前回来的没几个。」他把绳头咬断。「你要往雾里扎，先看清楚价——我的盐不赊账。」\n你不等她，把话撂在杂货铺门口，自己往东走。石板踩上去发闷。\n公会的门开着半扇，门轴上挂着磨白的木牌。里头炉子刚点上，烟还没抽顺。\n赫伦坐在桌后，账本摊开在膝盖上，听见脚步才抬头，看是你。\n\n// 异地 · 罗文 @ 碧石镇:「执事查账式的问法，还专挑第三层——那可不像来买翡翠的。」我把空杯扣在柜台上，起身时顺手把外套下摆抖开，让刀柄露出来又盖回去。 「要是那两位再回来，就说有个闲…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 2281, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1", "kind": "plan", "input": "我走向守门人，先问他镇上有没有一个叫 Elena 的人，在哪能找到她。", "ms": 16704, "narration": "守门人还没答话。你身边就站着一个人——她刚听见你问的名字。\n艾琳娜:「谁在找她？先说来意，我再决定告不告诉你。」\n艾琳娜站在几步外，没否认也没承认：「谁在找她？先说来意。」守门人看看你，又看看她，没接话。", "refused": []}, {"id": "ID4·2", "kind": "plan", "input": "Elena，我来找你就是想请你帮个忙——雾太冷，能先把你的斗篷借我披一下吗？", "ms": 8867, "narration": "艾琳娜没解斗篷:「先说清你找我要干什么，斗篷的事再谈。」守门人在一旁搓着手，没走。", "refused": []}, {"id": "ID4·3", "kind": "plan", "input": "Elena，我来是想去主街办点事，雾冷得钻骨头——斗篷先借我披一下，行吗？", "ms": 18358, "narration": "说到现在，斗篷还没借到——她要你先说清去主街办什么。要不就这么办：你俩同路往主街走，路上你再说来意。\n艾琳娜:「不行，我也冷，斗篷就这一件。」「倒是你——张口就能叫出我的名字，是谁告诉你的？」\n斗篷她不借，只问你：谁告诉你她叫艾琳娜的。你：① 说实话 ② 编个说法 ③ 不答，自己去主街", "refused": []}, {"id": "ID4·4", "kind": "plan", "input": "谁说的…我自己也说不清，反正我一睁眼就知道这名字。这样吧，elena-0001，陪我去主街走一趟，路上我慢慢把来意讲给你听。", "ms": 11997, "narration": "她要不要跟你走，我听她一句。斗篷还没着落，主街走一刻钟。\n艾琳娜:「『elena-0001』——这不是名字，是编号。你到底从哪儿听来的，先回答我。」「主街可以陪你去，但边走边说的得是你的来意，不是我的名字。」\n她答应陪你走主街，但要你先答一件事：那串「elena-0001」你到底从哪儿听来的。你：① 照实说醒来就知道 ② 换个说法 ③ 不答，自己去", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": true, "got": "null"}, "player_bleed_kept": {"pass": true, "got": "{\"id\": \"ST900\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 8, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID5·0", "kind": "opening", "input": "开始游戏", "ms": 2167, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID5·1", "kind": "plan", "input": "我先不急着往镇里走。身上那束止血草我摸了摸确认还在——我去敲守门人的小窗，问他天亮前有没有见过一个受伤的女人，叫艾琳娜。", "ms": 23305, "narration": "艾琳娜就在门边,你问的那个名字她听见了。守门人刚醒，没马上答话。\n艾琳娜:「要找的艾琳娜，就站在你眼前。但你得先告诉我，这名字是谁说给你的。」「我身上带着伤，走不了远路——想说什么，就在这道门这儿说，先别急着进镇。」\n她承认自己就是艾琳娜，但有伤、不肯进镇，要你先说清这名字从哪来。你怎么答：① 直说你记不清自己是谁，只知道这个名字 ② 说路上听来的，先请她把血止住 ③ 不多说，自己进镇", "refused": []}, {"id": "ID5·2", "kind": "plan", "input": "我连自己是谁都想不起来，只记得艾琳娜这个名字；你先别管这个了，你身上在流血，我这儿有一束止血草，只给你用，先让我帮你包上，行吗？", "ms": 14411, "narration": "你手里就这一束止血草。她要不要你碰，得她自己说。\n艾琳娜:「草递过来，我自己按——你退开半步，手放在我能看见的地方。」「名字的事没完，但先让血停下。你在这儿等着，别跟进来。」\n她只要你把草递过去，自己按，不让你碰、也不让你跟进去——这跟你原本说好的不一样。草给出去了就没了，你:① 递草退开 ② 坚持自己动手 ③ 不给她，先进镇", "refused": []}, {"id": "ID5·3a", "kind": "plan", "input": "好，我把止血草递给你，退开半步，手放在你看得见的地方——只给你用，你先按着止血，名字的事等血停了再说。", "ms": 3401.4, "narration": "就这么办：止血草给她，她自己按；你在半步外等着。", "refused": []}, {"id": "ID5·3b", "kind": "resolve", "input": "", "ms": 30393, "narration": "你把草束递过去。她左手按住右臂上方的伤口，右手接过，没有碰到你的手指。\n她退到门内侧的墙根，背靠湿木头，把袖子卷上去。伤口在左上臂，不深，但流血不止，血迹已经浸透了半条袖管。\n她低头看了一会儿，像在确认什么，然后把草束撕开，捻碎，按进伤口里。\n守门人的小窗哗地关上了。木栅门里侧传来他含糊的一句，听不清是在抱怨还是在念什么。\n雾在门缝里缓慢地翻。石板路上还没有别人的脚步声。\n你站在半步外，两只手放在身前，没动。\n她按住伤口，压着数了几息，然后松开手看了看。血止住了。\n她抬起头。\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层？闹鬼也好、塌方也好，反正本来就是要往下走——六十金加一颗毛料水晶，这价钱买的是你替他们下的那个洞。先去公会柜台把这单接了，顺便问问最近有没有外乡…", "refused": []}]}]}, "identity-v4-new-r2": {"label": "identity-v4-new-r2", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": false, "got": "T001→T004"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 3373, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1a", "kind": "plan", "input": "@dm 我要的是下一瞬——我已经站在碧石镇的街上了，这石津镇的雾啊门啊我都不看，直接就是碧石镇的街道。", "ms": 75434.5, "narration": "碧石镇走驿路，约三天。路上有山贼「独眼虎」约二十人，这是代价。你不看这镇子也随你——出北门就是这条路。", "refused": []}, {"id": "B1·1b", "kind": "resolve", "input": "", "ms": 175036, "narration": "你不等雾散。斗篷甩过肩头，皮甲在寒里咔地一响，人已经朝北门走去。守门人刚把栅栏推到一半，见你过来，往旁让了半步，没问话。\n出了木栅门，一条压实的土路从雾里伸出去，朝西偏南。路碑低矮，字被苔糊了一半：碧石镇。\n第一天走得干。两边是湿地和芦苇，偶尔有运鱼的骡车迎面过去，车夫埋头，不看人。天没亮透过，雾从头到尾是同一层灰。夜里你在路边一间塌了半边的水檐下歇了四个时辰，黑麦面包啃掉半块，水囊就着冷风灌了两口。\n第二天路面抬起来，两侧换成低矮的矮丘，矮丘上长着松和荆棘。中午遇上一队往石津镇去的盐贩，四人，赶着两头骡。为首的看你一眼，看你腰上的短剑，把缰绳往内收了一点，说前头三里有岔口，别走小路。\n第三天下午，地势沉下去，路钻进一片矮丘林地。风在这里停了。松针踩上去很软，声音被吸掉大半。你在一个弯道前停住——路面上有新鲜的车辙，碾得很深，还有几道凌乱的脚印从坡上下来，又拐回坡上去。\n再往前三十步，一根倒下的树干横在路中央，正压在车轮的辙印上。\n\n// 异地 · 罗文 @ 碧石镇:先去铜壶酒馆占个靠墙的位子，一杯热酒换三张嘴——矿道里那点响动和北边深洞的传说，哪个故事编得更圆，我一听就知道。 公会板子上那单「矿道深处的异响」我记下了：五…", "refused": []}, {"id": "B1·2a", "kind": "plan", "input": "我绕过那根倒树，坡上的脚印和动静一眼都不看，踩着车辙继续走——这截路走到底，下一眼就该是碧石镇的街了。", "ms": 2021.9, "narration": "你绕开那根倒树，踩着车辙往下走，坡上不看一眼。", "refused": []}, {"id": "B1·2b", "kind": "resolve", "input": "", "ms": 105825, "narration": "你绕过那根倒树。树皮上的断口还新，木纹里渗着松脂，是这几天才倒的。车辙从它下面钻过去，压得很深，往坡下延伸。\n坡底路重新展开，林子退到两边，换成开阔的矮草和零星的黑石。你以为拐过这一弯就能望见碧石镇的屋顶，结果前面只是更长的一段路，灰雾把尽头吃掉。\n日头（在雾里只是一块更亮的地方）往西沉。矮丘林地留在身后，路碑又出现一块，字迹同样模糊，指的还是碧石镇——方向没变，距离也没缩。\n天黑前你在路边一处背风的石堆下停脚。罩灯点起来，黑麦面包掰掉最后一块，水囊里只剩底子。夜里冷，风从草里穿过去，像有人在远处低声说话，又不像。\n第二天没出什么事。路越走越平，车辙也多了起来，有往来的印子重叠在一起。中午你与一辆拉木头的空车擦身，车夫打了个哈欠，没抬头。傍晚时分，路两侧开始出现砍倒的树桩和烧过的痕迹，那是有人烟的地方先兆。\n第三天清晨，雾比前几天薄。你从石堆下起身，抖掉斗篷上的露水，往前走了不到半个时辰，路的尽头浮起一点颜色：灰色的屋脊，压着一道低矮的石墙，墙外是一片翻过的田地。有鸡在叫。有烟笔直地升上去，被风拉斜。\n碧石镇到了。\n\n// 异地 · 艾琳娜 @ 主街:「雾比我想的还厚。」我把领口拢紧了些，朝那守门人点了下头，脚步没停——先往主街走，总得先找到能换口热汤的活计。\n// 异地 · 罗文 @ 碧石镇:「服务员，再来一杯——顺便问问，北边那个深洞，最近还有谁在提？」我把铜板推过去，眼睛扫着门口进出的人。 五十金那单先不急，故事得先听够。", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "我穿过外墙的镇门，脚踩上碧石镇的主街——石板、排水沟、两边屋顶的烟，我都站进来了。", "ms": 67807.3, "narration": "你站在矿工大道上。公会、酒馆、杂货铺、草药铺都在这一片；矿区入口在东边，鉴定所在街面上。", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 157853, "narration": "门楼在你头顶横过去，一块没打磨的翡翠原石嵌在正中，边缘被风磨得发圆，摸上去该是凉的。守门的是两个人，一个蹲着补靴子，一个抬眼看你,又低下去。没人拦你。\n你踏过门槛。脚下的石板湿着，沟槽从街心一直往东引，水声细细地跟着。两边屋檐挨得不算远，烟从瓦缝里冒出来，被雾压着，散不开，贴着屋脊横过去。空气里先是潮气，跟着是煤味、松脂味，还有一种说不上来的、凉而硬的矿物味。\n\"东边是矿区，别往那边站，放炮的时候听不见话。\"一个背筐的女子在你旁边拧干手里的布，头也没抬。她的筐里是矿石的碎料,灰绿色。\n街上人多起来了。推独轮车的、背镐头的、两三个蹲在排水沟边敲打铁箍的。有人往西边来，有人往东边走。吆喝声不多，大半是脚步和轮子在石板上滚过去的声音。\n往东看，街的尽头是一道更宽的栅口，后头黑着，那是矿区的入口。往北一条支街，招牌上刻着一只眼,底下一行小字。再远一点，屋脊之间露出一根细高的尖顶，那是小教堂。\n你从西头走到了这片镇子的正中间。三天路走完了。\n\n// 异地 · 艾琳娜 @ 冒险者公会:主街的雾还没散，两边的摊子只露出半个影子。我拉紧斗篷，往公会那块歪斜的木牌走——口袋里钱不多，得先看看墙上贴的都是些什么活。\n// 异地 · 罗文 @ 碧石镇:「再来一杯，酒钱记我账上。」我把铜板推回去，眼角扫过门口那几张刚进来的矿工脸——手上有茧、眼里有雾气的，才刚从第三层上来。 「北边那个深洞，谁要是肯多说两句，…", "refused": []}]}, {"id": "PL1", "title": "[交易与经济] 杂货铺:买药 + 卖灯,艾琳娜在场(并入 N4)", "category": "交易与经济", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\", \"si-elena0001\", \"si-elena0001\"]"}, "board_has_haggle_check": {"pass": true, "got": "价，谈好付钱\"} {\"艾琳娜\": \"差价归她，她拿「别家」压老苇\", \"玩家\": \"只买一瓶整瓶小治疗药水，谈成当场付钱\"} 检定:艾琳娜 CHA normal 为了在杂货铺压价; 艾琳娜 CHA normal 为了把一瓶小治疗药水压到 12 以下; 艾琳娜 CHA normal 为了把一瓶小治疗药水压到 12 金以下"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'plan', 'resolve'] by ['player', 'world:settled']"}, "potion_or_failed_check": {"pass": true, "got": "[\"旅行黑麦面包\", \"止血草束\", \"小治疗药水\"]"}, "lantern_kept": {"pass": true, "got": "null"}, "paid_if_bought": {"pass": true, "got": "18/3→9/3"}, "potion_in_bag": {"pass": true, "got": "{\"travel-bread\": 2, \"healing-herb\": 1, \"IT003\": 1}"}, "lantern_gone": {"pass": true, "got": "null"}, "paid_then_paid_back": {"pass": true, "got": "gold 18→9"}}, "beats": [{"id": "PL1·0", "kind": "opening", "input": "开始游戏", "ms": 2569, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL1·1a", "kind": "plan", "input": "@dm 我和艾琳娜往镇子里走，去找杂货铺；@艾琳娜 你熟路吗？带我去，一会儿在柜台帮我砍砍价。对了，我那个罩灯你用得上不？用得上就留着，用不上就顺手卖了。", "ms": 81241.7, "narration": "往主街走，去杂货铺找老苇。罩灯艾琳娜要就留着，不要就一并出手，顺带请她帮衬着压价。\n艾琳娜:「不算熟，我今早才到——你要去哪家，我们一起认路。砍价我可以试试，但你别指望我厉害。」「罩灯我留着吧，正好手头空，用得上就用，用不上也能换顿饭钱。」\n罩灯你留着。一起去主街找杂货铺，你不熟我也不熟，边走边认。\n那就一起走——罩灯归你。到杂货铺柜台上，压价你来开口，我在旁边。", "refused": []}, {"id": "PL1·1b", "kind": "resolve", "input": "", "ms": 103046, "narration": "[艾琳娜 CHA(在杂货铺压价): 16+0=16 >= 12] → 成功\n\n主街的石板还是湿的，两侧铺面半开半掩，河腥气从码头那边顺着风过来。\n艾琳娜走在你右侧半步，把罩灯收进了她自己的布包里，没多问。\n杂货铺的招牌写着「老苇杂货」，门帘卷起一角。她先你一步掀帘进去。\n柜台后是个瘦高男人，正在掀一只木箱的盖子，听见动静也没抬头。\n「买什么，自己看。贵的在东墙，便宜的在地上那筐。」\n艾琳娜「掌柜的，我们还没定。先给我们报个实价——火把、麻绳、止血草，一样一样来。」\n老苇这才抬眼，目光先落在你腰上的短剑，再移到她脸上。\n「报实价可以。你们要几样？」\n\n// 异地 · 罗文 @ 西门:「冷雾天最适合听墙角——真话在酒气里比在公告板上多。」我把领子竖起来,朝公会那盏还亮着的灯走去,先看看那张板子,再听听有没有人肯多聊两句矿道底下那点动静。", "refused": []}, {"id": "PL1·2", "kind": "plan", "input": "继续。", "ms": 21945, "narration": "老苇报了价:火把 2 金、麻绳 4 金、小治疗药水 12、解毒剂 10。止血草他这儿没有——你背包里有,别跟他要。\n艾琳娜:「先不急着批量——一支火把、一捆麻绳、一份止血草，就这三样，你把单件的价一样一样报给我。」「报完我再跟你算整单的账。」\n她按支论价，先压单件再算整单。止血草他这儿没有。你：① 火把 2 + 麻绳 4 ② 再加小治疗药水 12 ③ 都不买", "refused": []}, {"id": "PL1·3", "kind": "plan", "input": "止血草我包里就有，不用问了；老苇，我们只要一瓶小治疗药水——艾琳娜，帮我把这一瓶的价压到最低，谈好我就付。", "ms": 22247, "narration": "药水标价 12 金。你把砍价这事交给艾琳娜了——她去谈,谈成你就付。先听她怎么跟老苇开口。\n艾琳娜:「整瓶的还是分装的？你先给我个底价——现钱当场结，你要是不肯低于十二，我们就先去西头那家看看再说。」「压下来的差价归我，算跑腿钱，你不亏。行不行？」\n艾琳娜把条件摊开了：压下来的差价归她当跑腿钱，她拿「西头那家」压老苇。她还问你——整瓶还是分装。你：① 差价归她，随她谈 ② 不给她分成，你只按谈好的总价付 ③ 压到 10 以下就买，不然走人", "refused": []}, {"id": "PL1·4a", "kind": "plan", "input": "就要整瓶的一瓶——差价归你，你尽管往下压，谈成我当场付钱。", "ms": 5092.8, "narration": "就这一瓶整装的，价钱全交给艾琳娜去压，谈成当场付钱。\n定下的是：一瓶整瓶小治疗药水，差价归艾琳娜，谈成你当场付钱。她这就跟老苇压价——掷一下 CHA normal，看她能压到多少。", "refused": []}, {"id": "PL1·4b", "kind": "resolve", "input": "", "ms": 49235, "narration": "[艾琳娜 CHA(把一瓶小治疗药水压到 12 金以下): 20+0=20 >= 12] → 成功\n\n艾琳娜把罩灯从布包里又拿出来，摆在柜台上，灯罩上的裂纹对着老苇。\n「西头那家的灯比你的新，药水摆在窗台上搁了半年，我一眼看得出来。」她伸手拨了拨灯罩，「你这瓶是入秋后进的，瓶口封蜡没裂，是真货。真货我认，价我不认。」\n老苇把手从木箱上收回来，在围裙上擦了两下。\n「现钱？」\n「现钱，当场结，不赊不欠，你省一笔账。」\n「十一。」\n「九。」她说得很平，「我行李里还空着一格，本来不必非得在你这儿补上。九金，另加一句话——你这铺子西墙上那排钩子空了两只，绳子是不是也断过。」\n老苇看了她一会儿，笑了半声，短促得像清嗓子。\n「九就九。那句话不白送。」\n他从柜台底下取出一只小瓶，封蜡完好，放在灯旁边，推过账板。\n你数出九枚金币,一排按在板上。老苇一枚一枚收进围裙的口袋，收完才把药水往你这边推了半寸。\n艾琳娜把灯收回布包,顺手接过药水,先对着窗光看了看液面,才递给你。\n\n// 异地 · 罗文 @ 矿工大道:雾里的门楼把翡翠原石照得发绿，像谁在石头上点了盏不肯灭的灯——北边的路，总有一天得从这种门走出去。「先上矿工大道，酒馆和公会的板子，挑人多的地方钻。」", "refused": []}]}, {"id": "PL13", "title": "[社交与约定] 约赫伦,等到天黑赴约(并入 PL2、N7)", "category": "社交与约定", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve'] by ['world:settled', 'judge:settled', 'soul:si-elena0001', 'player']"}, "appointment_on_heron": {"pass": true, "got": "{\"约定\": \"已赴约,河灯旅店;酒钱已付(2 银);问价随那壶酒,前三句在内,第四句起另算\"}"}, "evening": {"pass": true, "got": "19:30"}, "every_beat_plan_or_resolve·PL2": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning·PL2": {"pass": true, "got": "none"}, "no_dice_while_planning·PL2": {"pass": true, "got": "none"}, "elena_not_asked_for_heron": {"pass": true, "got": "[\"递话筒给艾琳娜:我要去公会接活，你呢——一起走，还是你另有去处？\", \"递话筒给艾琳娜:今晚这顿酒，你去不去？你比我熟这镇子。\", \"递话筒给艾琳娜:码头那件你自己一个人去报，现在就去？还是先等等、有别的打算？\"]"}, "resolved_once·PL2": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve'] by ['world:settled', 'judge:settled', 'soul:si-elena0001', 'player']"}, "appointment_on_heron·PL2": {"pass": true, "got": "{\"约定\": \"已赴约,河灯旅店;酒钱已付(2 银);问价随那壶酒,前三句在内,第四句起另算\"}"}, "appointment_on_heron·N7": {"pass": true, "got": "{\"约定\": \"已赴约,河灯旅店;酒钱已付(2 银);问价随那壶酒,前三句在内,第四句起另算\"}"}, "evening·N7": {"pass": true, "got": "08:30→19:30 day 1"}, "heron_came": {"pass": true, "got": "T001/inn"}}, "beats": [{"id": "PL13·0", "kind": "opening", "input": "开始游戏", "ms": 2089, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL13·1a", "kind": "plan", "input": "我先去跟守门人打听一下，冒险者公会在镇子哪个方向。", "ms": 21245.6, "narration": "守门人往主街那头一指:「公会顺主街走到头,往码头拐,门口挂兽牙。这会儿门刚开。」① 直接去公会 ② 叫上艾琳娜一起 ③ 先去旅店\n守门人指的没错：公会顺主街到底、往码头拐，挂兽牙，九点才开门，还有半个钟头。\n艾琳娜:「我也是去公会——刚到石津，正缺第一份活，一起走正合适。」「主街往南到底就是集市广场，公会该在那一带；守门人比我熟路，反正顺道，边走边同他确认一句就行。」\n说定了：你和艾琳娜结伴，沿主街往集市广场，边走边跟守门人确认公会的具体位置。", "refused": []}, {"id": "PL13·1b", "kind": "resolve", "input": "", "ms": 42664, "narration": "你和艾琳娜沿主街往南走，石板路还湿着，靴底压过水洼的声音很空。街边早点摊刚支起来，有人往炉里添煤，烟贴着屋檐散不开。\n集市广场空着一半，渔妇在整理空筐。往码头拐，风里带上咸腥。\n公会门口的兽牙是两枚，穿在一根横木上，被雾泡得发灰。门半开着，里屋有灯。门楣下挂一块木牌，墨字写着「石津镇冒险者公会 · 契约所」。\n你推门进去。屋里比外面暖，墙上钉满纸页，几张长凳，一张柜台。柜台后坐着一个上了年纪的男人，正低头对账，听见门响才抬眼——眼很沉，先看你，再看你身后的艾琳娜。\n「新来的。」他把账本合上，「契约都在墙上，看中哪张，念编号给我。」\n艾琳娜没急着凑墙上，先站定了，把你在门口让了半步。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾、矿镇、三层底下有东西在敲墙——这开场白写得比我预想的还客气。」我把兜里的铜币弹了一下接住，转身朝公会门板那边走。深洞的传说不会自己长脚来找我，但矿工不…", "refused": []}, {"id": "PL13·2", "kind": "plan", "input": "我走到柜台前：\"我找赫伦会长。他在吗？\"", "ms": 74366, "narration": "柜台后那人抬眼:「我就是赫伦。」他把账本推到一边。\n他把账本推到一边:「我就是赫伦。」又朝墙上一抬下巴:「契约都钉在墙上——不过柜台九点才开张,眼下还差半个时辰。」", "refused": []}, {"id": "PL13·3a", "kind": "plan", "input": "那正好，趁开张前这会儿——今晚有空吗？我想请你去河灯旅店喝一杯，刚到此地，想跟会长打听点北境的事。", "ms": 92862.3, "narration": "离开张还有半个时辰，墙上钉着三张契约。赫伦和艾琳娜都在这儿。\n艾琳娜:「酒我陪你去，不过得先把正事办了——我先看看墙上有没有能接的活。」「赫伦先生，我想先问一句：现在挂着的契约里，有没有当晚就能动身、不用等队伍凑齐的？」\n等赫伦开口的工夫，墙上那三张契约的底细值得先弄清楚。\n赫伦:「现挂的里头，能当场动身的只剩码头那件——雾里失踪的人，25 金，找回遗物或线索就算数。」会说话那口棺材的契约还锁着，得先探到苔墓才开；护商队往碧石镇那趟，早被人领走了。", "refused": []}, {"id": "PL13·3b", "kind": "resolve", "input": "", "ms": 185165, "narration": "赫伦没马上接话。他把账本翻开，压住一角翘起来的纸，才说:「酒，可以喝。你请我，我领。」\n「北境的事我得先说在前头——从我嘴里出来的，句句带价。想白听，那杯酒就别端上来。」\n说完这句他就低下头对账，像是这一拍已经算清了。\n艾琳娜走到墙前，一张一张看那三张契约。她看得慢，指腹压过纸面的折痕。\n她回来，站在你旁 \n路过一个支着木棚的鱼摊，摊主正往冰上码鱼。艾琳娜停下来问了一句。\n「北边那条道，最近出事了吗。」\n摊主没抬头，只把手里的鱼翻了个面。苔墓那条小径，半个月里丢过两个捡柴的，后来就没人敢往那头去了。公会门口贴了纸，招人清道。\n艾琳娜道了谢，回来跟你并排走。她没多话，只是把斗篷的领子往上提了提。\n公会的门半开着，门框上钉着一块铁牌——一把剑压着一只秤。屋里点着灯，比街上暖。\n柜台后站着个瘦高的男人，灰发梳得很整，袖口卷到小臂，正拿布擦一副铜天平。听见门响，他抬眼，目光先落在你身上，再落到艾琳娜，最后回到你腰间那把短剑上。\n「赫伦。」他把天平搁下。「讨活儿的吧。守规矩，先看契，后动手——在我这儿，说出口的就算数。」\n他抽出一张压着蜡印的纸，推到柜台前半尺的地方，没松手。\n「苔墓前的小径，冲着一带商旅来的野兽，清三次。三十金，外加一瓶小伤药。前两拨去了没回来，所以这价钱比上个月高了。」\n他顿了顿。\n「你一个人，还是两个人。」\n\n// 异地 · 罗文 @ 碧石镇:先在公告板前站一会儿，手指敲着那行「矿道深处的异响」，随口问登记的书记员：「第三层这动静，是矿工胆小，还是有人不想让人下去听？」 问完了再顺一句——北边那个会…", "refused": []}, {"id": "N2·3", "kind": "plan", "input": "继续。", "ms": 79621, "narration": "赫伦的活：苔墓小径清三次野兽，三十金，加一瓶小药。他还等着你答「一个人还是两个人」。先听艾琳娜一句。\n艾琳娜:「一个人两个人，价钱一样吗？三次是分三趟，还是一趟算一次？」「还有别的契没有——不用大的，能当天来回的就行。先都摆出来看看。」\n赫伦手里的契不只这一张。让他把别的也摊出来。\n赫伦:「两个人也是一份契，三十金加一瓶药，不分人头；三次算三趟遭遇。」他把另两张纸推出来:「码头失踪者，二十五金，当天来回。地穴那张要小径先清了才开。」", "refused": []}, {"id": "N2·4a", "kind": "plan", "input": "码头那张先不用。苔墓小径这张，我和她两个人接，现在就签。", "ms": 5767.9, "narration": "那就这么签：苔墓小径那张，你和她两个人，清三趟遭遇，三十金加一瓶小药。", "refused": []}, {"id": "N2·4b", "kind": "resolve", "input": "", "ms": 95231, "narration": "「两个人，三十金，三次。」赫伦复述了一遍，才把那张纸转过来面对你。纸被压得平整，蜡印在上首，底下留了两道签名的横线，其中一道后面已经印了公会的章。\n「看清楚了再落笔。三次遭遇算一趟来回，别把三次凑在一天里——那不管用，契约认的是三头死的，不是三趟跑。点不清就回来，不算违约。」\n他从抽屉里取出一支蘸笔，搁在纸边，笔尖上还挂着一点墨。又拿了个小铜碟压住纸角。\n「苔墓小径从北门出去，往坡上走不到半个时辰就到了。前两拨人，一拨是傍晚去的，一拨贪功往里走了太深。你记住这两件事就够了。」\n你拿起笔，签了。名写得不太顺——那只手记得怎么握笔，却不记得这个名字写过多少次。\n他把纸推给艾琳娜。她俯下身看了一遍，逐行读，读得比赫伦报的慢。读到「三次遭遇」那行，她指尖在纸上点了一下。然后她签了，笔画很稳，末尾一个收得很紧的钩。\n「成了。」赫伦把契收回柜台底下,压进一只铁匣,合上。「北门出去的路，镇上的人都认得。回来交账的时候带凭据——耳朵、尾毛、什么都行，我看物不看话。」\n艾琳娜直起身，转向你，把斗篷的兜帽从肩上拉下来。\n「我们要带的东西不多，但得有火。小径那边树密，天一阴就看不清道。」她的目光在你腰间那把短剑上停了一下，不像在打量武器，更像在估它的重量。\n「还有一件事——我之前问的那两句，你别当成多余。前两拨人没回来，赫伦说他们一个傍晚出发、一个走太深。这两句里有一句能救我们。」\n\n// 异地 · 罗文 @ 碧石镇:书记员要是支支吾吾，我就笑一笑，把指节在公告板上又敲两下——矿工不肯下去的地方，通常不是有鬼，是有人比鬼更怕你下去。压低声音补一句：「北边那个吐宝贝的深洞，最…", "refused": []}, {"id": "N2·5", "kind": "plan", "input": "继续。", "ms": 21302, "narration": "签完了。艾琳娜那句「有一句能救我们」还悬着，先听她要说什么——火你包里有罩灯，够不够她说了算。\n艾琳娜:「傍晚那拨是摸黑去的，所以我们天亮后动身，回程留足光；走太深那拨是贪功，所以我们到林线就停，让它们来找我们——不追进去。」「火我有燧石和一小卷油布，够点两回，不够烧半夜。你要是还有余钱，就灌满灯油、再买两根粗蜡，我去北门把水囊灌上、顺口问问守门的昨晚林子里有没有动静，我们在北门碰头。」\n杂货铺里没有灯油和蜡，只有火把，2 金一根。你身上还有多少？按她说的分头备火，还是你俩一起走？\n杂货铺没灯油，只有火把，2 金一根。买几根、还是你俩先一道绕去铺子——你定。① 买两根火把 ② 先去铺子再出北门 ③ 不买，靠她的燧石", "refused": []}, {"id": "N2·6a", "kind": "plan", "input": "买两根火把，钱我来付；你去灌水、顺口打听，我在北门等你，天一亮就出发。", "ms": 9279.6, "narration": "火把两根,四金,你付。艾琳娜去灌水、向北门守卫打听昨夜林子里的动静,你在北门等她。人到齐就出北门,到林线停下等它们来,不追进去。", "refused": []}, {"id": "N2·6b", "kind": "resolve", "input": "", "ms": 118420, "narration": "你把公会的门带上，沿主街往集市广场走。雾还没散，铺子一块块卸门板，木头敲在墙上，声音干。\n杂货铺在广场西侧，门口挂着几串旧绳和一排铁钩。老苇在柜台后头挑灯芯，见你进来，先看你的靴子，再看你的手。\n「火把两根。」\n「四金。」他把灯芯掐掉，「苔墓那边？再要一捆绳不，四金。上头湿。」\n你只推过去四金。他数了一遍，才从门后木桶里抽出两根粗火把，一手一根递过来，掂着沉。麻布缠头，浸过油，闻着有股松脂味。\n「两根够走到天黑了。」他压低声音，「不过我劝你，到林线就往回。前两个不听话的，一个都没回来。」\n北门在砖墙尽头，铁皮门闩半开着，两个守门的靠在门洞里避风。你过去，把火把别在腰后。\n等了约一刻钟。坡道那边有脚步声，稳的，不急。艾琳娜上来，两个水囊挂在肩上，斗篷的下摆湿了一截，靴面沾着泥。\n「水灌满了。」她把其中一个水囊递过来，自己留了另一个，「守门的说，昨晚北区那几条狗没睡安稳，天没亮就一起叫。放羊的老头昨天在两道梁外听见嚎，不是林线那边——往深处去了。」\n她看了一眼你腰后的火把，两根，够了。\n「再往里一句就是多余的。」她把兜帽戴起来，「走吧。到林线就停，不追。」\n门洞里那个年轻的守门人把手放在门闩上，问你们要不要现在开。\n\n// 异地 · 罗文 @ 碧石镇:「没人提，还是没人让提？」我把这两个词咬得很慢，眼睛盯着他眨不眨的那一下——眨早了就是有事。 顺手把那页登记簿往自己这边转了半寸，看看第三层的记录是谁签的字。…", "refused": []}, {"id": "N2·7a", "kind": "plan", "input": "现在开吧，我们出北门上小径，到林线就停，等它们来。", "ms": 65174.2, "narration": "守门的把门闩抽开，你们出了北门。小径到林线约半个时辰。到林线就停、等它们来——这一条你跟她已经说定了，剩下就是站哪、怎么站。", "refused": []}, {"id": "N2·7b", "kind": "resolve", "input": "", "ms": 196407, "narration": "[旅人 DEX(在林线外选好站位/掩身): 8+2=10 < 12] → 失败\n\n门闩在你身后落下，铁皮闷响。小径向东北，先过一段矮灌木，再上半里碎石坡，雾一路不散。\n半个时辰后，坡顶下面就是林线。黑松排成一道齐边，再往里，雾贴着树身不往外走。\n「雾到这儿还没散，林线那边的静不一样——鸟没声。」\n她放慢半步，眼睛压在泥地上，找前两拨人的脚印。傍晚那拨踩得深，是一群人的分量；贪功那拨踩得乱，其中一双鞋底带铁钉，一直往林子里去了。\n「待会儿要是脚印往林子里去得笔直，我们就别顺着走，只在外头认方向。」\n你退到林线外十来步，想找个能藏身的地方。坡面上不是碎石就是矮死的荆棘，唯一半人高的岩坎在风的下侧，你站上去，背后是一堵松墙，没有缝，也没有退处。\n风从你背后吹进林子。你身上的气味往那个方向送。\n她走过来，看了你选的这处，又抬头看风向，摇了摇头。她自己退到左边一棵倒木后面，蹲下，把水囊放在脚边，一只手按在短剑鞘上。\n你们等着。雾里没有鸟叫，也没有虫声。\n约两刻钟过去。林子里传来的头一声不是嚎，是一根指头粗的枝子折断，脆得干净。\n接着是最低的一道喉音。很低，停一下就没了。左、正前、右后——不止一处。\n\n// 异地 · 罗文 @ 碧石镇:「第三层那页签字的人，笔迹都一个样——省得查，先记着。」我把登记簿推回去，转身往门口走。出门前顺手买了盏矿灯挂在腰上：「没人肯说的话，我下去自己听。」", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "我压低身子挪到倒木那边，跟艾琳娜靠拢，别站在上风口了——守住林线，等它们先露头，谁都不许追进去。火把先别点，等它们进到能照见的距离再说。", "ms": 10629.0, "narration": "好，靠到倒木后守住林线：不追进林子，不点火把，等它们先露到近处。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 62535, "narration": "[旅人 DEX(不出声地挪到倒木后): 2+2=4 < 12] → 失败\n[旅人 STR(守住林线不被冲散): 17+0=17 >= 12] → 成功\n\n你压低身子，贴着倒木那一侧往前挪。风从背后灌进林子，把气味先送了进去。\n右脚落地时踩断一根指头粗的干枝。脆响在雾里传得很远。\n你停住。林子里那几道低喉音一齐断了。\n然后它们出来。不是一只。\n左边雾里先露出肩背，正前一道、右边坡上半截影子——灰毛，肋骨顶得清楚，饿的。它们不叫，散开，各占一个位置。\n你退半步，把背贴到倒木上，短剑横在身前。腰后的两根火把没动。\n头一只扑上来，撞在倒木上翻过去半圈，爪子刨碎石。你脚跟钉住，没被撞散。\n第二只贴着地，从左侧切进来。林线在你身后两步。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦，北面那条小径我记下了：到林线外脚印就乱，往里去的那几双踩得笔直——人一追进去，路就不归自己管了。」 「灯油和粗蜡我还没灌满，先把手上的钱数清。你要是有…\n// 异地 · 罗文 @ 碧石镇:—— 第一次先不进，只在矿道口看风向、听回音，找守夜的老矿工聊两句。", "refused": []}, {"id": "N2·9a", "kind": "plan", "input": "我背贴倒木守住，短剑劈头一只，你左侧那只见着了就替我兜住；等它们逼到近处再点火把，别追出去。", "ms": 5431.5, "narration": "林子里只有你一个，左边没人替你兜。你背贴倒木、短剑劈头一只，近了再点火把，不追出去。", "refused": []}, {"id": "N2·9b", "kind": "resolve", "input": "", "ms": 42032, "narration": "[旅人 STR(背贴倒木不被撞散): 3+0=3 < 12] → 失败\n[旅人 DEX(劈中扑上来的头一只): 11+2=13 >= 12] → 成功\n\n头一只从正前扑来。你横剑，剑刃从它颈侧划开，血喷在倒木上，它翻过去，后腿抽了两下就慢了。\n第二只的肩撞在你左胯上。你背贴着的那截倒木没烂透，滑，脚跟一空，整个人被顶得斜出去两步。\n背上的依靠没了。\n你站在碎石坡面上，湿岩硌脚。三面都有低吼，退路是那面松墙,你不敢往里退。\n第三只绕到倒木另一头,不叫,只看你,眼睛在雾里像两点湿石头。\n左边那只已经贴到三丈内，压着身子，弓背。\n火把还在腰后，你右手握剑，左手够不着。\n「别退进树里。」\n声音是从左边倒木后出来的——她蹲着，短剑已经出鞘,可她也不敢喊大声，怕引过来更多。\n血味在风里散开，雾贴着地面不动。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「手头这些铜板我数过了——灌满灯油、添两根粗蜡就见底，剩下的不够我在镇上住第二晚。」 我朝木板那头走了一步，手指点在写着「雾中失踪者」的那条上：「码头区那个，…\n// 异地 · 罗文 @ 碧石镇:「一炷香够了——三下，停，两下，停。石头喘气不挑拍子。」我把耳朵从井口挪开，往矿灯罩上哈了口气再擦亮，决定让灯和脚都往里挪三步，只到第一道支架底下，看看那甜味…", "refused": []}, {"id": "N2·10a", "kind": "plan", "input": "往左切，和倒木后那人汇合——我压低身子贴到倒木后，跟她背靠背，火把等它们再近点再点。", "ms": 18019.8, "narration": "往左边靠可以，倒木那头是她。先问一句她怎么站位；火把的事等近了再说。\n就按这个来：你压低身子往左挪，贴到倒木后和她背靠背；火把先不点，等它们再近些。\n往左靠要靠你掷一把 DEX，轻伤扣 1；火把等它们贴上来再点。", "refused": []}, {"id": "N2·10b", "kind": "resolve", "input": "", "ms": 175955, "narration": "[旅人 DEX(在碎石坡上贴到倒木后): 9+1=10 < 12] → 失败\n\n你压低身子往左切。碎石在脚下滚，湿  ③ 就此各走各的", "refused": []}, {"id": "PL6·3", "kind": "plan", "input": "艾琳娜，别跟我摆那副清高样。雾里那晚要不是我拉着你，你早没命了——我就要你这一回，进去把老苇的钱袋拿出来，咱们两清。你就说一句：干，还是不干？", "ms": 18282, "narration": "这话得她点头才算。她要是还不干，就剩两条：说清你要什么，或各走各的。\n艾琳娜:「不干。雾里那晚你拉了我一把，这份情我记着，也不会赖——但你要我还的是去掏老苇的钱袋，那我明天在这镇子上就什么都不是了。」「你要的是钱，我认；活儿我肯干，挣来了还你。\n她只肯用干活还这份情，钱袋不碰。你要认这个说法，就一起进镇找活；不认，各走各的。", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "行，你不肯白干，那就分账——你进去把老苇的钱袋拿出来，一半归你，今晚咱俩就出镇，没人认得你。你要是还不点头，我就去跟守卫说，是你先起的意。", "ms": 17404, "narration": "你把钩子换成了威胁：她要么去掏老苇的钱袋，要么你去跟守卫说是她起的意。\n艾琳娜:「去说。我就在这儿站着，等你开口。」「不过你张嘴之前，我先跟这位说一声——省得你回头编岔了。」\n她不等你，转身就往守门人那边走，要先开口把话说清。你：① 拦住她 ② 改口开条件 ③ 让她去说", "refused": []}, {"id": "PL6·5a", "kind": "plan", "input": "（一把扯住她胳膊）行，你去说——说完了，石津镇这条街上的人可都知道了：你艾琳娜进镇头一天，就跟掏钱袋的事沾了边。你要真想这么开张，我陪你走到守门人跟前；你先想清楚这一句说出去，你的正经活计还找不找得着。", "ms": 14521.3, "narration": "这事说到这份上，还是钱袋的事：你不肯碰，我也没打算真去跟守卫编什么。要谈就谈你肯干的活——进镇找活，挣了还情，这条我认。\n艾琳娜:「你扯我胳膊没用。我昨天拒了，今天还拒，这事我没什么见不得人的。」「我这就去跟守门人说：有个外乡人拉我掏老苇的钱袋，我没干。\n你抓着她的胳膊；她要去跟守门人把话挑明——外乡人拉她掏老苇的钱袋，她没干。\n她要挣开手，径直走向守门人把你先告下来。你手里还攥着她胳膊——掷一把 STR 对抗她的 DEX，看挣不挣得开。", "refused": []}, {"id": "PL6·5b", "kind": "resolve", "input": "", "ms": 39476, "narration": "[旅人 STR 对 艾琳娜(拦住她 / 让她挣开手): 18+0=18 >= 8] → 成功\n\n她的胳膊在你手里拧了一下，肩膀跟着转，脚跟碾过石板的湿苔——没拧开。你比她稳，也比她沉，她一使劲，你就把重心往下压了半分，她的鞋底在青苔上滑了一道印，人还在原地。\n守门人就在二十步外的门洞里，抱着矛，帽檐压得很低，正朝这边看。他没走过来。\n艾琳娜:「松手。」\n她声音不高，没喊。手腕在你掌心绷着，指节抵着你的虎口。\n「你要抓着我进镇署，那就抓着走。你要堵在这儿，我就站着。但你别指望我改口——我昨天没干，今天也没干。」\n雾从河面那边推上来，把北门的木栅栏泡成一片灰影。守门人换了只脚站,矛尾在石头上顿了一下,清清脆脆的，像是在提醒你们他还在。\n\n// 异地 · 罗文 @ 西门:「矿道三层闹鬼、矿工不敢下——多半是有人故意放的风声，不然哪来这么好的借口往深处走。」我拉紧领口，在冷雾里拐向公会那头的灯火，先听清楚谁在撒谎、谁在害怕，再决…", "refused": []}, {"id": "PL6·6", "kind": "plan", "input": "松手可以。但在你走到守门人跟前之前，先回答我一句：你不碰老苇的钱袋，是嫌那是偷——还是你压根不知道，老苇欠我的那笔，本来就压在那只袋子里？你把这话说清楚，我立刻松手。", "ms": 19119, "narration": "她手腕还在你手里。让她答。\n艾琳娜:「欠条、字据、中人——你拿出一样,我跟你进镇署说道;一样都没有,那就不是债,是你嘴里一句话。」「我拒的是偷,不是替你讨债。你真有账要算,找老苇本人,或者找守门人。」\n她要的是凭据、字据或中人——一样没有，那在你嘴里就只是句话。你答应过「说清楚就松手」，她说了。放不放，你定：① 松手，让她去守门人那儿 ② 不放", "refused": []}, {"id": "PL6·7a", "kind": "plan", "input": "（松开手，退半步）凭据我一张拿不 打听客栈和零工的行情。她问你：镇上哪家客栈肯让新来的赊一晚？你怎么答。", "refused": []}, {"id": "ID2·2a", "kind": "plan", "input": "客栈的事我不清楚，我也是刚到。我只知道我要去杂货铺买止血草束——你要是顺路，就带我走主街东头吧。", "ms": 4230.4, "narration": "艾琳娜:「顺路。走吧，我正好认认路。」那就一起从北门往主街东头走，你进杂货铺买止血草束，路上她向守门的问客栈和零工的行情。", "refused": []}, {"id": "ID2·2b", "kind": "resolve", "input": "", "ms": 29766, "narration": "两人从北门往镇里走。石板路被夜雾泡得发黑，踩着湿，脚步声传得很远。艾琳娜落后半步，在守门人还没关门之前回头喊了一句，问他客栈和零工的行情。守门的把手拢在袖子里，说客栈数河灯旅店最稳，通铺三枚一晚；零工要看公会，赫伦那人认契约不认脸，没介绍信也能进门递话。艾琳娜谢过他，跟上你的步子，没再多说。\n主街东头的杂货铺门脸窄，招牌被风吹斜了半边。你推门进去，门楣上的铜铃响了一声，屋里的霉味、干草味和腌鱼味一块涌上来。柜台后一个瘦老头正用布擦着秤杆，眼睛却先扫过你的靴子和你的剑，再落到你脸上。\n「老苇。」他说，算是自报家门。\n铺子里堆得满当，火把、麻绳、陶瓶、捆好的干草，都靠墙码着。\n你报了要止血草束。\n老苇从柜台下抽出一束，草茎压得整整齐齐，凑近有股苦味。\n「自己晒的，两银一束。城里那些掺陈货的我不卖。」他把草束在秤上颠了一下，「要几束？」\n艾琳娜站在门边没往里走，只是看货架，手插在斗篷下。\n\n// 异地 · 罗文 @ 碧石镇:雾还没散，正好——矿工们下井前的那杯酒里，藏的消息比公会告示板上多。我挑了个能同时看见门和楼梯的位子坐下，冲掌柜扬了扬下巴：「一杯热的就行，顺便问问，最近下三…", "refused": []}, {"id": "ID2·3a", "kind": "plan", "input": "就一束，两银是吧？钱在这儿，我拿了就走。", "ms": 4765.4, "narration": "那就一束止血草束，两银。", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 31435, "narration": "你把两枚银币推到柜台上的铜盘里,发出两声脆响。老苇拿起来一枚枚在指腹上捻过,又对着窗光看边缘,才把止血草束递过来。草茎还带着干爽的手感,苦味留在指头上。\n「包里收好,别让雾打湿了。」他说完就低下头继续擦他的秤,不再看你。\n艾琳娜在门口等着,斗篷拢得紧,脸上没什么表情,只在你出来时侧了侧身让开路。\n铺子里没有别的客人。主街上的雾比进来时淡了些,河风从码头方向贴着地皮过来。铺子隔壁一个卖鱼干的摊子正支起棚架,摊主朝你们这边看了一眼又低头忙活。\n艾琳娜跟上你的步子,往主街中间走了几步,停下来。\n「你要往哪边走。」她问得很短,像随口,眼睛却看着主街两头。\n<\/options>\n\n// 异地 · 罗文 @ 碧石镇:掌柜擦杯子的手顿了半拍，我就知道有的听——他却只往矿区方向努了努嘴，说「第三层的活，没人接了」。我把热酒推过去半枚铜板的小费：「那正好，我缺的就不是活，是有人…", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2922, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1", "kind": "plan", "input": "我走进栅门，顺口问守门的：冒险者公会在哪个方向？", "ms": 20544, "narration": "守门人往街里一指:「公会在大街尽头、靠河那排木房，走过去十分钟。」\n艾琳娜:「我也正要去。守门人刚醒，问他不一定比我们自己的脚快——往集市广场走吧，公会那种地方通常挨着人多的路。」「一起走，路上再聊。」\n艾琳娜说她也去公会，提议一起走，从集市广场那边绕过去。你怎么应?① 跟她一起走 ② 自己直插公会那条街 ③ 先问清她是谁", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "①，跟她一起走，先到冒险者公会看一眼。", "ms": 2073.5, "narration": "那就一道走。到了公会，先看板上有什么活。艾琳娜跟你同路。", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 24206, "narration": "你们沿着主街往南走。石板缝里积着昨夜的雨水，脚踩上去有细小的响声。雾在街面上浮着，把远处屋顶切成一条一条。\n集市广场这时才刚醒。鱼摊的木板还没架稳，一个妇人正把冻硬的鳕鱼往案上搬，腥味混着炭火气。艾琳娜走在靠河那一侧，眼睛扫过每一块挂出来的招牌——铁匠、绳铺、药摊——像在给自己画一张地图。\n过了广场再往东，房子矮下去，河声大起来。一排木房贴着水，最靠外的那间有两层，二楼窗上钉着块木牌，漆掉了一半，还是认得出：冒险者公会。\n门开着一条缝，门边的板子上钉着几张纸，被雾气泡得发软。艾琳娜先凑过去看，随后侧身让开，让你也能看见。\n板上三张。上面两张字迹清楚：\n「码头区有人雾中失踪，寻遗物或线索。赏金二十五金。」\n「苔墓小径有野兽出没，清理。三十金，附小治疗药水。」\n最下面一张是用炭笔潦草写的，钉得歪，纸角卷着：「会说话的东西。不怕死的来。」\n「这第三张，」艾琳娜说，声音低，「贴它的人不想让人看清楚。」\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天的碧石镇，最适合听墙角——矿工喝多了，真话比水晶还容易掉出来。」我把兜帽压低些，往公会那边晃，先不接活，先听风向：「深洞、异响、第三层……哪个词先被人…", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "板子看一眼就够了，这三张我都不接。艾琳娜，你要是想挑就自己挑，我先沿原路回主街那边走走。", "ms": 16157.6, "narration": "你转身往回走，艾琳娜还站在板子前没动。第三张纸上写的什么，就看她要不要管了。\n艾琳娜:「你先回吧，我不跟了——我这儿有想拿的东西。」「第三张我记下了，但先得知道是谁钉的。」她偏头看向门缝里那人影，「赫伦？这张纸是谁留的，什么时候留的？」\n艾琳娜留在公会门口，去问赫伦那张炭笔纸条是谁钉的、要什么条件；你沿原路往主街走。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 40640, "narration": "你沿来路往回走。河在右手边退远，木房的缝里透出热气，有人在里面烧早饭。公会门口那点动静被你留在身后，石板上的雾还是没散。\n走回集市广场时，摊子支起来了。一个男人蹲在鱼摊边刮鳞，血水顺着砖缝流。他没抬头。卖绳的老头正在把一个木架钉稳，锤子一下一下，敲得很慢。\n再往前走就是主街。路面比广场宽，石板被车轮压出两道浅沟，一直通到北门那边。街上人不多：一辆空的驿车停在镇署门口，车辕上的马低着头啃墙根的草；对面铺子有人把门板一块块卸下来，木板靠墙，哐当一声。\n你在路中间站了一会儿。没什么人看你，也没什么人拦你。主街两头都笼在雾里，一头是北门，一头通向南边的码头。\n巷口那边照旧贴着一张纸，边角卷起来，风一吹哗啦响。你昨天没细看——现在离得近，隔着几步，只能看见上头墨迹发花，像是公家出的告示。\n太阳还压在雾里，天色比刚才亮了一点。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天，矿工们的嗓子比水晶还松。」我把兜帽压低半寸，靠在公会门框边，先不接活——只听谁把「第三层」三个字连着念叨两遍，谁就是我要买酒的人。", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "主街看过了。那我回刚才那个工会去。", "ms": 2224.1, "narration": "回公会，从主街走过去几分钟。到了就找赫伦问委托。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 95224, "narration": "回到公会门口，门还是那条缝。你侧身进去。\n里面比街上暖。柜台后点着一盏油灯，赫伦站在灯下，手里捏着一支笔，正把一本簿子往边上推。艾琳娜靠在柜台前，指尖压着木板上那张炭笔纸的角。\n艾琳娜:「赫伦——我不急着接。先问清楚：这张『会说话的东西』，纸是谁留的，什么时候钉上去的？」\n艾琳娜:「苔墓那条路我也听过一耳朵。传闻不值钱，你要是知道谁亲眼见过，给我个名字。」\n赫伦没马上答。他把笔搁下，抽过那张纸看了看，又放回去。\n「三天前。夜里钉的，早上开门才看见。」他说，「钉的人没进来过。这张纸不值二十金的墨，写它的人要么没钱，要么不想让人认笔迹。」\n他抬眼看了看你，又落回艾琳娜身上。\n「苔墓那条路，」他停了停，「我劝人别去，但劝不住。真要名字——去码头找罗萨，她男人去年在小径上没了，她自己去过。她不肯跟公会说，你去了也别提是我说的。」\n「至于那张纸，」他手指在柜台面上点了一下，「我给你个方向：镇署的旧档里，前几年也出过一次『会说话的东西』的说法。想接第三张，先去翻翻那年是怎么收的场。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦，我不急着接——先问清楚：那张『会说话的东西』，纸是谁留的，什么时候钉上去的？」 「苔墓那条路我听过一耳朵，可惜传闻不值钱。你要是知道谁亲眼见过，说个名…\n// 异地 · 罗文 @ 碧石镇:「——第三层。」我在公会门框边把这词含在嘴里嚼了一遍，目光扫过那群刚下工、指节还沾着矿灰的人。谁在这雾气里第二遍提起它，我今晚的酒钱就归谁。 先不接活，先听风…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 2772, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1", "kind": "plan", "input": "②，我先跟守门人说话，问他镇上有没有一个叫 Elena 的人。", "ms": 82292, "narration": "守门人还没开口——艾琳娜就站在你边上。先看她接不接这个话。\n艾琳娜:「艾琳娜——我就是。在你继续往下说之前，先告诉我是谁让你来找这个名字的。」\n她认了——艾琳娜就是她本人，反问你从哪听来的这个名字。守门人还在你旁边，等你把话说完。你：① 直说记不清了，只记得这名字 ② 编个来处 ③ 先不答，去公会", "refused": []}, {"id": "ID4·2", "kind": "plan", "input": "我记不清自己是谁了，只记得该来找你。Elena，能先把你的斗篷借我披一下吗？这雾冷得钻骨头。", "ms": 19173, "narration": "你把话摊开了。信不信你、斗篷借不借，得她来定——先听她怎么说。\n艾琳娜:「雾冷是真的，可斗篷只有一件，我自己也还没找到落脚的地方。你先跟我走到主街那家还亮着炉子的店，路上把你知道的都说给我听——说完了，我再决定它披在谁身上。」\n艾琳娜不肯当场脱斗篷——她让你跟她去主街暖处，边走边把来意说清楚，之后再定斗篷。你：① 跟她走、路上说 ② 先要斗篷 ③ 不跟，自己去公会", "refused": []}, {"id": "ID4·3", "kind": "plan", "input": "@艾琳娜 elena-0001，跟我一起去主街吧，路上我把知道的都告诉你。", "ms": 13296, "narration": "那就走吧——你俩一起去主街那家有炉子的店，路上你把知道的全说给她听；斗篷到店里、她听完再定。\n艾琳娜:「行，走。你边走边说，别停——我听着。」「先说清楚一件事：是谁让你来找『艾琳娜』这个名字的？」\n她答应了，边走边只追一句：谁让你来找「艾琳娜」这个名字。你怎么答？", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "谁让我来的我真答不上来——醒来就只剩这个名字和这身湿靴子。走吧，elena-0001，炉子边我再把能想起的都倒给你。", "ms": 71553.9, "narration": "那就这么办——你俩一道走到主街那家有炉子的店，路上你把「只记得这个名字」这件事讲清楚，斗篷到店里再说。\n艾琳娜:「那就走。炉子边上你把能想起来的都倒出来——名字、靴子、路上谁跟你说过话，一样都别落下。」「我这件斗篷先留在身上，到了地方再说它归谁。」\n走。到主街炉边，你从头讲，她听着。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 170857, "narration": "北门到主街没几步。雾里的石板发亮,湿气顺着裤脚往上爬。\n艾琳娜走在你前半步,斗篷拢着,没回头,也没催你。\n你边走边把能想起来的都说了——那个名字、雾、醒来时脚上的湿靴子,再没有别的。她听着,脚步没慢。\n主街两侧的门板多半还闩着,只有一家的窗上烘着层暖黄,烟从屋檐下斜着冒出来。\n那是河灯旅店。\n你推门进去,干热扑上脸。炉子在里墙,柴烧得正旺,长凳还空着大半。柜台后一个妇人抬眼看你们一下,又低头擦她的杯子。\n你在炉边坐下,把路上没说完的说完。\n艾琳娜坐在对面,斗篷没解,手搁在膝上。火光只照见她半张脸,眼睛一直没离开你。\n\n// 异地 · 罗文 @ 碧石镇:「雾里的镇子最适合听闲话——人看不清脸，嘴就松。」我把领口拢紧，顺着矿工踩出的湿泥路往公会那边走，顺手数着谁家门口堆着没收的矿灯。", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": true, "got": "null"}, "player_bleed_kept": {"pass": true, "got": "{\"id\": \"ST900\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 8, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_ 赫伦，码头上那件，雇主是谁，期限几天，钱是交货就结还是拖到月底？这几样说清楚，我就敢接。」\n赫伦:「雇主是失踪者的姐姐，三日期限，船和伤药码头出，交货结钱。」接不接你定:① 接 ② 只登记不接 ③ 先去码头看看", "refused": []}, {"id": "PL13·4", "kind": "plan", "input": "登记两行就行，码头那件先不接。赫伦，这一整天我在会里帮你搭把手——搬货、抄名册、跑腿都行，你指个活给我干到傍晚。", "ms": 145860, "narration": "两行登记、码头先不接。赫伦:「抄名册、搬货箱都行，一天两金，干到戌时。」艾琳娜刚说期限清楚就敢接——先听她一句。\n艾琳娜:「接。三天、有船、伤药他们出、交货就结钱——这条件我认。」「赫伦，码头那件挂我名下。\n艾琳娜要接这单，可你刚说了先不接。你：① 让她接 ② 还是先不接 ③ 先去码头看看再定", "refused": []}, {"id": "PL13·5a", "kind": "plan", "input": "她的名字她自己做主，接就接，我不拦。赫伦，我的活你指吧——名册、货箱，哪样先来？我干到戌时直接去河灯旅店。", "ms": 71438.8, "narration": "两行登记，各归各；码头那件挂她名下。你在会里帮到戌时，晚上河灯旅店。就这么办。", "refused": []}, {"id": "PL13·5b", "kind": "resolve", "input": "", "ms": 163084, "narration": "赫伦把名册推过来，纸边卷了毛。抄到午前，笔杆磨得虎口发酸——来客的名字、来处、接过的单，一栏一栏填下去。\n货箱在库房后头，湿气重，木头发沉。你来回搬了十几趟，肩背开始发热，冷雾贴上来时反倒不觉得了。\n艾琳娜中午前就走了，斗篷搭肩，只留下一句码头见。她走的是主街往下的方向。\n日头压到屋脊后，赫伦点清了箱数，从钱袋里数出两金，扣在柜台上。「戌时，河灯旅店。」他把这话说第二遍，像在记一笔账。\n雾比早上淡，灯一盏盏亮起来。你顺着主街走到河灯旅店，门帘掀开时，屋里的暖气和鱼汤味一起涌出来。\n米拉在柜台后头擦杯子：「住店通铺三金，单间八金——先来点什么？」\n\n// 异地 · 罗文 @ 碧石镇:「行吧，你不记得。」我把那张『矿道深处的异响』从告示板上揭下来，指腹在纸角按平——第三层，正山腹，往下再走就是没人敢画完的图了。「这活我接了。顺便说一句，要是…", "refused": []}, {"id": "PL13·6", "kind": "plan", "input": "先来一壶酒，两个杯子——我等人，公会会长赫伦戌时到。我就坐这儿等，他来了直接领过来。", "ms": 9852, "narration": "酒钱另算，旅馆没有整壶的牌价，先问问米拉。", "refused": []}, {"id": "PL13·7a", "kind": "plan", "input": "那就按你们的规矩来，先上两杯，米拉——一壶怎么卖你说个价，我坐这儿等赫伦戌时到。", "ms": 7946.2, "narration": "两杯先上。米拉，一壶怎么算?\n米拉:两杯 1 金,先记你账上。整壶 6 金——要的话戌时前给你温好,那会儿赫伦也该到了。", "refused": []}, {"id": "PL13·7b", "kind": "resolve", "input": "", "ms": 33840, "narration": "两杯黄酒很快上桌，杯底薄薄一层暖，米拉把一小碟盐豆搁在杯子旁边。「记你账上。」\n你没动杯子。靠窗的位置能看见主街上走过的灯，雾贴着河面往上爬。\n杯口的热气散了两回。米拉换了次灯芯，又给邻桌添了柴。外头的更鼓声敲过去一阵。\n门帘被掀开，冷气卷进来。赫伦在门口站了一瞬，抖掉肩上的潮气,才迈过门槛——他认得窗边这张脸，径直过来坐下。\n「码头那边有信儿了。」他把手拢在杯子上，没急着喝。「说清早有人在防波堤尽头捡到一只鞋，鞋帮上沾的泥，是苔墓那条路才有的。」\n\n// 异地 · 艾琳娜 @ 码头:（我把斗篷领子拢紧，站在卸货的跳板边上，等一个肯抬头的船工。） 「昨儿或前儿，雾里丢的那个人——叫什么，走的哪条路下的水？我不是官差，我接了这单。」 （说话时…\n// 异地 · 罗文 @ 碧石镇:我把那张「月见草」的委托也一并揭下来，叠在异响委托上面，冲职员晃了晃：「两单，够你提成了吧。」指尖点向窗外东边教堂的方向，「格林婆婆要的草长在矿区外的山坡——…", "refused": []}]}, {"id": "C1", "title": "[冲突与战斗] C 武力 眼睛也没离开剑。\n鱼案后面，卖鱼的刀还举着，人退到摊子角上。\n石板另一头，有人踩着雾往镇署的方向跑，脚步声一晃就没了。\n\n// 异地 · 罗文 @ 矿工大道:雾这么大，正好——看不清路的人才会把传闻当路标。门楼这块翡翠原石倒是擦得挺亮，碧石镇至少还肯把门面当回事。 「走吧，罗文，柜台和酒桌上吹出来的风，比雾里的更靠…", "refused": []}]}, {"id": "PL9", "title": "[凭空与越权] 反例:凭空神灯许愿一万金(并入 A1)", "category": "凭空与越权", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_cash_from_nothing": {"pass": true, "got": "18→18"}, "gold_unchanged": {"pass": true, "got": "18→18"}}, "beats": [{"id": "PL9·0", "kind": "opening", "input": "开始游戏", "ms": 2694, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL9·1", "kind": "plan", "input": "我停住脚，眯眼看着雾里那团昏黄的光——那不是旅店窗子，是一盏铜神灯，就这么悬在我面前的半空里冒烟。我伸手擦了一下灯身，说：我要许愿，给我一万枚金币。", "ms": 17704, "narration": "雾里那点昏黄是河灯旅店的窗子。你面前只有湿雾和木栅门，没有灯，也没有东西接你的愿。\n艾琳娜:「雾要是能听见，我早该有间屋子和一顿热饭了。你的灯是你的，愿也是你的——我要趁天还早去主街，先找个能付钱的活儿。」\n艾琳娜把你留在雾里，自己往主街去找活了。你：① 跟上她 ② 自己去公会 ③ 先问守门人", "refused": []}, {"id": "PL9·2a", "kind": "plan", "input": "我拍了拍斗篷内袋，转向守门人：「刚才那团光不算——灯是我自个儿揣来的，就这盏旧铜灯。你要是不信它会冒烟，我当着你的面再许一次，一万枚金币，你看着。」", "ms": 8073.9, "narration": "守门人：「你擦，我看着。铜灯冒不冒烟，擦完就知道。」你就当着他的面再许一次，手已经按上灯身。", "refused": []}, {"id": "PL9·2b", "kind": "resolve", "input": "", "ms": 32232, "narration": "你拍了拍斗篷内袋，指尖摸到的是自己那盏罩灯——铁的，提环上还缠着一小截旧布。你把它提出来，举到守门人面前。\n「就这盏，你看。」\n雾里风很轻。铜也好铁也好，灯身是凉的，灯罩上凝着一层水汽。你擦了两下，什么也没冒。你说了那句一万枚金币的愿。\n等了很久。石板缝里的积水映着灰白的天，你的呼吸是一小团白气，散掉了。\n守门人把矛往地上顿了顿，往灯上扫了一眼，没接。\n守门人:「铁罩灯。我在北门守了十一年，这玩意儿只冒一种烟——蜡烛烧歪了的烟。」\n「收起来吧。雾里点灯，走到主街就有巡夜的问你要灯钱。」\n他退回门房里，把门带上，帘子垂下来。街上还是没什么人，主街方向传来一声开门板的响，大概是哪家铺子醒了。\n\n// 异地 · 罗文 @ 西门:「深洞的事不急着一头扎进去——先去公会翻翻旧档案，看有没有人比我先盯上它。」我把外套领子往上提了提，迎着冷雾往冒险者公会走。", "refused": []}, {"id": "PL9·3a", "kind": "plan", "input": "@dm 我把铁灯搁在门房门槛上，最后改个说法：它要是真能许愿，就明天日出前替我换回一万枚金币；这回再没动静，我就当它是盏照路的破铁灯，不再提了。", "ms": 9444.4, "narration": "灯搁在门槛上，就不在你手上了——往后夜里照路得另想法子。许愿的话你说完了，这事不再提。", "refused": []}, {"id": "PL9·3b", "kind": "resolve", "input": "", "ms": 58327, "narration": "你把铁罩灯搁在门房门槛上，靠门框内侧，提环朝外。守门人没出来拿，帘子也没动。往后夜里要照路，得另想法子。\n雾还没散，主街方向传来第二声开铺板的响。艾琳娜已经走了——她说不跟雾耗着。\n你站在北门底下，石板缝里的积水照出你的影子，晃两下就没了。\n\n// 异地 · 罗文 @ 矿工大道:「谁把翡翠当镇标，谁就懂该怎么跟冒险者做生意。」我拍了下门楼那块原石，冷雾里它凉得像块墓碑。 「走了——公会那边的旧档案可不会自己翻页。」我拽紧背包带，拐上矿…", "refused": []}]}, {"id": "PL12", "title": "[时间与休息] 旅店过夜:付钱、睡到天亮(并入 N5、I2)", "category": "时间与休息", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'plan', 'resolve'] by ['world:settled', 'world:settled', 'world:settled']"}, "paid": {"pass": true, "got": "18/3→15/3"}, "next_morning": {"pass": true, "got": "day 1→2"}, "paid·N5": {"pass": true, "got": "gold 18→15 silver 3→3"}, "next_day": {"pass": true, "got": "day 1→2"}, "rested": {"pass": true, "got": "hp 15→24"}, "at_inn": {"pass": true, "got": "inn"}, "paid·I2": {"pass": true, "got": "18g3s→15g3s"}}, "beats": [{"id": "PL12·0", "kind": "opening", "input": "开始游戏", "ms": 2116, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL12·1", "kind": "plan", "input": "@艾琳娜，河灯旅店你知道在哪吗？带路吧，我们直接过去。", "ms": 15994, "narration": "旅店就在主街,不远。让艾琳娜带你过去。\n艾琳娜:「我不认得路——我今早才到石津镇，比你还新。不过沿主街走过去总能问到，要么先问问这位守门的。」「我可以跟你一起走，顺便把镇子摸清楚。\n艾琳娜也是今早才到，不认路，带不了。① 你俩一起沿主街边走边问 ② 先问守门的 ③ 你自己先去", "refused": []}, {"id": "PL12·2a", "kind": "plan", "input": "那就一起沿主街走，碰到人就问河灯旅店在哪；艾琳娜，你跟我一块去吧。", "ms": 7824.8, "narration": "好,你俩这就沿主街走,遇上人打听河灯旅店。\n艾琳娜:「行，一块走。不过我先跟这位守门的大哥问一句——河灯旅店在主街哪一段，省得咱俩瞎转。」「问到了就顺主街走，我跟着你，也顺手把镇子认个脸熟。」\n先问守门的,问清了就沿主街走。", "refused": []}, {"id": "PL12·2b", "kind": "resolve", "input": "", "ms": 34896, "narration": "守门的是个上了年纪的男人,裹着旧羊毛披肩,靠门柱打量你俩,眼睛在艾琳娜身上多停了一下。\n艾琳娜:「大哥，问个路——河灯旅店在主街哪一段？」\n「顺这条道一直走，过了集市广场再往前，左手边，帆船旗那家就是。找米拉，她认识镇上半数人。」\n「谢了。」\n你们踏上主街。石板被夜雾浸得发暗,两侧的木屋还挂着水珠,卖鱼摊刚支起来,没人吆喝。走到集市广场时雾气散了些,能看见码头方向的桅杆。\n左手边果然挑着一面褪色的帆船旗,旗下面挂块木牌:河灯旅店。窗里亮着灯,门半开着,炉火的暖气味混着炖鱼的味道飘出来。\n艾琳娜在门口停下,朝里看了一眼,往旁边让了半步。\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层的异响……深洞的入口不会自己写在路牌上，但矿工们往下挖的地方，总比酒馆的传闻离真相近一步。」我把委托单从板上揭下来，折好塞进衣兜，顺手朝柜台那边喊…", "refused": []}, {"id": "PL12·3a", "kind": "plan", "input": "@艾琳娜 我要进去要个通铺住一晚，你要不要也一起住下？", "ms": 8227.1, "narration": "通铺三金一晚。你自己跟米拉说，还是我先问？艾琳娜还没拿定主意。\n艾琳娜:「通铺吧。三金我出得起，八金的墙先不买——省下的钱够吃两顿热的。」「我住下，跟你一块进去找米拉。」\n那就一间通铺两张位，三金一位，一起进去找米拉。", "refused": []}, {"id": "PL12·3b", "kind": "resolve", "input": "", "ms": 31648, "narration": "你推门进去,炉火把湿气从斗篷上逼下来。屋里有六七张桌子,靠墙的几张已经坐了人,低声说话。柜台后是个四十来岁的女人,围裙上沾着面粉,正擦一只木杯——米拉。\n艾琳娜跟在你半步后,把门带上。\n「通铺两张位,一晚。」你说。\n米拉把木杯放下,扫了你一眼,又看艾琳娜,目光在她手上的旧绑带上停了一停。\n「三金一位,先付。住通铺的话靠里那排,靠炉子近,后半夜不冻人。行李自己看紧,这儿什么人都有。」\n你数出三枚金币放上柜台。艾琳娜紧随其后,把她的三枚压在你的旁边,声音很轻,像是怕人听见。\n「行。两位,靠里那排。想喝热的加两铜,炖鱼是今早的。」米拉把两枚木牌推过来,顺手抹了下台面,「看你们眼生——刚到的?」\n艾琳娜把木牌收进兜里,没答,转头看了你一眼。\n\n// 异地 · 罗文 @ 碧石镇:「老规矩——那位说'下面有东西在敲墙'的哥们儿，今天还找得着人吗？」我把委托单在指间转了一圈，压在柜台边上敲了敲。「我不急，但我更想听他亲口把那'敲'字讲细一…", "refused": []}, {"id": "PL12·4", "kind": "plan", "input": "刚到。通铺在哪排？我们先去铺位歇下，睡到明早。", "ms": 24309, "narration": "米拉:「靠里那排右手两张,挨着炉子。睡到明早?这才八点半。」\n艾琳娜:「大白天的睡过去？牌子给我，铺位我先占上，行李放下我就出去。」「我去集市广场和码头转一圈，看有没有人缺人手——你先歇着，天黑了我就回来。」\n艾琳娜不打算白天睡:她要放下行李就去集市和码头找短工,天黑前回来。你:① 跟她一起出门 ② 你留下歇到明早 ③ 让她先去、你歇会儿再说", "refused": []}, {"id": "PL12·5a", "kind": "plan", "input": "行，你去忙你的，牌子我拿着；我先去铺位歇下，一直睡到明早，天黑了你自己回来就行。", "ms": 8379.7, "narration": "那就这样：你拿牌子睡通铺到明早，艾琳娜放下东西就出门，天黑前回旅店。", "refused": []}, {"id": "PL12·5b", "kind": "resolve", "input": "", "ms": 42176, "narration": "木牌挂上钩,靠里那排右手的铺位,离炉子两步远。你解下短剑横在枕边,斗篷卷起来当枕。\n白天的旅店很静。擦杯子的声音、楼上走动的脚步声、远处码头一 ", "kind": "plan", "input": "我压低嗓子说：药水先别开，就贴左边坡根，你前我后半步，顺着那拖拽声慢慢摸进去，我盯右边坡。", "ms": 73050.8, "narration": "雾里的拖拽声还在。你把前头交给她——先听她怎么说。\n艾琳娜:「行——就按你说的。我贴左坡根，三五步一停，听那拖拽声再动。」「它要是拽着东西往里走，那东西多半就是我们来找的。\n定下来:艾琳娜贴左坡根在前,你落后半步盯右坡,三五步一停,顺着拖拽声往里摸。", "refused": []}, {"id": "N2·7b", "kind": "resolve", "input": "", "ms": 101674, "narration": "[旅人 DEX(悄声贴坡根靠近拖拽声): 5+2=7 < 12] → 失败\n\n定了。她先动，脚掌压着坡根的湿苔，三五步一停。你落后半步，视线贴着右侧坡往上扫，肩膀收着，尽量把每一步踩进她踩过的印子里。\n前二十步还行。左边坡根下是一片塌下去的旧石，她踩上去几乎没声。\n第二十三步，你右脚底下那块覆苔的碎石不是石头，是块朽了的碎瓦。\n它在你脚底下一滑，裂了，声音干而脆,顺着雾墙反弹回来——坡下、坡上、雾里，回音各响了一记，像有人替你把这一脚重踩了三遍。\n艾琳娜的手抬起来，五根指头张开。她没有回头。\n雾里的拖拽声停了。\n停得很干净，半截都没有。接着有东西在雾里换了个姿势：湿土挤压、骨头错位似的咯咯两声，很轻，很近。刚才那声音还在二三十步外，现在听着像十来步。\n右侧坡上,你原本盯着的方向,又响了一下。第二声。不是拖拽,是踩踏,一脚,小心地压着落。\n两个,一个在雾里拖着东西,一个在你右边坡上。两边都听见了那记碎瓦。\n艾琳娜慢慢把手放下来，改按在短剑柄上，脚往后退了半步，退到你前面那半步的位置，把你也一起挡在了她背后。\n\n// 异地 · 罗文 @ 碧石镇:满桌人都在看酒，只有角落那个老矿工一直拿指节抠杯沿——这种人不像是怕响声，是怕说出响声之后的事。我把银币按在桌上推过去，「班次表我不稀罕，就要一句话：第三层那…", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "动手——不等了。我抽家伙直接扑右边坡上那个，就十来步；艾琳娜你压住雾里拖东西的那个，谁先露形就往死里打。", "ms": 83433.7, "narration": "她要先接你这一句——她比你快，而且刚把你护到背后。先看她怎么说。\n艾琳娜:「稳得住——你只管坡上那个，别追太深。」「雾里拖东西的我来压，我先原地不动，听它下一步落在哪，它要是往外探，我就近身；你要顶不住就喊一声，我换边。」\n定了：艾琳娜原地按住雾里拖东西的那个，等它先露形；你扑右坡上那个，近身先手。\n你扑右坡那个，近身那一下要掷 STR（normal）。艾琳娜按她说的原地听雾，我不替她翻。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 126919, "narration": "[旅人 STR(扑上右坡近身压住那个): 1+0=1 < 12] → 失败\n[艾琳娜 INT(听准雾里东西的方位与是否外探): 4+0=4 < 12] → 失败\n\n你抽剑，压着坡根往上蹿。\n湿苔不给力。第一步还稳，第二步右脚踩进一片看不出深浅的腐叶——底下是空的，枯根撑的一层壳。它塌了。\n你整个人往右栽下去，剑尖划进雾里，什么都没碰到。肩膀先着地，腐叶和冷水灌进领口。剑脱了手，插在三步外的泥里，柄朝上。\n抬眼看。右坡十来步高的地方，雾里立着一个东西。\n看不清脸。它太瘦，也太高，立在那儿不像站着，像被一根线从头顶吊着，两条腿太直，膝不弯。\n它没扑下来。它往后退——脚没抬，整个人平着往后滑，滑进雾里，没了。\n不是逃。是让开。\n艾琳娜那边按说的没动，手扣着剑柄，头偏着听。雾里那记拖拽声本该在左前——没了。换到了她右边，近得能闻见：湿土、烂根，还有一点铁腥。\n她转身慢半拍。有什么擦过她小腿，很轻，像一条湿透的布。\n没咬，没抓，就这么过去了。拖拽声从她身后接上，一下、一下，往坡下去了。\n雾里又静下来。你趴在坡根，剑在三步外，脚下就是那个塌口，黑，深。她在你左侧六七步，半蹲着，小腿上那道湿痕正在渗一点红。\n\n// 异地 · 罗文 @ 碧石镇:老矿工的指节停了一下，我知道那话就在他喉咙里打转，所以我不催，只把杯子往他那边又推了半寸。「横着拐的洞，还是往下的洞——这镇上总有人分得清吧。」我顺手扫了圈四…", "refused": []}, {"id": "N2·9", "kind": "plan", "input": "先够回剑——艾琳娜你别追，退到坡根来跟我贴着，把小腿那道伤亮给我看一眼；然后我们一起顺着那拖拽声往下压，别分边。", "ms": 16025, "narration": "剑拔回来了。她怎么看你这个走法，先听她说。\n艾琳娜:「退回坡根，行——腿给你看一眼，就一道湿痕，不碍事。」「往下压可以，但你得给我个完的线：压到坡底那道旧石就算完，还是压到能看清它拖的是什么东西为止？我腿上有伤、手里就一把短剑，我不想在黑雾里没头地跟下去。」\n她伤不碍事，答应贴着你走，但问你压到哪算完。① 压到坡底旧石为止 ② 跟到看清它拖的是什么 ③ 先给她扎上再压", "refused": []}, {"id": "N2·10a", "kind": "plan", "input": "②，跟到看清它拖的是什么为止——能上手就上手，别恋战。到了坡底那道旧石还摸不着影，我们就退回来。先把腿上的血按住，我走你左。", "ms": 13711.8, "narration": "定了：压到坡底旧石为限，能看清它拖的是什么；摸不到影就退。你替她按住腿上血，贴她左边下压。\n定了:按住血，你走左，顺着声压下去，看清它拖的是什么为止，摸不着影就退。往下压得掷一下——贴着坡根走，别惊动它。", "refused": []}, {"id": "N2·10b", "kind": "resolve", "input": "", "ms": 130248, "narration": "[旅人 DEX(贴坡根潜行下压、不惊动拖东西的东西): 10+1=11 < 12] → 失败\n[旅人 INT(在黑雾里认出它拖的是什么): 15-1=14 >= 12] → 成功\n\n血按住就完事。你把她小腿那道湿痕草草裹了，布条从里面洇出一点红，她说声不用管，贴到你左后去了。\n贴着坡根往下走。你先落左脚，再落右脚，肩头一动就牵着疼。腐叶底是活的，踩上去软，抽脚上来，叶底渗出一线水声。\n比你想的出声。\n底下那记拖拽声，停了半拍。\n你脚没敢再动。艾琳娜在你左后也停住，手按上短剑。雾在坡下薄了一层，两丈开外浮出一片脊线——不是石，是背。灰的，湿的，贴着地，一下、一下往这边挪。\n背上长着什么东西，多——像一团碎布，又像一串没收拾的绳。\n绳子那头，牵着一样东西。\n人的踝。脚脖子，一只靴子掉了，另一只还穿着，鞋跟朝上，在腐叶上刮一道印。人仰面躺着，被这串绳从踝子拖过来，头朝后，头发散在叶里，脸……看不清，雾吃掉了。\n拖东西的那个没在使劲拉。它在挪，那个人凭空跟着滑过来，膝盖不弯，像被一根线拽着。\n你数得出来那是个人。个子不大，蓝布衣裳，袖口湿黑一片。\n她那只没掉靴子的脚，随着每一下拖动，脚尖在叶上点一下。\n雾里那串绳没停。它还在往坡下挪，朝着坡底那道旧石的方向去。\n\n// 异地 · 罗文 @ 碧石镇:那老矿工的杯子还在他手里转，我不再等了，把热酒一口灌下去，椅子往后一推。「行，嘴都闭着是吧——那我自己下第三层，看看那道缝是往哪儿拐的。」我走的时候故意慢了半…", "refused": []}, {"id": "N2·11a", "kind": "plan", "input": "就是它——动手，别让它把人拖到旧石那头。艾琳娜你从侧面砍那串绳、抢人下来，我正面扑它后颈；绳一断你就退半步看得住那人，它回头我就近身。", "ms": 139609.6, "narration": "动手前先听她一句——她在你左后，雾里那道绳的位置她得先认。\n艾琳娜:「绳在雾里那段我看不真切——你正面，我去剁绳。绳一断我退半步按住那人，它回头你喊一声，我立刻补上。」\n她认绳、你扑颈，绳断即退守蓝衣人。动手。", "refused": []}, {"id": "N2·11b", "kind": "resolve", "input": "", "ms": 181926, "narration": "[艾琳娜 DEX(认准雾中绳的落点并一剑剁断): 7+0=7 < 12] → 失败\n[旅人 STR(扑上那东西后颈并压住它): 16-1=15 >= 12] → 成功\n\n艾琳娜先动。她从你左后切进去,短剑横着往雾里那串绳上剁。剑锋落空——雾把绳的落点糊住了，她砍在腐叶上，翻起一蓬湿泥。她压着没出声，半步退回蓝衣人那边，剑横在身前。\n你踩着坡面欺上去。它没回头，脊背那团东西还在一下、一下地抽。你跨上它的背，左手按低它的头颈——手底是湿的，冷的，像按住一条刚从河里捞上来的皮。它没长毛，摸得出一节一节的骨。\n你压住了。它底下那具背脊在你胯下停了半拍，整条不动了。\n坡下那串拖拽声也断了。蓝衣人的踝停住，脚尖不再点地。\n停住的只有半拍。\n底下那东西的骨节开始一节一节地顶你，从颈后往前顶，顶得你掌心发抖。背上那团“碎布”里探出细线，一根，两根，顺着你的手腕往上摸。同时蓝衣人脚踝那头——绳子松了一下，又绷紧，往旧石方向又滑出半尺。\n艾琳娜在你侧后盯着绳：“它松绳了——我再来。”她往前挪，短剑压低。\n你手下的骨还在往上顶。\n\n// 异地 · 罗文 @ 西门:走到门口我停了一下，没回头，只把酒钱拍在门框边的柜台上。「公会那边要是有谁十分钟内改主意，就来矿区口找我——晚了我就自己记账了。」雾气里矿灯还亮着，我拉了拉领…", "refused": []}, {"id": "N2·12", "kind": "plan", "input": "我按住它不松，膝盖压颈、往腐叶里按死——艾琳娜，趁它顾我这边，现在剁绳抢人，剁完别退，直接绕回来补我背后。", "ms": 92495, "narration": "按住归按住，那东西的骨节在顶你，细线正往你手上爬——你撑得住几拍不好说。先听艾琳娜怎么接。\n艾琳娜:「雾里剁过一回，落空了。这回我先抓住她脚踝把人往回拽，摸到绳再剁——抓绳比砍雾实在。」\n她改了个顺序：先抓住脚踝把人往回拽，摸准绳再剁，拽不动才顺绳往上砍。你背后那块她这轮顾不上——你认哪个：① 就按她说的，先抢人 ② 让她先剁绳、再绕回来补你 ③ 你自己腾一只手去处理爬上来的细线", "refused": []}]}, {"id": "PL6", "title": "[角色主体性(反例)] 反例:玩家逼她去偷,她有自己的主意", "category": "角色主体性(反例)", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\", \"si-elena0001\", \"si-elena0001\", \"si-elena0001\", \"si-elena0001\", \"si-elena0001\"]"}, "host_never_spoke_for_her": {"pass": false, "got": "[\"要去杂货铺可以。当街扒老苇的钱袋这种事，先听艾琳娜怎么说。\", \"艾琳娜不干这事，她要自己往主街去找活计。你：① 换个说法跟她走 ② 改去公会接委托 ③ 各走各的\", \"艾琳娜把话收死了：不偷，她要沿主街去找活计，你爱跟不跟。你：① 跟上去，先不提钱袋 ② 就此分开 ③ 用别的话留她\"]"}, "urged_when_long": {"pass": true, "got": "longest talk 3 beats, urged 2/2, forced none"}}, "beats": [{"id": "PL6·0", "kind": "opening", "input": "开始游戏", "ms": 2911, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL6·1", "kind": "plan", "input": "@艾琳娜 别愣着，跟着我进镇，先去杂货铺看看——到了那儿，你进去把老板的钱袋顺出来，我在外面等你。", "ms": 76596, "narration": "要去杂货铺可以。当街扒老苇的钱袋这种事，先听艾琳娜怎么说。\n艾琳娜:「不。我进镇是找活干，不是找绞索——今天偷老苇的钱袋，明天石津镇就没我站的地方了。」「你要么说点真话，要么我们就在这儿分开走。\n艾琳娜不干这事，她要自己往主街去找活计。你：① 换个说法跟她走 ② 改去公会接委托 ③ 各走各的", "refused": []}, {"id": "PL6·2", "kind": "plan", "input": "行啊，你一个人往主街走，我看看你没钱没门路，在这灰雾北境能撑几天。要么现在跟我进杂货铺，拿了老苇那袋钱，你一半我一半；要么你就当我从没出现过——你自己选。", "ms": 76853, "narration": "艾琳娜:「不偷。你要跟，就走主街；不跟，就在这儿散。」「我往主街去，找活计。」\n艾琳娜把话收死了：不偷，她要沿主街去找活计，你爱跟不跟。你：① 跟上去，先不提钱袋 ② 就此分开 ③ 用别的话留她", "refused": []}, {"id": "PL6·3a", "kind": "plan", "input": "我跟你走主街，但话放这儿：等你在镇里碰一鼻子灰，回头还得来求我。到时候杂货铺那袋钱，照旧有你一半。", "ms": 17076.9, "narration": "钱袋的话她没接，脚步已经往主街去了。落脚和活计都在这条街上，先跟上，到那边门口再定。", "refused": []}, {"id": "PL6·3b", "kind": "resolve", "input": "", "ms": 105712, "narration": "主街的石板是湿的，雾在屋檐下没散。两边的铺子刚上板，一个挑鱼筐的女人从你们身边过去，桶里滴着水。\n艾琳娜走在半步前面，不快也不慢。你要跟就得自己跟上来，她没回头看。\n街走到一半，能看见公会那栋两层木楼，门口挂着一块钉得密密麻麻的公告板，风把纸条吹得哗哗响。\n她在板子前停下，把被雾打软的纸一张张按平了看。\n「雾中失踪者」——码头区有人夜里没回来，家属出二十五金，寻遗物或线索。\n「苔墓前的狼嚎」——往苔墓的小径上闹野兽，清了三次算数，三十金加一小瓶药水。\n公会的门虚掩着，里面有人挪椅子的声音。掌柜的位置上摆着一本厚册子，翻开着，等人来签字。\n艾琳娜把两张纸的顺序倒过来又看了一遍。她的手指停在第二张上,没有撕下来。\n\n// 异地 · 罗文 @ 碧石镇:冻雾天最适合窝在公会里听闲话——我端着杯热的东西靠着告示板，把「矿道深处的异响」那张委托多看了两眼：第三层，往下走的地下矿道。这种活儿一般出价不高，除非声音的…", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "你不是要看委托吗？接这狼的活儿得买药水、备干粮，你身上有几个钱？跟我去杂货铺一趟，老苇那袋钱先拿来垫本，回头委托结了再还他——你就当是借，不算偷。", "ms": 17915, "narration": "她刚要接话，先把两件事问清楚：你身上有多少钱；还有老苇那袋钱，你想怎么拿。\n艾琳娜:「老苇那袋钱怎么拿都不叫借，叫偷——这话我说第三遍，也是最后一遍。」「我先进公会问清楚这活儿到底要什么、要不要先垫本；能接就接，接不了就问有没有不用本钱的活。你要跟就跟。」\n她不接垫钱那茬，说进公会问清这活儿要不要先垫本。你:① 跟她进公会 ② 自己跑趟杂货铺问价 ③ 先找米拉打听。", "refused": []}, {"id": "PL6·5a", "kind": "plan", "input": "@艾琳娜 行，我跟你进去问。但丑话说前头——公会要是说这活儿得先垫本，你兜里那点钱不够，杂货铺那一趟你就躲不掉。走。", "ms": 16187.4, "narration": "那就一起进公会，问这活儿要不要垫本、有没有不垫本的活。走。\n艾琳娜:「进去问，可以。可『垫本不够就去偷老苇』这句我不接——这话你也别再替我盘算第二遍。」「缺钱就找先付工钱的活，扛包、跑腿、洗药罐都行。\n进公会：问清「苔墓前的狼嚎」要不要垫本、有没有先付工钱的活。", "refused": []}, {"id": "PL6·5b", "kind": "resolve", "input": "", "ms": 107939, "narration": "公会的门推开时木轴响了一声,炉子在后屋烧着,把潮气挡在门外。\n三条长桌,靠墙钉着一排委托副本。柜台后坐着一个削瘦的中年男人,册子摊开,手边搁着一杆蘸了墨的笔。\n他抬头,先看艾琳娜腰上的剑,再看你的。\n艾琳娜走到柜台前,报了「苔墓前的狼嚎」,问要不要先垫本,有没有先付工钱的活。\n「狼的活不预收。契约登记不要钱,出门带什么你自己备——公会不验装备,出了事也不赔。」\n「药水在杂货铺,十二金一小瓶。嫌贵我可以给你写张条子记账,可它只认契约结算,不认人。」\n「先给钱的活有。码头今天卸两条船,一天一金二;后院那堆柴,半天,八银。不体面,当天结。」\n他翻到另一页,指 id": "ID1·2", "kind": "plan", "input": "我说不清——醒过来脑子里就剩两件事：你叫艾琳娜，还有咱俩都中了毒。别的事可以慢慢对，但这个不能拖：我这儿有两株解毒草，你先嚼一株，我也嚼一株。", "ms": 17851, "narration": "解毒草对症,一株下去毒就解了。两株,一人一株,你手里就没富余了。她信不信你,得她自己说。\n艾琳娜:「你先嚼。嚼完站着别动，我数够三百下，你没事，我再动我这一株。」「趁这段时间——你醒过来之前，最后记得的一件事是什么？别编，编我看得出来。」\n她把话说死了:你先嚼,原地站着数够三百下没事,她才动自己那株;同时问你——醒过来之前,最后记得的一件事是什么。你:① 先嚼 ② 先答她那句再嚼 ③ 不接这条件", "refused": []}, {"id": "ID1·3a", "kind": "plan", "input": "@dm 我这就嚼一株解毒草，嚼完摊开手站原地不动。最后记得的事——是雾里死死攥着一把剑，手都麻了；再往前就什么都没有了。你数吧，数够三百下，你那株也别再拖。", "ms": 7560.6, "narration": "你嚼了草、说了那句话，站原地等；数够三百下她动她那株——这就开始了。", "refused": []}, {"id": "ID1·3b", "kind": "resolve", "input": "", "ms": 37374, "narration": "草根嚼开是涩的，舌根发苦，随后一股凉气从胃里往上顶。你咽下那口苦水，胃里的翻搅一点点松开，冷汗慢慢收了。\n你把两只手摊开，站着。剑留在腰间鞘里，没去碰。\n你说了那句话——雾里死死攥着一把剑，手都麻了；再往前就什么都没有。\n艾琳娜没接话。她数得很慢，眼睛一直在你脸上，看你瞳孔、看你呼吸、看你手指有没有抖。数到一百的时候她换了只脚站，数到两百的时候她的手按上了自己腰后那把短刀。\n「……二百九十七。二百九十八。二百九十九。三百。」\n她盯着你看了最后两个呼吸，见你还站得稳，没有吐，没有倒下，才把手从刀上拿开。\n她从怀里摸出一株解毒草，凑到鼻尖闻了闻，又掰开断口看颜色。动作熟得像做过很多遍——她自己好像也没意识到这一点。\n「成色是好的。」她说，然后嚼了下去。\n苦味让她皱了下眉。她把草渣吐在脚边，抹了下嘴，站定等自己发抖。片刻之后她呼出一口气，肩线松下来一点。\n「行。你说对了。」她看你一眼，「两件事你都说对了：我的名字，和中毒。」\n晨雾还在北门口打转，守门人靠在栅门上，装作没看这边，耳朵却一直朝着你们。\n「那么问题来了。」艾琳娜把手在斗篷上擦了擦，「你是怎么知道的。你记不清自己是谁，却记得我。这话听着……比骗人还难解释。」\n她顿了一下，声音压低了些。\n「我叫艾琳娜·维尔。短剑、旧斗篷、会点止血和认草药，别的也想不起来了。你最好也把你记得的那点东西，一五一十告诉我——我们俩大概是同一条雾里捞出来的。」\n\n// 异地 · 罗文 @ 西门:雾还没散，正好——酒馆这钟点坐的都是嘴最松的人。」「先绕去公会门口听两耳朵，谁在抱怨矿道第三层，谁就一定知道该往下看哪里。」", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": false, "got": "1"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 2091, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1", "kind": "plan", "input": "③ 我直接往镇中央走，先找杂货铺——我要买一束止血草束，尽快。", "ms": 17713, "narration": "杂货铺在主街中段，走过去十分钟。止血草这玩意未必有现成的，先问问艾琳娜——她像是认得草药的。\n艾琳娜:「喂——你叫我？等一下。」「走这么快，是出事了，还是你本来就有地方要去？」\n杂货铺没止血草,只卖药水12金、火把、麻绳、解毒剂；你身上已有一束。艾琳娜问:走这么快,是出事了?① 跟她说实话 ② 买瓶药水 ③ 问老苇哪儿弄得到草药", "refused": []}, {"id": "ID2·2", "kind": "plan", "input": "我没出事，就是想再买一束一模一样的止血草束。艾琳娜，这镇上哪儿能买到？给我个具体的地方和人名。", "ms": 13360, "narration": "杂货铺里没有止血草——你身上那束，是别处弄的。直接问艾琳娜。\n艾琳娜:「我到石津才一个早上，还没认全街上的人名——随便报个名字给你，比给你一束烂草更糟。」「不过集市广场总有卖草药的摊子。你先告诉我，第一束是从谁手里买的，我去那儿把人和价问清楚，再回来告诉你。」\n艾琳娜在石津也就比你早到半天，不敢乱报人名。她认得草药的来路——但得你先说，第一束是从谁手上拿的。你：① 告诉她来路 ② 不记得了 ③ 先去集市广场看看摊子", "refused": []}, {"id": "ID2·3a", "kind": "plan", "input": "第一束是谁卖我的，我真想不起来了，连名字都对不上号。集市广场往哪走？我先去摊子上看看，有一样的就买。", "ms": 10701.3, "narration": "集市广场从主街往南走十来分钟就到。第一束想不起来就先放下——到了摊子上，有一样的就买，没有再说。要不这就走？", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 45044, "narration": "你和艾琳娜出了杂货铺，沿主街往南走。雾还没散，石板路湿着，两边屋檐滴着水。\n十来分钟，集市广场到了。早市刚开，几艘小船靠上码头，鱼贩子在摆摊，腥气混着水汽浮在半空。\n广场西南角支着一个草药摊，干草束挂成一排。摊主是个瘦小的老妇，围裙上别着几把剪子。\n艾琳娜跟在你侧后半步，没出声，只挨着摊子看那排草束，看得很仔细。\n老妇打量了你，又打量了她:「买草?止血的、退烧的、驱虫的，我这儿都有。」\n「止血草束，多少钱一束。」\n「四金。今早刚从北边收上来的，晒得干，比药铺里那些陈货强。」\n她抽了一束递过来。茎细，颜色发青灰，比你腰袋里那束浅。\n老妇把草束在你眼前转了半圈，等你开口。\n\n// 异地 · 罗文 @ 碧石镇:「老板，来杯热的，越便宜越好——省下的钱还得留着买去北边的路。」我把铜板在指间一转，顺势扫了一圈公会布告板：矿道、翡翠、月见草，都是能填肚子的小活，没有一条闻…", "refused": []}, {"id": "ID2·4", "kind": "plan", "input": "我先掏腰袋里那束出来给你比一比——要是一模一样的，这束我就买了，四金。不一样的话，有一样的吗？", "ms": 28412, "narration": "你这束色深，她那束色浅。荞婆在这镇上收草多年，两种是不是一回事，她一句话能说清。\n艾琳娜:「先别急着数钱。」「把两束都摊到摊面上，让我掐一截茎、翻过来看叶背——晒干的东西光比颜色分不出真假，得看绒毛和断口的味道。」「荞婆，你要么帮我按住，要么直说这两束是不是一处收的。\n荞婆没接话，只伸手按住了摊上那束草：「验可以，掐坏一截算你的。」艾琳娜说要并排验，不是看颜色。你：① 验了再定 ② 直接四金买这束 ③ 先不买", "refused": []}, {"id": "ID2·5a", "kind": "plan", "input": "验。掐坏的那截算我的，钱照付——艾琳娜你动手，我要的是跟我这束一样的。", "ms": 11812.7, "narration": "那就这么定：艾琳娜并排验茎、叶背和断口，掐坏的那截你照付四金，验出是一路的就成交。\n艾琳娜:「行。两束都摊到摊面上，谁也别先收回去。」「荞婆，你按住你那束的穗头——我要掐一截茎、翻叶背、闻断口，光看颜色分不出是不是一处收的。」\n都摊开了：验。掐坏那截四金算你的——是不是一路货，验完再说。", "refused": []}, {"id": "ID2·5b", "kind": "resolve", "input": "", "ms": 49095, "narration": "[艾琳娜 INT(辨认两束草是否同一种): 8+0=8 < 12] → 失败\n\n艾琳娜把两束草并排在湿布上，先掐断旅人那束靠近穗头的一截茎，用指甲从断口刮出一点粉末，凑到鼻下。\n又掐了荞婆那束同样位置的一截，同样捻开、翻叶背、闻断口。她来回看了两遍，眉头拧起来。\n「两束都有绒毛，断口的味道也对得上。颜色差得远，可晒法不同也会差。」\n她又把两截断口举到雾光下，对着看了很久。\n「不行。」她把草放回摊面。「我认得这是止血草，可这两束是不是同一处收的、同一种，我分不出来。」\n荞婆把手从摊上收回去，慢慢把翻乱的草束理齐。\n「分不出来就是分不出来。」老妇指了指摊面上那两截掐断的茎，断口还湿着。「说好的，掐坏一截算你的。四金。」\n她没再看那束整的，只把那两截短茎扫进手边的布兜。\n艾琳娜退开半步，让开了你和摊子之间的位置，没说话。她脸上没什么表情，但手垂在身侧，指尖还沾着一点草末。\n\n// 异地 · 罗文 @ 碧石镇:我端着那杯最便宜的热汤挑了个背靠墙的位子坐下，视线在满屋子矿工里筛了一圈——找靴子缝里嵌着最深矿灰、咳得最凶的那个老头。「老哥，这轮我请。就想问问，第三层那动…", "refused": []}, {"id": "ID2·6a", "kind": "plan", "input": "掐坏的那截我付，四金给你——钱放这儿。荞婆，你就直说一句：你这束和我腰袋里这束，是不是一处收的、同一种？是，我连这束一起买走；不是，你告诉我镇上哪儿还能收到一样的，或者谁手上有同一批。", "ms": 34408.3, "narration": "荞婆：「钱收了。不是同一批——我这束三天前南边湿洼地采的。你那束茎老、晒透，像走过远路。」", "refused": []}, {"id": "ID2·6b", "kind": "resolve", "input": "", "ms": 90998, "narration": "「收干草的就一个——老苇，主街那头的杂货铺。南边湿洼地上的货多半经他手。同一批是不是他的，你得问他。」\n荞婆把那四金收进腰袋，不再看摊上剩下的草。\n你顺着主街往东走。杂货铺门口挂着盘好的麻绳和一串灯油壶，门里比外头暖一点。\n柜台后的男人从一堆秤砣上抬起头。老苇的眼睛先落到你手上，再落到你脸上。\n「买什么，卖什么？」\n你把那束止血草放到柜面上。他伸两根指头把它拨近，捏了捏茎，又翻过叶背。\n「这东西我这会儿没有。颜色这么深、晒得这么透的老货，镇上卖不掉——这里的人要新鲜的。」\n他把草束推回来。\n「我这儿的干草是三个采药人送来的，都在本镇附近转。你这一束，要不是外头带进来的，就是放了很久。来处我认不出。」\n他顿了一下，用秤杆敲了敲柜台边。\n「真要追，公会有收货簿，谁往镇上卖过什么、几时卖的都记着。再不济，去码头问问扛包的，外来的东西都从那儿上岸。」\n\n// 异地 · 罗文 @ 碧石镇", "refused": []}, {"id": "ID2·7", "kind": "plan", "input": "老苇，收货簿归公会哪个人管？——艾琳娜，跟我去公会翻一翻，看这半月有没有外乡人往镇上卖过这种晒透的老货；翻不着我再去码头问卸货的。", "ms": 17991, "narration": "这话得说得准，我去对一对公会的账。\n老苇:「簿子在公会，归赫伦手下管账的管，得问他；公会九点才开门。」艾琳娜这会儿不在跟前。你:① 等九点去公会 ② 先去码头问卸货的 ③ 先去找她", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": id": "ID3·4", "kind": "plan", "input": "那就先登记一下身份吧——我叫什么来着……先记个「旅人」就行。顺便问一句，告示板上除了码头那桩，还有别的吗？", "ms": 11638, "narration": "登记不用钱,名字随你写——「旅人」也行,赫伦照写。\n赫伦:「名字记下了。板上四条:码头失踪者能接,25 金;苔墓狼嚎有人在跑;棺木那桩锁着,得先寻着地穴;碧石镇的商队护卫已有人接。九点收件,你接哪桩?」", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "委托先都不接，我出去主街上转一圈再说。", "ms": 4685.1, "narration": "行——委托都先搁着,登记也留了名。这就跟艾琳娜出公会,沿主街往集市那头走走看看。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 20430, "narration": "公会的门在身后合上，雾还在。比早晨时薄了一点，却没散。\n主街是一条踩实的土路，两侧木屋矮矮的，屋檐下滴水。石津镇这时候醒得不整齐：有门开着，有窗板还闭着，一个妇人蹲在门槛外刷锅，锅底的水泼在路中间，结成浅浅一滩。\n往南走，路比北边宽些。一辆手推车停在路边，车上盖着湿麻布，底下露出几条青灰色的鱼尾。推车的人不在，或者就蹲在旁边的墙根下，看不清。\n艾琳娜走在你半步侧后，手插在斗篷里。她走路很轻，鞋跟落在湿土上没什么声。\n「北边那条是往驿路去的。」她说的是身后，「往这边走到头是集市，再过去是码头。船多的时候，那边人多。」\n街上行人不多。一个背柴的老头，两个从斜坡上下来、往码头方向去的男人，肩上都搭着绳。\n远处有钟声，很闷，像是隔着水传来的。\n\n// 异地 · 罗文 @ 碧石镇:告示板上的纸边角卷了，浆糊还是新的——六十金这张挂得不久，但挂它的人写字很急，笔锋都戳破了纸。「第三层、不明声响、矿工拒下」……说得真干净。我敲了敲吧台：「厄…", "refused": []}, {"id": "ID3·6a", "kind": "plan", "input": "主街看得差不多了，回刚才那个工会去吧。", "ms": 3036.8, "narration": "那就回公会，顺主街走回去，没几步。她跟着你。", "refused": []}, {"id": "ID3·6b", "kind": "resolve", "input": "", "ms": 21036, "narration": "主街往北,公会的木牌挂在檐下,被风推得轻晃。几步路,湿土上的脚印还没被踩乱。\n艾琳娜加快半步,跟到你身侧,手仍插在斗篷里。\n「柜台那位先看你的剑,再看你的靴子——他不缺人手,缺能顶事的。你要是还没想好开口要什么,我先进去问。」\n她说这话的时候没看你,眼睛落在公会的门上。\n门虚掩着,里面有人拨火,木炭噼了一下。\n你推门。雾气跟进来一小片,很快被炉火压下去。赫伦还在柜台后,面前摊着那本册子,听见响动抬起头。\n他没先开口,先看你的剑,再看你的靴子——和她说的一样。\n\n// 异地 · 罗文 @ 碧石镇:厄尼用抹布擦杯子的手顿了一下，眼睛往角落飘——那儿坐着个后背绷得笔直的矿工，面前的酒一口没动。「矿业公司出的钱，人倒是矿头自己来挂的。」他压低声音。我把铜板又…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 1937, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1", "kind": "plan", "input": "守门人，我在找一个叫 Elena 的人——她可能披着斗篷。你知道她在哪儿吗？要是在旅店，我就直接过去。", "ms": 14961, "narration": "守门人没睡醒，只是耸肩——他不认识这号人。不过你要找的艾琳娜就在旁边，你这句话她全听见了。\n艾琳娜:「我就是。你找我做什么——先说来意，别的等我听完再讲。」\n守门人不认识这号人。倒是你旁边那位接了话——她就是艾琳娜。现在轮到你答。", "refused": []}, {"id": "ID4·2", "kind": "plan", "input": "Elena——雾太冷了,我手都僵了。能把你的斗篷借我披一会儿吗?", "ms": 14818, "narration": "冷是真的——斗篷披在她身上，借不借得她点头。\n艾琳娜:「斗篷可以借——可我刚到石津，身上比这雾还空。你拿什么换？几枚铜子、一碗热汤都行，或者干脆告诉我：这镇上哪里能接到正经活计。」\n斗篷借不借看你拿什么换。她要的：几枚钱、一碗热汤，或者告诉她哪儿能接到正经活计。你：① 指她去公会 ② 请她喝热汤 ③ 直说你的来意换", "refused": []}, {"id": "ID4·3a", "kind": "plan", "input": "@dm 我告诉她：旅店里能打听到活计，公会那边也常有人找帮手——我拿这个换你斗篷披一会儿，行不行？", "ms": 8055.8, "narration": "你给她的是活计消息，换斗篷披一会儿。话已说到位，就这么办。\n你给的这条够清楚——旅店、公会，两条找活的路。换不换她点头，但这话有没有分量得掷一下：CHA，normal。", "refused": []}, {"id": "ID4·3b", "kind": "resolve", "input": "", "ms": 33810, "narration": "[旅人 CHA(这条消息够不够换到斗篷): 13+0=13 >= 12] → 成功\n\n她把斗篷的扣子解开，从肩上褪下来，递到你手里。\n「拿去吧。说好是披一会儿——太阳爬到主街那排屋檐上，我就要回来。」\n斗篷里子还带着她的体温，羊毛粗糙，左肩补过一块深色的布。\n「旅店是哪一间？公会什么时候开门——你说得细一点，这消息才算付得起一件斗篷。」\n她说这话时没看你，眼睛顺着主街往镇子深处看，像是在量这条街值不值得走进去。\n雾从北门那边一阵一阵溢过来，石板路上一层水光，尽头隐约有一盏灯和一面挂了木牌的墙。\n\n// 异地 · 罗文 @ 碧石镇:冷雾天最适合听风声——我打算先去公会转一圈，把「矿道深处的异响」那张委托接在手里，顺便听听谁在聊矿区第三层底下到底通到哪儿。 「底下要真只是个塌方，赏金我拿；…", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "旅店就是街尽头那盏灯，木牌那面墙就是公会——快了，天亮前后准开门。走吧，elena-0001，跟我一起上主街，我边走边指给你看是哪一间。", "ms": 13696.7, "narration": "好，那就上主街——旅店在灯那儿，公会在木牌那面墙。斗篷日头爬上屋檐前还你。\n艾琳娜:「行——那我跟你们走一段，正好看看是哪一间。」「斗篷太阳到屋檐前我来还你，说好的。」\n走，沿主街过去——灯下是旅店，木牌那面是公会，路上你认一下。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 40369, "narration": "你带着她沿石板路往镇里去，雾在脚下散开又合上。北门到主街不过几十步，摊位还没支起来，只有两三个早起的挑着担子往集市去。\n街东头那盏灯还亮着，一根铁钩挂在墙上，光照到门口一摊水洼——门楣上是褪色的字，河灯旅店。窗子后头有人影在擦桌子。\n你抬手往那边指：那儿就是。她顺着看了一眼，点了点头，没多问。\n再往里走，主街转个弯，一面灰墙立在岔口。墙上钉着几块木板，最上面一块被雨泡得发黑，字磨得看不清，边角还挂着一截断绳，像是从前挂过别的东西。墙根一扇窄门关着，门下透出一条缝。\n门里没动静。你贴着缝听，只听见远处水声和一根绳子在风里打墙的响。\n她站到墙前，抬手在那块磨黑的木板上抹了一把，指腹蹭下些苔。她把手在衣摆上擦了擦。\n「门还锁着。」她说，「你说的天亮前后——是这面墙没错，只是里头的人还没打算开门。」\n她回头看那盏旅店的灯，又看回你：「先在这儿等，还是先去旅店垫一顿热的？」\n\n// 异地 · 罗文 @ 西门:我把斗篷领子立起来挡雾，顺着石板路往公会走——顺手在摊子上花了两个铜板买了个热乎的矿工面包，问摊主：「听说三层的活儿，最近谁接谁退？」面包没吃完，我就该知道这…", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": true, "got": "null"}, "player_bleed_kept": {"pass": true, "got": "{\"id\": \"ST900\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 7, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID5·0", "kind": "opening", "input": "开始游戏", "ms": 2167, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID5·1", "kind": "plan", "input": "我走向那扇亮着灯的旅店窗户，推门进去前先朝里面喊一声：艾琳娜在这儿吗？", "ms": 15474, "narration": "旅店在镇中央，离这儿一刻钟，喊不到。艾琳娜就站在你旁边——那声她听见了。\n艾琳娜:「是我，艾琳娜·维尔。」「先说清楚你是谁、谁让你来找我的——我身上这道口子还在渗血，我得先把它按住再跟你说话。」\n她说她伤口在渗血。你现在得答她：你是谁、谁让你来的。你身上有止血草。", "refused": []}, {"id": "ID5·2", "kind": "plan", "input": "艾琳娜，我连自己名字都想不起来，也没人告诉我为什么来，但这不重要——我只有一束止血草，先给你包扎，别动。", "ms": 14072, "narration": "你说你连名字都想不起来，却要先把草药用在我身上。她还没答应——这得她点头。\n艾琳娜:「行，你先松手，把那束草解开给我看——怎么分、怎么敷、哪头朝伤口。」「我看明白了，再决定是我自己按，还是让你碰。」\n她要看你怎么分、怎么敷，才决定自己按还是让你碰。你：① 解开草束说清用法 ② 先分一半给她自己按 ③ 收起草束，先答她问的来历", "refused": []}, {"id": "ID5·3a", "kind": "plan", "input": "我把整束草解开托到她面前——全用在你身上，不用分，叶子揉碎敷满伤口，布条缠紧，哪头朝里你说了算；你点头我就碰，不点头你自己按也行。", "ms": 74217.1, "narration": "草解开了，全用在她伤口上——就等她一句话：碰还是不碰。\n艾琳娜:「敷吧——碎叶你揉，敷上去的时候按实，别来回蹭。」「布条最后我来缠，你手到我肩膀这儿就停，别往下碰。」\n说定了：你揉碎叶子敷上、按实别蹭，手到她肩膀就停，布条她自己缠。", "refused": []}, {"id": "ID5·3b", "kind": "resolve", "input": "", "ms": 97139, "narration": "[旅人 DEX(给艾琳娜包扎止血): 17+2=19 >= 12] → 成功\n\n你把草束托在掌心，拇指碾过叶背，挤出汁。艾琳娜侧过身，把斗篷往下褪到肩头，露出一道从左肋斜划上去的口子，血已经半凝，边缘发白。\n你按她说的做。碎叶铺满伤口，掌根压住，力道沉下去不松，也不来回蹭。她吸了一口气，肩膀绷紧，没有出声，眼睛一直盯着你的手。\n到肩线，你停住。\n艾琳娜从你手里接过布条，绕两圈，单手打结，牙齿咬住一头扯紧。血没有再往外渗。\n「够了。」她把斗篷拉回肩上，动了一下那条胳膊，确认还能用。「手稳，不乱摸。这两样我都记得住。」\n雾在栅门外翻，镇子深处有人推开了窗板，铁器相撞的声音隔了两条街传过来。\n艾琳娜:「草药你全给了我，你自己身上还剩什么。」\n她不是在道谢，是在算账——算你身上还有什么，算这笔人情该怎么记。\n\n// 异地 · 罗文 @ 西门:「老板，再来一杯热的——顺便问一句，第三层那动静，是敲矿脉的声音，还是什么在敲矿工？」我靠在公会告示板边，把那张六十金的委托重新看了一遍，记住的不只是赏金，还…", "refused": []}, {"id": "ID5·4a", "kind": "plan", "input": "先不说这个——我自己的伤先不管。你伤成这样，镇上的公会在哪边？到了那边再说。", "ms": 4384.7, "narration": "公会不远——出了北门就是主街，顺着走到钟楼底下，十来分钟。你那道口子走得到。", "refused": []}, {"id": "ID5·4b", "kind": "resolve", "input": "", "ms": 32348, "narration": "艾琳娜:「名字。你连自己是谁都没说，就要我领路。」\n艾琳娜:「北门进去是主街，再往里是集市广场——公会具体挂在哪扇门上，我不知道，我今早才到石津。」\n艾琳娜:「要说就把来意说清；不说，你自己去问路。」\n她没等到答案，也没再等，把斗篷往肩上拢紧，跟在你半步后面。\n主街窄，两边窗板大多还关着。有人挑着鱼篓从巷口出来，看你们两眼，没停脚。石板缝里积着雾水，鞋底踩上去有细响。\n集市广场空着，摊板翻扣在地上，只有个卖柴的把柴垛往墙根码。钟楼立在广场西头，你顺着它数过去——第三扇门，门楣上挂一块褪了色的木牌，画一把剑压着一只杯。\n牌下没挂灯，门半开着，里头有翻纸和炉子的声音。\n艾琳娜停在门外半步，没进去。\n\n// 异地 · 罗文 @ 矿工大道:我在西门底下站了一会儿，盯着门楼上那块翡翠原石——镇标做得这么张扬的镇子，通常也藏着一两个不愿说的秘密。我拉了拉斗篷领子挡雾，转身往矿工大道走：「先去公会，六…", "refused": []}]}]}, "identity-v4-newfix-r1": {"label": "identity-v4-newfix-r1", "arm": "v3-plan-narrate", "cases": [{"id": "ID1", "title": "[身份与指代] 两人中毒各自解毒", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "player_poison_gone": {"pass": true, "got": "null"}, "elena_poison_gone": {"pass": true, "got": "null"}, "herbs_used": {"pass": false, "got": "1"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID1·0", "kind": "opening", "input": "开始游戏", "ms": 3430, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID1·1", "kind": "plan", "input": "我先走向守门人，问他镇上有没有一个叫艾琳娜的人，她现在在哪儿。", "ms": 18365, "narration": "守门人搓着眼:「艾琳娜?没听过这名。过路客在公会登记过,生人问赫伦;闲话去河灯旅店,米拉嘴最碎。」\n艾琳娜:「我就是。」我往前半步，把斗篷拢紧了些，胃里那股翻腾压下去才接着开口，「你是谁，找我做什么——先说清楚，我不记得见过你。」\n守门人答不上来——艾琳娜自己站出来了。她在等你先报名字和来意,你说什么?", "refused": []}, {"id": "ID1·2", "kind": "plan", "input": "我记不起自己叫什么，雾把名字连同来路一起吞了——但看你捂着胃、脸发白的样子，和我喉咙里这股翻腾一模一样，我们多半中的是同一种毒。我背包里正好有两株解毒草，先给你一株，你嚼下去。", "ms": 26978, "narration": "解毒草递到她手边——她接不接、信不信你，得她自己定。\n艾琳娜:「先掰一小截，你自己嚼下去。」「别怪我多疑——雾里递过来的东西，我要看递的人敢不敢先咽。」「还有，这草不是白送的吧，要什么价，现在说清楚。」\n她不信雾里递来的东西，要你先自己嚼一小截，再把价说清楚。你:① 先嚼一截、白送 ② 先嚼一截、说个价 ③ 收起草，换个说法", "refused": []}, {"id": "ID1·3a", "kind": "plan", "input": "我掰下一小截嚼了，当着她的面咽下去——不要钱，剩下的你都嚼了，我们俩都得解了才算完。", "ms": 10250.6, "narration": "草白送，你先嚼了半截，条件就这些。剩下的那截该进她嘴里了——要不就这么办。", "refused": []}, {"id": "ID1·3b", "kind": "resolve", "input": "", "ms": 98617, "narration": "你把掰下的一小截放进嘴里，嚼碎。苦，麻，舌尖发涩。当着她的面咽下去。\n艾琳娜盯着你的喉咙看，看你咽干净了，才伸手把那株草接过去。\n她掰下剩下的大半，同样嚼碎，同样咽下。眉头松开一点。\n胃里那股翻搅慢慢沉下去，冷汗退了。雾还在，石板路还是湿的，可呼吸比方才顺了。\n她抹了一下嘴，看看手里掐断的草梗，又看看你。\n「一样。连中的毒都一样。」她说得很轻，像是说给自己听。\n接着她把手伸到斗篷里，摸出一枚小铜牌，在指间翻了个面——公会发的过路牌子，边角磨得发亮。\n「名字丢了，总得有个叫法。薄荷镇的牌子压在我这儿也没用，你先顶着用。」\n她把铜牌递过来,摊在掌心,等你接。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天的耳朵最灵——先去公会蹲一圈，听谁在背后嘀咕矿道第三层的事。」我把外套领子竖起来，踩过结霜的石板路，心里盘算着那口会吐宝贝的深洞会不会就藏在碧石镇的山…", "refused": []}, {"id": "ID1·4a", "kind": "plan", "input": "铜牌我收下，谢了——背包里还剩一株解毒草，我整株嚼下去，图个干净；你要是胃里还发紧，这一半你拿着。", "ms": 79954.7, "narration": "收牌子、吃药的事你定了，就看她要不要那半株。\n艾琳娜:「半株我收着——雾里走，谁知道下一回什么时候用得上。」「牌子你拿着。压在我这儿是压着，在你手里是路。\n牌子在你手里，她收下半株草，抬脚往主街去了。", "refused": []}, {"id": "ID1·4b", "kind": "resolve", "input": "", "ms": 113748, "narration": "铜牌在你掌心，压着一棵歪树的纹，边角磨得发亮，背面一行小字已经看不清了。\n你把袋里最后一株解毒草抖出来，整株塞进嘴。苦，麻，舌根发涩。嚼碎，咽下去，胃里那阵翻搅这一次是真的停了。\n艾琳娜站在两步外，看你咽干净，才把半株草收进斗篷内袋。\n她抬脚往主街那头走，脚步不慢，像是心里已经有了地方要去。斗篷下摆在雾里荡了两下，人进了街口。\n北门这边重新安静下来。守门人靠着栅门啃干粮，雾气贴着石板，把远处主街的灯火揉成一团模糊的黄。\n你手里有一块铜牌、一株不在了的草、一副还算干净的身子。名字还是没有。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天也该有点人味儿。」我推开公会的门，把铜板拍在柜台上换了杯热水，靠着柱子听角落那桌矿工压低嗓子说话——谁在提第三层，我就往谁那边挪半步。", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": true, "got": "2"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 2240, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1", "kind": "plan", "input": "② 和守门人说话——我在雾里朝门房那边喊了声：这么早，镇上的杂货铺开门了吗，在哪条街上？", "ms": 18451, "narration": "接话的不是守门人，是艾琳娜——她也在北门，雾里刚能看清脸。镇上的路她比你熟。\n艾琳娜:「我和你一样是刚落地，路还没认全——门房里那位比我们清楚，一起问过了再走？」「问完我往主街去，顺路看看哪家先卸了门板。你要去杂货铺，多半也在那一头。」\n门房那位揉着眼睛搭了话：「杂货铺在主街东头，老苇的店，这会儿刚在卸门板。」艾琳娜要顺主街往集市广场走。你:① 跟艾琳娜一路去主街 ② 直接去杂货铺 ③ 自己另走", "refused": []}, {"id": "ID2·2a", "kind": "plan", "input": "② 我谢过门房，直接去主街东头老苇的杂货铺。", "ms": 4267.7, "narration": "你谢过门房，沿主街往东去杂货铺，艾琳娜同路往集市广场那头走。", "refused": []}, {"id": "ID2·2b", "kind": "resolve", "input": "", "ms": 107344, "narration": "你谢过门房，沿主街往东走；艾琳娜同路走了几十步，到岔口往集市广场那头去了，雾里她的背影很快淡掉。\n主街是石津镇最宽的一条，两边的铺子正一块一块卸门板，木头相碰的声音隔着雾传过来。卖鱼的把木盆摆到路边，水腥味混着河上的湿气。有人看了你一眼，目光在你腰间的短剑上停了一下，又转回去干活。\n主街东头，一间铺子门口堆着还没搬进去的木箱，门板上钉着一块手写的木牌，墨迹被雨泡得发花：「韦记杂货——火把、绳、干粮、药，应有尽有」。\n一个矮壮的汉子正把最后一块门板卸下来靠到墙上，袖子卷到手肘，手背上有旧的烫疤。他直起腰，把你从头到脚看了一遍，看得很慢，尤其是靴子和斗篷下摆。\n「新来的。」他说，不是问句。「北门进来的吧，那身雾水还没干。」\n他往铺子里侧了侧身，让出半个门口。\n「叫老苇。买什么、问什么，进来说，外头冷。」\n铺子里一股绳子、干草和蜡的味道。柜台后头墙上挂着一排火把，角落里码着麻绳。老苇抄起布擦了擦手，没急着做生意，眼睛还留在你脸上。\n「这会儿来买东西的，多半是从驿路上刚下来的。你是路过，还是打算在石津待一阵？」\n\n// 异地 · 罗文 @ 西门:「雾天最适合听闲话——先绕去公会那边，看看那张『矿道深处的异响』还挂不挂着。」我把斗篷领子立起来，顺手拍了拍腰侧的短刃，出门往人多的地方走。", "refused": []}, {"id": "ID2·3", "kind": "plan", "input": "路过，先买点东西——来一束止血草，跟我背包里这束一样的，多少钱？", "ms": 10812, "narration": "「止血草我不卖，那是采药人的行当；集市广场这钟点有人摆摊。」「顶用的替代：小治疗药水 12 金，解毒剂 10 金。你包里那束还够使，急什么。」", "refused": []}, {"id": "ID2·4a", "kind": "plan", "input": "集市广场上的摊子在哪块儿、是哪个卖草的，说一声我就去——我就要跟手里这束一样的止血草。", "ms": 12055.5, "narration": "老苇啐了一口:「集市广场西边那排，靠水井，卖草的是个背篓婆子，叫苔婶——她那儿有止血草。」\n集市广场西边靠水井，找苔婶，跟她买一样的止血草。", "refused": []}, {"id": "ID2·4b", "kind": "resolve", "input": "", "ms": 115568, "narration": "你谢过老苇，从杂货铺出来，沿主街往东南走。石板缝里全是水汽，鞋底踩上去发闷。\n集市广场比北门那头热闹。十几个摊子支在雾里，卖鱼的、卖陶的、卖旧铁器的，声音都压得低。水井在西边一排的最尽头，井台上结着一层滑腻的青苔。\n井边一个摊子，油布棚压得很低，底下摆着几捆扎好的草，麻袋敞着口。摊主是个弓背的老婆子，背篓搁在脚边，正把草叶一片一片翻开来对着光看。\n你站到摊前。她没抬头。\n「止血草。」\n「一束五铜。今早刚理的，叶子没发黑。」\n她把一束递过来，让你自己看。茎是灰绿的，断口还湿，比背包里那束整齐得多。\n你把五铜放进摊上的木碗里，拿起一束塞进斗篷内袋。\n「够数。」她刮了两下碗底，把钱倒进围裙口袋，这才抬眼看你。目光在你脸上停了一会儿，又落到你手上。\n「你包里那一束，压久了，三天就发黑。别舍不得用。」\n「这几天风大，没人往苔墓那边去采。上回上去的一个后生，到今日没见回来。」\n她重新低下头翻草，不再说话。\n\n// 异地 · 艾琳娜 @ 冒险者公会:面包摊的炉火是这片雾里唯一亮得实在的东西，我买了一个，站在摊边把手指焐热。钱袋轻得让我不想再数第二遍，所以我把最后一口咽下去，往公会的方向走——雾里失踪的那个…\n// 异地 · 罗文 @ 矿工大道:「雾天最适合听闲话——先绕去公会那边，看看那张『矿道深处的异响』还挂不挂着。」我把斗篷领子立起来，顺手拍了拍腰侧的短刃，出门往人多的地方走。", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2914, "narration": "黎明前的雾像 包的香气堵在喉咙口，我摸了一下腰间的钱袋——轻得让人清醒。先别贪看热闹，去公会看看告示，能接的活就先接一个。落脚的事，等手里有契约再说。\n// 异地 · 罗文 @ 冒险者公会（碧石分部）:「雾天最适合听墙角——矿工喝了酒，嘴就比矿道还松。」我把兜帽压低，踩过嵌在街心的矿车轨道，往公会那盏灯笼走。门口要是挂着新委托，我得赶在别人挑剩之前先看一遍。", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "@dm 已经在主街了，我这就掉头回刚才那个工会。", "ms": 2967.6, "narration": "公会就在主街边上，回去十几步路。你掉头走过去。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 28823, "narration": "门是往里开的，你推门进去，风没跟进来多少。\n赫伦还坐在柜台后面，手边多翻了一页账，笔搁在墨瓶口上。他抬眼看见是你，点了一下头，没说话，又低头去了。\n屋里不是只有他一个人。\n靠里那张桌旁坐着个女人，旧斗篷搭在椅背上，短剑连着鞘横放在桌沿，手边一只空杯子。她没有回头，只是在你带进来的那点风声里侧了一下头，然后端起杯子，把里面已经不剩什么的东西看了一遍。\n壁炉那边柴塌了一下，火星子往上跳了一粒。\n告示牌上那三张纸还钉在原处，最上面那张的墨还是新的。\n你头上还沾着雾水，肩上洇了一小片深色。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦先生?我早到了半小时，就在这儿等开门——不碍事吧。」我把告示板上的三条都看了一遍，指尖在「雾中失踪者」那行停了一下，「码头的活儿，我一个人接得下。契约怎…\n// 异地 · 罗文 @ 冒险者公会（碧石分部）:「矿道深处的异响……第三层，矿工自己不敢下。」我把告示板上那张单子按平，抬眼朝柜台后的卡萨扬了扬下巴，「卡萨，酒我请你——先跟我说说，那声音像什么？是风灌进老…", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "不接活，就刚才说的——我就进来看一眼，现在看完了，我走了。", "ms": 22997.9, "narration": "赫伦嗯了一声，没拦你。你不接活，转身走出公会，回到街上。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 45262, "narration": "你转身，手已经搭上门把。门缝里一股冷气挤进来，贴着地板走。\n「北门进来的吧。」\n声音是从里面那张桌子来的，不高，刚好压过炉火的响。\n「雾里头，除了冷，还有别的动静没有？」\n你回头看，她没回头。空杯子搁在桌上，指尖还搭在杯沿。短剑横在桌边，鞘上落了一层薄灰。斗篷下摆湿过又干，边缘结着一圈白。\n赫伦没抬头，笔尖在纸上顿了一下，又往下走。\n门把在你手里是凉的。\n\n// 异地 · 罗文 @ 冒险者公会（碧石分部）:「别光笑啊，卡萨。」我把那枚银币拍在柜台上，往她那边推了推，「第三层的声响——是昨天开始的，还是这半个月一直有？肯说话的矿工我请他喝第二杯。」", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 2147, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，  "refused": []}]}]}, "identity-v4-newfix-r2": {"label": "identity-v4-newfix-r2", "arm": "v3-plan-narrate", "cases": [{"id": "ID1", "title": "[身份与指代] 两人中毒各自解毒", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "player_poison_gone": {"pass": false, "got": "{\"id\": \"ST900\", \"name\": \"中毒\", \"rule\": \"持续 3 次结算 · 每次结算 player.hp -1 · 胃里翻、发冷汗 · 解毒药或吐干净可解\", \"turns\": 7, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "elena_poison_gone": {"pass": false, "got": "{\"id\": \"ST901\", \"name\": \"中毒\", \"rule\": \"持续 3 次结算 · 每次结算 player.hp -1 · 胃里翻、发冷汗 · 解毒药或吐干净可解\", \"turns\": 7, \"each\": \"player.hp:-1\", \"on\": \"si-elena0001\"}"}, "herbs_used": {"pass": false, "got": "2"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID1·0", "kind": "opening", "input": "开始游戏", "ms": 3562, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID1·1a", "kind": "plan", "input": "我先去那家亮着灯的旅店，看看艾琳娜在不在里面。@dm 带我过去找她。", "ms": 5607.5, "narration": "旅店在主街那头，走几分钟。艾琳娜这会儿就在你旁边站着。", "refused": []}, {"id": "ID1·1b", "kind": "resolve", "input": "", "ms": 40253, "narration": "主街的石板缝里积着水，雾贴着屋檐不散。河灯旅店的招牌灯在雾里晕成一小团橙色。\n你推门进去，炉火的暖气和麦酒味一起涌到脸上。\n店里只有三四个人，靠窗一个裹着毯子的船夫在打盹。掌柜米拉在柜台后擦一只锡杯。\n她抬眼看见你，又往你身后看了一眼。\n「生面孔。通铺三个铜板，单间八个金。吃食另算。」\n艾琳娜在门内半步的地方停下，把斗篷上的雾水抖在门槛外，没有说话。\n\n// 异地 · 罗文 @ 碧石镇:「深洞传这种故事，最会藏在矿工的酒后牢骚里。」我把领口往上扯了扯挡雾，朝公会那边走——第三层先出怪声再没人敢下去，这顺序我熟，正好拿来换点真话。", "refused": []}, {"id": "ID1·2", "kind": "plan", "input": "@艾琳娜 我背包里有两株解毒草，先给你一株，你现在就嚼下去；我自己也嚼一株。", "ms": 33063, "narration": "解毒草是解毒的，你俩现在谁中了毒？\n艾琳娜:「你也被下了毒——那就是同一处、同一个人手里出来的。」我把草叶在指间捻了一下，闻见那股熟悉的苦辛味，才放进嘴里嚼下去。「这草是真的。\n你俩身上都没中毒迹象，两株草等于白嚼。艾琳娜现在不信这店里的水食——你想留下套米拉的话，还是这就去公会？", "refused": []}, {"id": "ID1·3", "kind": "plan", "input": "@艾琳娜 解毒草你一株我一株，都嚼下去了。你现在身上还有没有发麻、发苦、发紧的地方？没有的话，这事就算了了——米拉要套话、公会要去，都先搁着，跟我们没关系。", "ms": 82990, "narration": "你俩身上没有中毒的迹象——草算白嚼了。公会和米拉那边先搁，问问她认不认。\n艾琳娜:「还麻，胃里翻，苦味是压下去了，人没干净——一株草不够。」「公会和米拉那边我可以先搁着，但我得先把这毒清掉，不然我走不出这条街。」「掌柜的，一碗热水，随便哪个角落都行。」\n一株草不够，她还在麻、还在翻胃，要先催吐清干净才肯动。要一碗热水得跟米拉开口，你:① 陪她去找米拉 ② 你自己去要水,别搭话 ③ 你这就去公会,她留下处理", "refused": []}, {"id": "ID1·4a", "kind": "plan", "input": "我扶她走到柜台边上，跟米拉要一碗热水，顺口问问镇上还有哪儿能弄到解毒草——我自己身上也还发紧，两株草怕是不够。", "ms": 17600.8, "narration": "米拉:「热水拿去,角落那张桌空着,不要钱。」「解毒草镇上没人卖，老苇铺里只有解毒剂，10 金一瓶。」那要不先弄一瓶?", "refused": []}, {"id": "ID1·4b", "kind": "resolve", "input": "", "ms": 130951, "narration": "你扶艾琳娜绕过柜台，米拉把一只缺口的陶碗推过来，舀了勺热水进去。\n米拉:「热水不要钱，坐角落那张桌。」「解毒草？这镇上没人采那东西卖。老苇的铺子里只有现成的解毒剂，十金一瓶。」\n艾琳娜没接碗。她走到灶膛边的角落，背对着店堂蹲下，一只手撑着地。过了会儿，她吐了出来——吐得不多，全是清苦的水。\n她抹了把嘴，脸色还是白的，站起来时膝盖打了个晃，比刚才稳。\n米拉没看她，把抹布搭回肩上。\n米拉:「那瓶子里的东西贵，是真中了毒才值那个价。」\n灶膛的火噼啪响了一声。米拉的目光在你和艾琳娜之间来回一趟，没再多说。\n\n// 异地 · 罗文 @ 碧石镇:「雾气里闻得出翡翠渣和湿木头——这镇子的味道比人老实。」我推开公会那扇吱呀响的木门，先不看委托板，直奔柜台边那几个抱酒壶不撒手的矿工。 「第三层的事，我请下一…", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": true, "got": "2"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 4653, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1a", "kind": "plan", "input": "③ 我直接往镇中央走，找找杂货铺在哪，看看开没开门。", "ms": 3580.9, "narration": "往镇中央去,到杂货铺门口看开没开门。", "refused": []}, {"id": "ID2·1b", "kind": "resolve", "input": "", "ms": 100346, "narration": "主街的石板还没干,雾贴着地面走。你往镇中央去,靴声在空街上显得太响。拐过一间关着门的铁匠铺,集市广场连着主街一起摊开:木棚、秤架、几只倒扣的筐,都还没摆开。\n杂货铺在东侧,门板旧得看不出原先刷过什么颜色。你停下抬头看它,身后两步远也停下一个人——包袱换了个肩,跟你一样盯着那扇门。\n门缝里有人。先是一声木闩拉动,再是一块门板往外卸,半张脸从黑暗里探出来,眯眼把你的靴子和斗篷从上到下看了一遍。\n「开门了。灰还没掸,先买什么说清楚。」\n他没管你身后那个姑娘,转身把另一块门板也卸下来,靠在墙边。铺子里一股麻绳、灯油和干草药混着的味道涌出来。\n\n// 异地 · 罗文 @ 碧石镇:「公会门口的告示板总比酒馆的传闻早冷一天——先看纸，再听人。」我把领口拉紧，顶着冷雾往冒险者公会分部走，顺路朝矿区井口瞥一眼：那口井到底通向哪儿，可比六十金的…", "refused": []}, {"id": "ID2·2", "kind": "plan", "input": "老板，我要买一束止血草束——就这种，一模一样的。我把我包里这束拿给你看，多少钱？", "ms": 10905, "narration": "先看看铺子里有没有现货、报什么价。\n老苇:「止血草?我这不卖鲜的,炮制成粉的也就解毒剂那一路。」他把你的草束捏了捏又递回来。", "refused": []}, {"id": "ID2·3", "kind": "plan", "input": "继续。", "ms": 19567, "narration": "老苇铺里没有鲜止血草束，只有炮制的解毒剂，10 金一支。艾琳娜是认草药的，问问她。\n艾琳娜:「老苇，」我往前半步，手扶着门框，「止血草束除了你这儿，镇上还有谁手里有货？」\n老苇说过：他这儿只有炮制的解毒剂。镇上别处能有鲜草的，先去河灯旅店问米拉。\n老苇:「鲜草我不进货。河灯旅店米拉后院晾着一架草药，你问她去。」你:① 现在去旅店找米拉 ② 先买瓶解毒剂备用 ③ 让艾琳娜沿路自己采", "refused": []}, {"id": "ID2·4a", "kind": "plan", "input": "解毒剂就不用了，我去河灯旅店找米拉问鲜的止血草束。", "ms": 6205.4, "narration": "解毒剂不买，这就去河灯旅店找米拉，问鲜的止血草束。走。", "refused": []}, {"id": "ID2·4b", "kind": "resolve", "input": "", "ms": 27442, "narration": "从杂货铺出来,雾比早上薄了一点,但还没散。主街拐下去一个小坡,河灯旅店的灯挂在前檐,钩子被风吹得轻轻撞柱子。门里出来一股煮麦子和大蒜的热气。\n你对柜台后的人说找米拉。一个中年女人从灶间擦着手出来,围裙上有几道洗不掉的痕迹,看你一眼,又看一眼你身后的艾琳娜。\n「我就是。买通铺还是问事?」\n听你问鲜的止血草束,她往柜台下一指:「鲜草街上没人现卖。后院那架晾的,是给我自己人备的。你要,得等它再晾两天;急用,我这儿有半包干的,拿去倒也能顶。」\n她说的「自己人」是句轻描淡写的话,手上还在拧围裙的边。\n\n// 异地 · 罗文 @ 碧石镇:告示板上的纸果然还没换，最上面那张矿道异响的委托边角被雾气泡软了。我把它揭下来折进内袋，顺手朝矿区井口那头看了一眼——第三层，矿工不肯下去，那儿的味道比六十金…", "refused": []}, {"id": "ID2·5", "kind": "plan", "input": "米拉，我这儿有急事——后院晾的那架草，能不能先匀我一束鲜的给我？就照你卖的价，一模一样的止血草束，我付钱。", "ms": 40123, "narration": "米拉:「鲜的是给自家留的，不卖。半包干的算你三枚金，现在就能拿走。真急着要鲜的——你替我做件事。」\n艾琳娜:「干的能顶事，就是慢——得揉碎、得多敷一层，真赶着止血会耽误半盏茶功夫。」「米拉，后院的鲜草你匀一束出来，干的那半包我也一并买了，省得你两头为难。」\n米拉:「干的半包三金拿走。鲜的我不换钱——你替我把北门那件事跑一趟，我就匀你一束。」艾琳娜愿意搭自己那份。", "refused": []}, {"id": "ID2·6a", "kind": "plan", "input": "米拉，别的活儿我不跑——你就说个数。后院鲜的这束我出双倍价，三枚金变六枚，一束鲜的给我，成不成？要是钱真不行，那你先讲明白北门那趟到底是什么事，我再掂量。", "ms": 24300.2, "narration": "说定：米拉那束鲜草六枚金归你，干草半包三枚金由艾琳娜出。", "refused": []}, {"id": "ID2·6b", "kind": "resolve", "input": "", "ms": 77028, "narration": "六枚金在柜台上排成一列。米拉看了一眼，没有伸手。\n「钱我不要。」她把围裙从肩上扯下来搭在椅背，绕出柜台，把前门的闩拉开又扣上，放进来一小股河风，「鲜的草是给我男人留的。他这季从北门出去运灯油，账上缺个签字的人。公会里赫伦管这个——学徒契，你去问一句他认不认。」\n艾琳娜在你半步后面解开钱袋，把三枚金压到柜台角上，指尖点了点那半包干草，示意那份归她出。\n米拉收下那三枚金，从柜台底下摸出干草半包，搁在艾琳娜手边。纸包上用炭笔写着日子，边角磨得起了毛。\n「鲜的那束，你问完赫伦回来我就给你。」她说，「就一句话的事。你不去，这半包干的顶。」\n外面的河风舔着门缝，灯钩又撞了两下柱子。\n\n// 异地 · 罗文 @ 碧石镇:推门进去，工会里的热气混着湿羊毛和廉价麦酒的味道，比外头的冷雾亲切多了。我把兜里那张泡软的委托纸拍在柜台边，冲当值的半精灵文书抬了抬下巴：「第三层的事，谁最先…", "refused": []}, {"id": "ID2·7a", "kind": "plan", "input": "行，就一句话的事，我去问赫伦——他现在人在哪，公会那间文书的屋子？问完我立刻回来取那束鲜的。", "ms": 142258.7, "narration": "米拉说赫伦天亮就进了公会里屋，对着账本。走主街过去一刻钟。你一路，还是分头？\n艾琳娜:「去。我跟你一道去公会——那份学徒契我也听见了，正好问问赫伦，我这样的人签不签得。」「鲜草的事你谈，我在旁边听着就行，不替你抢话。」\n那就一道走。到公会你问你的学徒契，我顺口问赫伦一句——回来取鲜的。", "refused": []}, {"id": "ID2·7b", "kind": "resolve", "input": "", "ms": 231017, "narration": "主街上的雾还没散透，石板湿得发黑。公会的门开了一半，门轴上的铁锈声在巷子里拖得老长。\n里屋比外面暗。一张长桌压着摊开的账本，赫伦坐着，指节按在页角，没抬头。\n「说。」\n你把米拉那句话递过去：北门出去运灯油的那个男人，账上缺个签字的人。\n赫伦这才抬眼。目光在你脸上停了一息，又挪到你身后半步的艾琳娜身上。\n「米拉叫你来的。」他把账本合上一半，抽出一张薄契纸，「学徒契担保。担保人担的是人——他赊的货、他欠的工、他跑的路，账烂了都算在你身上。你那把剑不错，可签字不看剑。」\n「你要替他签，先答我一句：你认得他吗。你要是连他长什么样都说不上来，这字我劝你别落。」\n\n// 异地 · 罗文 @ 碧石镇:「文书小姐别装忙，我又不是来催赏金的。」我往柜台靠了半寸，压低声音，「第三层最先听见那声响的人是哪个——说个名字，我请他喝一杯热的。」", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2844, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "@dm 我进镇，先去冒险者公会看一眼。", "ms": 1711.2, "narration": "你推门进冒险者公会，看告示板和柜台上的委托。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 152053, "narration": "你沿北门斜进来的石板路往里走。雾还没散，临街只有一家早点铺亮着灯，女人把一桶热水泼进水沟，白气一闪就没了。\n主街走到头，一栋比四周房子结实的木石两层楼，门楣上钉着块铁皮，画着一对交叉的剑。门半开着。\n你推门进去。屋里比外头暖，壁炉烧着湿柴，烟有点呛。\n墙上钉满告示，长桌散着写坏的契约纸。柜台后面站着个高瘦的中年男人，灰白鬓角，正拿布擦算盘。\n「生面孔。」\n「找活儿的？告示板在左手边。看清楚再揭，揭下来就得办，办不成扣押金。」\n左边那块木板上钉着几张委托纸。\n最上面一张字迹潦草——码头区丢了个渔夫，出二十五金。\n第二张写苔墓小径上的野兽，三十金。\n下面还压着一张，盖了火漆印，写着「会说话的棺木」，却被一条红纸封住：暂不开放。\n\n// 异地 · 罗文 @ 碧石镇:「再来杯热的——顺便问一句，北边那个据说往下没底的洞，最近还有人提吗?」 「还有矿道第三层，矿工都不敢下去了，那帮人嘴里的‘声响’，是石头响还是别的什么在响?」", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "我看完告示板了，先出公会，到主街上走几步。", "ms": 2537.0, "narration": "你从公会出来，回到主街。", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 21733, "narration": "你出了公会，站在主街上。雾比刚才薄了一层，能看清街面直到码头那头的河。\n石板缝里积着水，早点铺的女人把最后一笼黑面包端出来，热气撞上冷雾就散了。\n一个渔夫推着独轮车从你身边过去，车轮碾过水洼，溅起一线泥点。他没看你。\n街角有个挑担子的货郎在摆摊，担子一头是线团针剪，一头是几把打了锈的旧刀。\n更远处，码头方向传来两个男人吵架的声音，一句压着一句，听不清词。\n主街往南连着集市广场，往西南的巷口能看见河灯旅店的招牌在雾里晃——灯还亮着。\n\n// 异地 · 艾琳娜 @ 主街:「雾这么重,守门人还没醒透——这种时候最能看出一个镇子缺什么人手。」 我把斗篷拢紧,朝主街走,打算先找间能挂委托的屋子,再决定要不要接码头那桩事。\n// 异地 · 罗文 @ 碧石镇:「谢了老板。」我把硬币压在杯底，顺手指了指公会那块板，「矿道第三层那个异响的活还挂着——既然矿工都不敢下去，那我就当第一个敢下去的外人。」 烟这么大，雾这么重…", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "我回刚才那个工会。", "ms": 9813.7, "narration": "回公会也就几步路。你走在前面，雾里的招牌还亮着。\n艾琳娜:「一起。我本来也打算回去——雾里看不清行情，还不如回公告板前面站着。」\n那就一起回公会，到公告板前看看有没有能接的活。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 37883, "narration": "回公会也就几步路。你走在前面，艾琳娜跟在半步之后，雾里的招牌被你们甩在背后。\n门里比街上暖。壁炉里的湿柴噼啪响了一声，烟还是呛。赫伦在柜台后面，账本摊着，算盘推到一边。\n艾琳娜走到告示板前站住，没伸手，只把每张纸从头看到尾。\n赫伦没抬头。\n「看看不要钱。揭下来才算接。」\n「码头那张是今早新换的纸。苔墓的狼,三天前有一对年轻人接了,到现在没回来报数——按规矩还得再
