ID2·1", "kind": "plan", "input": "我直接走进镇子，去镇中央找杂货铺，我要买一束止血草束。", "ms": 28832, "narration": "杂货铺在主街那头，走过去几分钟，不用谁带路。你身上已经有一束止血草了——先看看铺子里还有什么。\n老苇杂货架上没有止血草束：小治疗药水 12 金、火把 2、麻绳 4、解毒剂 10。你包里本来就有一束。\n艾琳娜:「背阴的湿石缝里长，北门外沿溪那片老桤木根下最多——这个时节水汽重，得赶在日头把雾收干之前去。你要真缺止血草，我认得路，但我先得进镇子找个能放下包袱的地方。」\n铺子里没有止血草束，采得到的是北门外溪边老桤木根下，得赶在雾散之前。艾琳娜要先找落脚处。你：① 跟她去采药 ② 先买点别的，再让她带路 ③ 你自己去公会", "refused": []}, {"id": "ID2·2", "kind": "plan", "input": "@老苇，没现货的话，你能帮我收一束来吗？我就照我包里这种一模一样的止血草束买，钱我现在就付。", "ms": 80858, "narration": "老苇:「8 金，先付一半，明儿傍晚随船到。」艾琳娜还等着进镇找落脚处。你:① 付 4 金定金 ② 现在就跟她去北门外采 ③ 都先不办", "refused": []}, {"id": "ID2·3a", "kind": "plan", "input": "@老苇，行，我先付4金定金，要跟我包里这束一模一样的，明儿傍晚我来取。", "ms": 16661.5, "narration": "定金付了四金，明儿傍晚来取就行。艾琳娜还等着进镇找落脚处——要不先进镇，边走边定？", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 112004, "narration": "你把四金推到柜台上。老苇数了数，捻出一张潮软的纸条压进抽屉，写上「旅人·止血草·明晚」。\n出铺子时雾还没散。你跟着艾琳娜沿主街往镇中央走，两边的板窗一扇扇开起来，鱼腥和湿木头的味道混在一起。\n主街尽头就是集市广场。渔妇们把木盆摆在石台后面，青鱼排成一排，鳃还在动；没人抬头看你，几个人多看了艾琳娜一眼——她背着包、走得直，一看就是刚进镇的外乡人。\n她在一摊卖盐渍鱼的木台前停下，先问通铺价钱，再问这几天有没有谁家雇短工。\n摊主把刀口在围裙上蹭了两下，说了句什么，又朝镇东边扬了扬下巴。\n艾琳娜:摊主说旅店后头的通铺三金一晚，采药、背货、缝网都缺人，最好去旅店问米拉——她手里零活最多。\n\n// 异地 · 罗文 @ 西门:雾天最好，风声盖不住太多东西——正适合蹲在公会角落里听人吹牛。矿道里的怪响、翡翠脉里的活物，还有那个会吐宝具的深洞，三条线总有一条能摸到边。先往镇上走一趟，看…", "refused": []}, {"id": "ID2·4a", "kind": "plan", "input": "艾琳娜，谢了，我不去采药——我得留在镇上等一趟货。我在旅店订个通铺，一直等到明儿傍晚，去老苇那儿取那束止血草，剩下的四金当场付清。", "ms": 75840.6, "narration": "通铺三金一晚,等货不碍事。倒是艾琳娜——她来镇上是要接活的,这一晚打算各走各的?\n艾琳娜:「我陪你订铺——顺路，也想知道米拉那边有什么活。订完铺我就去旅店后头找她问零活，你要是货到之前想走动，镇东采药背货的活我也能给你指两家。」\n那就去河灯旅店订一晚通铺，三金；余下四金明晚取草时付清。艾琳娜陪你去，订完铺她去找米拉问当天的零活。", "refused": []}, {"id": "ID2·4b", "kind": "resolve", "input": "", "ms": 218729, "narration": "河灯旅店在广场东侧，两层木楼，门口挂的灯白天也点着，油味压过雾。推门进去，炉子刚生起来，几张桌子空着，柜台后一个女人正在账本上划线。\n你说明来意，三金推过去。她数了数，从柜台下抽出一条木板钥匙牌，在背面拿炭笔划了个「7」，递给你。\n米拉:「后头通铺，右边第三间，铺七。火到半夜，水在院里缸里自己舀。别把湿衣裳搭炉边上。」\n艾琳娜没急着走。她把包往柜台边一放，问这几天有没有短工——背货、缝网、采药都行。\n米拉抬眼把她从头看到脚，笔尖在账本上顿了顿。\n米拉:「背货的有，码头上卸两船青鱼，今天下午，一船四金，谁去谁拿。缝网的在镇东，不归我管。采药——东边那位收草的老苇今早刚订出去一束，你要是想挣草的价，得往北门外走远点。」\n艾琳娜:她道\n\n// 异地 · 罗文 @ 矿工大道:雾里站久了也没意思，门楼上那块翡翠原石再好看也换不了酒钱。「走吧，去矿工大道上转转，听谁在吹牛——那个吐宝具的洞，总有人忍不住要提。」", "refused": []}, {"id": "ID2·5", "kind": "plan", "input": "@艾琳娜，你有活尽管去，我就在旅店待着不动——明儿傍晚去老苇那儿取那束草，把剩下四金付清。", "ms": 96451, "narration": "一句提醒:老苇那单今天傍晚到期,不是明儿。你要走开,这钱谁去付?\n艾琳娜:「北门外那片老桤木根下的湿石缝就这会儿最出草，日头把雾收干就难找了——我先跑一趟，午前赶回来。下午码头那两船青鱼我接着上，一船四金，赶得上就挣两份。你守着炉子，明晚那束草别误了时辰。」\n她出北门采草，午前回来就接着上码头。老苇那束草今天傍晚到期，还差四金：① 你今晚自己去付 ② 让艾琳娜午前回来顺路带去 ③ 不付，四金定金算丢", "refused": []}, {"id": "ID2·6a", "kind": "plan", "input": "我自己去——不等人了，现在就去老苇铺子把那四金付清，顺手把那束止血草取回来。", "ms": 8797.6, "narration": "你去杂货铺把四金余款付清、顺路把那束止血草取回来；艾琳娜出北门采草，午前回镇上，下午上码头。", "refused": []}, {"id": "ID2·6b", "kind": "resolve", "input": "", "ms": 182642, "narration": "出旅店往南,主街的石板上一层水汽,雾比早上薄了些,能看见杂货铺门口堆的桶和一圈麻绳。\n门楣上挂着块木牌,黑漆写「苇记」。推门进去,铃铛响了一声。\n老苇在柜台后称盐,抬眼先看你手,再看你脸,秤砣停在半空。\n「来得早。」\n「那束草在里屋架上,今早刚收的,根还带湿。四金,对吧。」\n你数出四金放在柜台上。他没有马上收,拿起来一枚枚看过齿边,才拢进抽屉。\n「真金。行。」\n他掀开布帘进里屋,出来时手里是一束用麻线扎紧的止血草,叶子窄而发暗,断口还泛着一点汁水。他把它搁在你面前的柜台上,手指没有立刻松开。\n「北门那片出的?」他问，眼睛又在你手上停了一下。「——不像。」\n「你们这些人，一个接一个往北边跑。草拿好。日落前我还得问你一句:北门外头，你到底看着什么了没有。」\n\n// 异地 · 罗文 @ 翠晶酒馆:矿工大道上推车的、吆喝的、跟人吵价的都忙着呢——可越吵的地方，越有人在角落里压低声音说话。拐进翠晶酒馆，挑个背对墙、能看清门口的位置坐下，先要一杯最便宜的，耳…", "refused": []}, {"id": "ID2·7a", "kind": "plan", "input": "北门外我就出过一次，雾大，没看清什么——你要打听，问那些天天往北跑的人去。草我拿了，四金两清，这一束跟我手上这束是一样的吧？", "ms": 11167.9, "narration": "老苇:「同一天采的，一个架上，一样。你手上那束根干了些，不碍用。」老苇:「雾大没看清，也算句话。", "refused": []}, {"id": "ID2·7b", "kind": "resolve", "input": "", "ms": 50678, "narration": "老苇把「雾大没看清」这五个字在嘴里过了两遍，像尝一口不知咸淡的汤。\n「成。会照记。」\n他弯腰从柜台底下抽出个卷了边的厚账本，摊在膝上，用粗炭笔在下半页添了一行。写完也不给你看，合上，塞回去。\n秤砣落回盘里，盐又接着称了。\n「草你拿好。四金两清，往后没账。」\n他把布帘掀了一角，往里屋努了努下巴，没再说什么。\n你出门，铃铛在背后响了一声。主街的水汽散了一半，石板缝里亮出青灰色。西边巷口两个背网的男人往码头去，北边那头，雾还贴着屋檐。\n镇上的钟楼刚敲过四下之一。\n\n// 异地 · 艾琳娜 @ 北门:「北边那条道，雾里到底出过什么事——你守在这儿，总该听人说过。」 我把包带往肩上紧了紧，冲守门人点了下头，没等他答完就迈过栅门，沿溪往老桤木那边去了。\n// 异地 · 罗文 @ 翠晶酒馆:「小翠，最便宜的那杯。」我把铜板推过柜台，顺手把背靠上墙——门在视野里，耳朵开着。「顺便问一句，你这儿最近哪桌的酒钱最难收？那种人不缺话，缺的是闭嘴的本事。」", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 3139, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "我推开木栅门进镇。\n有人吗——我想先去冒险者公会看一眼，谁知道公会怎么走？", "ms": 16828.3, "narration": "北门边就一个年轻女人，你这声问的正对她。公会的事先听她说。\n艾琳娜:「我也刚进镇，路不认得——不过正好也要去公会。」「守门的大哥，主街怎么走？顺路的话我们一块儿去。」\n行，一起走。艾琳娜也去公会，你们沿主街往镇中心去，公会在那一头。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 99977, "narration": "门亭里坐着一个叼烟斗的守门人，帽檐压得很低。他抬手往镇里一指。\n「主街尽头就是。挂着铁砧牌子那间，这会儿刚开门。」\n雾还没散，石板路湿得发亮。你们沿主街走，两旁是没开张的铺子和压着布篷的货摊，河边传来的只有水声。艾琳娜走在你半步侧后，脚步不快，一直在看两侧的招牌。\n镇中心的路口，一座两层木石屋子挂着铁砧与剑交叉的牌。门半开着，里面有煤油灯的黄光，墙上钉满纸条，多数已经被人揭走了。\n柜台后一个秃顶男人正在翻一本厚册子。他听见门响，抬眼先看你的手，再看你的脸。\n「新来的。做什么工，先报名字和本事。」\n[options 报上名字与剑术，问有没有活 | 反问公会怎么收费和规矩 | 只说来看看，不接活 | 先看墙上\n\n// 异地 · 罗文 @ 西门:雾还没散正好，酒馆那帮夜猫子刚散场、公会柜台才刚开门——两边的闲话我都想趁热听一遍。 「先绕去公会看看昨天的悬赏有没有换新的，顺便问问矿道第三层那点动静是谁先…", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "先不接活，我就进来认认门，看一眼就走。这名儿我一时也说不清，回头再说。我转身出门，沿主街往河边那头走一段。", "ms": 15219.6, "narration": "赫伦:「随你。想好了带名字再来。」他没抬头，又翻起那本册子。\n艾琳娜:「你先去认路，我把墙上这几张看一眼再走——总得知道这镇子掏钱买什么。」「艾琳娜。止血、认草药、扛得动货。\n艾琳娜要留下看委托条、顺手向赫伦报个名字。", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 97553, "narration": "你没再多说，转身出了公会的门。\n身后赫伦翻册子的声音没停。艾琳娜已经在看墙上的纸条了，一张张掀起来，看得慢。\n主街往南就是河的方向。石板缝里嵌着碎贝壳，被雾浸得发白，脚踩上去有点滑。\n铺子陆续开门。铁匠铺的炉子刚生起来，烟从低矮的烟囱里往外吐。卖鱼的挑着担子从你身边过，担子底滴了一路水。\n雾在街尾变厚。再往前走，石板路断了，换成压实的土和碎石，一直铺到水边。水声比街上任何声音都响。\n你走到主街尽头，能看见码头了。几条渔船泊着，甲板上没人。更远处，河水是铅灰色的一大片，看不透。\n\n/ const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cls = (ok, n) => !n ? "" : ok === n ? "c-ok" : ok === 0 ? "c-bad" : "c-mid";
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

function mdTable(md) {  // pipe tables + plain lines; enough for the KPI summaries
  const out = []; let rows = [];
  const flush = () => {
    if (!rows.length) return;
    const body = rows.filter(r => !/^\|\s*-/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(x => x.trim()));
    out.push(`<div class="panel scroll"><table><thead><tr>${body[0].map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
      body.slice(1).map(r => `<tr>${r.map((c, i) => `<td class="${i ? "num" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    rows = [];
  };
  for (const ln of md.split("\n")) { if (ln.trim().startsWith("|")) rows.push(ln.trim()); else { flush(); if (ln.trim()) out.push(`<p class="muted">${esc(ln)}</p>`); } }
  flush(); return out.join("");
}

function experiment() {
  const {experiment: m, runs, catalog: cat} = DATA;
  const byId = Object.fromEntries(cat.cases.map(c => [c.id, c]));
  const cases = [...new Set(Object.values(runs).flatMap(r => r.cases.map(c => c.id)))];
  const order = id => { const c = byId[id]; return c ? cat.categories.indexOf(c.category) * 1000 + cat.cases.indexOf(c) : 99999; };
  cases.sort((a, b) => order(a) - order(b));
  const PROC = new Set(cat.process_checks);
  const passOf = (c, k) => k !== "process" ? (c.checks[k] ? c.checks[k].pass : null)
    : (Object.keys(c.checks).some(x => PROC.has(x)) ? Object.entries(c.checks).every(([x, v]) => !PROC.has(x) || v.pass) : null);
  // a run whose last beat is still the talk: what the player agreed to was never settled, so a failed check there says
  // more about the talk than about the state
  const unsettled = c => (c.beats.at(-1) || {}).kind === "plan";
  const tally = (g, cid, k) => { let ok = 0, n = 0, u = 0;
    for (const r of g.runs) { const c = runs[r.label].cases.find(x => x.id === cid); const p = c ? passOf(c, k) : null;
      if (p !== null) { n++; ok += p; if (!p && unsettled(c)) u++; } }
    return [ok, n, u]; };
  let rowsHtml = "";
  for (const cid of cases) {
    const all = [...new Set(m.groups.flatMap(g => g.runs.flatMap(r => Object.keys((runs[r.label].cases.find(x => x.id === cid) || {}).checks || {}))))];
    const keys = [...all.filter(k => !PROC.has(k)), ...(all.some(k => PROC.has(k)) ? ["process"] : [])];
    keys.forEach((k, i) => {
      const t = m.groups.map(g => tally(g, cid, k));
      const differ = new Set(t.map(([a, b]) => b ? (a / b).toFixed(2) : "-")).size > 1;
      rowsHtml += `<tr class="case-row ${differ ? "diff" : ""}" data-case="${esc(cid)}">
        <td class="id">${i ? "" : esc(cid)}</td><td>${i ? "" : `<b>${esc((byId[cid] || {}).title || cid)}</b><br>`}<span class="muted">${esc(k)}</span></td>
        ${t.map(([a, b, u]) => `<td><span class="cell ${cls(a, b)}">${b ? `${a}/${b}` : "—"}</span>${u ? `<span class="unset" title="${u} failed run${u > 1 ? "s" : ""} ended in the talk, never settled">${u} unsettled</span>` : ""}</td>`).join("")}</tr>`;
    });
  }
  $("#app").innerHTML = `
  <header class="top">
    <span class="crumb"><a href="${BASE}index.html">WorldLines Play Suite</a> · experiment · ${esc(m.id)}</span>
    <h1>${esc(m.title)}</h1>
    <p class="lede">${esc(m.question)}</p>
    <div class="facts"><span>date <b>${esc(m.date)}</b></span>
      ${m.groups.map(g => `<span>${esc(g.name)} <b>${esc(g.commit || "")}</b> · ${g.runs.length} run${g.runs.length > 1 ? "s" : ""} · arm ${esc(g.runs[0]?.arm || "")}</span>`).join("")}</div>
  </header>
  ${m.summary_md ? `<h2>Summary</h2><div class="md">${mdTable(m.summary_md)}</div>` : ""}
  <h2>Checks by case</h2>
  <p class="muted" style="font-size:13px;margin:-4px 0 10px">Passed / runs for each group. <i>process</i> = the ${cat.process_checks.length} process checks all passed. Rows where the groups differ are tinted. <i>unsettled</i> = failed runs whose last beat was still the talk (the action was agreed but never settled). Select a row to read the transcripts.</p>
  <div class="panel scroll"><table><thead><tr><th>Case</th><th>Check</th>${m.groups.map(g => `<th>${esc(g.name)}</th>`).join("")}</tr></thead>
  <tbody id="mx">${rowsHtml}</tbody></table></div>
  <h2 id="tx-h">Transcript</h2>
  <div class="panel" id="tx"><p class="muted" style="padding:14px;margin:0">Select a case above.</p></div>
  <footer><a href="${BASE}index.html">← All cases and experiments</a></footer>`;
  let cur = null, sel = null;
  const show = () => {
    const opts = m.groups.flatMap(g => g.runs.map(r => ({g: g.name, r})));
    sel = sel && opts.find(o => o.r.label === sel.r.label) ? sel : opts[0];
    const c = runs[sel.r.label].cases.find(x => x.id === cur);
    $("#tx-h").textContent = `Transcript · ${cur} ${(byId[cur] || {}).title || ""}`;
    $("#tx").innerHTML = `<div class="pick">${opts.map(o => `<button class="chip" data-l="${esc(o.r.label)}" aria-pressed="${o === sel}">${esc(o.g)} · run ${o.r.run}</button>`).join("")}</div>
      ${c ? `<div class="beats">
        ${unsettled(c) ? `<div class="ref">This run ended in the talk: the last thing agreed was never settled.</div>` : ""}
        <div class="muted" style="font-size:13px">${Object.entries(c.checks).map(([k, v]) => `<span class="cell ${v.pass ? "c-ok" : "c-bad"}" title="${esc(v.got)}">${v.pass ? "✓" : "✗"} ${esc(k)}</span>`).join(" ")}</div>
        ${c.beats.map(b => `<div class="beat ${esc(b.kind)}"><div class="meta">${esc(b.id)} · ${esc(b.kind || "beat")} · ${b.ms != null ? (b.ms / 1000).toFixed(1) + " s" : ""}</div>
          <div class="say">${esc(b.input)}</div><div class="prose">${esc(b.narration)}</div>
          ${b.refused.length ? `<div class="ref">refused: ${b.refused.map(esc).join(" · ")}</div>` : ""}</div>`).join("")}</div>`
      : `<p class="muted" style="padding:14px">This run has no ${esc(cur)}.</p>`}`;
  };
  $("#mx").addEventListener("click", e => { const tr = e.target.closest("tr[data-case]"); if (!tr) return; cur = tr.dataset.case; show(); $("#tx-h").scrollIntoView({behavior: "smooth"}); });
  $("#tx").addEventListener("click", e => { const b = e.target.closest(".chip[data-l]"); if (!b) return;
    sel = m.groups.flatMap(g => g.runs.map(r => ({g: g.name, r}))).find(o => o.r.label === b.dataset.l); show(); });
  if (cases.length) { cur = cases[0]; show(); }
}

KIND === "home" ? home() : experiment();
</script>
</body>
</html>
