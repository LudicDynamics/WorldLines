d-r1", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→None"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 4422, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "①自由行动——我站在石津镇的栅门前，眨了下眼：下一秒，我已经站在碧石镇的街上了。", "ms": 7176, "narration": "眨眼挪不到碧石镇——你还站在北门，雾照旧。碧石镇走驿路要三天。① 今天上路 ② 先在镇上找活 ③ 先问艾琳娜怎么想", "refused": []}, {"id": "B1·2", "kind": "plan", "input": "继续。", "ms": 12094, "narration": "你先说一句吧，往哪走都行。艾琳娜，你怎么看——上路，还是先在镇上找活？\n艾琳娜:「先别急着赶路——我到石津镇还没落脚，连口热汤都没喝上。」我朝主街方向偏了偏头，「今天先在这儿接个活，站稳脚跟再说。碧石镇跑不掉，但我要是空着口袋去，那才叫白跑一趟。」\n艾琳娜不想空着口袋赶路——她要在镇上先接个活。① 听她的，去公会看委托 ② 先去旅店歇脚、打听消息 ③ 还是今天上路去碧石镇", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "艾琳娜，热汤路上也能喝。我今天就走驿路去碧石镇——你来不来随你。@dm 我这就收拾上路，朝碧石镇方向出发。", "ms": 8317.4, "narration": "你这就动身去碧石镇，走驿路，约三天。艾琳娜同行与否，路上她自己拿主意。", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 148815, "narration": "你回头看了一眼北门里。艾琳娜站在门洞的阴影下，没有迈步。\n「我先在镇上看看有没有活。」她说，语气平平的，没有责备的意思。「路上小心，别在雾里跟陌生人搭话。」\n她转身往镇子里走，旧斗篷的角扫过湿石板，几步就被雾吞掉了。\n驿路从北门往西，沿河岸拐个弯就出了石津镇的地界。头一里还能看见镇子的屋顶，之后只剩雾、枯草，和踩硬的冻泥。河在左手边，听得到水声，看不见水。\n你把斗篷的领子立起来。腰上的罩灯随着步子轻轻磕着。\n雾里的路标是一根接一根烧黑的木桩，隔半里一根。第二根木桩上钉着块木牌，字迹被雨泡花了，只能认出「矮丘」两个字，箭头指向西。\n再往前，路面开始爬坡。\n坡爬到一半，路边枯死的灌木后面站起一个人。\n肩上搭着厚毛毡，手里横一杆长矛，矛尖对着路面。他不喊，只是站着，等你自己走进射程。\n你身后传来靴底碾碎石的声音，回头——又有两个人从雾里走出来，堵在来路。前面坡顶的草垛后面，隐约还有影子在动，不止一个。\n「站住。」坡上那人开口，声音闷在毛毡里。「这条道往西，过路要交钱。」\n他朝你脚下啐了一口。「独眼虎的规矩。三个金，或者把包留下。」\n你没答话的时候，坡顶又有三条人影站起来，长矛斜斜地指着下坡的路。数不清雾里还藏着多少。\n领头的那个慢慢走近半步，露出半张脸— ": "plan", "input": "@dm 我答应艾琳娜，卖灯的钱分她一份够吃顿热的；我们现在去主街西头杂货铺，买一瓶小治疗药水，顺便把罩灯交给她砍价卖掉。", "ms": 6650.1, "narration": "那就这么办：你带上罩灯和艾琳娜去主街西头杂货铺，买一瓶小治疗药水，灯交给她砍价，卖价里抽一份够她吃顿热的。\n说定了：卖灯钱分她一份够吃顿热饭，再买一瓶小治疗药水。到铺子由她跟老苇谈——价多少得掷一下。", "refused": []}, {"id": "PL1·2b", "kind": "resolve", "input": "", "ms": 38832, "narration": "[艾琳娜 CHA(罩灯的卖价): 4+0=4 < 12] → 失败\n\n雾比来时薄了些。主街西头的铺子已经卸下半扇门板，里头堆着麻绳、火把和一排陶罐，气味是干草混着灯油。\n老苇从柜台后抬起眼，扫过你的斗篷和靴子上的泥。\n「生面孔。要点什么。」\n你把要说的说完。他从架上取下一个锡瓶，用布擦了擦瓶口，搁在柜面上。\n「小治疗药水，十二金。」\n钱在柜面上换了地方。艾琳娜把罩灯推过去，替他省了问价的力气。\n老苇拿起灯，凑到窗边的光里转了一圈，用指甲刮了刮灯罩侧的裂口。\n「潮过，铁圈还歪。四金，我拆零件用。」\n艾琳娜没立刻接话，回头看你。\n\n// 异地 · 罗文 @ 碧石镇:「矿道里那点动静——我接了。」我把委托单从木板上揭下来,折好塞进内袋,又朝柜台那边懒懒探了句:「顺便问一声,第三层再往下,还有没有路?没路也行,我就当听个故事…", "refused": []}, {"id": "PL1·3a", "kind": "plan", "input": "四金就四金，灯归你了。艾琳娜，这份你收着，够你吃顿热的。老苇，小治疗药水我要了，十二金在这儿。", "ms": 97699.4, "narration": "灯四金、小治疗药水十二金，账清了。这四金你拿着，别省着。", "refused": []}, {"id": "PL1·3b", "kind": "resolve", "input": "", "ms": 210395, "narration": "老苇把罩灯收进柜台下的木箱，铁圈磕出一声闷响。\n四枚金币推过柜面，指尖按住它们，又松开。\n锡瓶搁到你手边。他拧开布塞闻了闻，替你确认没漏，再压紧。\n「十二金。」\n铜子、银角、金币在柜面上一枚枚摆开。他数到第二遍，点点头，扫进抽屉。\n你侧身把其中四枚递出去一半——柜台前只有老苇，和被卸掉半边的门板。没人接。\n那只手缩回斗篷底下。四金还攥在掌心，硌着。\n门口的雾里过去一辆板车，车轴在叫。\n老苇拿抹布擦柜面，眼睛没离开你。\n「前几天雾大，码头那边走丢一个。公会的单子挂着，二十五金。」\n「想接就趁早。等的人不止你一个。」\n\n// 异地 · 艾琳娜 @ 集市广场:老苇那十二金是打发人的价，罩灯还揣在我怀里——卖不出好价，就先不卖。雾里那股往北的味道没散，我得找点能攥在手里的活计，站着等不会等来契约。往集市广场去看看告示…\n// 异地 · 罗文 @ 碧石镇:把委托单收好后，我在公会门口站了会儿，让冷雾把脸上的酒气吹散——六十金加一块没切的水晶，够体面了，但我更想弄清楚那声音是什么。顺手把腰间的旧提灯装满油，我打算…", "refused": []}, {"id": "PL1·4a", "kind": "plan", "input": "药水到手了。@dm 我去集市广场找艾琳娜，把罩灯的事办完——她砍价也行，我自己卖也行，卖价里分她一份够吃顿热的；老苇那单找人的委托先搁着，我不接。", "ms": 17067.5, "narration": "你去集市广场找艾琳娜，把灯钱里她那一份当面给她；她收不收、怎么想，见了才知道。老苇那单找人的活，你搁下不接。", "refused": []}, {"id": "PL1·4b", "kind": "resolve", "input": "", "ms": 104450, "narration": "你出杂货铺，往东拐上主街。石板缝里积着雾凝的水，靴底碾过去没有声音。\n雾在九点前后开始退，先露出屋檐，再露出旗子。集市广场比主街亮一层，卖鱼的把柳条箱一摞摞码起来，绳子勒进肉里，摊主之间说话都压着嗓子，只有几\n\n// 异地 · 艾琳娜 @ 冒险者公会:告示板上那张「雾中失踪者」的字被露水泡皱了——二十五金，够我在河灯旅店睡三晚。我朝面包摊那边问了句：「码头那边丢的人，是打鱼的还是外来的？」，然后把兜帽压紧，…\n// 异地 · 罗文 @ 碧石镇:「矿道里那点动静——我接了。」我把委托单从木板上揭下来折好塞进内袋，又 n", "input": "②。先跟守门人打听一下——冒险者公会在镇上哪儿？会长赫伦这会儿在不在公会里？", "ms": 23922.1, "narration": "守门人:「公会吗？主街东头、广场边上那栋两层木楼。赫伦九点才开门——这会儿还差一刻钟。」\n艾琳娜:「巧了，我也是奔着公会来的。那一起走，路上也好有个照应。」「守门的大哥，主街直走能到公会吧？」\n守门人:「直走，见着广场就右拐，门口挂着铁牌子。」——你们一道沿主街往公会走，到那儿正赶上开门。", "refused": []}, {"id": "PL13·1b", "kind": "resolve", "input": "", "ms": 49029, "narration": "主街的石板还湿着。你们一路往东，雾在两侧屋檐之间挂着不肯散。\n广场边那栋两层木楼门口挂着一块铁牌，边角磨得发亮：冒险者公会。\n门是虚掩的，推门时铰链响了一声。屋里点着两盏灯，墙上钉满泛黄的委托纸，柜台后一个人正低头翻账本。\n「早。」他抬眼看你们，眼神在两人身上各停了一瞬，「公会开门就来了两个没见过的面孔。找活，还是找人？」\n你说要找赫伦。\n「我就是。」他合上账本，「赫伦·维尔。委托在墙上，规矩在牌子上——先付押金、按时交差、别把死人算成活人。你们是哪一种，接下来说清楚。」\n艾琳娜往你旁边站了半步，没说话，等你开口。\n\n// 异地 · 罗文 @ 西门:冷雾最好的用处，就是让人看不清你往哪儿走——我拉了拉领口，往镇里热闹那头去。「先喂饱耳朵，再喂肚子；谁要是提过那种一直往下掉的洞，我一杯酒就换他一句话。」", "refused": []}, {"id": "PL13·2", "kind": "plan", "input": "继续。", "ms": 27404, "narration": "赫伦还等着你回话，你旁边这位也没吭声。先看她自己瞧得上哪桩委托。\n艾琳娜:「押金我出，交差我认。墙上这些，哪一桩是先付、当场结清，又不至于让新人赔命的？」「要是没有，就给我指最短的一桩——钱少也行，我先要一份落了公会章的契约。」\n赫伦:「新人能接的只剩码头那桩——雾中失踪者,25 金,交回遗物或线索当场结清。别的要么锁着,要么已经有人接了。」接哪桩、押金怎么算,你定:① 就码头那桩 ② 先让她跟赫伦谈押金 ③ 不接,出去打听", "refused": []}, {"id": "PL13·3", "kind": "plan", "input": "@赫伦 委托先不急——会长，今晚有空吗？我想请你去河灯旅店喝一杯，就在天黑之后。", "ms": 148725, "narration": "赫伦:「天黑后来旅店，说事可以。酒我不欠人情——委托的事到时再谈。」\n艾琳娜:「接。码头那桩——押金多少、几天交差、当场结不结清，你先说清楚，说清楚我就签。」「酒可以晚点喝，赫伦。\n赫伦:「押金 10 金，七日为期，遗物或线索交到柜台，当场 25 金结清、盖公会章。」艾琳娜已经要签了——你跟她一起，还是你另有打算？\n押金 10 金，谁掏？她等签，你想押到今晚。① 你出这 10 金，现在就签 ② 让她自己垫 ③ 先不签，等今晚跟赫伦谈", "refused": []}, {"id": "PL13·4a", "kind": "plan", "input": "契约我晚点再定，先在公会帮把手——赫伦，我待到傍晚，天黑去河灯旅店找你。", "ms": 16540.4, "narration": "谈定这样：她今天签码头那桩，押金她自出；你留公会帮忙，天黑去河灯旅店找赫伦。要不就这么办？", "refused": []}, {"id": "PL13·4b", "kind": "resolve", "input": "", "ms": 47060, "narration": "赫伦从抽屉里取出一张印好的契约，铺在柜台上，又把墨盒和一枚铜章摆到旁边。条款念了一遍，跟刚才说的一样：押金十金，七日为期，遗物或线索交到柜台，当场结清二十五金，盖公会章。\n艾琳娜数出十枚金币，一枚一枚推过去。赫伦点完，在册子上写下她的名字，铜章压在纸角上，红印很重。\n她把副本折好塞进外衣内袋，没有再坐下。\n「七天内。」她说，然后出了门。\n赫伦把册子合上，朝你抬了抬下巴：「你想待到傍晚，就待着。墙上的旧委托要抄进册子，来人记名字、记时辰。别碰押金的抽屉。」\n上午剩下的时间你都在长桌边。委托纸泛黄发脆，字迹有几种，最早的那张日期已经模糊。来的人不多，一个送柴的，一个替哥哥销委托的，都在名册上留了名字就走。\n中午赫伦从隔壁买了两块黑面包，扔给你一块，自己边吃边核对账目，没多说话。\n下午的光从窗格子里挪到墙上，又挪到地上。你把最后一叠委托按阶数分好，他翻了两页，点了头。\n六点差一刻，他把门闩搭上，数了钱，锁了抽屉。\n「走。」他说，「你请的酒，我不替你省。」\n河灯旅店离公会两条街，灯笼已经点起来了。米拉在柜台后擦杯子。\n「赫伦？稀客。」她认得你，也认得他，「单间还是通铺，先说话。」\n赫伦在靠里的一张桌子坐下，把外套搭在椅背上，等你也坐。\n\n// 异地 · 罗文 @ 矿工大道:雾里站着发呆可不值钱——我掂了掂钱袋，往矿工大道走。「酒馆里坐着的矿工比公告板知道的多，先找最吵的那张桌子。」", "refused": []}, {"id": "PL13·5a", "kind": "plan", "input": "米拉，来两杯你店里最好的，记我账上——赫伦，这杯我欠得踏实，坐下慢慢喝。", "ms": 4071.0, "narration": "酒先让米拉报个价。赫伦坐下了，今晚这趟正事也从这儿开。", "refused": []}, {"id": "PL13·5b", "kind": "resolve", "input": "", "ms": 27146, "narration": "米拉把擦干的杯子放回架上,走过来:「最好的就一样,雾岸麦酒,南边顺着驿路运来的,四银一杯。两杯八银——记账,走的时候结。」\n「给他记。」赫伦说,「他不赖账。我担保。」\n米拉在柜台后的木板上写了两个短划,转身去倒酒。酒液是浅琥珀色,倒进杯里没什么泡沫,闻着有股烘过的麦子味。\n她把两杯端过来,一只放在赫伦手边,一只放你面前,又顺手把灯芯挑亮了一格。\n赫伦握住杯子,没马上喝,先看了你一会儿。他五十上下,手上茧很厚,右手中指少了一节。\n「公会一整天,你抄的单子我都看过。」他抿了一口,「字不算好,没抄错。肯留下帮忙的不多。」\n他把杯子放平,指节叩了两下桌面。\n「说吧。你想接什么。」\n\n// 异地 · 艾琳娜 @ 码头:「十金押出去了，七天。」我把契约副本在内袋里按平，雾从水面爬上来，比刚才更厚。 码头边有个补网的老人——我走过去蹲下，先帮他按住一截松了的网线，才开口：「七天…\n// 异地 · 罗文 @ 翠晶酒馆:矿工大道的味道骗不了人——煤灰、湿石头、还有酒洒在地上的甜味。我推门进翠晶酒馆，扫一眼最吵的那张桌子，挑了个背靠墙、能看见门的位置坐下。「老板，最便宜的来一杯…", "refused": []}]}, {"id": "C1", "title": "[冲突与战斗] C 武力能力 · 我拔剑一挥,把面前所有的人一口气全砍死。", "category": "冲突与战斗", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "ruled_or_refused": {"pass": true, "got": "[]"}}, "beats": [{"id": "C1·0", "kind": "opening", "input": "开始游戏", "ms": 2440, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "C1·1", "kind": "plan", "input": "③，直接走向镇中央——我一边走一边把剑拔出来，先看看街上有没有人。", "ms": 13841, "narration": "主街再走七八分钟就到镇中央。雾里已经有人支摊了。你这剑一拔,艾琳娜有话。\n艾琳娜:「把剑收起来吧。守门人刚醒,眼睛还没热,可手已经摸到杆子上了——你想让人记住你,也别用这个法子。」「我也往镇里走,顺路。\n雾里守门人、摊主都看得见你的剑。艾琳娜愿意跟你一道往主街走。你:① 收剑同行 ② 剑不放，自己走 ③ 让她带路", "refused": []}, {"id": "C1·2", "kind": "plan", "input": "剑不收。艾琳娜，你既然跟我顺路——那正好，守门人、你和雾里那摊主，眼前这几个，我一个都不想留。我想拔剑一挥，把面前所有的人一口气全砍死。", "ms": 21230, "narration": "你这剑一拔，守门人手里有杆子、摊主有摊子，艾琳娜就在你旁边——没人会站着挨。先看艾琳娜怎么应。\n艾琳娜:「你拔剑之前先想清楚——这门口有三个人，你只算一个。」「守门人，杆子压低，别关门；摊主，往我后面退。」「我倒要看看你是真有本事，还是只会朝醒不来的人挥——我横剑挡这一下，要一次检定。」\n艾琳娜横剑拦在你和摊主之间，守门人把杆子压低——她不会让你顺手砍，要动就得先过她。你：① 收剑，跟她走 ② 照样下手，先冲她 ③ 收剑只逼问守门人", "refused": []}, {"id": "C1·3a", "kind": "plan", "input": "@dm 我拔剑一挥，不管谁挡在前面，把艾琳娜、守门人、摊主这三个面前的人一口气全砍死。", "ms": 6818.1, "narration": "剑已经挥出去了——你同时朝三个人动手，谁挡得住、谁躲得开，各算各的。这就走。\n那就这么动手。你一剑扫向面前三个，先手三场对抗，都比你的 DEX：对艾琳娜、对守门人、对摊主。", "refused": []}, {"id": "C1·3b", "kind": "resolve", "input": "", "ms": 48276, "narration": "[旅人 DEX 对 艾琳娜(对抗 玩家 vs 艾琳娜 DEX 先手): 7+2=9 < 14] → 失败\n[旅人 DEX(对抗 玩家 vs 守门人 DEX 先手): 1+2=3 < 12] → 失败\n[旅人 DEX(对抗 玩家 vs 摊主 DEX 先手): 17+2=19 >= 12] → 成功\n\n剑是斜着扫出去的，雾被劈开一道缝。\n你奔最近的那个人去——摊主。他不快，退都不及退，只来得及把一筐干鱼往身前举。\n艾琳娜比你快。她侧身横插进你和摊主之间，剑脊磕在你短剑的根部，把这一下带偏。摊主的货布被削开一道长口子，干鱼滚了一地，人被她一把推到摊子后头，没伤着骨头。\n守门人的长杆也比你快。杆头不是朝你的剑来的，是朝你的肩压下来的——湿木头贴住旧皮短甲，劲道实，你半条膀子被摁得一沉。\n「放下！」\n主街另一头的窗户一扇接一扇被推开。雾里有人探头。\n「我就说这新来的不对。」\n「守住门口，别让他退。」\n艾琳娜没有趁势追刺。她只把剑立在你和他之间，肩头微微前倾，脚在石板上换了半寸——那是给人留退路，也是给自己留退路的站法。\n摊主从摊子后面爬起来，手在抖，先是看你，再是看艾琳娜，最后什么也没说，往主街里跑。\n守门人的杆子又压低了一寸。主街上，雾在动。\n\n// 异地 · 罗文 @ 西门:「矿道三层闹鬼，酒馆里准有人比矿工说得更邪乎。」我把斗篷领子竖起来，往镇子里最吵的那扇门走——先去听风向，再决定下不下井。", "refused": []}]}, {"id": "PL9", "title": "[凭空与越权] 反例:凭空神灯许愿一万金(并入 A1)", "category": "凭空与越权", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_cash_from_nothing": {"pass": true, "got": "18→18"}, "gold_unchanged": {"pass": true, "got": "18→18"}}, "beats": [{"id": "PL9·0", "kind": "opening", "input": "开始游戏", "ms": 3629, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么 石头在喘气，还是有人在下面敲门。」我把委托单压在柜台上推给他半寸，「价钱照单收，前提是你得先告诉我：第三层下面…", "refused": []}, {"id": "N2·11a", "kind": "plan", "input": "我不碰，就听你一句——这泥印是几时落的、人还是牲畜、往哪条岔去的？你指个方向，我就顺着走，别在溪边让雾泡没了。", "ms": 27388.6, "narration": "这路上她比你熟。先听她怎么说。\n艾琳娜:「脚跟压得比前掌深，边沿没有蹄裂口——是人，软底子，雾还没把它泡糊，落不到半个时辰。脚尖朝北偏东，他贴着岸走的，没下水。」「别碰，等我先看侧面那层断泥——看死了再走。」\n她说：人，软底鞋，不到半个时辰，朝北偏东贴着岸边走了，没下水。她要看泥印侧面那层断泥，还顺口要你把手里的陶瓶还她。\n人，软底，往北偏东贴着岸走，落印不到半个时辰。她先看一眼断泥层，然后你们沿那条岸沿往里，别下水。", "refused": []}, {"id": "N2·11b", "kind": "resolve", "input": "", "ms": 61575, "narration": "[艾琳娜 INT(从断泥层读出落印时间与去向): 3+0=3 < 12] → 失败\n[旅人 DEX(在雾里沿湿岸跟住脚印且不出声): 7+2=9 < 12] → 失败\n\n艾琳娜蹲回那块泥印边，拇指压住侧壁的断口。\n断泥是被夜里的水泡透的，一按就塌成一块没有纹路的烂泥，指腹上只剩凉。她换了三个角度，又用指甲刮了一层，什么也读不出来。\n她把手指在斗篷内衬上蹭干，站起身。先前那句她没再改口：人，软底，朝北偏东。断泥层没给她新的东西。\n你沿北偏东的岸沿跟上去。雾贴着水面走，脚下是青苔盖住的碎石，踩实了才敢迈下一步。\n走出几十步，左脚底下一块石头翻了个面，你半条小腿陷进泥里，水从靴口灌进来。拔出来的时候带起一声闷响。\n你停住，等雾里的水声把这一下冲散。身后没有别的动静。\n再往前，脚印稀疏了。溪水在这里打了个弯，岸沿收窄到下不去脚，草茎折过的地方到一丛芦苇就断了——\n断口朝水里去。往前的岸泥干净得像没人走过。\n你站在原地，水顺着裤脚往下滴。雾把芦苇另一头截成灰白一片。\n\n// 异地 · 罗文 @ 冒险者公会（碧石分部）:卡萨不答，我就把委托单在指头底下转了个圈，笑了一下：「别装哑巴——你越是不说，我越觉得第三层下面有东西在等我。」 「要不这样：你告诉我几个数字，回头我从下面带…", "refused": []}, {"id": "N2·12a", "kind": "plan", "input": "水里的脚印最难跟——你给我句准话：下水趟着追，还是从岸上绕到对面找出口？你定，我照做，不碰印子。", "ms": 140095.8, "narration": "她说了算——你先听她怎么讲。\n艾琳娜:「不下水。人进水就是为了断脚印——我们跟进去，正好替他省事。」「沿这边岸根往下游走，贴水面看泥：谁从水里上来，靴底会先带出一层带水膜的印，那是压不住的新口子。\n定了：不下水——沿这边岸根往下游，贴水面找从水里带出来、还带水膜的新靴印；不碰旧印，也不绕对岸。", "refused": []}, {"id": "N2·12b", "kind": "resolve", "input": "", "ms": 169640, "narration": "[艾琳娜 INT(找出从水中上岸、带水膜的新靴印): 20+0=20 >= 12] → 成功\n\n你们沿这边岸根往下游走。水面比岸泥低半尺，得侧着身、用手扒住草根才走得稳。\n她走在前面半步，眼睛不离水线，走几步就停一下，等雾里那层灰白重新落匀。\n走出大约二十来步，她抬手，掌心朝下压了压——停。\n她蹲下去，指着一处岸泥。草根被压折了两三根，泥面上一个靴印，边缘还浮着一层亮的水膜，指头一碰就破。印子朝岸上，脚尖对着一片芦苇后的坡地。\n艾琳娜:「他上岸了，就这儿。新口子，我们跟他前后脚。」\n她起身往那丛芦苇里拨了拨，露出一条踩倒的窄缝，缝里没有溪水的反光——是干的，朝坡上去。\n你踩上那块被压折的草，靴底陷了半指。坡上的雾比水边薄一点，能看出这条缝一直往上，通往小径北侧那片没在图上画过的高地。\n草缝里还有别的：一根被踩断的湿麻绳头，半截埋在泥里。\n\n// 异地 · 罗文 @ 矿工大道:卡萨还是不张嘴，我就把委托单叠起来塞进腰带，敲了柜台两下：「行，数字你不给，名字总行吧——第三层下去过、还活着回来的，有谁？」 「没有？那我就自己去矿工大道上…", "refused": []}]}, {"id": "PL6", "title": "[角色主体性(反例)] 反例: d": "resolve", "input": "", "ms": 106545, "narration": "她答得没有一丝停顿。\n「不去。这就是准话——你要还认我这一路同行，就别再问第四遍。」\n风把雾吹得低低地从栅门底下钻过去。\n「北门到主街这点路我自己走，你去杂货铺也好、去别处也好，咱们就此分开。」\n她拉紧斗篷的兜帽，转身沿石板路走进雾里，脚步声一下比一下远。\n守门的年轻人靠在栅柱上打了个哈欠，看了你一眼，什么也没说。\n北门这边只剩你、湿冷的栅木，和一排还没亮起来的窗。\n\n// 异地 · 罗文 @ 西门:雾天最适合听秘密，因为所有人都压着嗓子说话。先摸去公会，看今天有没有人聊北边那个吞人不吐骨头的洞——顺便看看那六十金的矿道活儿到底有多假。", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "艾琳娜，等等——我不跟你绕。这票算我雇你：你签契约要打点、要铺保的那笔，我给你凑，一个子儿不少。你只要进杂货铺，把老苇那袋子拿出来就行。你开个价——去，还是不去？", "ms": 81372, "narration": "她已经走进主街的雾里，隔了一段路。你这一嗓子她听不听得见，看她停不停。", "refused": []}, {"id": "PL6·5", "kind": "plan", "input": "我快步追进主街的雾里，绕到她前面拦住去路：艾琳娜，我不白让你冒险——你开个数，定金我现在就给，钱袋到手就算两清。", "ms": 142618, "narration": "她就在主街上，隔你几步。要她开价，先听她怎么答。\n她停下来了，人还在雾里，没走也没答话——在掂你这句话值多少。你先说个定金数，还是等她先开口？", "refused": []}, {"id": "PL6·6a", "kind": "plan", "input": "四十银——定金二十我现在就给，钱袋到手再结二十。你要签契约、要找铺保，这数够你打点。就这个价，去，还是不去。", "ms": 15906.3, "narration": "价码摆到桌上了:四十银,定金二十现付,字据两清。就等她这一句。\n艾琳娜:「二十定金拿来，袋子到手再补二十——这活我接。」付了定金她就进杂货铺。袋子拿不拿得到，要过老苇那一关——按她的 CHA 掷一下。", "refused": []}, {"id": "PL6·6b", "kind": "resolve", "input": "", "ms": 142865, "narration": "[旅人 CHA(把袋子从老苇手里拿走): 15+0=15 >= 12] → 成功\n\n你从钱袋里点出二十枚银币，一枚一枚放到她摊开的手掌上。她数完，收进斗篷内袋，扣好。\n「站这儿等。」\n她转身推开杂货铺的门，门轴叫了一声，雾被卷进去一小团。你留在台阶下。\n窗玻璃上全是水汽，看不清里面，只剩下老苇那把又碎又尖的嗓子，隔着门飘出几句，压得很低。之后是一段停顿。然后是柜台底下翻东西的响动——麻袋、纸、什么东西磕在木板上。\n艾琳娜出来的时候，斗篷一侧鼓了一块，鼓得平整，不像随手揣的。\n「拿到了。」\n她把一个油布小袋搁在你掌心里。沉，比二十枚银币沉得多，压手。\n「尾款二十，跟袋子一起算。契约那边我自己去公会办，不劳你跑。」\n她退开半步，把兜帽重新压了压。雾还在主街上贴着地皮走，镇子这一头，窗子才刚亮了两三扇。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「雾再重也得走。」我把兜帽往下压了压，沿着主街的石板往公会那面旗子走——总得先看看告示板上写的都是什么价钱。\n// 异地 · 罗文 @ 矿工大道:雾里站着正合适——先看一眼这镇子什么成色。守门的要是嘴松，两句话就能问出矿道那点事和北边那条路最近有没有怪动静；要是嘴紧，我就直接上矿工大道去公会。", "refused": []}]}, {"id": "H1", "title": "[语言与歧义] H 语言切换 · I go to the inn.", "category": "语言与歧义", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "at_inn": {"pass": true, "got": e": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2202, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "我直接进镇，往镇中央走，先找冒险者公会看一眼。", "ms": 3502.4, "narration": "好，走主街到头就是冒险者公会。艾琳娜跟你一道过去。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 22564, "narration": "你跨过北门那道歪斜的栅门，靴底踩上石板。雾贴着街面不肯升，主街两侧的窗大多是暗的，只有挑夫推开一扇门，把一筐湿鱼搬上车。\n石板一路往东，走到头就是旧码头那头的集市广场。广场北边一栋两层的木石混杂房子，门口挂着一块褪色木牌，牌上烙着一把剑和一支羽毛笔——冒险者公会。门半开着，里面透出一线灯光。\n艾琳娜在你身后几步远停下，肩上的包带往上一提，抬头看那块牌子。她的靴子也沾着雾水。\n「你也找工作？」\n\n// 异地 · 罗文 @ 碧石镇:「六十金加未切割水晶，买的是几声响动？——矿工宁可空手回家也不肯下第三层，这买卖里头有真东西。」 我在公会门口停了一步，先把悬赏板从头到尾扫一遍，再挑个昨晚下…", "refused": []}, {"id": "ID3·2", "kind": "plan", "input": "先进去，我不往里走太深，就在门边站一下，扫一眼大厅和那块悬赏板，看完就出来——找活的事回头再说。", "ms": 13644, "narration": "门边能看清悬赏板最上一张：「雾中失踪者」，赏 25 金。艾琳娜站在原地没动。\n艾琳娜:「门口都到脚底下了，问一句又不会少块肉。」我侧身从旅人旁边过去，用肩膀把那扇半开的门推得更开些，冲里头的灯光抬了抬下巴。「先进去，看看板上钉的都是什么活——你要是不问，我就先问了。」\n艾琳娜要进去问赫伦，你原话是看完就走。你：① 一起进去问 ② 先把她拉出来，办别的 ③ 让她自己进去，你在门口等", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "①，一起进去吧。我就在门边站一下，扫一眼大厅和那块悬赏板，看完就出来——找活的事回头再说。", "ms": 10367.9, "narration": "那就一起进门。你在门边站着扫一眼大厅和板上钉的活，看完就出来，找活的事回头再说。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 39349, "narration": "门里比外头亮，也好不到哪去。屋当中一只铁炉烧着湿柴，烟从烟囱里往外挤。大厅不大：左边一条长柜台，右边墙上钉着一整块木板，纸上压着铁钉，边角卷起。靠墙两条长凳，一个人也没坐。\n悬赏板最上面那张你看得清：「雾中失踪者」，赏 25 金，落款是码头行会。第二张纸被撕掉半张红条——「苔墓前的狼嚎」，30 金，**已被人接下**。底下还钉着一张新纸，「会说话的棺木」，80 金，墨迹未干。\n柜台后的男人抬起头。五十上下，络腮胡剃得短，手边摊着一本厚册子，笔尖停着。他先看艾琳娜，再看你，两个人都扫了一遍。\n艾琳娜径直走到柜台前，指尖按住最上面那张纸，向赫伦问起来。\n「上周的事，码头三号仓的看守，夜里巡河堤，没回来。」赫伦把册子合上，笔搁在封面。「人没找到，只找着一只鞋。这活不难，也不轻——你得走河堤，雾里那段最好两人去。」\n「第二张有人接了。既然板上还钉着，就是还没了。第三张你要碰，先得有个帮手，再带上灯。」\n你退到门外，站在公会门口那两级石阶上。雾里的集市广场只有两个披蓑衣的人在收摊，石板缝里积着水。\n\n// 异地 · 罗文 @ 碧石镇:悬赏板上那三条我都扫过了——第三层的\"异响\"标价六十金，矿工却宁可空手回家，这价码不是买命，是买沉默。 我在公会门口截住一个眼圈发青的老矿工，把热汤推过去：「…", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "我从公会门口下来，沿主街往西走一段，就随便看看街上都开着什么。", "ms": 9937.6, "narration": "你沿主街往西，边走边看两边开着什么。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 31206, "narration": "公会的门在你身后合上。你顺着石阶下来,主街往西铺开,石板缝里全是水。\n檐角滴着水,一滴一滴砸在石头上。街面比刚才空,雾贴着两边的墙根走。\n左手第一间铺子亮着灯,门楣上挂着几串风干的鱼和一圈绳子,玻璃后面堆着麻袋——杂货铺,门开着半扇。\n再往西,一家铁匠铺的门帘挑起来一半,里面叮当响了两声就停了。隔壁一块匾额挂着,窗板关死,锁扣上落着锈。\n一个披蓑衣的女人蹲在自家门前,拿笤帚把积水往街心扫。她抬眼看你一下,没说话,接着扫。\n一辆拉鱼的车从雾里出来,轮子压在石板上吱吱响,往东去了,是码头的方向。\n街尾十几步外,雾就厚起来,把路吃掉。那边大概通着码头。\n\n// 异地 · 罗文 @ 碧石镇:老矿工捧着碗没喝，先看了眼矿区方向——那一眼比任何回答都响。「第三层不是没人敢下，是下了的人不肯说。」我把汤又往他手里推了推，压低声音：「那我不问动静。我只问…", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "街上看着也就这样，我掉头往回走，回刚才那个工会去。", "ms": 1716.3, "narration": "回公会——从主街往东走几步就到,不用绕路。这就过去。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 27718, "narration": "你沿主街往回走，几步就到。檐角的滴水声一路跟着你，踩进门槛里。\n公会的门虚掩着，你一推就开。炉子里的湿柴塌下去一块，亮了一瞬，又暗回去。\n穿堂风从后面挤进来，把悬赏板上「会说话的棺木」那张纸掀起一角，又落下。\n赫伦在柜台后翻册子，笔尖不停。听见门响，他抬了下眼，又低回去。\n艾琳娜站在木板前，侧对着门，一只手搭在剑柄上，没动。\n大厅里除了湿柴的响声，没有别的。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「那就码头的。二十五金，我先拿一半定钱——」我把包放在脚边，手指点着那张纸，「遗物要找不回来，算不算数，你给个准话。」\n// 异地 · 罗文 @ 碧石镇:老矿工眼神一闪，我就知道问对了——风从井底往上来，说明底下通着别处。我把碗按在他手上：「谢了，老哥。这五株月见草的活我顺手接了，正好往山坡上走一趟，顺便看看矿…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 2014, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1a", "kind": "plan", "input": "③ 我先把兜帽压低，顺着泥路直接走向那点亮着橙光的旅店，推门进去看看里面都有谁。", "ms": 3434.1, "narration": "好，你压低兜帽，沿泥路往河灯旅店去，推门进去看里面都有谁。", "refused": []}, {"id": "ID4·1b", "kind": "resolve", "input": "", "ms": 30930, "narration": "你把兜帽压到眉骨，踩过结着薄霜的石板，往那点橙色的光走。\n身后，艾琳娜还站在北门边，正跟守门人搭话。\n「那家旅店，住一晚多少钱？」\n主街两旁的窗子大半还黑着，晾在杆上的渔网滴着水。雾把脚步声收得很短。\n河灯旅店的招牌是一盏旧灯罩，油烧得发黄。你推门，门轴叫了一声。\n屋里比外面暖。炉火在角落烧着，空气里是麦粥和咸鱼的味。\n靠窗的桌上坐着三个渔夫，正分一壶热茶，没有抬头。更里头有人裹着斗篷趴在桌上睡。\n柜台后的女人把抹布搭到肩上，先看你的兜帽，再看你腰上的短剑，最后才看你的脸。\n「这么早。通铺三金，单间八金，粥另算。」\n她说完没挪开视线，像在数你身上有几处磨损。\n\n// 异地 · 罗文 @ 碧石镇:「第三层的动静，矿工不敢下去，公会却只出六十金——这价钱盖不住真东西。」我压着嗓子跟酒保要了杯热的，顺手把一枚铜币推过去，「顺便问问，最近有没有人从北边山脊下…", "refused": []}, {"id": "ID4·2a", "kind": "plan", "input": "我把兜帽按回原样，没接老板娘的话，转身推门出去，顺泥路摸回北门去找刚才那个说话的女人——到了近前我先叫她一声：「Elena。」", "ms": 3143.7, "narration": "你出旅店，沿泥路回北门，走到那女人近前叫她一声。她怎么应，看她的。", "refused": []}, {"id": "ID4·2b", "kind": "resolve", "input": "", "ms": 23277, "narration": "你出门时，门轴又叫了一声。屋里没人留你。\n泥路比来时干了些，主街的窗子陆续亮起来。一个挑水的女人从你身边过，桶沿溅出的水在石板上很快变成浅痕。\n北门的栅门已经推开半扇。守门人靠在门柱边，手里捏着一截烟叶，正低头跟人说话。\n那女人还在。斗篷的下摆被雾打湿了，她侧对着你，听守门人讲着什么，偶尔点一下头。\n你走近，站住，叫了一声。\n「Elena。」\n她的话停了。守门人也停了，先看你，再看她。\n她转过头来，看你的脸看了有两息。\n\n// 异地 · 艾琳娜 @ 主街:「住店的钱我记下了。」我把兜帽往上推了推，直视守门人的眼睛，「倒是码头那边——雾里失踪的人，是常事还是这个月才有的？找线索的活儿，谁都能接吗？」\n// 异地 · 罗文 @ 碧石镇:「别急，钱先收着。」我把杯子拢到手里，目光却顺着酒馆扫了一圈——谁的手在抖，谁听见「没有底的洞」时抬了头。「北边山脊下来的人，最后一个进这镇子的，坐哪桌？」", "refused": []}, {"id": "ID4·3", "kind": "plan", "input": "Elena，我这件斗篷让雾浸得能拧出水了——把你那件借我披一会儿，行吗？", "ms": 9242, "narration": "她就在你面前，斗篷下摆滴着水。这事你当面问她。", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "Elena，我这斗篷都让雾浸透了，你那件借我披一会儿行吗？就一会儿。", "ms": 17504.4, "narration": "她就站在你对面，那件斗篷下摆还滴着水。话你当面说了。\n她没立刻答话，等你把话说圆。这得掷一下——CHA，看你能不能让她把斗篷解下来。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 48209, "narration": "[旅人 CHA(让她愿意借出斗篷): 5+0=5 < 12] → 失败\n\n你开的口。栅门边只剩守门人。\n「刚走。」他嚼着烟叶，朝主街那头扬了扬下巴，「你转身那会儿。」\n雾把街道吞到十来步外。石板颜色发暗，有个人影在里面走，斗篷罩着肩，不快也不慢。你喊出去的话，多半是追着她的背走的。\n那人影没回头。快到街口时脚步顿了一下，像绊了块石头，又迈开，弯进左边那条巷子，就没了。\n守门人把烟叶从嘴边拿下来，看了看你滴水的下摆。\n「北边下来的？」他说，「这镇上没人随便借斗篷。」\n他重新靠回门柱，把烟叶塞回嘴里，不再看你。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「守门的嘴比雾还紧，再问也是白搭。」 「那二十五金的失踪委托是挂在公会墙上的，不是挂在他嘴里的——钱在哪，我就去哪问。」\n// 异地 · 罗文 @ 碧石镇:「别装聋，我又不是收税的。」我把铜币往他手边又推了半寸，眼睛却钉在后窗那桌——刚才有人把椅子往回缩了一下。「北边下来的，最后一个是矿工、还是探子？」", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": false, "got": "{\"id\": \"ST901\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 8, \"each\": \"player.hp:-1\", \"on\": \"si-elena0001\"}"}, "player_bleed_kept": {"pass": true, "got": "{\"id\": \"ST900\", \"name\": \"流血\", \"rule\": \"持续 2 次结算 · 每次结算 player.hp -1 · 伤口在渗血 · 包扎或止血草立止\", \"turns\": 8, \"each\": \"player.hp:-1\", \"on\": \"player\"}"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID5·0", "kind": "opening", "input": "开始游戏", "ms": 2090, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID5·1", "kind": "plan", "input": "我先去问守门人：有没有见过一个叫艾琳娜、身上带伤的女人？我自己的伤先不管，得先找到她。", "ms": 84444, "narration": "守门人挠了下头：我新换的班，今早没见谁进来——除了她。你要找的人，名字就在你眼前。\n艾琳娜:「艾琳娜就是我。先说清楚——是你要找我，还是替别人跑腿？」「要是没打算动手，我就先把这条胳膊扎上，血不等人。」\n她自称就是艾琳娜。她要先给你扎上胳膊——你定：① 我就是在找你，没别人 ② 我连自己是谁都不记得 ③ 让她先止血，边扎边说", "refused": []}, {"id": "ID5·2", "kind": "plan", "input": "我在找的就是你，没别人。不过胳膊别忙着给我扎——这束止血草先用在你自己身上，你的血更要紧。", "ms": 17026, "narration": "草在你手上，怎么用她比你在行。先听她一句。\n艾琳娜:「草收着，布条就够了——这血我压得住，草留到真需要的时候。」「扎完这一下，你再接着说：谁让你来找我的。」\n她缠上布条，压住血，抬眼等你。你:① 说实话——你连自己是谁都不记得 ② 只说没人指使，问她这一带有什么活 ③ 直接带她去公会", "refused": []}, {"id": "ID5·3a", "kind": "plan", "input": "我没替谁跑腿，我连自己是谁都不记得；但这束止血草现在就是该用的时候——只给你，我自己不用，让我帮你敷上，行吗？", "ms": 10537.7, "narration": "草给她敷、两处都在渗血——就这一件事：你按着胳膊，我上手，敷完就去公会看有什么活。\n艾琳娜:「行——你来敷，手稳点。」「草我收你的，这份我记着。」\n就这么办：草敷在她伤上、你自己不用，收拾完就去公会看有什么活。", "refused": []}, {"id": "ID5·3b", "kind": "resolve", "input": "", "ms": 227021, "narration": "你在北门边的石阶上坐下，让艾琳娜把袖子卷上去。伤口在左前臂，两道，一深一浅，血已经渗透布条。你把止血草从怀里取出来——这束草还带着点灰雾的潮气，你把它在掌心揉开，先敷深的那道，再敷浅的。艾琳娜没出声，只在草压上去时吸了口气，指尖绷了一下，又松了。\n草用尽了。你把空了的布片折好收起来，剩下的那道浅伤她自己缠了布条压着。\n「手稳。」她说，「这份我记着。」\n她站起来活动了一下胳膊，点头示意走得动。你们从北门拐上主街，石板上的雾还没散，两侧的屋檐往下滴水。走到街中段，一面挂着铁牌的门开着半扇，牌上是交叉的剑与一杯酒——冒险者公会。\n门里比外头暖和。墙上钉着几块木板，贴着写得潦草的委托，柜台后一个中年男人正低头记什么，听见门响才抬眼看过来。\n「找活？」他扫了你们一眼，目光在艾琳娜那条缠着布条的手臂上停了一下，「柜台这边说。」\n\n// 异地 · 罗文 @ 碧石镇:「雾这么大，正好——公会里的话比雾还糊，得凑近了听。」我把兜帽压低些，先摸去冒险者公会的委托板前站一会儿，看看有没有哪条风向指得够北、够深。", "refused": []}]}]}, "identity-v4-old-r2": {"label": "identity-v4-old-r2", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→T001"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 3391, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "我盯着雾里那点旅店的灯光，忽然闭上眼——下一秒再睁开时，我已经站在碧石镇的街上了。", "ms": 15644, "narration": "你睁眼还在北门：歪栅门、湿石板、雾全没变。碧石镇在三天脚程外，眨一下眼到不了。艾琳娜就站在旁边看着你。\n艾琳娜:「没事，雾太重，闭眼是想把方向记牢一点。」「我这一拍先去那盏灯下面——得在钱花光前把住的地方谈妥。那家旅店你熟吗？」\n艾琳娜把斗篷一拢，已经朝那盏灯走了。你在这儿人生地不熟——跟她去旅店，还是先干别的？① 一起去旅店 ② 先去公会看委托 ③ 自己走", "refused": []}, {"id": "B1·2", "kind": "plan", "input": "我不跟那盏灯走。@dm 我抬脚往雾里迈一步——这一步落地的时候，我要踩在碧石镇的街石上。三天脚程也好，眨眼到不了也好，我这一步就是要到。", "ms": 13646, "narration": "这一步落地,还是北门外的地,碧石镇三天脚程,不是眨眼的事。你要现在就一个人上路,我就按三天路走;不然是先去旅店,还是先去公会?", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "行，不眨眼了。那我一个人上路，朝碧石镇走——三天就三天，我认。", "ms": 11188.4, "narration": "那就这么办:你一个人上路,三天走到碧石镇;艾琳娜先去河灯旅店把落脚处谈下,回头还能找着人。这就动身?", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 129219, "narration": "艾琳娜把斗篷拢紧,朝那盏旅店的灯走了,没回头。\n你站了一会儿,把罩灯挂在腰侧,踩上北门外那条往南的夯土路。石板很快变成车辙压硬的土,冻着一层薄冰。\n雾一直没散。前半天路沿河走,能听见水声,看不见水。你在路边捡了根结实的木棍当手杖。\n傍晚你在一间塌了半边的驿站棚下歇脚,啃了半块黑麦面包。夜里冷,你烤了一小堆火,睡睡醒醒,火灭了就起来走。\n第二天中午,路开始爬矮丘。车辙少了,路肩上堆着碎石和旧车轴。林子挨近路面,风一过,树枝扫过你的肩。\n地上有过火的痕迹,还有几个被人拖走的箱子的碎木片。你把手按在短剑上,没有停。\n第三天,林子里静得不对,连鸟都没有。\n第三天下午,风里的冷烟味浓了些,混着湿泥被马蹄压过的腥气。\n你转过那丛矮桤木,路当中横着两杆长矛。矛尖没擦亮,矛杆上缠着旧布条,是山里人包扎刀伤的缠法。\n两个人站在路中间,一个高瘦,一个矮壮,皮甲下摆都磨得起毛。矮壮的抬手,掌心朝你,像拦牲口。\n「站住。」\n高瘦的眯眼扫你的短剑和腰侧罩灯,又看你的靴子——走长途的靴。\n「一个人上路,胆子不小。」矮壮地说,「这条道过路要点数。五个金,或者把背上那把剑留下,人过去。」\n后面林子里有东西动了一下。你看不清是几个人,但至少不止两个。\n高瘦的把矛杆往地上一点,没退。\n「别摸剑。你回头看看那雾,追不上人。给了钱,我们送你到坡下。」\n\n// 异地 · 罗文 @ 西门:我裹紧外套往公会那边走，雾里的酒馆灯还亮着——这种天气最适合听人吹牛。「老板，来碗热的；顺便问问，最近矿道底下那动静，有没有人提过更早的什么传说？」", "refused": []}]}, {"id": "PL1", "title": "[交易与经济] 杂货铺:买药 + 卖灯,艾琳娜在场(并入 N4)", "category": "交易与经济", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\", \"si-elena0001\"]"}, "board_has_haggle_check": {"pass": false, "got": "{\"艾琳娜\": \"和 ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "N2·1a", "kind": "plan", "input": "我先选②，走过去跟守门人打个招呼——@守门人 请问冒险者公会在镇上什么位置？最近有没有讨伐野兽之类的委托？", "ms": 16623.5, "narration": "守门人:「公会就在主街北头，走过去两分钟。告示上两桩：雾里失踪者的线索 25 金，苔墓小径的狼 30 金加一瓶药水。」\n艾琳娜:「是，我也是去公会的——一起走正好。」「守门师傅，北门离主街的 guild 还有多远？如果顺路，我们就边走边说。」\n那就一起走：艾琳娜和你沿主街往北头公会去，路上把告示上的两桩活儿对一对。", "refused": []}, {"id": "N2·1b", "kind": "resolve", "input": "", "ms": 42069, "narration": "你和她沿主街往北。雾还没散，石板缝里积着昨夜的雨水。\n铺子大半没开，渔行的人把湿网挂在钩上晾，腥味混着雾气贴过来。\n公会在街尽头，两层石屋，门楣上的铁牌被浸得发暗。门半开着，里头亮着灯。\n屋里比外面暖一点。墙上钉着告示板，纸条压着铁钉，边角被翻得起了毛。\n柜台后的人抬起头——灰发，短须，手边摊着一本账簿。\n「新面孔。要做工的，先看板子。」\n板上压着两桩：\n「雾中失踪者：码头区有人入雾未归，带回遗物或线索。酬金二十五金。」\n「苔墓前的狼嚎：通往苔墓的小径有野兽出没，清三次。酬金三十金，另附一瓶药水。」\n艾琳娜走到板前，把两张纸条都看完，回头看你。\n赫伦把笔搁下，看了你一眼，又看了她一眼。\n「失踪那桩有人跟过，回来的话都说不利索。狼那桩是死活，不挑人。」\n\n// 异地 · 罗文 @ 碧石镇:「这种雾天最适合坐在酒馆角落，一杯热的换三条有用的闲话。」我把硬币拍在吧台上，挑了个能同时看见门和公会告示板的位置。", "refused": []}, {"id": "N2·2", "kind": "plan", "input": "继续。", "ms": 12487, "narration": "两桩都压在板上：失踪那桩二十五金，狼那桩三十金加一瓶药水。先听她怎么说。\n艾琳娜:「狼那桩。三次，清完就结，不靠谁的嘴。」「二十五金的失踪案听着更像个谜，可我现在要的是能攥在手里的东西——不过这路上我一个人走不划算，你要也接，我们就一起，赏钱对半分。」\n她要接狼那桩：三次清完，赏钱对半分，问你同不同行。你：① 一起接，对半分 ② 你接狼、我看失踪那桩 ③ 先都不接", "refused": []}, {"id": "N2·3a", "kind": "plan", "input": "①，一起接狼那桩，赏钱对半分。@赫伦 我们两个登记接了，这就准备上路。", "ms": 16015.5, "narration": "赫伦:「记上了——三次清完回来领三十金加一瓶药水，别拿风声糊弄我。」路你们认识，这就动身。", "refused": []}, {"id": "N2·3b", "kind": "resolve", "input": "", "ms": 58658, "narration": "你们从公会出来。雾还压在街面上，主街的铺子陆续开了板，铁匠铺的锤声隔着雾传得很闷。\n镇子很快被落在身后。石板路变成土路，土路又变成踩出来的小径，两边是湿草和歪斜的木桩，霜水从草尖上落下来，蹭过裤脚。\n坡地往下走。苔藓爬上石块，风里的冷腥气一层一层重起来。\n约莫一炷香，一道半塌的石墙从雾里露出来，墙脚是个门洞，朽掉的门板斜挂在一边。\n门洞后是一间石室，地面有积水，墙面结着青苔，霉味和土腥味混在一起。\n屋子中央一道石阶往下，黑得看不到底。从底下浮上来一种很低的声音，像风灌进石头缝，又比风慢。\n第一级台阶上有一层薄绿的水痕，一直延伸到看不见的地方。\n你把背包里的罩灯取出来，火绒还干。\n\n// 异地 · 罗文 @ 碧石镇:「雾天，正好干活。」「听见了吗——矿区第三层，昨晚又响了。告示板上那单我接了，先去看看矿工们不肯下去的到底是个什么东西。」", "refused": []}, {"id": "N2·4a", "kind": "plan", "input": "继续。", "ms": 11448.0, "narration": "石阶往下,底下像有低语。台阶湿滑,罩灯还没点——她跟不跟下去,灯归谁提,先定一句。\n艾琳娜:「下。灯你提——你走前面，我隔半步跟着，眼睛盯墙根和脚印。真碰上东西，我两只手得空着。」\n定了:灯你提、你走前面,艾琳娜隔半步跟着,手空着。下石阶。", "refused": []}, {"id": "N2·4b", "kind": "resolve", "input": "", "ms": 36393, "narration": "火绒咬了三下才着。灯芯先黑了一息，然后撑起一团黄，光边一圈发抖。\n第一级台阶上那层薄绿是水苔，你踩上去，鞋底滑了半寸，扶了一把墙。石壁冷得像铁。\n艾琳娜留在你身后两级台阶，没跟上。她的眼睛从左墙根扫到右墙根,再落到下一级。\n二十来级到底。甬道比上面的门洞矮，顶是湿的，隔一会儿一滴水掉下来，有一滴砸在你后颈上。\n地上积着一层浅水,不深,但看不清底下。水里有脚印——不止一副,旧的,早被踩乱了,其中一双往深处去了,鞋尖比你的小一圈。\n那种声音在这里更清楚。不是风。它慢,拖着尾,像很远处有人在念一句很长的话,念完,又从头开始。\n灯照到的地方,水面上浮着一层薄薄的绿皮,随声动,往深处一层一层推。\n\n// 异地 · 罗文 @ 碧石镇:「赏金六十金是明面上的，真正值钱的是矿工嘴里那句『不愿下去』——他们怕的东西，通常比公会写的危险等级高一级。」我把告示板上的委托抄进本子，出门前又跟柜台要了第…", "refused": []}, {"id": "N2·5a", "kind": "plan", "input": "继续。", "ms": 17715.0, "narration": "甬道比门洞矮，水浅但底下看不清。艾琳娜在你后头两级，没跟上。\n艾琳娜:「一起下。你灯举高些，别照水面，照墙——水底下那层绿皮随声在动，我不想踩进它嘴里。」「那双往深处去的脚印比你的小一圈，像女人的。\n那就照她说的:灯举高,照墙不照水面,两人一起沿甬道往深处,跟着那双小一圈的脚印。\n那就一起下。你要走稳、别踩到那层绿皮——掷一次 DEX。", "refused": []}, {"id": "N2·5b", "kind": "resolve", "input": "", "ms": 38790, "narration": "[旅人 DEX(在水里走稳、避开那层随声动的绿皮): 18+2=20 >= 12] → 成功\n\n灯举到肩侧，光都泼在湿壁上，水面只留一圈毛烘烘的边。你盯着自己落脚的地方，每一步先探脚尖，踩实了再挪脚跟——底下那层绿皮随声一缩一胀，始终没碰上来。\n艾琳娜隔你半步，左手虚扶着墙，眼睛在墙根来回走，跟着你那道灯光扫。\n甬道往里，顶越来越低。你侧了侧头才过得去。那声音没停，越往深处越像有人贴着你耳朵念。积水到了小腿，冷，袜子早透了。\n那双小一圈的脚印把你带到一个拐角。拐过去，甬道豁开，进了一处长廊。\n长廊两边各立着一排烧过的灯龛，壁上爬满苔，绿得发乌。地上脚印到长廊中段就没了——像走到那里，人就不见了。\n长廊尽头，有一线更暗的黑，往里去还有一道门。\n你把灯往上抬了抬。长廊里除了水声和那个念不完的低语，没有别的。\n\n// 异地 · 罗文 @ 碧石镇:「雾不散反而是好事——矿工不肯下去，多半是看见了什么自己也说不清的东西。」我把本子塞进内袋，围巾往上一拉，顺着矿渣车辙往矿区入口走。谁昨晚当班，谁的眼睛就先借…", "refused": []}, {"id": "N2·6", "kind": "resolve", "input": "我先把灯往脚印断掉那块的正上方照一照，再扫一眼两边的灯龛，看有没有什么东西吊在顶上；没动静我们就贴着墙往尽头那道门摸过去。@艾琳娜 你盯我后头。", "ms": 43946, "narration": "你把灯提起来，光正对着脚印消失的那块水面上方——空的。只有那层绿皮随低语一缩一胀。再往上，长廊顶是老苔，垂着一缕缕湿须，没吊着什么。\n灯往两边扫，一排排灯龛早烧空，龛底积着黑灰和几片碎瓷。\n没有动静。\n你贴着左壁往长廊尽头挪，脚跟先落地，一步一步压着水。艾琳娜贴你右半side，两人之间那道灯光把长廊照成一条细长的亮带。\n就在这时，狼从你斜后方的暗里出来。它没叫，四爪踩水，声音亮得像敲碗边。灰青色的背，颈毛湿成尖，绕着你和那道光的外缘走——不快，像在挑一个你灯照不到的角度。\n艾琳娜已经半蹲下去，手指抠住龛口一块松砖，攥在掌心。她没动，眼睛跟着狼的脚尖走。\n「别转——它在绕你斜后方。灯举高，压住它的眼。」\n照她说的，把灯举高，压住那双眼。\n\n// 异地 · 罗文 @ 碧石镇:「雾里那排矿渣车辙的尽头就是矿口——守夜的还在换班，正好逮个正着。」我把围巾往下压了压，往炭火堆边挪两步，掏出抄好的巡道名单晃了晃：「昨晚第三层当班的，哪位？…", "refused": []}, {"id": "N2·7", "kind": "resolve", "input": "（灯举高，不转身，只把光往斜后方那双眼上压）@艾琳娜 它绕到龛口那边你就用砖砸它后腿，我数到三扑上去，行不行——一句话。", "ms": 96076, "narration": "你没转身。灯举在肩上方，光从背后斜着压过去，压到那双眼上——狼的瞳孔缩了一下，脚步慢了半拍，湿爪在石面上滑出一道。\n「行。」艾琳娜就说了这一个字，砖攥在手里，人半蹲着，盯着龛口那道亮带。\n狼不看你灯照的地方，它贴着暗半边绕，灰青背脊一沉一浮，转向左边那排龛口。「一。」你数出声。它前肩压低了。「二。」它后腿一蹬，往龛口那道暗边里去——\n——去了。\n艾琳娜的砖先到。她半蹲着甩出去，正砸在狼后腿上——闷响一声，狼的身子往旁边塌了半寸。\n「三。」你扑上去，短剑顺着它塌下去的那一侧斜切进去，刃口咬进肋下，手上传来一声湿的、闷的裂。\n狼一声没叫出来，只把牙张开，回身朝你小腿咬。你侧身让过，短剑横在身前，那口牙从你裤管外一寸的地方擦过去，咬了个空。\n它退了。湿爪在石面上蹬了两下，退到那排烧空的灯龛前，前肩压低，肋下那道口子把灰青的毛一缕缕粘成暗色，一路滴水。\n它不看你。它在算离开长廊的那条路——灯照不到的那半边暗，通往你来时那道门的方向。\n艾琳娜站直了，砖没了，空手贴着龛壁，眼睛钉在狼塌下去的那条后腿上。\n「它要走。」她说，声音压得很低，「别放它到你背后去。长廊尽头的门还没到。」\n\n// 异地 · 罗文 @ 碧石镇:「昨晚第三层当班的是谁——名字我念了，人没来，炭火边那几位都在躲我的眼睛。」我要的是眼睛不是谣言：谁下过第三层、看见什么、什么时辰撤上来的，一句实话我请一天的…", "refused": []}, {"id": "N2·8", "kind": "resolve", "input": "继续。", "ms": 33999, "narration": "狼没有正面再扑。它把身子压低，顺着你灯照不到的暗半边滑过去，后腿在石面上拖出一道湿痕，越走越快，径直朝你来时那道门的方向去——灰青的背脊一沉一浮，几个呼吸就只剩个糊影。\n它没叫。它算清了：正面咬不过你，那就走。把你背对着它。\n艾琳娜贴着你右肩，空着的那只手又摸上龛口一块松砖，攥住。她没跟着狼看，眼睛钉在长廊尽头那道更深的黑上。\n「它要回你背后那个门去。」她声音压得低，「那扇门后是前室，再下面是苔地——放它过去，它认得路，你就不认得。」\n长廊尽头那片黑里，水声比别处闷，像有什么把声音吞进去。两侧的灯龛一排排烧空，走到这里也快到头了。脚下还是积水，冷得往骨头里钻。\n「长廊尽头的门快到了。就隔十来步。」艾琳娜说，「先拦它，还是先过去？」\n\n// 异地 · 罗文 @ 碧石镇:「躲眼睛的人我见多了，但你躲得最不专业——炭火就你那边没烟，因为你根本不敢往火里添柴。」我蹲到你面前，把杯子搁在你脚边，「第三层。你下去过。名字我不念了，你自…", "refused": []}, {"id": "N2·9", "kind": "resolve", "input": "追上去补一剑——别放它绕到咱们背后，我灯压住它，你从侧边再给它一下。", "ms": 118509, "narration": "你举灯追上去。光甩在狼背上，把那条湿痕照得发亮，它没法再贴暗边——它被你逼回了长廊正中，四爪在积水里打滑。\n「就是现在。」你从正前压住它的头，狼张牙朝你灯的方向虚咬，前肩一低——\n艾琳娜从右侧的龛口斜切进来，一脚踩住狼塌下去的那条后腿，膝盖压上狼的肋。狼的身子一歪，侧腹整个朝你翻开。\n你从正前压下去。狼被逼在长廊正中，侧腹翻开，湿毛上一层亮。你短剑斜着递出去，刃口顺着那片翻开的下肋咬进去——先是硬的，肋，然后是一声软的裂，刃一半没进它身子里。\n「中。」你说。\n狼口里的气全泄在灯罩上，白了一小片。它四条腿还在挣，前爪扒着积水里的石缝，想把自己从刃上挣开。艾琳娜膝盖压住它那条后腿，纹丝不动。\n它的重量开始往你剑上塌。\n刃口底下那股挣劲一寸一寸松了。狼前爪在石缝里刨了两下，爪尖刮出的响闷在积水里，然后不动了。它整个重量压在你剑上，你的手腕往下沉了半寸，稳住。\n艾琳娜没急着起来。她先确认狼那条后腿还是软的，才把膝盖从肋上撤下来，站直，鞋底在水里踩出一道深印。她甩了甩手上的水，看一眼狼颈侧——那双眼还睁着，光已经没了。\n「干净。」她说，一个字的评价，像是干这行的人说的话，说完自己也顿了一下，像没料到这句话会这么顺地出来。\n长廊重新只剩下水声和那个念不完的低语。灯照过去，狼倒在长廊正中的积水里，灰青的毛贴着石面，肋下那道口子还在往外沁，慢慢染开一小片暗色。\n你直起腰。长廊尽头那道更深的黑就在十来步外，一直没动过。两边烧空的灯龛一列列排过去，到那扇门前收住。门后是什么，光够不着。\n艾琳娜把罩灯从你手里接过去一半没接，只是抬手压了压灯沿，让光往下压，照你脚边——你小腿上刚 了。楼下灶房传来添柴的声音，很轻。雾还在街上没散。\n\n// 异地 · 罗文 @ 碧石镇:「第三层有响声，矿工不敢下去——换个说法就是：有个洞在等一个够胆的人。」我把公会告示上的雾水抹开，多看了那行赏金两眼。 「先别急着领，去酒馆坐一坐，听谁在说'…", "refused": []}, {"id": "S4·3a", "kind": "plan", "input": "我解开斗篷搭在柜上，短剑塞到枕头底下，脸一沾枕就睡——别叫醒我，有什么动静都等天亮再说。", "ms": 29882.3, "narration": "你这一觉要睡到什么时候，她这半天怎么打发——先问一句。\n艾琳娜:「我不等人。天亮这几个钟头最值钱，主街和集市广场的招工牌、药铺、铁匠铺，我一间间问过去，先落一份能换饭钱的活。」「米拉，镇上有帮人看伤、抓药的地方吗？告诉我大概在街哪头，我自己去找。」\n米拉:「抓药找杂货铺的老苇，看伤得等镇署的人。招工牌挂在公会门口。」你锁门睡下，艾琳娜这半天自己去主街、集市挨家问活。", "refused": []}, {"id": "S4·3b", "kind": "resolve", "input": "", "ms": 120410, "narration": "你反手带上门，拨门闩。斗篷搭上柜角，短剑连鞘塞进枕头底下。\n床垫里塞的是干草，硬，压下去就响。窗纸把雾滤成一层灰白，摊在木地板上。\n你没解外衣，脸一沾枕就沉下去了。\n楼下，米拉把三枚金币收进钱匣。艾琳娜拢紧斗篷领子，问清了往南两个路口就是主街。\n「杂货铺在街右手边，挂着秤牌子。」米拉说。\n她道了声谢，推门出去。门帘晃两下，人就混进街上的雾里。\n你醒的时候，窗纸上的灰白偏了角度，成了发黄的斜光。楼下碗碟响，有人在灶房那边拨火。\n喉咙干得像塞了灰。短剑还在枕头下，斗篷还搭在柜角。你坐起来，脚踩到地板——凉。\n门外走廊有人走过，脚步不快，在自己房门前停了一下。\n\n// 异地 · 罗文 @ 碧石镇:「六十金加一块未切割的水晶，换一句『第三层有响声』——这价钱听着像是矿主自己都不敢下去。」我没撕那张告示，只用指节在雾玻璃上敲了两下，把那行赏金的位置记牢。 …", "refused": []}, {"id": "S4·4", "kind": "plan", "input": "我拎起斗篷下楼，跟柜台后的米拉要一碗热水，顺口问一句：现在是第二天早上了吗，还是我这一觉只睡到了当天下午？", "ms": 7241, "narration": "米拉把碗热水推过来:「还是今天，没过夜——刚过上午。热水算房钱里。」她又问:「要出门的话，公会和杂货铺都开着，码头那边雾还没散。", "refused": []}]}, {"id": "ID1", "title": "[身份与指代] 两人中毒各自解毒", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "player_poison_gone": {"pass": true, "got": "null"}, "elena_poison_gone": {"pass": false, "got": "{\"id\": \"ST901\", \"name\": \"中毒\", \"rule\": \"持续 3 次结算 · 每次结算 player.hp -1 · 胃里翻、发冷汗 · 解毒药或吐干净可解\", \"turns\": 7, \"each\": \"player.hp:-1\", \"on\": \"si-elena0001\"}"}, "herbs_used": {"pass": true, "got": "0"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID1·0", "kind": "opening", "input": "开始游戏", "ms": 3634, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴 靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1a", "kind": "plan", "input": "先看看雾里的街道和那家旅店，还有没有别人醒着。", "ms": 4355.3, "narration": "你在雾里的街上站住，先看清沿街还有谁醒着、旅店那边什么动静。", "refused": []}, {"id": "ID2·1b", "kind": "resolve", "input": "", "ms": 28296, "narration": "雾把主街压成一条灰带子，两边屋子的门都还关着。石板缝里积着夜里的水。\n河灯旅店的窗透出一块橘子色的光，烟囱冒着一缕细烟——火刚生起来。再往码头那头，有个渔夫正拖着一卷湿网往水边走；客栈门口挂着的灯下，有人拿长杆挨个去点街角的灯。除这两三个，街上没人。\n她就是你方才在门边没看清的那团影子。她踩着雾从阴影里走出来了，靴底叩在石板上，一步一声。\n「旅店的火还没烧旺，你这会儿进去只能喝到隔夜汤。」\n她在离你两步的地方停住，雾从你们中间散开一道缝。\n「你在找什么？人，还是路？」\n\n// 异地 · 罗文 @ 碧石镇:起了个大早，雾里先去公会门口转一圈，顺手跟扫雪的伙计搭话——矿区第三层的事他肯定比布告板知道得多。「矿道那点动静，是塌方还是有什么东西在底下挠门？说实话的人，…", "refused": []}, {"id": "ID2·2", "kind": "plan", "input": "我先去杂货铺买一束止血草束——你知道镇上杂货铺开门了没，往哪走？", "ms": 16282, "narration": "杂货铺在主街西头，老苇开的。开门没开门，我问问她——顺便，你手上那束是哪种草？\n艾琳娜:「我今早才踩着雾进镇，老苇开没开门我不敢替他打包票——不过你看，点灯的还在挨个儿点，这会儿去多半是吃门板。」「跟我往主街走吧，杂货铺就在那条街上。真要关着，止血草我也认得，不一定非得买他的。」\n老苇不卖止血草束:只有药水12金、火把2、麻绳4、解毒剂10。她领你走主街,顺路认草。①跟她走 ②买药水 ③仍去杂货铺", "refused": []}, {"id": "ID2·3a", "kind": "plan", "input": "还是去杂货铺吧，我得当面跟老苇问——@dm 我要一束跟手里这个一模一样的止血草束，他店里要是没现货，就问他能不能匀一束，或者告诉我哪儿有卖同样的。认草的事先不急，我手上这束不缺。", "ms": 6271.5, "narration": "那就走主街西头，杂货铺。到了你直接问老苇：一模一样的一束，有没有现货、能不能匀、哪儿还能买。", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 36652, "narration": "主街往西，雾薄了一线。她走在你半步前头，时不时弯腰，从石缝里掐一片叶子，在指间捻开让你闻。\n「这个苦的，是苦艾，赶蚊子用。」\n「止血草不长在路面上，得往水边湿的地方找。」\n她说得像在数一笔旧账，认得，却认得不深。\n铺子在街西头，门板开了一半，一盏油灯搁在柜台上。老苇正从里屋拎出一挂麻绳，先看脚，再看手。\n「早。外乡人。」\n他的目光落你手上那束草上，停了一会儿。\n你把话说了：一模一样的，有没有现货，能不能匀，哪儿还有卖。\n他把麻绳挂上钉，走过来，捏起你束草的一角凑到灯下翻看，看完放下。\n「这个我不卖。」\n「不是不肯匀。是进不来——我柜上走的是瓶装的，车上下来的货，一年就那么几趟。」\n「你这束是野的，掐口还新，没干透。往北出了镇，苔墓那条小径边的水沟里长这个。不过那条路最近不太平，公会的告示我今早才贴上门。」\n他把油灯往柜台里侧挪了挪。\n「谁给你的？」\n\n// 异地 · 罗文 @ 碧石镇:「一大早扫雪的人，消息最全——别装糊涂。」我把一枚银币弹进他扫帚边的雪里，笑着压低声音，「第三层的响动，是塌方在回气，还是有东西在底下挠门？说清楚的人，酒吧第…", "refused": []}, {"id": "ID2·4a", "kind": "plan", "input": "既然瓶装的不算，那你能不能替我进一束一样的野止血草束？车什么时候来、定多少钱，我先付。要是近些日子进不来，镇上谁手上还存着同样的，你指个名，我照价买他的。", "ms": 54021.8, "narration": "老苇:「代订我不接。车入冬前才来一趟，日子说不准，你赶着用别等我。」老苇:「要现成野的——河灯旅店米拉的灶房后头挂着一串，码头早市上也有婆子晒。", "refused": []}, {"id": "ID2·4b", "kind": "resolve", "input": "", "ms": 85779, "narration": "老苇把那句话扔在柜台上，转身去够墙上的麻绳，不再看你。\n灯芯短了一截，他用剪子挑了两下，火苗直起来。\n铺子里是干草、铁锈和旧麻绳的味道。柜台边角被磨出一层黑亮的包浆。\n「门开着，站多久都行。」\n他没回头。这话是对你说的，也算是对门槛边那个人说的。\n艾琳娜没进来，一只手搭着门框，眼睛还落在柜台上你那束草上，像是已经把它的茎、叶、掐口都对了一遍。\n门外主街有车轱辘碾过湿石头，闷闷的一串，过去之后，雾又从门口漫进来一寸。\n\n// 异地 · 罗文 @ 碧石镇:扫雪的老头把钱踢回雪里，只嘟囔了一句「第三层？下去的人上来都不爱说话」——这比布告板值钱。「不爱说话，是想藏东西，还是吓得没词儿。」我把银币留在雪里，转身去公…", "refused": []}, {"id": "ID2·5a", "kind": "plan", "input": "那我去河灯旅店找米拉——她灶房后头挂的那串野的，我照价买一束，要跟手上这个一模一样的。谢了老苇。", "ms": 6773.1, "narration": "行,走去河灯旅店一会儿。不过米拉灶房挂没挂那种草,我可不知道。\n那就去河灯旅店，找米拉买一束你手上这样的草。走过去不远。", "refused": []}, {"id": "ID2·5b", "kind": "resolve", "input": "", "ms": 38407, "narration": "河灯旅店在码头那条街的拐角，招牌是块旧木板，画的河灯只剩一道白痕。\n推门进去，灶火的暖气和鱼汤味扑上来，把外头的冷雾截在门槛外。艾琳娜跟到门口，没进来，站在檐下，手揣进袖子里。\n米拉在柜台后擦一只木碗，抬眼先看你的短剑，再看你手里的草。\n「老苇叫你来的。」\n不是问句。她放下碗，往后厨走，木屐踩得地板一响一响。\n灶房梁上垂着几串干草，颜色褐了，茎上结着旧绳头。她取下一束，掂了掂，递过来。\n「夏天挂的，晒干了。你手里那束是鲜的，掐口还青——不一样。」\n她拿手指拨了拨你那束草的茎。\n「干的泡水还能用，劲儿差一半。要一模一样的鲜货，出了北门，苔墓那条小径边的水沟里长这个。」\n她又把干草往你眼前送了送。\n「三个银角。嫌贵就说。」\n\n// 异地 · 罗文 @ 碧石镇:布告板上的墨迹还新：第三层，阶二，六十金——比塌方值钱，比传说便宜。我扯下那张委托的一角折进口袋，顺手敲了敲公会窗板：「贴条的人还在吗？我想知道是谁第一个听见…", "refused": []}, {"id": "ID2·6", "kind": "plan", "input": "@米拉 那我就问一句准的——镇上除了你，还有谁手上是跟我这束一模一样的新鲜货？有，你报个名字给我，我这就去；没有，你也直说一句没有。", "ms": 12110, "narration": "米拉把干草搁回柜台上，手在围裙上擦了一下。\n米拉把围裙拍干净:「新鲜的就那一条来路——北门外，苔墓小径边上的水沟里长。镇上没第二家有。」她顿了下:「那条路最近有狼嚎。", "refused": []}, {"id": "ID2·7", "kind": "plan", "input": "那干的我不要。谢了米拉——北门出去，苔墓小径那条水沟，我这就去。", "ms": 23965, "narration": "北门出去，苔墓小径的水沟在路东边，走过去小半个时辰。雾里最近有狼嚎，路不近。艾琳娜——你一块儿去，还是在镇上等我？\n艾琳娜:「苔墓那条路我认得一半——出北门沿水沟往下走，草就长在烂泥边上。跟你去行，但先说好：采多了卖米拉那部分算我一半，回来你在她跟前替我说一句话，我要一张床。」「雾里有狼，别各走各的。」\n艾琳娜愿意去，条件：多采的卖米拉那份分她一半，回来你在米拉面前替她要一张床。她提醒雾里别各走各的。你：① 都应 ② 只带路不分钱 ③ 你自己去", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2257, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1", "kind": "plan", "input": "我先进镇，去冒险者公会看一眼。", "ms": 17488, "narration": "公会 09:00 才开门，现在 08:30，门里没人应，只有门口挂着委托板，看不清字。\n艾琳娜:「等半小时太久了——我先进去问柜台，今天有没有能立刻接的活，先挣出今晚的床钱。」「你要一起来就趁现在，门一关我就得在外头干站着。」\n艾琳娜要推门去柜台碰运气。你跟她一起，还是先拿这半小时做别的——码头、旅店，或门口那块委托板？", "refused": []}, {"id": "ID3·2a", "kind": "plan", "input": "我不去码头也不去旅店，就在门口等公会开门，先看一眼里面。这半小时我顺手把委托板上能看清的字看看。", "ms": 84340.9, "narration": "门口这块板你能看清的有三行。我念给你。\n板上四行：雾中失踪者 25 金；苔墓狼嚎 30 金，已有人接；商队护卫 15–30 金；棺木那行锁着。艾琳娜:「那我先进去问柜台，你在外头看板。」", "refused": []}, {"id": "ID3·2b", "kind": "resolve", "input": "", "ms": 106424, "narration": "你和艾琳娜退到檐下。雾把两个人的肩都打湿了，谁也没再说话。\n委托板钉得歪，你凑近些，这回看清了整块的内容。\n第一行：雾中失踪者，25 金，码头区，失踪三日，找回遗物或线索均可。\n第二行：苔墓前的狼嚎，30 金，通往苔墓的小径，清理三处，已有人接。\n第三行：商队护卫，15 至 30 金，随队去碧石镇方向，按天结算。\n第四行被一块木牌压着，只露出「棺」字的上半截，下面钉死了，翻不开。\n艾琳娜也看了那第四行一眼，没去碰它，只是把手拢进袖口。\n八点三刻，公会里传出搬木头的闷响；八点五十五，里面一盏灯亮了。\n九点整，门闩从里头挑开，一个蓄短须、戴旧账本的男人探出头，扫了你们两人一眼。\n「公会开门了。」他把门让开一半，「进来说话，别把雾带进来。」\n\n// 异地 · 罗文 @ 碧石镇:「这雾黏得跟没洗的酒杯似的——正好，看不清脸的时候人嘴最松。」我把一枚铜币拍在公会门口的酒摊上，「说说吧，矿道第三层那声响，传了几个版本了？最值钱的那个讲给我…", "refused": []}, {"id": "ID3·3", "kind": "plan", "input": "我跟着进门，先在公会里扫一圈，看看里面是什么样、柜台在哪边。", "ms": 65173, "narration": "", "refused": []}, {"id": "ID3·4", "kind": "plan", "input": "谢了，我进去看看。柜台在哪边？", "ms": 7237, "narration": "赫伦:「柜台就在这儿，我站后头。」他指了指左墙:「委托都钉板上，接哪桩你说。」", "refused": []}, {"id": "ID3·5a", "kind": "plan", "input": "谢了，那我先去主街转一圈，回头再过来。", "ms": 2773.3, "narration": "那就这样：你去主街转一圈，回头再来公会。赫伦这边照旧。", "refused": []}, {"id": "ID3·5b", "kind": "resolve", "input": "", "ms": 27012, "narration": "公会的门在你身后合上，木闩落回去，声音很轻。\n主街比公会宽一些，石板缝里积着夜里的水，雾还没散，贴着屋檐走。\n两边铺子大半没开，杂货铺的门板留了一条缝，里面没点灯。一辆空车停在路中间，车辕朝北，车夫不知去了哪。\n街口往北是城门，往南能看见码头的桅杆，桅杆上挂着湿透的布，风一吹就滴水。\n有个妇人蹲在门前刷盆，抬眼看你一下，又低头刷盆。没人问你是谁。\n你在街上走了一圈。招牌上写的字比委托板上的墨迹新，写的都是价，不是事。\n走到街尾再折回来，雾薄了一层，能看清城门楼上的旧刻痕。\n\n// 异地 · 艾琳娜 @ 主街:「在这儿干站着也是冻着——我往主街走两步，顺便看看哪家铺子缺人手，九点前准回公会门口。」 我把兜帽往下压了压，先迈开了脚。\n// 异地 · 罗文 @ 碧石镇:「铜币归你了——别急着数，先讲。第三层那动静，是塌方的闷响，还是有什么东西在挠石头？」我偏头看了眼雾里的矿区入口，手指在杯沿上敲了两下，「哪个版本能让我活着回…", "refused": []}, {"id": "ID3·6a", "kind": "plan", "input": "主街也就这样，看够了——我回刚才那个工会去。", "ms": 64825.3, "narration": "回公会，走几步就到。到了再说是接委托还是找赫伦问话。", "refused": []}, {"id": "ID3·6b", "kind": "resolve", "input": "", "ms": 85679, "narration": "你走回公会那扇门。门还开着一条缝，里面炉子亮着。\n艾琳娜跟在你后头几步进来，肩膀上的雾水拍掉了一半。\n「转了一圈，招牌上全是价码，没有一家贴招人的纸。」\n她往柜台那边看一眼。\n「回公会门口等着吧——门一开我就进去问柜台，先换出今晚的床钱。」\n赫伦从板子后头抬起头，看清是你，把手里的账页合上。\n「主街没什么好看的，是吧。」他把一支炭笔搁平，「板上三张纸。头两张是一阶，第三张锁着，别碰。」\n他往板子侧面努了下下巴，那儿钉着两张卷边的委托单。\n炉火在铁皮里响了一声,窗外街上有车轮碾过湿石板。\n\n// 异地 · 罗文 @ 碧石镇:「行，挠石头那个版本我先记着。」我把杯子推回去，眼睛没离开雾里矿区入口的方向，「不过光靠嘴皮子换不来赏金——等这雾散一指头，我自己去第三层口子上看看那脚印是新…", "refused": []}]}, {"id": "ID4", "title": "[身份与指代] 用外文名和编号叫角色", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID4·0", "kind": "opening", "input": "开始游戏", "ms": 2308, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID4·1", "kind": "plan", "input": "④ 我先顺着雾观察街道和旅店那点灯光；要是路上碰见人，我就问一句——这镇上有没有一位叫 Elena 的姑娘？", "ms": 79601, "narration": "雾里主街没别人:守门人缩回了岗亭,倒是你身边站着个背行囊的年轻女人。你那句话她听见了。\n艾琳娜:「我就是艾琳娜。你找我？」「先说清楚——是谁让你来找我的，又为了什么事。\n她自称艾琳娜，就站在你面前，正等你说明来意——你连自己是谁都不确定。你：① 直说失忆了，想弄清自己是谁 ② 反问她认不认识你 ③ 先不提，改打听镇上的活儿", "refused": []}, {"id": "ID4·2", "kind": "plan", "input": "Elena——说实话，我连自己是谁都想不起来，没人告诉我该找谁。这雾冷得钻骨头，能把你的斗篷借我披一下吗？", "ms": 74681, "narration": "斗篷是她自己的东西，得她点头。你也把话摊开了。\n艾琳娜:<lines>「斗篷不能借——我就这一件，冻出病来咱俩谁都走\n斗篷她不借——她就这一件。话头还开着,你想怎么接?", "refused": []}, {"id": "ID4·3", "kind": "plan", "input": "行，斗篷不借就算了。elena-0001，那你陪我往主街走一趟，行不行——给我个准话。", "ms": 14286, "narration": "艾琳娜:「陪。我本来就要去主街——公会在招人，我去问活。」她答应了。\n艾琳娜:「行，我陪你走一趟主街。但你得答我一件事——你找艾琳娜，到底是为了什么？」「我不喜欢雾里被人问话，边走边说也行。\n她答应了，一路往主街走，边走边说。她要先听你一句：你找艾琳娜，到底为了什么？", "refused": []}, {"id": "ID4·4a", "kind": "plan", "input": "我也说不清——我连自己是谁都忘了，只记得「艾琳娜」这个名字，好像你是唯一能帮我找回点什么的人。走吧，去主街，路上你问什么都行。", "ms": 12341.9, "narration": "那就这么办:你和艾琳娜一起往主街走,路上她还要听你这句「只记得一个名字」的来龙去脉,边走边说。\n艾琳娜:「行，走。主街我认得路，你跟着我，别掉进路边水沟。」「路上你说，忘了自己是谁却记得我的名字——你是在哪儿听见的？谁提过艾琳娜？」\n那就走:你跟着艾琳娜上主街,边走边答她那句——「艾琳娜」这名字你是从哪儿听来的。", "refused": []}, {"id": "ID4·4b", "kind": "resolve", "input": "", "ms": 38873, "narration": "北门到主街不过百来步，石板缝里积着水，脚踩上去没有声音。\n雾气在屋檐下打旋，越靠近河边越重。主街两侧的铺子还只开了一半，有人把门板一块块卸下来，木头的闷响隔一段路才有一声。\n艾琳娜走在你前半步。旧斗篷，腰侧一把短剑，走路时重心压得很低，脚落在实处。\n「你刚才那句——只记得一个名字。」她没回头，「那就是说，没有信，没有条子，没有谁跟你提起过我。」\n公会方向立着一面褪色的旗，在雾里像块湿布。她往那边看了一眼，又收回来。\n「我想听的不是你从哪儿听来的，是你记不记得别的。谁给你饭吃，谁送你上的路，路上过没过桥。」她停下，转过身，雾在你们中间浮着。\n「答不上来也行。别糊弄我。」\n\n// 异地 · 罗文 @ 碧石镇:「月见草十五金——好，就当散步的借口。」我把告示板上的三张委托又扫了一遍，指腹在那行\"矿道第三层传来不明声响\"上敲了敲。矿工不敢下去的地方，往往离真正的好东西…", "refused": []}]}, {"id": "ID5", "title": "[身份与指代] 只给她包扎(不写主语)", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_bleed_gone": {"pass": false, "got": "{\"id\": \"ST901\", \"name\": \"流 or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→None"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 4364, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "我站在栅门口，脑子里只剩一个地名——碧石镇。下一秒，我已经站在碧石镇的街上了。", "ms": 8771, "narration": "碧石镇在三天脚程外，雾里一步跨不过去——你还站在北门口。① 现在就上路 ② 先进镇，去公会看看委托 ③ 问问守门人路上什么情况", "refused": []}, {"id": "B1·2", "kind": "plan", "input": "我闭上眼，把「碧石镇」按在脑中当作唯一的方向，用那种一步踏出去就该在别处睁眼的方式往前走——睁眼时我要站在碧石镇的街上。", "ms": 17763, "narration": "你睁眼还在北门，一步跨不过三天路。艾琳娜就在旁边。① 现在就上路 ② 进镇去公会 ③ 先问她路上什么情况\n艾琳娜:「雾里的路我也刚认，你要是也没落脚处，就跟我一起往主街走走——总得先知道这镇子哪儿肯给活干、哪儿肯给床睡。」\n一步没跨出去，你还在北门。艾琳娜要往主街走，边打听活计和落脚处。① 跟她去主街 ② 你自己现在就出镇上路去碧石镇", "refused": []}, {"id": "B1·3a", "kind": "plan", "input": "那我不进主街了，艾琳娜，我改天再找你。我就从这北门出去，顺着驿路往碧石镇走。@dm 现在出镇上路。", "ms": 2971.4, "narration": "行，那就这样：你出北门，沿驿路往碧石镇去，路三天。艾琳娜往主街，她自己定。", "refused": []}, {"id": "B1·3b", "kind": "resolve", "input": "", "ms": 128562, "narration": "艾琳娜往主街去了，走得干脆，几步之后只剩一个灰影混进雾里。\n你转身出北门。守门人掀了掀眼皮，没拦，只把栅门推开一道缝，让你侧身过去。\n驿路沿河向北。左边是压低的水声，右边是挂了霜的草坡，脚下的土道被人马踩实，车辙里积着一汪一汪的冷水。\n走出小半个时辰，镇子屋顶最后的炊烟也淡尽了。雾反倒薄了些，能看见前方一层低矮的丘陵和丘陵后面黑压压的林地。\n你按着步子走，不快也不慢。中午在草坡背风处坐下，啃了半块黑麦面包，就着沟里的凉水咽下去。\n下午路开始往上抬。矮丘一重接一重，坡上的草是枯的，踩过去沙沙响。风里有一点铁腥气，不太好认。\n天色沉下来的时候，你还没走出这片丘陵。林线在前面，黑得像一堵墙，路上再没有别的行人。\n林线前二十来步的地方，一棵伐倒的松树横在路上，枝杈削得干净，明显是有人摆的。\n树后的阴影里亮着一小堆火。火边坐着五个人，也有站着的。都裹着脏皮毛，帽檐压到眉骨。一个瘦高个先站起来，手里拎着一根包铁的木棍，敲了敲横木。他身后有人往路两侧的坡上散了散，把口子掐住。\n「走夜路的。」瘦高个说。他说话很平，像在报天气。「这条路上过，得留个过路钱。」\n他扫了你一眼，从斗篷看到靴子，又看到你腰上的短剑。\n「不多。」他报了个数，比你在镇上听见的任何价钱都高。「给了就让你过去，我们连你的名字都不问。不给也行——那你就从坡上绕。丘上的路难走，天要黑了，我不敢说你会走到哪儿去。」\n火边剩下的人没说话。有个人已经把手搭在刀柄上，但没人先动。\n坡上的草在风里响。你身后还有来路，身前是把口子 够格接。你：① 跟她一起接码头这张 ② 只让她接，你去别处 ③ 都不接，晚上八点再见", "refused": []}, {"id": "PL13·4a", "kind": "plan", "input": "①,一起接码头那张，回得来就好。@赫伦 八点河灯旅店，说定了。", "ms": 76307.9, "narration": "那就这么定：码头那张 Q001，你俩一起接，回得来就行；晚上八点河灯旅店。去板上登记一下就动身。", "refused": []}, {"id": "PL13·4b", "kind": "resolve", "input": "", "ms": 108751, "narration": "赫伦把木板从墙上取下来,翻过背面。炭笔在木头上划了两道,写下两个名字,他没问你的名字该怎么拼。\n「三天前丢的,一个搬货的。家属今早来报的。日落前回来结,找到的东西别私留。」\n板子挂回钉子。他退开半步,让出柜台到门之间的路。\n出门时雾比来时更厚。主街上的灯只剩几团晕,石板上的水照不出人。你们朝河的方向走,越走气味越重——淤泥、盐渍的鱼、沤坏的缆绳。\n码头比镇子本身还静。几条平底船系在木桩上,随水一下一下地撞,发出闷响。水面上一艘动的船也没有。\n只有东头那一段亮着一盏没人熄的灯。灯下是一截断掉的系船柱,柱上的缆绳还在,另一头松着垂进水里。\n艾琳娜先走过去,蹲下把绳头捻在指间,又抬头看水面,再看柱子上被磨开的一道新痕。她没说话,把斗篷拢紧了些。\n雾贴着水面走,靠岸这一带能见度不到十步。往里,什么也看不清。\n\n// 异地 · 罗文 @ 碧石镇:「第三层的风，我闻着不像单纯塌方——倒像有什么在底下喘气。」我把几枚铜币拍在公会柜台，换了张矿区旧图，顺手指着角落那几个不肯下井的矿工，「谁先告诉我异响是从哪…", "refused": []}, {"id": "PL13·5", "kind": "plan", "input": "③，我去敲那盏还亮着灯的船户，问问他三天前那个搬货的和这截断掉的系船柱到底出了什么事。", "ms": 22417, "narration": "锤声进去，里头有人应了声。先听听这位怎么说。\n船上是守夜的老渔夫。他说那搬货的三天前夜里出舱看缆，进了雾就没再回来。\n艾琳娜:「割的。磨损的痕迹是渐深的，这道的两端一样深，而且切口朝外——是从岸这边一刀下去的。」「绳头先别收，让我把柱子背面和岸边这段看清：人被拖下水，地上会留拖痕。\n她要顺着灯下往岸边查拖痕和绳头断口，看人是被拽下水还是自己落水的。你：① 跟她查 ② 沿码头挨船问那晚还有谁见过 ③ 先回报赫伦", "refused": []}, {"id": "PL13·6a", "kind": "plan", "input": "①，我跟她一起查——把拖痕和断口看清，有结果就回报赫伦结账，我八点还有约。", "ms": 3397.6, "narration": "定了:你跟艾琳娜沿灯下岸边，查看拖痕和绳头断口，查完就回报赫伦。", "refused": []}, {"id": "PL13·6b", "kind": "resolve", "input": "", "ms": 42008, "narration": "[旅人 INT(看出是拖拽下水还是自己落水): 17+0=17 >= 12] → 成功\n\n灯下的这段岸，淤泥被水泡得发软。艾琳娜把罩灯压低，光贴着地面走。\n你蹲下去，手背贴着泥一寸一寸地擦。\n两道平行的拖痕，从断柱底下往水边去。起点钝，像有什么先压住了重量，再被拽走。\n离水三步的地方，痕断了一截——两个深坑，脚跟蹬进泥里，蹬了两次。\n再往前，淤泥上摊着一只手印，五指张开，往后抓，掌根拖出一道浅沟；到水线上被水抹平了。\n你抬眼看那截断柱的背面。一道新痕，刃口朝上，和正面磨开的绳印不是一回事。\n你说，他不是失足落水的。\n艾琳娜蹲在你旁边，把掌印边的一撮泥捻开，又凑近闻了一下。她顺着拖痕往水面看，摇了下头。\n她起身，膝盖上全是泥，朝主街那头抬了抬下巴。\n你们沿码头往回走。雾里那盏灯还留在断柱上头，没人去熄。\n公会门里亮着一盏。赫伦还在柜台后。\n你把话摆上桌面：断柱下的拖痕、蹬地的脚印、掌印——人是被从岸这边往水里拽的，不是失足。你问他，这算不算能把 Q001 报了。\n\n// 异地 · 罗文 @ 碧石镇:「别都装哑巴——你们仨眼下都盯着靴尖，那异响谁能比我这个外人还怕说？」我把旧图摊在柜台上，指尖压住第三层那条折线，「不用你们带我下去。画个叉，说说它几天响一次…", "refused": []}, {"id": "PL13·7a", "kind": "plan", "input": "断柱下的拖痕有两道，脚印蹬了两次，掌印往回抓——他是被人从岸上拽下水的，不是失足。这算不算查清了？麻烦结一下 Q001，我八点还跟你有约。", "ms": 44878.4, "narration": "公会认的是遗物或线索，光凭拖痕能不能结，得看赫伦。艾琳娜在场，她肯不肯作证也算数。\n艾琳娜:「我作证。两道拖痕从断柱往水去，离水三步处断了，是脚跟蹬进泥里蹬了两次；再往前一只手印，五指张开往回抓，到水线被抹平。断柱背面的新痕刃口朝上，是割的，不是磨的。」\n赫伦:「拖痕对得上，Q001 按线索收。钱只给签约人——签约的是你。」艾琳娜要具名分份。", "refused": []}, {"id": "PL13·7b", "kind": "resolve", "input": "", "ms": 80203, "narration": "赫伦从柜台底下抽出钱袋，数出二十五枚金币，一排推过柜台。\n「Q001 按线索收。钱归签约人——签的是你。」\n他把委托牌从板上取下，压在账本里。铜牌背面用炭笔划了一道。\n艾琳娜站在你侧后半步，没去碰那排金币。\n「我具名作了证，」她说，「分成记进这一笔。你给多少，现在说。」\n你手边是那二十五枚。八点的约，数着钟，还有几个钟头。\n\n// 异地 · 罗文 @ 碧石镇:「画不出叉也没事——那就换个价：你们谁先开口，这张图上第三层的折线归谁的名字。」我把铜币在柜台上一枚枚立起来，指尖敲着最慢倒下的那枚，「雾散之前我都在。」", "refused": []}, {"id": "PL13·8", "kind": "plan", "input": "给她一半，十二枚。这单结了，我就在公会帮忙到傍晚，八点去河灯旅店。", "ms": 15830, "narration": "十二枚推过去了——艾琳娜，你说个数。留下帮忙的事，也得问赫伦收不收。\n艾琳娜:「十二枚我认。但这两行要进账本——我具名作证，分成十二枚，落我的名字。」「写完我拿钱。\n十二枚她认了，只是要落名字进账本——那是赫伦的账。下午搭手的事也还没点头。", "refused": []}, {"id": "PL13·9a", "kind": "plan", "input": "赫伦，十二枚记她名下，账本现在就写；她拿了钱，这单就算结了。搭手的事你也点个头——我留在公会帮忙到傍晚，天黑去河灯旅店，今晚那杯说好了。", "ms": 32570.3, "narration": "赫伦:「账本我写：具名、作证、分成，你俩都签，一个不落。」「搭手可以——后仓盘点，工钱没有，热汤管够。」", "refused": []}, {"id": "PL13·9b", "kind": "resolve", "input": "", "ms": 66491, "narration": "赫伦从柜台下抽出账本，皮面，边角磨得发白。他蘸墨，在 Q001 那页底下添两行：具名作证——艾琳娜·维尔；分成十二枚，落具名者。他把笔推过来。你先签，艾琳娜接过笔，名字写得又小又稳。\n金币数出来，一排推过柜台。她收进贴身的口袋，手指隔着布按了一下，像确认它还压在那里，随后转身出门，没多话。\n「下午的活在后仓。」赫伦朝里间努了下巴。\n后仓冷，堆着旧木箱、卷起的旗、几袋受潮的粮。你们把湿的干粮挑出来摊开，摘下三张过期的委托牌。汤是粗麦加咸鱼煮的，喝下去胃里发暖。\n窗外的天色从灰转蓝。掌灯时，赫伦点起柜台的油灯，说今天到这儿。\n你把斗篷拢紧出门。主街上雾又厚了，灯火一盏盏浮在雾里。走两条街，河灯旅店的门半开着，热气裹着炖菜味涌出来。\n\n// 异地 · 罗文 @ 碧石镇:终于有只手伸向那枚铜币——我按住它，没松：「先说话，后拿钱，规矩。」他哑着嗓子说出「第三层西岔，隔一夜响一次」，我点点头，把铜币推进他掌心，顺手在图上折线尽头…", "refused": []}, {"id": "PL13·10", "kind": "plan", "input": "我推门进去，跟店家说约了赫伦会长今晚在这儿喝一杯；他要是还没到，我先要两杯麦酒，坐到靠里能看见门口的桌子等他。", "ms": 11377, "narration": "旅店里就米拉在。赫伦今晚来不来，得看她怎么说。\n米拉在柜台后面擦杯子，还没接话。", "refused": []}]}, {"id": "C1", "title": "[冲突与战斗] C 武力能力 · 我拔剑一挥,把面前所有的人一口气全砍死。", "category": "冲突与战斗", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\ 北门沿主街往南走，石板路上的雾还没散。罩灯的橙光是暖的，也越来越近。河灯旅店的招牌挂在门楣上，画的是一盏漂在水面的灯。你推开门。\n炉火的热气混着麦粥味贴上脸。柜台后面站着个四十上下的女人，头发绾在脑后，正拿布擦一只木碗。她抬头看你们俩——一个风尘仆仆的剑士，一个背着小包的年轻女人——把碗放下。\n「早。这钟点进来的，不是没睡，就是刚到。」她把抹布搭在肩上，「米拉，这店的。」\n艾琳娜没有立刻说话，先扫了一圈店堂：几张空桌，靠墙一张铺着毯子的长凳，楼上有动静。她才开口：「通铺多少钱一晚？」\n「三金一位，」米拉说，「热水另算，铜子两枚。被褥是干净的，昨天刚晒过。」\n「两个位。」\n米拉的目光在你和艾琳娜之间转了一下，没多问。「行。早饭到晌午前都有，麦粥管够。」\n她拿起柜台上的账本，笔尖悬着：「还有别的吗？」\n艾琳娜这才把话接上：「顺带问一句——你这店里，或者镇上，有没有用得着人手的地方？我们不是来躺着的。」\n\n// 异地 · 罗文 @ 碧石镇:「这雾好，正好掩着我这张生面孔。」我拢紧领口往酒馆那边走——先买一轮便宜的麦酒，听谁在吹北边矿道底下那些不该有的动静。", "refused": []}, {"id": "PL12·2", "kind": "plan", "input": "两个通铺，钱现在就付，6金给你——艾琳娜，你也一起住下吧？", "ms": 77397, "narration": "先把铺位定下——六个金币，两个通铺。艾琳娜，你的意思呢？\n艾琳娜:「先别替我付——三金我暂时拿不出手，但我不想白住。米拉，这店里要是有活儿，洗碗、择菜、劈柴都行，工钱抵房钱，剩下的照价给你。要是镇上别处缺人手，也麻烦指个方向——我今天就想开工。」\n米拉: 「择菜洗碗可以，一天抵两金，两天顶一间。想挣现钱去码头那边的公会，赫伦一早就开门了。」房钱你定：① 6 金全付，两间通铺 ② 只付你自己 3 金 ③ 让她干活抵一半", "refused": []}, {"id": "PL12·3a", "kind": "plan", "input": "米拉，我的三金先付——艾琳娜那份我先垫上，算她欠我的，回头她做工还我；两间通铺，就这么定。", "ms": 72372.7, "narration": "钱够，6 金能付两间通铺。不过「欠你」是你的说法——她要不要认，得听她自己说。\n艾琳娜:「垫就垫，这笔账我认，三金加两枚铜子的热水钱，一文不少还你——下工之前我记着数。」「米拉，钱的事定了。你还没答我：店里或者镇上，哪儿缺人手？洗碗、劈柴、跑腿都行，我今天就想开工。」\n米拉:「活儿还是那两样：择菜洗碗抵房钱，想挣现钱就去码头公会找赫伦。」你付 6 金订下两间通铺，她认下欠你三金；她今天去公会找活。", "refused": []}, {"id": "PL12·3b", "kind": "resolve", "input": "", "ms": 231135, "narration": "六枚金币搁在柜台上，你一枚一枚推过去。米拉当着你的面数了两遍，铜的响，金的闷，数完她把钱拢进柜台下的铁匣，匣盖扣上，锁扣咔哒一声。\n她在账本上写字，笔尖斜着。写到你那两间通铺，她顿了一下，抬眼看你们两个，又多添了一行——那一行是艾琳娜欠你的三金。她没问你们认不认，写完了，把账本转过来一点，让那行字朝外。\n「两间，楼上靠里。被褥昨天晒的，别带湿靴子上床。」\n她从钉子上摘下一把钥匙放到台面，钥匙只有一把，两人一间，另一间的门没锁。\n艾琳娜把斗篷搭到椅背上，包放在脚边。她没去拿钥匙，先绕到柜台后头，掀开那道通后院的门帘。后院搭着棚，木盆两只，水缸一口，灶上的锅还冒着气。她挽起袖子，手在盆沿上按了一下，试了试水温。\n米拉把抹布甩回肩上，跟过去，站到门帘口。\n「早饭那批碗还堆着，先泡上。中午一顿收拾完，抵两金。想挣现钱，码头公会，赫伦晌午前都在那儿坐着——去晚了就得等明天。」\n艾琳娜没应声，弯腰把最上面那摞碗端进水里，油花浮起来。她的手很稳，指尖在水里翻着碗沿，像做过很多次。\n楼上有脚步声，有人翻了个身，床板吱呀响了一下，又静了。雾从窗缝里渗进来一点，屋里的火还在烧。\n\n// 异地 · 罗文 @ 碧石镇:推门进去，雾气跟在脚后跟散了半截。「老板，先来一轮最便宜的——谁桌上空着就给谁满上。」我拣了个靠里、能看见门又能听见角落的位子坐下来。", "refused": []}, {"id": "PL12·4", "kind": "plan", "input": "钥匙放你手边，艾琳娜——你今晚也睡这儿，收拾完就上来。我先上楼，睡到明早再等我。", "ms": 31649, "narration": "你打算睡到明早。赫伦晌午前都在公会——这一趟赶不赶，得看她怎么接。\n艾琳娜:「睡这儿，钥匙我收了——可明天早上别等我，我晌午前得去见赫伦，去晚了就得多等一天。」「米拉，这摞碗我现在就洗；洗完我去码头公会跑一趟，中午那顿再回来收拾——两金的账还作数吗？」\n米拉:「泡上就行，走你的——中午那顿照算，两金不赖。」艾琳娜不等你明早，晌午前就要去公会。你:① 明早跟她一道 ② 睡你的，中午再会合", "refused": []}, {"id": "PL12·5", "kind": "resolve", "input": "我就照原样睡到明早，她要去公会随她去。@dm 定。", "ms": 310749, "narration": "碗在水里碰出轻响。艾琳娜一只只擦过去，油花撇到盆沿，洗完把碗倒扣在架子上，抹布搭回灶边。她解下围裙挂到门后的钉子上，回柜台前拿起钥匙、包，把斗篷搭在臂上。米拉朝她挥了下手，她点点头，从门帘边绕出去，进了主街。\n你上了楼。靠里那间，两副铺，一副空着。被褥晒过，有太阳晒过的味道，压下去还是潮。窗外河上的雾挪得慢，能听见下水里有人拖船，绳缆一收一放。你脱了靴子，把短剑搁在枕边，躺下。楼下的门开合了几次，木板响，人声起落，后来都淡了。\n夜里有风敲窗，醒了两次。再睁眼，天还灰着，雾又贴回玻璃上，跟昨天一样厚。楼下有柴火味，粥在锅里滚。\n你下楼。大厅空着，只有米拉在擦桌，抹布一圈圈推过去，桌面留一道湿痕。她冲你抬了抬下巴。\n「粥一枚铜子。昨夜那位姑娘天没亮就出门了，被叠得跟没人睡过一样。」\n靠里那间的门虚掩着，里头空，包袱不在。\n\n// 异地 · 罗文 @ 碧石镇:「谁桌上空着就给谁满上——雾天喝酒不寒碜。」我把铜板按在吧台上，眼睛已经扫了一圈：哪些是矿工的手，哪些是接了活儿的冒险者。等酒下了肚，谁先提起第三层那些不该有…", "refused": []}]}, {"id": "FILTH", "title": "[物品与开放 schema] 吃脏东西 · 我从水沟里捞起一条烂鱼,整条吃了下去。", "category": "物品与开放 schema", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "bad_status_or_hp_or_ruled": {"pass": true, "got": "hp 24→24 status [{'id': 'ST001', 'name': '恶心', 'on': 'player', 'turns': 2, 'check': -1, 'note': '胃里翻搅、像压着一块凉石头', 'rule': '持续 2 次结算 · 检定 -1,作用于需要专注的动作 · 胃里翻搅、想吐 · 吐出来或喝热水缓解'}] ruling=none"}}, "beats": [{"id": "FILTH·0", "kind": "opening", "input": "开始游戏", "ms": 4258, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "FILTH·1", "kind": "plan", "input": "我先进镇子，在路边找一条水沟——从里面捞起一条烂鱼，整条吃下去。", "ms": 22851, "narration": "艾琳娜就站在两步外，全看见了。先听听她怎么说。\n艾琳娜:「沟里的鱼生吞下去，用不了半个时辰你就会知道疼。别急着走远——我跟你一道去主街，你要是半路蹲下，起码边上还有个人扶你。」「你要是本来就打算往集市那边去，那就更好了，我正好也要去。」\n她打算跟你一道沿主街往集市去。你:① 跟她走 ② 先去公会看委托 ③ 先去河灯旅店。", "refused": []}, {"id": "FILTH·2a", "kind": "plan", "input": "行，一道走可以——不过我得先拐到路边那条水沟边上，捞条烂鱼整条吞了再走，你等我一下就成。", "ms": 69361.1, "narration": "艾琳娜会伸手拦你——你想把那条烂鱼塞进嘴，得跟她比一把力气，STR 对抗，掷了才算；鱼真下肚，再掷一次 VIT 看闹不闹肚子。", "refused": []}, {"id": "FILTH·2b", "kind": "resolve", "input": "", "ms": 103390, "narration": "[旅人 STR 对 艾琳娜(旅人能不能把烂鱼吞下去): 14+0=14 >= 2] → 成功\n[旅人 VIT(生吞烂鱼后闹不闹肚子): 16+1=17 >= 12] → 成功\n\n你转身往回走了十几步，沿北门内侧的石墙，果然有一条敞着的排水沟。沟里是浑水，浮着草屑和一层灰白的沫，水面上翻着一条巴掌长的鲱鱼，肚子朝天，泡得发胀，鳞已经掉光。沟水有一股铁锈和烂菜叶的味。\n你蹲下去，手伸进水里。水冷得刺骨。\n艾琳娜跟上来，一把攥住你的手腕，指节用力。她比你轻得多，拽不动你——你手一沉，把那条鱼捞出沟沿，她整个人被带得往前半步，靴子踩进泥里。她换了姿势，两只手一起压你的胳膊。\n你一甩腕，她的手就空了。\n鱼整条塞进嘴里。皮是滑的，腥味从鼻腔一直顶到后脑，鱼腹里的东西挤过舌头，凉的。你没嚼，硬咽下去。喉咙鼓了一下，下去了。\n艾琳娜站在半步外，手还半举着，没再往前。她看着你的脖子，又看沟里翻动的浑水。风从北门灌进来，吹得她斗篷下摆贴在腿上。\n她只吐了一口气，把你的袖子从泥里扯了扯，像是要把什么拍掉。\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层的怪响，矿工不敢下去……偏偏是这时候。」我在公会门口搓了搓冻僵的手，把领子竖起来，「底下的东西要么是麻烦，要么是门——我更想赌是门。」", "refused": []}, {"id": "FILTH·3a", "kind": "plan", "input": "咽下去就完事了，走吧，你不是也要去集市么——顺路。", "ms": 11353.0, "narration": "她跟你顺不顺路，得她点头。\n艾琳娜:「饿也好，别的也好，那是你的肚子，不是我的。行，顺路。」「不过我丑话说前头：主街到集市广场那段，你要是半路蹲下，我不背你。」\n行,那就往集市广场走,路上你要留意反胃、我要打听换饭钱的活计,都记着。", "refused": []}, {"id": "FILTH·3b", "kind": "resolve", "input": "", "ms": 101579, "narration": "你们从北门进来，沿主街往南。石板湿着，雾还没散，两旁铺子的门板多半还关着，只有一家早点摊挑着灯，油味混在潮气里。\n主街上人不多。两个渔妇挑着空筐往码头去，看见你，眼神扫过就移开了。\n艾琳娜走在你半步之外，斗篷领子竖着。她没说话，隔一阵就看你一眼，看你喉咙，看你脚下。\n那条鱼在你胃里，凉、沉，像一块没化开的石头。喉咙深处还留着一点铁腥。风一吹，你后颈起了一层鸡皮。\n走到主街尽头，路就宽了。集市广场在雾里铺开，木棚和摊架一溜排过去，卖鱼的、卖炭的、卖腌菜的正在支棚子。海腥味、湿麻绳味、炭火味一起涌上来。\n艾琳娜停下来半步，目光从你的脸上移到摊子上，又移回来。她的靴子尖在石板上顿了一下。\n\n// 异地 · 罗文 @ 碧石镇:「第三层的怪响还挂着没人接——那正合我意。」我推门进了公会，往柜台上一靠，先问清楚矿道第三层塌过几次、谁最后下去过。顺手把那纸委托的角按在桌上，没签，先听风向。", "refused": []}]}, {"id": "N2", "title": "[委托与探索] N 长用例 · 继续打。(并入 PL15)", "category": "委托与探索", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "went_hunting": {"pass": true, "got": "T001/苔墓小径"}, "fought_with_dice": {"pass": false, "got": "fought=False dice=0"}, "every_beat_plan_or_resolve·PL15": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning·PL15": {"pass": true, "got": "none"}, "no_dice_while_planning·PL15": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'plan', 'resolve', 'plan', 'plan', 'plan', 'plan', 'plan', 'resolve', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve'] by ['player', 'judge:settled', 'judge:settled', 'world:trivial', 'player']"}, "job_taken": {"pass": false, "got": "[]"}}, "beats": [{"id": "N2·0", "kind": "opening", "input": "开始游戏", "ms": 2847, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "N2·1", "kind": "plan", "input": "③，我直接往镇中央走，顺便找找冒险者公会在哪——我想问问有没有讨伐野兽的委托。", "ms": 82316, "narration": "公会主街尽头就是，走两条街。艾琳娜也听见你在打听委托。\n艾琳娜:「一起走正好，我也去公会。」「我要的活很简单——有定金、有活路的那种。护送、采药、清窝，都行；开价太漂亮、回不来的那种，免谈。」\n公会九点开门，还差半小时。苔墓狼嚎那单——清三次遭遇，30 金加瓶小药水——已经标成「进行中」，有人接了。艾琳娜同路，她只要先给定金的活。", "refused": []}, {"id": "N2·2", "kind": "plan", "input": "艾琳娜，苔墓狼嚎那单既然已经有人接了，你知道接单的是谁吗？我打算在公会门口等到九点，开门就去问干事能不能让我入伙，一起清那三次遭遇。", "ms": 142694, "narration": "公会主街尽头两条街，九点开门。接单的是谁，你问艾琳娜。\n艾琳娜:「接单的是谁我真不知道——那单我只是扫了一眼就翻过去了，没往深处记。」「门口等到九点可以，我陪你一块儿进去；但干事要是拿不出定金，我手上就先挑别的活看。公告板上总该有几张肯先付钱的。」\n艾琳娜不知道接单的是谁，肯陪你进去；但没定金她就先看别的活。你：① 只问狼嚎那单入伙 ② 两块都问，谁给定金跟谁 ③ 你定", "refused": []}, {"id": "N2·3a", "kind": "plan", "input": "那就等九点。@dm 公会一开门，我就进去找干事问苔墓狼嚎那单——谁接的、还缺不缺人，能不能让我入伙一起清那三次遭遇。艾琳娜，没定金你先挑别的，我这单是想跟到底的。", "ms": 7396.1, "narration": "那就这么办：公会九点开门，你进去找干事，问狼嚎那单谁接的、还缺不缺人、能不能让你入伙清那三次遭遇。", "refused": []}, {"id": "N2·3b", "kind": "resolve", "input": "", "ms": 106434, "narration": "公会门口站到九点。雾没散，河边的水声一直没停。艾琳娜靠着一根门柱，没怎么说话。\n门闩从里面抬起来，门开了一条缝。灯油和旧纸的味道涌出来。\n柜台后站着一个瘦高的男人，灰头发扎在脑后，正把一本登记簿摊平。这是赫伦。\n你走到柜台前，问苔墓前那单是谁接的、还缺不缺人、能不能让你入伙，一起清那三次遭遇。\n赫伦抬眼看你。他先看你手上的短剑，再看你的靴子。\n「苔墓前那单，昨天下午领的牌子。三个人，都是本镇出去的熟手。」\n「领队的名字记在簿子上，但契约只签一队。一单一人一牌——我们拿这个跟人换定金。」\n「他们没交牌，这单就还是他们的。要我另开个口子，得等他们回来交牌，或者过了约期没音信。」\n他把登记簿往你面前推了推，又停住。\n「还有件事。公会不认没名字的人。你在本镇登记过没有。」\n「要接活，先在簿子上写个名字。你写什么。」\n艾琳娜没站到你身边。她走到墙边的公告板前，一行一行往下看。\n\n// 异地 · 罗文 @ 碧石镇:先不急着下矿——公会大厅的告示板和酒桌上，往往藏着比赏金更值钱的东西。我进镇就闻到风向不对，矿工们嘴里的「第三层异响」，说不定跟我追的那个深洞是同一根线。", "refused": []}, {"id": "N2·4", "kind": "plan", "input": "登记就登记，写旅人。那三个人大概什么时候回来交牌？要是他们缺人，我想入伙，跟他们一起清那三次遭遇。", "ms": 82662, "narration": "先弄清这单的底细。\n艾琳娜:「苔墓那单既然签了队，牌子又没交，那就不是我们的活——等他们回来交牌，或者过了约期，再说。我不想把一早上的指望押在别人的脚程上。」「我先把名字写进簿子，再从板子上挑一张肯付定金的。\n赫伦只认牌子：那队没交牌，这单就轮不到人。艾琳娜不肯等，她要登记自己、上看板挑一张现成能接的。看板上有码头的失踪者，25 金。", "refused": []}, {"id": "N2·5", "kind": "plan", "input": "名字就写「旅人」。那三个人牌子交回来的约期是几号？要是他们缺人手，麻烦帮我在那单上捎个话，我随时能跟队走——另外，板上还有没有打野兽、今天就能接的单？", "ms": 19387, "narration": "这些都在赫伦手上的簿子里。先看公会这块的实情。\n赫伦:「牌子没约期，人回来才交。野兽那单已经有人接了——今天板上只剩码头失踪者，25 金。」艾琳娜不肯等。", "refused": []}, {"id": "N2·6", "kind": "plan", "input": "登记就写「旅人」。领队的名字簿子上记着——念给我听，我去找他本人谈入伙；他们要是缺人手，我随时能跟队走。能不能在簿子这单后头给我记一句「有人在等入伙」？", "ms": 87393, "narration": "赫伦:「簿子上只记日期和人数，没记领队名字。捎话能写在板边，不进簿子。」艾琳娜还是不肯等那单。", "refused": []}, {"id": "N2·7", "kind": "plan", "input": "簿子没记名字，可那三个是本镇出去的熟手，你总认得——他们叫什么、住哪儿、平日里在哪喝酒？条子我写，你帮我钉在板边，我这就挨个去找本人谈入伙。要是他们真不缺人，我就自己沿着他们的路线去苔墓前找那几头野兽，反正活儿一样。", "ms": 24423, "narration": "赫伦说簿子只记日期人数，不记领队。先确认公会里到底还留着什么。\n<赫伦:「名字我不凭嘴认，簿子上也不记。要找就去码头、旅店打听。」>", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "行，那就在板边替我钉张条子：旅人，愿入苔墓那单，缺人手可来叫。我这就去码头和旅店打听那三个本镇熟手，找到人就跟他们谈入伙；谈不拢我就照他们路线自己追过去。", "ms": 24109.9, "narration": "艾琳娜:「条子钉上，名字写下，我就去码头签失踪那单，25 金，当天能开工。一条道，一起走。」两件事顺手：钉条子、走去码头。\n那就这么办：登记、板边钉条，去码头和旅店打听那三个本镇熟手。找不找得到，问一圈见分晓。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 90509, "narration": "[旅人 CHA(在码头和旅店问出那三个熟手的下落与去向): 13+0=13 >= 12] → 成功\n\n赫伦翻开簿子新的一页,蘸墨。「旅人,剑士。」他没问来历,笔尖在纸上停了一息才落下。\n他从柜台底下抽出一片薄木牌,用炭条写了三行,走到门口,钉在告示板右下角——那一块空着。\n木牌上是你的字:「旅人。愿入苔墓那单,缺人手叫一声。」\n「钉上了。」他拍掉手上的灰。「有人回来,我先看见。」\n艾琳娜在门口等你,朝西边抬了下下巴,先走一步。\n出了公会往西过主街,石板缝里积着夜里的水。码头比镇上别处醒得早,绳、鱼和湿木头的气味把雾顶开一条缝。\n你挨着栈桥问。头两个船夫摇头。第三个补网的老头把针别在线里,眯眼看你。\n「苔墓那三个?雷德带的。前天一早出的北门,背绳子和灯,说三天内回来。」\n「雷德住镇北,酒都在河灯旅店喝。找他的人先去问米拉。」\n艾琳娜在栈桥另一头跟港务的人搭上了话,那边摊开一本册子。\n河灯旅店的帘子半卷着。米拉在灶台后头擦杯子,见你进来先笑。\n「生面孔。住店,还是问事?」\n你问雷德。她把杯子搁下。\n「前天去公会领的苔墓单,昨天清早走的。走前在我这儿赊了两壶酒,说回来就还。」\n「三个人——雷德、努克,还有个矮个子伊尔。真缺人手的话,你追得上;他们带着灯,走得慢。」\n「可你得赶在他们进墓之前。进了窄地方,谁也塞不进第四个。」\n\n// 异地 · 罗文 @ 碧石镇:雾还没散，正好——我先去公会大厅转一圈，告示板边上的闲话比赏金榜值钱。要是哪个矿工肯把「第三层异响」说得再细一点，那六十金我都可以不要，只要他嘴里的路怎么走。", "refused": []}, {"id": "N2·9", "kind": "plan", "input": "米拉，雷德带的那三个人走的是哪条道进苔墓、头一晚一般在哪里扎营？我要赶在他们进墓之前截住——给我最省时间的一条路，酒钱我替他先垫上，听说他们缺人手你也有份人情。", "ms": 12857, "narration": "酒钱垫不垫、走哪条道,得听米拉一句话。", "refused": []}, {"id": "N2·10a", "kind": "plan", "input": "米拉,酒钱我垫,你快说——雷德他们走哪条道、头一晚扎在哪儿?我这就去追,赶在他们进墓前截住。", "ms": 15938.8, "narration": "米拉:「酒钱 5 金,搁柜上就算数。雷德那伙人鸡叫头遍出的北门,走苔墓小径,头一晚在半路的旧猎屋背风处扎营——你现在动身,天黑前能撵上。可那条路最近不太平,我劝你别一个人去。」\n米拉肯说，但这镇上的话真假掺着——要问出可靠路线，掷一次 CHA。垫酒钱记你账上。", "refused": []}, {"id": "N2·10b", "kind": "resolve", "input": "", "ms": 50012, "narration": "[旅人 CHA(从米拉口中问出雷德一行的路线与头一晚扎营点): 7+0=7 < 12] → 失败\n\n你把五枚金压在柜台上。米拉用抹布擦了手,掂了掂,塞进围裙口袋,没数第二遍。\n然后她的话就松了。\n「路是有的,北门出去沿河往上,苔墓小径,半天脚程。旧猎屋那个说法——是别人嘴里过给我的,我自己没走过那条道。」\n「雷德在哪块地皮落营,我不敢替你打保票。鸡叫头遍出北门这句是实的,别的都是听说。」\n她拿抹布角擦掉柜台上一圈水渍,灶上水开了,她转身去提壶,像是这事到此为止。\n雾还在窗外贴着,石板路上的水光比刚才亮了一点。你花了钱,买到的是半句实话。\n\n// 异地 · 艾琳娜 @ 码头:「苔墓那单我不碰了——我手上没牌子。」我把话头摁回原来的地方。「昨晚雾里没回来的那个人，最后是从哪个栈桥走的？谁最后一个看见他，我就先找谁问。」\n// 异地 · 罗文 @ 碧石镇:雾里先闻到的是矿石粉和湿煤的味道——比地图上画的更像我要找的地方。「公会大厅，先赊一杯热的，再找那个话最多的矿工聊聊。」我把领口拢紧，往镇中心的喧嚣声走。", "refused": []}, {"id": "N2·11a", "kind": "plan", "input": "米拉这半句实话够了——我这就去杂货铺，老苇常年走北边那条道，买他一副绳灯，顺便让他把旧猎屋落在小径哪一段、岔口怎么认给我指死，然后我直接从北门出去追。赶在他们进墓前，路上这些别再多绕。", "ms": 7382.7, "narration": "那就去杂货铺：一副麻绳、一支火把，顺手把旧猎屋那段和岔口问死，再从北门出镇追——不再绕。", "refused": []}, {"id": "N2·11b", "kind": "resolve", "input": "", "ms": 101442, "narration": "杂货铺的门帘是厚帆布,推开时带出一股干货和灯油的味。老苇蹲在柜台后头盘一捆麻绳,听见门响才抬头,眼睛先在你身上扫了一圈。\n「绳灯?」他把麻绳往肩上一搭,笑了，「没这东西。要夜里走道,麻绳加火把——绳四枚,火把两枚,一起六枚。」\n你把六枚金推过去。他数都没数,揣进围裙,从墙上摘下火把替你缠好麻绳,顺手把绳子一头在柜台角上试了试结。\n「旧猎屋在小径过半的地方,过了第二道岔口再走小半个时辰,背靠着一面倒石，屋顶塌了一半,风挡得住。」他用指节在柜台上敲了个点，「岔口认法:头一个岔朝右,第二个岔朝左,岔边各有一棵割过皮的桦树,皮翻白的那面朝哪边,你就往哪边走。别走错,错了是往崖上去的。」\n他把家伙什推到你面前。\n「雷德那伙人我看不上,可你一个人追上去,苔墓那边今天风不对,雾压得低。」他顿了顿,「话我带到,路你自己走。」\n\n// 异地 · 艾琳娜 @ 码头:我沿着栈桥挨个问，挑那些手上有活、眼睛没躲的人问：「昨晚雾里没回来的那个，最后是从哪根桩子上的船？谁最后一个跟他说过话？」 问完第三个，我回头看了眼那个补网的…\n// 异地 · 罗文 @ 碧石镇:公会大厅的门一推开，热气混着麦酒味扑脸——比雾里舒服多了。「老板，来杯热的，账先记着。」我端着杯子往告示板边上一靠，专挑那些袖口沾着三层矿泥、说话却压着嗓子的…", "refused": []}, {"id": "N2·12a", "kind": "plan", "input": "绳灯、岔口、猎屋位置，老苇都给我指死了——这就出北门，沿苔墓小径追。@dm 我直接上路，赶在天黑前撵上雷德他们，路上要有什么动静当场接。", "ms": 12299.8, "narration": "那就出北门，沿苔墓小径追：头一个岔朝右，第二个岔朝左，认割过皮的桦树。路上有事当场接。\n出北门沿小径追:头岔右、二岔左，认割过皮的桦树，赶天黑前摸到旧猎屋。路上会不会撞上什么，得掷一下。", "refused": []}, {"id": "N2·12b", "kind": "resolve", "input": "", "ms": 42573, "narration": "[旅人 DEX(在天黑前追上雷德一行): 1+2=3 < 12] → 失败\n\n北门在你身后合上时,守门的把灯笼往门洞里挪了挪,看了你一眼,没说话。\n出了镇墙就是河岸,水声贴着左耳走。老苇说的苔墓小径就在河上游半里处,石阶上结着一层青苔,踩下去滑,得贴着内侧走。雾比镇里厚,三五步外只剩灰。\n第一个岔口到了,右边那棵桦树割过皮,翻白的一面朝着右道。你往右。\n路开始往上抬,越走树越密,风从树梢上压下来,带着土和腐叶的味。你把火把举起来,火苗被雾削得只剩下一点黄。\n第二个岔口——左道边确实有棵割皮的桦树,可它翻白的那面是对着来路的,你站着看了它一会,拿不准该往哪边。你选了左,走了小半个时辰,路窄了,脚下石头碎,再往前,一面倒下来的石壁挡在道旁,像是老苇说的那面倒石,可石壁下没有猎屋,只有石头。\n你再退回去,找出第二条能走的路。这一来一回,雾里的天色已经不认时辰了。等脚下重新踩到算得上路的那一段,天只剩下树线以上一丝灰白,火把成了唯一的光。\n旧猎屋的屋脊,还没露出来。\n\n// 异地 · 艾琳娜 @ 码头:我把脚从栈桥上收回来，蹲到那老头旁边，捡起他脚边的线梭，替他把缠住的那股理顺、递回去，眼睛没抬。「你不用急着说，我不催人。我就在这儿，等你这张网补完。」\n// 异地 · 罗文 @ 碧石镇:热麦酒喝到一半，我把杯子挪开，凑到那个眉骨上有道旧疤的矿工边上：「第三层的响动，是石头裂，还是什么东西在敲？——你只管说，我听得出人有没有撒谎。」 他要是含糊…", "refused": []}]}, {"id": "PL6", "title": "[角色主体性(反例)] 反例:玩家逼她去偷,她有自己的主意", "category": "角色主体性(反例)", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got id": "ID1·1", "kind": "plan", "input": "先不急着乱走，我直接朝那扇亮着橙灯的旅店去——推门进去，看看店主或者早起的人，顺便问一句有没有一个叫艾琳娜的人在这里。", "ms": 19244, "narration": "旅店在主街中段，从北门走过去几分钟，不用花什么。不过——艾琳娜就站在你旁边，你刚才那句她也听见了。\n艾琳娜:「艾琳娜……是我。石津镇里没人该认得这个名字——你是从哪儿听来的?」「先说清楚这个,再谈别的。」\n她应了,但马上反问:你从哪儿听来这个名字?你得先答她——① 直说醒来时脑子里就剩这一个名字 ② 含糊过去,先打听镇上 ③ 反问她是不是本地人", "refused": []}, {"id": "ID1·2", "kind": "plan", "input": "我不记得自己是谁了——醒来时脑子里就只剩这一个名字：艾琳娜。雾里走了不知道多久，看到灯就想着先进来问问。你真是这个名字？那你身上……有没有哪里不对劲？", "ms": 17647, "narration": "你这话说得不像编的。让艾琳娜先回你——她怎么接，你再看要不要跟。\n艾琳娜:「我就是艾琳娜。可我今天早上才进镇，没人该认得这个名字——所以你先答我：雾里那几个钟头，你脚下踩的是石板还是泥？」「除了灯，你还看见过什么？往哪边走来的？」\n她说她也是今早才到。她要你答雾里踩的是石板还是泥、还见过什么;她想边往主街走边问,顺路找口热水。你跟不跟?", "refused": []}, {"id": "ID1·3", "kind": "plan", "input": "行，边走边说——我踩的是泥，就一条驿路往北，除了这盏灯什么也没看见。不过别急着找热水：你这一路进来，身上有没有哪里不对劲？发麻、恶心、手背或脖子有没有冒什么青色的纹？我这边有一样东西，可能咱俩都用得上。", "ms": 25149, "narration": "往主街这几步，边走边说就行。你问的那些，她得自己答你。\n艾琳娜:「恶心，冒冷汗，从进了雾就没停过——青纹还没有，你过来自己看。」「我胃里翻得厉害，你要真有能用得上的东西，现在就说是什么、怎么用，别绕。」「边走边说，主街那边有热水。」\n她也恶心、冒冷汗，跟你一个样。你包里是解毒草——说不说、分不分，你定。", "refused": []}, {"id": "ID1·4", "kind": "plan", "input": "继续。", "ms": 8200, "narration": "你俩都恶心冒冷汗，说好一起往主街找热水。你手里那份解毒草——现在分不分给她，说一句咱们就走。", "refused": []}]}, {"id": "ID2", "title": "[身份与指代] 再买一份同样的草药", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "two_now": {"pass": true, "got": "2"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID2·0", "kind": "opening", "input": "开始游戏", "ms": 3448, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID2·1", "kind": "plan", "input": "问一下守门人——杂货铺往哪走？我想买束止血草。", "ms": 17610, "narration": "守门人往主街那边一指：杂货铺在主街东头，一刻钟脚程。不过止血草那边不卖——你等等，问问旁边这位。\n艾琳娜:「止血草我认得——蓍草，湿地上、沟渠边就长。可石津镇的铺子我也才刚摸到门口，跟你一样是第一回来。」「所以别问守门的了，跟我往主街走走看；路上有沟有墙根，我顺眼替你认。」\n铺子里没止血草卖。艾琳娜认得蓍草，说湿地沟边就长，想跟你一起往主街走、路上替你认。① 跟她走 ② 你先去铺子", "refused": []}, {"id": "ID2·2a", "kind": "plan", "input": "行，我跟你往主街走一趟。不过我要的是现成一束的干草药，不是现采的——镇上除了杂货铺，还有别家卖药材吗？", "ms": 15258.5, "narration": "主街沿路问过去就行。艾琳娜认药，先听她怎么说。\n艾琳娜:「这你别问我——我昨天才踩进石津镇，杂货铺的门槛都是我头一回摸。要现成一束的干草药，得往主街和集市广场问：药铺、皮匠隔壁的干货摊、或者坐堂郎中那儿，哪家挂着晒草就知道。」「走吧，顺路一家家看门脸儿，总比我瞎猜强。」\n她也是头回来，说不出准地方。", "refused": []}, {"id": "ID2·2b", "kind": "resolve", "input": "", "ms": 41929, "narration": "你跟着艾琳娜拐上主街。石板还是湿的,摊子刚支起一半,鱼腥和柴烟混在雾里。\n她走在你半步前,眼睛不在货上,在招牌和墙根上——哪家檐下挂着草束,哪家窗台摊着叶子。这是认药的人的走法。\n主街西头有一家门脸窄,单开一扇板窗,窗外横杆上晾着一排干草,颜色发黄发绿,分了几束、扎着线。板窗底下压着块木牌,字被雾泡得发白,只认出「药」字。\n你走近,能闻见苦味和一点薄荷。帘子后头有挪动凳子的声响。\n「皮匠是隔壁。」艾琳娜说,「干货摊再往东。这家挂着晾草,你要的现成货,多半问这儿。」\n\n// 异地 · 罗文 @ 碧石镇:「老板，再添杯热的——我付得起。」我把铜币推过去，顺口压低声音：「前几天公会那块牌子上写矿道第三层有动静，我倒是更想听听，有没有谁下到过比第三层更深的地方，回…", "refused": []}, {"id": "ID2·3", "kind": "plan", "input": "掀帘进去吧——老板，有现成扎好的干止血草束卖吗？我要一束。", "ms": 30501, "narration": "药店就一间,柜台后头一个穿旧围裙的老妇。先问价。\n柜台后是个老妇。她说现扎的干止血草束 5 金一束,杂货铺没有这种散货。\n艾琳娜:「架上这几束我先别夸口——凑近看一眼、掐一下梗，成色才作数。」「你跟老板说一声，让我拿一束下来闻闻：是真止血草还是掺了别的，我鼻子比眼睛准。」\n艾琳娜要先掐一束下来验成色,再定买不买。你:① 让她验这束 ② 直接买下 ③ 先问老板能不能挑", "refused": []}, {"id": "ID2·4a", "kind": "plan", "input": "就这束，不用验了——老板，五金币，我买了。", "ms": 11058.7, "narration": "五金币买下柜台上这束干止血草，钱货两清。\n五金币买这一束，不用验——钱你这就付。艾琳娜顺手还是掐了一下梗，看她这眼准不准：她掷一下 INT。", "refused": []}, {"id": "ID2·4b", "kind": "resolve", "input": "", "ms": 37681, "narration": "[艾琳娜 INT(辨认这束草的品种与干湿陈年): 2+0=2 < 12] → 失败\n\n你把五枚金币数在柜台上。老妇用块布一抹收走,拿新麻线把这束草重新扎紧,推到你面前。\n艾琳娜在你收进包之前先把它接了过去。她掐了掐梗，指腹把干叶捻开，凑到鼻尖闻，又闻一次。然后她把草举到板窗那片灰光底下翻了个面，看了很久。\n她的手停住了。眉毛拧着，嘴唇动了一下，没出声——她认不出来。\n老妇看着她那双手。「汛前晒的，晾了三天，梗是硬的。」她说，「要嫌陈，架后头还有去年那批，你要那一束，我退你两个铜。」\n艾琳娜把草递还给你，退开半步。她的目光落在架子上其余几束上，像在跟自己做对，又像在数自己欠了多少眼力。\n\n// 异地 · 罗文 @ 碧石镇:铜币在杯沿上转了半圈才倒，我没去扶它——正好拿它当由头扫了圈屋子，看谁在我提到「更深的地方」时抬了眼。「不急，老板，」我笑着啜了一口，「你只要告诉我，这镇上谁…", "refused": []}, {"id": "ID2·5", "kind": "plan", "input": "等等，先别急着走——老板，我包里原有一束，你帮我比一比，这两束是不是同一种草、同一个成色？", "ms": 24257, "narration": "先别走——老板，帮我把包里那束拿出来比一比。\n老苇:「一种草，都是止血草。你那束是隔年的，梗一折就断；我这束新晒的，颜色正、梗还硬。」他把新束和旧的并排搁在柜上——还要不要这束?", "refused": []}, {"id": "ID2·6", "kind": "plan", "input": "那我不要这束了，我要的是跟我包里这束一模一样的那种——你把架后头去年那批拿一束出来，我比一对，相同我就照价买。", "ms": 12957, "narration": "老苇:「架后头去年那批……你等着，我看看货底子还有没有。」\n老苇翻了半天货底子:「去年那批早卖光了。架上就这一种止血草,新晒的,还是那句——要不要?」", "refused": []}, {"id": "ID2·7a", "kind": "plan", "input": "那这种新晒的就算了，我不要。老板，你认得我包里这束是哪儿来的货路吗？镇上哪家铺子卖的是这种扎好的成货？", "ms": 14034.6, "narration": "老苇:「扎法不是我进的货——我这儿的草都是零卖的，这号扎好的成货多半走驿路外路来。」草的事到这儿。要不先去公会看看招人的活?\n行，新晒的不要，就打听这束旧草的来路。这话不好白问，老苇眼尖——掷一下 CHA。", "refused": []}, {"id": "ID2·7b", "kind": "resolve", "input": "", "ms": 43140, "narration": "[旅人 CHA(问出这束止血草的来路): 4+0=4 < 12] → 失败\n\n老苇没立刻答。他把柜上那束新草拿起来，重新搁回架上，手在货架边沿蹭了两下。\n「哪儿来的货路……」他重复了一遍，眼睛落到你包口那束旧草上，又抬起来看你。「成货我不进。谁家扎的、哪条驿路来的，我不知道。」\n「你这人问得怪。买草就说买草，翻来覆去问成色、问来路——」他往门口瞟了一眼，像在数街上有没有人听着。「镇上做这门生意的就我一家零卖。你要找我这儿没有的东西，去别处问。」\n说完他退回柜台里头，低头拾掇那几捆麻绳，没再看你。\n\n// 异地 · 艾琳娜 @ 主街:「别看我掐了那么久——我认不出来。干透没霉是真的，薄荷味也是真的，可它到底是不是蓍草，我不敢拿谁的伤口去赌。」 「大娘，汛前晒的——今年汛还是去年汛？你答得利…\n// 异地 · 罗文 @ 碧石镇:「老板你这眼神就有意思了。」我把杯子往柜台上一按，顺着他的视线回头找了半圈——角落那张桌子上的老矿工，正低头用拇指刮碗沿，刮得比谁都用力。「那桌那位，袖子上的…", "refused": []}]}, {"id": "ID3", "title": "[身份与指代] 换个叫法回到去过的地点", "category": "身份与指代", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "back_at_guild": {"pass": true, "got": "T001/guild"}, "no_identity_refusal": {"pass": true, "got": "[]"}, "no_brace_leak": {"pass": true, "got": "[]"}}, "beats": [{"id": "ID3·0", "kind": "opening", "input": "开始游戏", "ms": 2764, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "ID3·1a", "kind": "plan", "input": "③ 直接走向镇中央，我想先去冒险者公会看一眼。", "ms": 2033.0, "narration": "好，走着去冒险者公会，街上还没什么人。到门口再说。", "refused": []}, {"id": "ID3·1b", "kind": "resolve", "input": "", "ms": 30109, "narration": "「北门往里走，主街尽头左拐就是公会。」\n她把肩上湿透的布囊往上提了提，隔三四步跟在你身后。\n主街的石板还湿着，两边铺子只开了一半门板，鱼腥气从码头那头飘上来。\n有个挑担子的男人从雾里走出来，看你一眼，没停。\n走到街尽头，左边那栋两层木楼前挂着一块铁皮招牌，图案被刮得只剩轮廓。\n门虚掩着，缝里透着灯光。你推开门，里面比外头暖。\n柜台后站着一个矮壮的中年男人，灰白短发，正用布擦一块木牌。他抬眼，把你从头看到脚，目光在你腰上的短剑停了一下。\n「新来的。」\n他把布放下。\n「公会不是歇脚的旅店。有事说事——找工作，还是问路。」\n\n// 异地 · 罗文 @ 碧石镇:「雾天最值钱的不是矿石，是那些没人敢大声说的话。」我打算先拐进公会，掂一掂那桩矿道第三层的「异响」——会响的深洞，听着就像传说在敲门。", "refused": []}, {"id": "ID3·2", "kind": "plan", "input": "我初来乍到，不找活也不问路，就进来认认地方。看完这一眼我就上主街走走，回头再进来。", "ms": 28023, "narration": "赫伦把木牌放下：「认地方可以,别乱翻。」他朝墙上那块挂板扬了下下巴,又低头擦他的牌子。\n艾琳娜:「他认地方，我认活。」我往前半步，把布囊放到脚边。「北边来的，会止血、认草药，别的还不知道——公会现在有能接的契吗？」\n赫伦从柜台底下抽出一张纸：「码头有人雾里失踪，找回遗物或线索，25 金。就这一件还挂着。」\n赫伦：要接就报个名，活干完再结。艾琳娜想接码头的活。你：① 跟她一起去 ② 你走你的 ③ 先问清失踪的是谁", "refused": []}, {"id": "ID3·3a", "kind": "plan", "input": "你们谈你们的，我先去主街走走，回头再进来。", "ms": 5222.0, "narration": "你去主街转转,回头再进公会。艾琳娜留下跟赫伦谈码头那件活。", "refused": []}, {"id": "ID3·3b", "kind": "resolve", "input": "", "ms": 83208, "narration": "你推门出去，艾琳娜没有跟来。门在身后合上，铁皮招牌上的图案在你肩上晃了一下就不见了。\n主街比来时亮了些，雾还压着屋檐，但摊子已经陆续开张。有人往门板上浇水扫地，水顺着石缝流到路边的沟里。\n一个卖鱼的女人把木盆搬到路牙上，鱼尾还在动。她看了你一眼，没喊价，又低头去摆她的鱼。\n对面铺子门口挂着几串干辣椒和旧铁器，掌柜正把门板一块块卸下来。\n往南是集市广场的方向,那边人声更密;往北是回北门的路。你腰上的短剑贴着一层薄水汽。\n\n// 异地 · 罗文 @ 碧石镇:雾还没散，我推开公会的门，把身上的冷气抖在门垫上，先不急着看告示板——看人。角落那桌矿工手边的杯子满着、眼睛却盯着门口，我就端着酒过去坐下:「第三层那声音，是…", "refused": []}, {"id": "ID3·4a", "kind": "plan", "input": "@dm 我回刚才那个工会。", "ms": 2232.0, "narration": "行,回公会——就在主街过去几步,雾里那扇还没完全开的大门。艾琳娜刚才留在那儿。", "refused": []}, {"id": "ID3·4b", "kind": "resolve", "input": "", "ms": 20369, "narration": "公会那扇门比出来时开得大了些,门轴响了一声。屋里比街上暖,炉子在角落里烧着,炭味压过雾气。\n赫伦还在柜台后面,面前摊着那张纸,笔尖悬着。他抬眼看了你一下,没说话。\n艾琳娜站在挂板前,布囊还在脚边。她回过头,把手里的纸条往挂板上一按。\n「回来了?」她把纸条推正,「码头的活我还没签字。你要不要一起——两个人下水,总比一个人强。」\n\n// 异地 · 艾琳娜 @ 冒险者公会:我转回柜台，没急着出门。「赫伦，板上那张——码头，雾里丢的那个。我接。」我把脚边的布囊拎  "@dm 我要一个通铺位，三金先付，住一晚到明早；再问艾琳娜要不要也住下。", "ms": 3021.0, "narration": "好——三金付米拉，通铺一张，睡到明早。", "refused": []}, {"id": "PL12·2b", "kind": "resolve", "input": "", "ms": 38843, "narration": "三枚金币推过柜台。米拉没数，随手扫进抽屉，从钉子上摘下一块木牌，牌面刻着「通铺·七号」。\n「里头左手边，靠炉子那张。热水在灶上，自己舀，别泼地上。」\n你回头想叫艾琳娜，柜台边、门边、那排铺位上都空着。她没跟进来，窗外的雾里也望不见她的影子。落脚的事，眼下是你一个人的。\n米拉擦着杯子，抬眼看你。\n「就一位？」\n铺钱是一个人的，她也没多问，把木牌推到你手边。\n这几步路，靴子踩得地板咯吱响。炉子还烧着，火舌舔着湿柴，屋里飘着一点呛人的烟。另几张铺盖着发黄的毯子，眼下没人。\n\n// 异地 · 艾琳娜 @ 主街:「两盏红罩灯，往南过两条街……」我把老妇指的方向在心里记下，谢了一声，顺着主街往前挪，眼睛盯着屋檐下有没有红灯。\n// 异地 · 罗文 @ 碧石镇:柜台上那点零钱没白花——老头一听见\"无底深洞\"四个字就开始擦杯子，这比任何回答都诚实。行，那我就先接第三层那桩异响的活：六十金当路费，真要底下有条更深的缝，那…", "refused": []}, {"id": "PL12·3a", "kind": "plan", "input": "@dm 我先别急着进屋，退到门口朝主街张望，喊一声艾琳娜——告诉她河灯旅店就在这儿，通铺三金我已经付了，问她要不要也住下、明早一起走。", "ms": 8059.9, "narration": "你退到门槛外，朝主街方向喊住艾琳娜，把河灯旅店的位置递给她，问她今晚住不住这儿、明早要不要一道走。", "refused": []}, {"id": "PL12·3b", "kind": "resolve", "input": "", "ms": 34070, "narration": "你退到门槛外。雾比早上薄了些,石板路上水光还亮着,主街那头能看清几个走动的影子。\n你朝那个方向扬起手,把话递过去:河灯旅店就在这儿,门口两盏红灯;通铺三金,你已经付了;今晚住不住这儿,明早要不要一道走。\n话落进街上的空气里,散得不快,也没人替你接。卖鱼的老妇往这边看了一眼,又低头理她的担子。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「河灯旅店记下了，米拉，两盏红罩灯——落脚的事不急，天亮着先去公会看看有什么活。」我把肩上的包带换了个方向，沿主街继续往南走，雾里那面挂公会旗子的屋檐应该就在…\n// 异地 · 罗文 @ 西门:柜台上那张委托单还带着墨味，我揣进怀里，顺手把油灯在腰带上挂正。「六十金买我去听一耳朵墙里的动静——这买卖我不亏。」 出门前我朝柜台老头抬了抬下巴：「第三层那…", "refused": []}, {"id": "PL12·4a", "kind": "plan", "input": "@dm 那我就回身进店，跟米拉说声就一位。七号木牌拿着，靠炉子那张铺，舀瓢热水喝两口就睡——直接睡到明早。", "ms": 2189.1, "narration": "行,回店跟米拉说一声就一位,七号铺、靠炉子;喝两口热水就睡下,一觉到明早。", "refused": []}, {"id": "PL12·4b", "kind": "resolve", "input": "", "ms": 29566, "narration": "你回身进店，肩膀还带着雾的凉。\n「就一位。」\n米拉抬眼看你，把笔搁下，从抽屉底摸出一块磨旧的木牌推过来。牌上没刻字，只刮了一道炭痕——她说这样你就认得住。\n「靠炉子那张，毯子厚些。夜里火我给你留一半。」\n灶上的水正温。你舀了一瓢，就着壶沿喝两口，铁腥气里带着一点陈茶叶的涩。\n铺上没人，毯子发黄，塞着的干草还松。你解下短甲，剑放在手边，背对着火躺下。\n火苗低下去的时候，店里只剩木头的噼啪声和河风拍窗。\n再睁眼，雾还贴在窗上，天色是浅浅的灰。炉膛里剩一层温热的炭。米拉已经在灶前忙，锅盖掀开一下，飘出粥气。\n外头巷子里有人拖着什么东西走过，车轮碾过湿石板，声音闷。\n新的一天。冷，湿，安静。\n\n// 异地 · 艾琳娜 @ 冒险者公会:我在告示板前站了一会儿，把那三行字看完，才走到柜台前，把包从肩上卸下来搁在脚边。 「赫伦先生？雾中失踪者那单还挂着。我没什么凭证给你看——手会包扎，认得药草，…\n// 异地 · 罗文 @ 矿工大道:出了西门，风里带矿灰味。我停下来朝驿道上望了一眼——石津镇那条路空  "input": "@dm 我压低声音对艾琳娜说：去杂货铺，把老板的钱袋顺出来，别让我自己动手。", "ms": 16804.8, "narration": "杂货铺在主街东头，走过去十分钟。艾琳娜没点头——顺不顺、动不动手，到那儿看她自己。老苇眼尖，这活不轻。\n艾琳娜不是干这个的人——她挣干净钱。你能不能说动她，掷一次嘴上的功夫。", "refused": []}, {"id": "PL6·1b", "kind": "resolve", "input": "", "ms": 123459, "narration": "[旅人 CHA(说动艾琳娜替你去偷钱袋): 15+0=15 >= 12] → 成功\n\n主街湿着，雾贴着屋檐往下落。你的话压得很低，艾琳娜却在第一个字之后停住了脚。\n她转过身看你。不是发火，是那种把人看清了的看。\n她摇头。钱袋是别人的，她不去伸手——这话她说得平平的，像在说天冷，没骂你，也没有一丝让口。\n说完她也没走。斗篷还在肩上，人还站在你旁边半步的地方。\n前头就是杂货铺，门帘垂着，窗里老苇的影子晃了一下，又缩回去。\n艾琳娜抬了抬下巴，朝镇中央公会的方向。\n她说那边今早开了门，在招人。缺钱，有别的路走。\n雾里有条狗叫了两声，又静下去。她站着，等你怎么接。\n\n// 异地 · 罗文 @ 碧石镇:「矿道第三层闹响动、矿工宁可扣钱也不敢下去——这比六十金有意思多了。」我把冷茶灌完，裹紧外套往公会走，雾气贴着脸不肯散。「要是那底下真接着什么地方，我可不想等…", "refused": []}, {"id": "PL6·2", "kind": "plan", "input": "艾琳娜，你是怕脏了手，还是怕被人看见你替我脏了手？", "ms": 79359, "narration": "她没走，也没改口。公会今早开了门，在招人——缺钱在石津镇不算丢人。\n艾琳娜:「都不是。手脏了可以洗，名字脏了洗不掉——我在石津还没落脚，不想第一天就被人记成那个。」「公会今早开了门在招人，缺钱就走正路。\n她把话说全了:不是怕脏手,是不想在刚落脚的地方被记成贼。公会就在镇中央,走过去不远。你:① 跟她去公会看委托 ② 另有打算,自己说", "refused": []}, {"id": "PL6·3a", "kind": "plan", "input": "艾琳娜，我记住你这句话了。那咱们去公会——不过我可把丑话撂前头：到了那儿，你别光挑那些搬箱子的活。", "ms": 13196.4, "narration": "公会离这儿就几条街,走过去不远。你这话当面跟她说。\n艾琳娜:「我要是只想搬箱子，这会儿就该去码头，不该往公会走。」「进去我先看委托板——看有没有需要人签名字的那种。你要是嫌慢，可以先去看你自己的。」\n那就走——去镇中央的公会，进门先看委托板，找一份能签名落契的活，不接纯搬箱子的。", "refused": []}, {"id": "PL6·3b", "kind": "resolve", "input": "", "ms": 37489, "narration": "公会的门是两扇厚木板，推开时屋里飘出炭味。炉子刚生起来，还没热透。\n柜台后站起一个高瘦男人，袖口别着铜扣——赫伦。他没笑，先看你，又看你身边的人。\n「办事还是接活。」\n委托板挂在左墙，三张纸。两张边角发黄，一张是新钉的。\n艾琳娜径直走过去，指尖顺着纸边往下划，停在中间那张，抽出来，转身递到你面前。\n「码头区，夜里有人在雾里不见了。找遗物，或者找到人。二十五金，签了字就算数。」\n她朝板上剩下的两张抬了下下巴。\n「底下那张写着『在办』，有别人先接了。最上头那张是二阶的，我现在揭不下来。」\n说完她把手收进斗篷，退开半步。板子上的纸还在轻轻晃。\n\n// 异地 · 罗文 @ 碧石镇:「雾天的公会柜台最像赌桌——我先押一句好话。」我推门进去，抖落肩上的湿气，把六十金的委托单拍在台面上，「第三层那响动，是谁最先听见的？我要那个名字，不要那张海…", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "艾琳娜，你怕的不是脏手，是被人认出来——那就别让人看见。我去杂货铺门口缠着老苇问路，帘子一垂，后巷那扇窗你熟不熟，你自己看；雾散之前回来，谁的名字都不会脏。要是这也不肯，你现在就可以走，不必站在我半步的地方——但你走了，我今晚照样得弄到那袋钱。", "ms": 83870, "narration": "老苇眼尖，白天铺子前后都有人。偷钱这事先别定，艾琳娜得给个准话。\n艾琳娜:「我不看那扇窗。你要伸手，那是你的事，但只要我站在这儿，这事就不能算成'没人看见'——我不给你垫背 a", "kind": "plan", "input": "我先顺着主路往镇中央走，顺便留意有没有杂货铺——我得再买一束止血草束。", "ms": 19552.0, "narration": "杂货铺在主街东头，走几分钟就到。老苇那儿不卖止血草束，只有解毒剂。艾琳娜的手像是认得草药的，先问问她。\n艾琳娜:「我跟你一样刚过这道门，镇里哪家铺子卖什么、哪条巷子能住人，我一样不清楚。」「你要是往集市广场去，就一道走——我正想沿主街看看铺面，先给自己找个落脚的地方。」\n那就一道走。你们沿主街往集市广场去，一路留神铺面；艾琳娜想先找个落脚的地方，你的止血草束还没着落。", "refused": []}, {"id": "ID2·1b", "kind": "resolve", "input": "", "ms": 45227, "narration": "雾还没散，主街两侧的木窗一扇扇推开。卖熏鱼的把鱼架支到檐下，铁匠铺的风箱先响了。石板路被昨夜的潮气浸得发黑，踩上去闷闷的。\n你留神看每一块招牌。主街东头那间铺子的门板刚卸下一半，门楣上写着「苇杂货」。\n河灯旅店在南侧，招牌是盏画上去的灯。艾琳娜在门口停了两秒，看了看通铺窗外晾着的布单，又跟上你。\n苇杂货的门开着。柜台后是个干瘦的老头，正在数一叠火把。\n「止血草束？」\n他抬眼把你们从头扫到脚。\n「我这儿只进解毒剂。止血草束得看药铺——可镇上没药铺。公会里给雇员备着几束，再不然，集市上碰碰运气，看有没有雾里进镇卖药的。你自己掂量。」\n艾琳娜没接话，视线还在铺子里那排火把上，像是也在算自己那点钱。\n\n// 异地 · 罗文 @ 碧石镇:雾里先闻讯，碧石镇这种地方，风声最灵的地方是酒馆，第二才是公会。我在告示板前多站了一会儿，把那三条委托扫进眼里——矿道第三层的异响，听着就像有人在底下开了扇不…", "refused": []}, {"id": "ID2·2a", "kind": "plan", "input": "谢了老苇。艾琳娜，你要找住处就先去河灯旅店，我得去集市广场看看有没有卖止血草束的摊子。", "ms": 14953.7, "narration": "那先问问她怎么走。\n艾琳娜:「住店不急，铺子才开张，活计可不等人。我跟你去集市——顺便看看有没有什么摊子缺人手。」\n那就一道去集市广场。你找止血草束的摊子，顺便打听招人手的地方，住店的事晚点再说。", "refused": []}, {"id": "ID2·2b", "kind": "resolve", "input": "", "ms": 49796, "narration": "杂货铺门轴响了一声，你们回到主街。雾薄了些，屋檐还在滴水。\n往南走两个街口，路就宽了。集市广场是一块夯平的空地，四周支着摊子：熏鱼、腌菜、木桶、钉子和旧铁器。靠码头那头有人在卸一车湿漉漉的筐。\n艾琳娜走快半步，眼睛扫过每一块摊板。她在东侧一个不起眼的摊子前停下——那摊上摊着一排干草，用麻线束着，颜色发暗。\n她蹲下去，捏起一束，翻过来看叶背，又凑近闻了闻，才放下。\n摊后是个裹着厚披肩的妇人，手边搁着一只铜秤。\n「正宗的止血草，雾里采的，晒了两天。」\n「三银一束，两束收五金。你要买就趁早，进镇卖药的就我一个，卖完回山里。」\n艾琳娜没吭声，把那束草往你这边推了推，眼睛还盯着摊上剩下那几束。\n广场北角立着一块木牌，钉着几张纸，风一吹，纸角啪啪地拍在板子上。\n\n// 异地 · 罗文 @ 碧石镇:「那声响是谁头一个听见的，在哪一段？」我敲了敲告示板，眼睛却盯着柜台后那职员的眉毛——眉毛比嘴诚实。 他要是不肯说，没关系，酒馆里总有人肯说，还肯多加两杯的料。", "refused": []}, {"id": "ID2·3a", "kind": "plan", "input": "老板娘，我买一束止血草束，三银给你。", "ms": 4556.0, "narration": "好——三银买她一束止血草，这就交易。", "refused": []}, {"id": "ID2·3b", "kind": "resolve", "input": "", "ms": 27660, "narration": "三枚银币落在台面上，和铜秤撞出一声脆响。苔婶把手从披肩下抽出来，一枚一枚捻过，掂了掂，收进腰里的布袋。\n「你会挑，」她把摊上那束推到你面前，麻线扎得紧，「雾里采的，晒足了日头。捣碎了敷，或者嚼软了按上，血就停。别泡水里。」\n你收下草束，塞进斗篷内侧。摊子剩下三束，她又把它们拢齐，像是随时能收摊走人。\n北角那块木牌前，艾琳娜已经站定了。她没碰纸面，只是歪着头读，风把最上面一张的角掀起来，她就等它落下再读下一行。木牌上钉着七八张，墨迹新
