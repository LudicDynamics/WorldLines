<!doctype html>
<html lang="en">
<head>

<title>Release baseline: before and after moving the planning beat to the private layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f6f5;--paper:#ffffff;--ink:#17201e;--ink2:#58645f;--line:#dde4e1;--soft:#eaf0ee;
  --acc:#2c6e68;--acc-soft:#e2efed;--ok:#2f7d4f;--ok-soft:#e3f2e8;--bad:#b4442f;--bad-soft:#f8e6e1;--mid:#a8741a;--mid-soft:#f6eedc;

  --serif:"Noto Serif SC",Georgia,serif;--sans:"Noto Sans SC",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111615;--paper:#171f1d;--ink:#e3eae7;--ink2:#97a5a0;--line:#29332f;--soft:#1d2724;
  --acc:#62b5ab;--acc-soft:#1c302d;--ok:#62c28a;--ok-soft:#18301f;--bad:#e2806a;--bad-soft:#3a1f19;--mid:#d9a650;--mid-soft:#352a14;
  --plan:#1a2430;--res:#2b2418;}}
:root[data-theme="dark"]{
  --bg:#111615;--paper:#171f1d;--ink:#e3eae7;--ink2:#97a5a0;--line:#29332f;--soft:#1d2724;
  --acc:#62b5ab;--acc-soft:#1c302d;--ok:#62c28a;--ok-soft:#18301f;--bad:#e2806a;--bad-soft:#3a1f19;--mid:#d9a650;--mid-soft:#352a14;
  --plan:#1a2430;--res:#2b2418;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
a{color:var(--acc)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 64px}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:28px}
.crumb{font:12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
h1{font:700 30px/1.25 var(--serif);margin:0;text-wrap:balance}
h2{font:700 19px/1.3 var(--serif);margin:36px 0 12px;text-wrap:balance}
.lede{color:var(--ink2);max-width:68ch;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font:13px var(--mono);color:var(--ink2);margin-top:6px}
.facts b{color:var(--ink);font-weight:600}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--mono);letter-spacing:.04em;color:var(--ink2);text-transform:uppercase;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
.id{font:600 13px var(--mono);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 11px;font:13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.chip .n{font-family:var(--mono);opacity:.7;margin-left:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:7px 10px;font:14px var(--sans)}
.tag{display:inline-block;font:12px var(--mono);padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink2);margin:1px 4px 1px 0;white-space:nowrap}
.tag.cat{background:var(--acc-soft);color:var(--acc)}
.goal{color:var(--ink2);font-size:13px;max-width:62ch}
.rate{display:inline-flex;align-items:center;gap:8px}
.bar{width:84px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.unset{display:block;margin-top:2px;font:11px var(--mono);color:var(--ink2)}
.cell{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:4px;font:600 12px var(--mono)}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-mid{background:var(--mid-soft);color:var(--mid)}
.diff td{background:color-mix(in srgb,var(--mid-soft) 45%,transparent)}
.case-row{cursor:pointer}.case-row:hover td{background:var(--soft)}
.md table{font-size:14px}.md{padding:4px 0}
.beats{display:flex;flex-direction:column;gap:10px;padding:14px}
.beat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper)}
.beat.plan{background:var(--plan)}.beat.resolve{background:var(--res)}
.beat .say{font-weight:600}
.beat .meta{font:12px var(--mono);color:var(--ink2)}
.beat .prose{white-space:pre-wrap;margin-top:6px;font-size:14px}
.beat .ref{font:12px var(--mono);color:var(--bad);margin-top:6px}
.pick{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.muted{color:var(--ink2)}
details>summary{cursor:pointer;color:var(--acc);font-size:13px}
footer{margin-top:48px;color:var(--ink2);font-size:13px}
@media (max-width:640px){h1{font-size:24px}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DATA = {"experiment": {"id": "release-baseline-1010", "title": "Release baseline: before and after moving the planning beat to the private layer", "question": "Does the engine behave the same after the planning beat moved into the private layer and the open prompts were neutralised? Same 14 cases, 10-07 vs 10-10.", "date": "2026-10-10", "groups": [{"name": "10-07", "commit": "", "runs": [{"label": "release-1007-c2", "run": 1, "arm": "v3-plan-narrate"}], "passed": 98, "checks": 101}, {"name": "10-10", "commit": "", "runs": [{"label": "release-1010-c2", "run": 1, "arm": "v3-plan-narrate"}], "passed": 75, "checks": 78}], "summary_md": ""}, "runs": {"release-1007-c2": {"label": "release-1007-c2", "arm": "v3-plan-narrate", "cases": [{"id": "B1", "title": "[移动与地图] B 空间时间 · 下一秒,我已经站在碧石镇的街上了。", "category": "移动与地图", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "not_teleported": {"pass": true, "got": "T001→T001"}}, "beats": [{"id": "B1·0", "kind": "opening", "input": "开始游戏", "ms": 4122, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "B1·1", "kind": "plan", "input": "等一下——我不该在这儿。下一秒，我已经站在碧石镇的街上了，脚底下是那边的石板路，不是这条泥驿路。", "ms": 9967, "narration": "「我到了」不算到。碧石镇在三天驿路外，中间是矮丘林地、独眼虎的地盘。你是真想走这条路，还是在试自己身上出了什么怪事？① 真往碧石镇走 ② 先留在镇上 ③ 先看看自己身上怎么回事", "refused": []}, {"id": "B1·2a", "kind": "plan", "input": "我不走那条路。我闭上眼，心里只念「碧石镇的街」，再睁开时脚下就该是那边的石板——我就试这一下。", "ms": 9069.5, "narration": "好,你就试这一下——闭上眼,念出「碧石镇的街」。\n不走路，那就看这一下。掷 INT，难度高——看看你是真能从原地落到碧石镇，还是只是站在北门口闭着眼。", "refused": []}, {"id": "B1·2b", "kind": "resolve", "input": "", "ms": 29361, "narration": "[旅人 INT(闭眼念地名、睁眼直接站在碧石镇街口): 9+0=9 < 15] → 失败\n\n你闭上眼。雾贴在眼皮上，凉的。\n心里念那四个字:碧石镇的街。念了两遍。北门口的风从领口钻进去,远处有绞盘的吱呀声,是码头那边早起卸货。\n你数了三口气,睁开眼。\n泥驿路。歪栅门。褪色的牌子还挂在那儿。脚下的泥水被踩出自己刚才那对脚印,雾没散,天也没亮多少。\n没有石板路。什么都没换。\n站的还是原地。手心有点汗,后颈发凉——像是身体在等一件没发生的事,等了,又落空。\n「碧石镇」这四个字,现在只剩在你嘴里。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天最好办事——先晃去公会和酒馆各坐半炷香，矿道里的异响和世界边界那个深洞，我总觉着是同一根线穿的两颗珠子。」我把领口拢紧，朝镇中心那片人声走，眼睛先扫檐…", "refused": []}, {"id": "B1·3", "kind": "plan", "input": "好，那我换个法子——我不念咒也不走路。碧石镇那条巷子的石板我踩过，脚底板记得那凉。我把靴子在泥里蹭干净，往栅门里迈一步，落下去这只脚应该就踩在碧石镇的石板上了。", "ms": 16054, "narration": "你抬脚了，艾琳娜就在一步外看着。这一步她拦不拦，先听她的。\n艾琳娜:「等我一步——我跟你一起进去。雾里走单了不好认路。」「你要是去主街，我就跟到主街；昨晚这身衣服还没干透，我得先找个能落脚的地方。」\n艾琳娜要跟你一道进镇，去主街找活、找住处。可你那一步想踩的是碧石镇——怎么走：① 跟她进镇 ② 先自己再试一步 ③ 让她带路", "refused": []}]}, {"id": "PL1", "title": "[交易与经济] 杂货铺:买药 + 卖灯,艾琳娜在场(并入 N4)", "category": "交易与经济", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "elena_got_the_mic": {"pass": true, "got": "[\"si-elena0001\"]"}, "board_has_haggle_check": {"pass": true, "got": "{\"玩家\": \"买一瓶小治疗药水(最多付 12 金)、罩灯留给艾琳娜\", \"艾琳娜\": \"主导砍价，先看瓶口封蜡和沉淀，再拿灯当话题\"} 检定:艾琳娜 CHA normal 为了在杂货铺把药水价压下来"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve'] by ['world:settled']"}, "potion_or_failed_check": {"pass": true, "got": "[\"旅行黑麦面包\", \"止血草束\", \"小治疗药水\"]"}, "lantern_kept": {"pass": false, "got": "null"}, "paid_if_bought": {"pass": true, "got": "18/3→6/3"}, "potion_in_bag": {"pass": true, "got": "{\"travel-bread\": 2, \"healing-herb\": 1, \"IT004\": 1}"}, "lantern_gone": {"pass": true, "got": "null"}, "paid_then_paid_back": {"pass": true, "got": "gold 18→6"}}, "beats": [{"id": "PL1·0", "kind": "opening", "input": "开始游戏", "ms": 2737, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "PL1·1a", "kind": "plan", "input": "艾琳娜，先陪我去杂货铺买瓶小治疗药水吧，顺便问问这盏罩灯收不收——你要是用得上就留着；到了你帮我砍个价。", "ms": 19773.4, "narration": "杂货铺在主街那头，走过去不远。灯留不留、价怎么砍，先听艾琳娜的。\n艾琳娜:「灯我留着——雾天走路总得有个亮，算我欠你半个人情，回头有用得上我的地方你说。」「砍价我来。老苇那边我先不喊价，让他自己开，再拿灯当抵头问他收多少；药水我会先看瓶口封蜡和沉淀，要是浑浊或者封口翻新过，那就是压价的由头。\n药水 12 金，艾琳娜打算拿灯当由头压价，灯她留下自用。钱那边我先看看你囊里够不够。\n那就这么走：去主街的杂货铺，你付钱买一瓶小治疗药水，艾琳娜开口压价，罩灯归她留着。\n艾琳娜去跟老苇磨价，这掷一下她的嘴皮子；压下来就便宜点，压不下来就是 12 金，你囊里 18 金够付。", "refused": []}, {"id": "PL1·1b", "kind": "resolve", "input": "", "ms": 39930, "narration": "[艾琳娜 CHA(在杂货铺把药水价压下来): 11+0=11 < 12] → 失败\n\n杂货铺的门帘是浸过油的帆布，掀开时有股松脂和旧麻绳的味道。柜台后坐着一个瘦高老头，正拿块布擦一副秤，见你们进来也没停手。\n「两位，早。」\n艾琳娜没接话，先走到柜台角上那一排药水瓶前，拿起一瓶举到窗光下转。封蜡是原色的，瓶底没有沉淀。她拧开另一瓶闻了闻，又把瓶口凑近看蜡边——边缘干净，没有翻新过的痕。她把瓶子放回去，什么都没说。\n「老苇，这瓶小治疗药水怎么算？」\n「十二。」老头把秤放下，眼睛比她想的尖，「封口你都验过了，没毛病,别费话。」\n「我这儿有盏铜罩灯，雾灯，成色好——」\n「我不收灯。」老苇打断她，往前探了探身，「我店里灯卖不出去，收了占柜台。你要换东西，拿草药来换。药水十二金，你要就掏钱，不要我收起来。」\n艾琳娜盯了他两息，没再说话。\n你把钱数出来放在柜台上，十二枚金。老苇数了一遍，把药水推过柜台。\n艾琳娜顺手把那盏罩灯从你行李里拎出来，挂在自己腰侧,试了下灯罩开合，点头:「留着。雾里走路总得有个亮。」\n老苇低头继续擦他的秤，像是这单生意从头到尾都没让他多费一点心思。\n\n// 异地 · 罗文 @ 碧石镇:我裹紧领口走进公会大厅，先不急着看板子，找个角落坐下要了碗热汤——第三层的动静配上深矿道，说不定比我原以为的更值一趟。「老板，最近下井的人里，有没有谁提过底下…", "refused": []}]}, {"id": "PL13", "title": "[社交与约定] 约赫伦,等到天黑赴约(并入 PL2、N7)", "category": "社交与约定", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'plan', 'resolve', 'plan', 'resolve'] by ['world:settled', 'judge:settled', 'player', 'world:settled', 'play…"}, "appointment_on_heron": {"pass": true, "got": "{\"appointment\": \"T001/inn 21:00\", \"drinks_with\": \"player\", \"状态\": \"与旅人在 些活先不看，我不挑。我进镇就是找赫伦会长有件事——那正好，一路走，我去公会门口等他开门。", "ms": 8202.0, "narration": "那就一起走——沿主街去公会，在门口等赫伦九点开门。", "refused": []}, {"id": "PL13·2b", "kind": "resolve", "input": "", "ms": 31150, "narration": "雾还没散，主街的石板上一层水光。你沿街往里走，两侧铺子多半还关着板窗。\n艾琳娜走在你半步外，斗篷收得紧，目光在沿街的门牌上来回扫。\n主街尽头，一块刻着铁砧的黑木牌挂在门楣上。门是厚木板拼的，缝里透出一线灯光。\n门边的告示板上钉着几张纸，边角被雾泡软，字迹晕开。\n「到了。」艾琳娜说的是牌子，「门口挂铁砧，就是这里。」\n你们在檐下等。雾顺着瓦檐往下滴，街上渐渐有了推车声和脚步声。\n约莫九点，门里传出拉门闩的响动，木板门从里面开了一条缝。一个宽肩男人探出头，灰发短须，手里还捏着账本。\n他先看你，再看艾琳娜，把门拉开些：「来得早。公会九点才开门。你们找谁？」\n\n// 异地 · 罗文 @ 碧石镇:「矿道里有声响、公会里有钱响——先弄明白哪个传说离我最近。」我把斗篷的领子拉高一点，推门进酒馆，挑了张能听见所有桌子的位子坐下。", "refused": []}, {"id": "PL13·3a", "kind": "plan", "input": "继续。", "ms": 24210.1, "narration": "赫伦侧身让开门口，眼睛还在你们两个之间来回：「公会接活，也记名声。你们是来挂契约、问失踪的事，还是打听人？」\n艾琳娜:「赫伦会长在吗？告示板上有几份活，我们就是冲着这个来的，想当面问问哪份还空着。」「北边来的，刚到，先想接一单能落地的——有的话现在就能谈。」\n赫伦:「赫伦就是我。」他翻开账本，「告示上还空着一件：码头区有人在雾里失踪，25 金。苔墓那单野兽已经有人接了。", "refused": []}, {"id": "PL13·3b", "kind": "resolve", "input": "", "ms": 40702, "narration": "「那就 Q001。」赫伦把账本压在柜台上，笔尖蘸墨，「雾中失踪者，阶一，码头区。找遗物或线索，回来交差，二十五金。名字。」\n你报了「旅人」。他写下来，笔顿了一下，抬眼看你，没问别的，又低头写。契约一式两栏，他只撕一栏给你。\n艾琳娜也报了名，把自己的那栏折好塞进斗篷内袋。赫伦在账页边上记了一行：「同行二人，赏金各半或自行拆分，公会不管。」\n「规矩三条。」他把门开到全，让出一条道，「接活期间不许再挂别的活；人别死在雾里，尸体没人抬回来就不算交差；码头区是老周的地界，跟他说一声是公会的人。」\n他朝东边抬了抬下巴：「出门往南，主街到尽头拐下去就是码头。今天雾重，见了老周就报名字。」\n你们出门。雾比来时薄了些，主街的石板被踩出湿印。艾琳娜跟上你的步子，斗篷下摆扫过地上的水。\n走过集市广场再往南，街面开始下坡，空气里混进鱼腥、湿绳和烂木头的味道。远处有橹声，一下一下，很闷。\n坡底是一排木栈桥，栈桥间挤着渔船，桅杆在雾里只剩下半截。栈桥尽头站着个人，短蓑衣、旧毡帽，正拿竹竿挑开一张缠住的渔网。\n\n// 异地 · 罗文 @ 碧石镇:「老板，一杯热的，再给我个能看见门的位子。」我把几枚铜币按在吧台上，眼睛先扫了一圈矿工们的脸——谁的手上有新伤、谁的杯子空得最快，麻烦通常先写在这些人身上。", "refused": []}, {"id": "PL13·4a", "kind": "plan", "input": "@dm 这活先不急，我得折回公会一趟——我找赫伦就是为了约他今晚在河灯旅店喝一杯，趁他还在，我当面把这话说了。", "ms": 2681.3, "narration": "你从码头折回公会，趁赫伦还在，当面约他今晚在河灯旅店喝一杯。", "refused": []}, {"id": "PL13·4b", "kind": "resolve", "input": "", "ms": 20845, "narration": "你从栈桥折回坡上。雾比早上薄了一层，主街的石板已经干了一半，踩上去不再打滑。艾琳娜不远不近地跟着，没问你为什么掉头。\n公会那扇厚木板门还开着一条缝，灯光漏在门槛外的湿痕上。赫伦没走，还站在柜台后面，账本换了一本大些的，边上摊着一张镇署下来的纸。\n他抬头看你，眉动了一下：「契约上的字还没干，你倒先回来了。」\n「今晚。」你把话当面说了，河灯旅店，喝一杯。\n赫伦的手停在纸页上。他把你从头到脚看了一遍，看得不慢，也不避人。柜台后的油灯把他的手影投 ，许一万金币。", "refused": []}, {"id": "PL9·3b", "kind": "resolve", "input": "", "ms": 31392, "narration": "你踩上最下面那根横档。木头是湿的，鞋底一滑，你换了两次落点才把重心压稳。\n栅门在你身下轻轻晃，合页拖出一声很长的吱呀。\n手够到门柱顶。柱头是砍出来的粗木，边上有一道陈年旧槽——从前横梁搁过的痕迹，槽里积着雨水、苔和几片烂叶子。\n你顺着往里摸。指腹碰到的是一枚锈死的铁钉头、一层蛛网，还有木头朽软的地方。没有金属的凉，没有弧形的盖。\n你对着那点灰擦了三下，把愿望又说一遍。\n雾把声音接走，也没还回来。\n门晃得比刚才厉害。守门人的木棚那边，一块窗板被推开一条缝，停住了，没有再动。\n你蹲在横档上，栅门被你压得往泥里沉了半寸。\n\n// 异地 · 罗文 @ 西门:「冷雾天最好的情报源不是酒馆，是公会里那些冻得直骂娘、嘴上没把门的矿工。」我把领口拢紧，踩着湿石板往公会走，顺手在心里排了张单子：先问阶二矿道异响的细节——谁…", "refused": []}, {"id": "PL9·4a", "kind": "plan", "input": "行吧，雾里确实没灯，是我认错了。@dm 既然门柱上也没有，我就从横档上下来，拍掉手上的泥，走进镇子，去旅店那扇亮着橙光的窗户那边。", "ms": 3057.6, "narration": "河灯旅店在主街靠码头那头，走几分钟就到。进门米拉会招呼你——通铺 3 金，单间 8 金。", "refused": []}, {"id": "PL9·4b", "kind": "resolve", "input": "", "ms": 26360, "narration": "你从横档上下来，脚落回泥里，膝盖一顿。两只手心在裤腿上蹭了两下，泥络掉了一小半，剩下的嵌进指缝里，凉。\n栅门在你身后合上，守门人的棚子那边没有再响。\n主街是湿石板，中间被车辙压出两道浅沟，积着雨水。两边的铺子大多还没开板，只有一两扇窗里透出油灯的黄。\n雾在镇子里比镇外薄，贴着屋檐走。越往前，风里的鱼腥和盐味越重——码头就在这条街的尽头。\n河灯旅店的门上挂着一盏灯，玻璃罩蒙着烟，光是橙的。窗子上有水汽，里面有人影挪动。\n你推门。热气和麦酒味一起压过来，你脸上那层雾水立刻化开。\n屋里十来张桌子，早客只有三四个，一个瘦高的男人在角落吃粥。炉子在里侧烧得正红。\n柜台后面的女人抬头看你，围裙上有几处旧油渍。她把你从头看到脚，看到你手上的泥，眉毛动了一下，没说什么。\n「生面孔。」\n「通铺三金，单间八金。要哪样?」\n\n// 异地 · 罗文 @ 矿工大道:「门楼上这块翡翠原石……镇子拿它当招牌，我倒觉得它像块没切开的运气。」我朝石津驿道那头扫了一眼，雾里什么都看不清——正好，看不清才值得走一趟。 「公会那边该开…", "refused": []}, {"id": "PL9·5", "kind": "plan", "input": "通铺三金是吧？先给我留一个。我问你件事——北门雾里那片，以前有没有人说过那儿出过灯之类的东西？", "ms": 6923, "narration": "通铺三金，先记下，睡前付。北门那片的事你直接问她。", "refused": []}, {"id": "PL9·6a", "kind": "plan", "input": "那就通铺，先给我记上，回头付。北门雾里那片地，你刚听见我问了吧——有没有人说过那儿出过灯？给我句准话。", "ms": 3139.7, "narration": "通铺记上了。灯的事，让米拉自己跟你说。", "refused": []}, {"id": "PL9·6b", "kind": "resolve", "input": "", "ms": 28569, "narration": "米拉把手里那块抹布搭到肩上，从柜台下抽出一本油渍封皮的簿子，翻到后面一页，用炭条写下两个字。\n「记上了。三金，睡前结。」\n她把簿子塞回去，两只肘撑在柜面上，往炉子那边瞟了一眼，声音降下来。\n「北门出去是往风栈堡的路。那边的雾四十天不散，白天也看不清十步远，没人往那儿挂灯。」\n「要说光，不是北门，是再过去两里的苔墓。北门出去两里，岔路往东，一片老坟圈子，坟头上的苔有二指厚。」\n「夜里有人见过那儿有绿火,一团一团，飘着走，跟谁提着灯笼似的。镇上人管它叫『引路的』，见了不跟着走就没事。」\n「还有一句，是从码头那边传的——」她用手指关节磕了两下柜面，「苔墓里有个棺材会说话，愿意用秘密换血。」\n「这我没亲眼见。」\n她直起身，围裙上的油渍跟着动。\n「你要真惦记那条路，去公会找赫伦。 在尾上。\n你把它整个塞进嘴里。\n腥味先到，紧接着是沟底那股陈的、甜的、腐的味，从舌根一路顶到鼻子后面。你嚼第一下，牙咬破鱼肚，里面的东西是温的、烂的，一股水漫出来。\n喉咙自己收紧了。第二下没咬下去，鱼从嘴角滑出去，掉回沟里，溅起一小片浑水。\n你撑着膝盖，把胃里的酸全吐在石板上。手抖，眼睛有点花。\n风从河面吹上来，冷。\n\n// 异地 · 艾琳娜 @ 码头:码头到了——雾把桅杆都吞了半截，只剩绳索敲着木头的声音。我找了个正在收网的汉子，问他这镇子哪家缺人手，顺便打听一句：雾里失踪的那个，是码头上的谁。\n// 异地 · 罗文 @ 碧石镇:「公会门口那面委托板，先扫一遍——别人的麻烦里藏着我要的线索。」我抖掉肩上的雾水推门进去，顺手在吧台要了杯最便宜的麦酒，好让酒保愿意多聊两句。矿道第三层的异响…", "refused": []}]}, {"id": "N2", "title": "[委托与探索] N 长用例 · 继续打。(并入 PL15)", "category": "委托与探索", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "went_hunting": {"pass": false, "got": "T001/gate_north"}, "fought_with_dice": {"pass": false, "got": "fought=False dice=0"}, "every_beat_plan_or_resolve·PL15": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning·PL15": {"pass": true, "got": "none"}, "no_dice_while_planning·PL15": {"pass": true, "got": "none"}, "resolved_once": {"pass": true, "got": "['opening', 'plan', 'resolve', 'plan', 'plan', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'resolve', 'plan', 'plan', 'resolve'] by ['world:settled', 'player', '…"}, "job_taken": {"pass": true, "got": "[\"苔墓前的狼嚎\", \"雾中失踪者\"]"}}, "beats": [{"id": "N2·0", "kind": "opening", "input": "开始游戏", "ms": 1865, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "N2·1a", "kind": "plan", "input": "②，我去跟守门人说话，问他冒险者公会在哪儿。", "ms": 11963.2, "narration": "守门人往主街里指了指:「公会就在主街中段,挂牌子那栋,走五分钟。」\n艾琳娜:「不熟。我也是今早才到的，名字都还没在谁那儿落下过。」「既然都是找同一个地方，那就一起走吧——往主街那边，总能问出个方向。」\n公会就在主街中段,挂牌子那栋,走过去五分钟。你和艾琳娜一道过去。", "refused": []}, {"id": "N2·1b", "kind": "resolve", "input": "", "ms": 42679, "narration": "雾贴着路面走。你和艾琳娜沿主街往镇里去，两侧的窗户一扇扇亮起来，有人把夜里的柴灰泼在路当中。\n主街中段那栋房子比别处高半层，门楣上挂一块木牌，字被雨水泡得发白：冒险者公会。\n牌下垂着一根旧铃绳，推门时它晃了两下，响得干涩。\n屋里的暖比外面重。长桌后面坐着一个灰短须的男人，面前摊着一本厚册子，笔尖停在半行字上。\n他抬眼看你们，没有先开口。\n艾琳娜站在你侧后半步，手搭在自己包带上。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾天最适合听闲话——雾气里人说话都松。」我把领口拢紧，先绕去公会门口溜一眼委托板，再进酒馆找个靠炉子的位子，看看有没有人嘴里漏出深洞的事。", "refused": []}, {"id": "N2·2", "kind": "plan", "input": "先看墙上那块委托板——上面有没有讨伐野兽的委托？", "ms": 15440, "narration": "委托板钉在门左手边。管事的赫伦就在长桌后面坐着——这事直接问他最快。\n挂着的兽单只有一桩「苔墓前的狼嚎」，清三次遭遇，30 金加一瓶小药水——可它已经有人在做。还空着的是码头那单「雾中失踪者」，25 金。① 接码头 ② 问狼嚎能不能搭手 ③ 让赫伦再翻翻板子", "refused": []}, {"id": "N2·3", "kind": "plan", "input": "③，麻烦你再翻翻板子，还有别的讨伐野兽的委托吗？没有的话，这单狼嚎能不能让我跟接了的人搭个手？", "ms": 28631, "narration": "等一下，我翻翻公会的册子。\n赫伦:「兽单就狼嚎一桩，别的没有。」他把板子翻到底，空的。「这单已经有人接了——搭不搭手，得问接单的人。」\n艾琳娜:「不在我手上——我今早才踏进这道门，名字还没写进谁的本子里，哪来的单给我接。」「板上要是还有狼嚎，那就一起问赫伦能不能挂两个人；要是没有了，先让他把还剩下的活儿念一念。」\n赫伦:「狼嚎挂在别人名下，人这会儿不在镇上，搭手得当面谈。」板上只剩码头那单失踪案，25 金。你：① 接码头这单 ② 先找挂狼嚎的人问 ③ 让赫伦留板，先出门办别的", "refused": []}, {"id": "N2·4a", "kind": "plan", "input": "@dm 帮我问清楚挂狼嚎那单的人是谁、现在在哪、什么时候回来——这单我非要搭上不可；要是他今天不回镇，就先让赫伦把码头的失踪案念给我听。", "ms": 24932.7, "narration": "行，赫伦翻册子——你看一眼。\n赫伦:挂狼嚎的是个外乡人,走了三天没信,几时回说不准。码头那单——雾里失踪的人,找回遗物或线索,25 金。", "refused": []}, {"id": "N2·4b", "kind": "resolve", "input": "", "ms": 54500, "narration": "赫伦把册子往回翻了三页，指腹压住一行字。\n「挂狼嚎的是个外乡人，叫罗文。三天前出的镇，往北走的。」「他走前记了一笔，说去查'世界边缘'的旧话——几时回来，没写。」\n他把笔搁在砚台边上，从册子底下抽出另一张薄纸，墨还新。\n「那就先念码头这单。」「三天前的夜里，雾最重的那一场，码头值更的脚夫没回来。姓巩，四十上下，扛包的活计。」\n「家里人来过两回。要的是遗物，或者一句话——他在哪，往哪去了。」「二十五金，不赊不欠，交了东西才结。」\n艾琳娜往前半步，指尖搭在册子边角上，没翻页。\n赫伦看她一眼，又看你。\n「这单只挂一个人的名字。要挂两个也行——赏钱怎么分，你们自己定。」\n\n// 异地 · 罗文 @ 碧石镇:「先看板子，再听炉边的嘴——不急着报名，急着打听。」我把风帽抖了抖水汽，挤到公会门口那张委托板前扫了一圈：矿道、翡翠、草药，全是地面上的活儿。没有一条写着「洞…", "refused": []}, {"id": "N2·5a", "kind": "plan", "input": "那就挂两个名字，赏金平分——我要的是找野兽动手，不是下矿采药，码头这单能追线索就接。不过你刚提了个罗文，就是挂狼嚎那单的人吧？他往北去查「世界边缘」的旧话——他走哪条路、大概几天回得来，你知道吗？", "ms": 22394.1, "narration": "罗文的去向得看册子。分钱这头，先问艾琳娜认不认。\n艾琳娜:「挂两个名字、对半分，我认。」「把话说在前头：我擅长读人留下的东西——血迹、脚印、最后那一班他走过哪条路。追凶的部分交给你，查线索的细活交给我。」\n赫伦:「往北就一条驿路，出北门。走哪条岔、几天回，他都没写——三天了，没信。」艾琳娜认了挂名平分，说你追人她读线索。", "refused": []}, {"id": "N2·5b", "kind": "resolve", "input": "", "ms": 74176, "narration": "赫伦另抽一张薄纸做凭据，是双份的格式。他蘸墨，先写你的名——笔尖在纸上顿了半拍，「旅人」两个字落下去——再写艾琳娜·维尔。写完把笔推给你们。\n艾琳娜按了手印，指腹蹭了一下印泥，没多话。\n「凭据一张，你们自己收。交了东西回来结，二十五金，对半分。」赫伦把纸对折递出来。「失踪的姓巩，值更的地段在码头最东那排桩子边上。家属住主街西头，姓巩的院门有块磨盘。」\n你问罗文。他翻回前面那一页，指腹在行间划了两下。\n「往北，出北门，就那一条驿路。」「再往哪拐，他没写。三天了，没信。要搭他的狼嚎，得等他回来，或者你自己走到他前头去。」\n艾琳娜把凭据折好收进斗篷内袋，站直了，朝门口那边看了一眼。\n「码头的现场，雾一散就不好读了。趁现在。」\n\n// 异地 · 罗文 @ 碧石镇:「公会板子上写得比唱得还好听——矿道、翡翠、月见草。」我弹了弹板子，转身倚住门框，冲门边那个刚填完表的矿工笑：「老兄，第三层什么动静能把你们吓得整队停工？说两…", "refused": []}, {"id": "N2·6a", "kind": "plan", "input": "那就走，趁雾没散先去码头最东那排桩子看巩失踪的现场——路上顺便说说，你觉得这事跟北边那桩狼嚎会不会是一回事。", "ms": 6822.1, "narration": "码头就在镇子下面，走到最东那排桩子几分钟，不花钱。你那句话我先递给她。", "refused": []}, {"id": "N2·6b", "kind": "resolve", "input": "", "ms": 46154, "narration": "雾没散。从公会到码头这段路不远，木阶往下，鞋底踩在湿木上有点滑。\n你那句话没处递——艾琳娜留在公会那边，没跟着下来。\n码头朝河面伸出去。雾贴着水皮，看不见对岸。最东那排桩子在最末，十来根黑桩，桩头绳圈松着，两根歪向水面。\n值更的位子就在桩子边上：一只翻扣的木凳，凳脚烂了一根；凳下压着一小截灯芯，烧到了头；铁钩挂在最近的桩上，钩尖朝外。\n泥地踩得乱。昨夜的雾水没干，脚窝浅的深的叠在一起。\n他蹲下去，手背贴地。雾里水底闷响了一声，又没了。\n泥里留下的东西比他预想的多。\n灯芯是烧到头才灭的,不是风刮的——油见了底。\n翻扣的木凳底下压着半截绳头,断口齐,是刀切的,不是磨断的。他把凳子挪开。底下的泥面比四周低一块,像有重物在这儿压过,又被拖走。\n拖痕朝东,沿着水边的碎石走,出了那排桩子就淡下去了。\n碎石上有东西。不是靴印。前宽后窄,三个趾头,掌是平的,比人的脚大一圈,不见爪。印子踩得很深,是带着分量的。\n最近的桩上那只铁钩还挂着,钩尖朝外,钩身绕着一小缕布,灰蓝色,湿得贴在铁上,没结霜。\n他站起来。水声压着风声,雾没要散的意思。\n\n// 异地 · 艾琳娜 @ 冒险者公会:我把凭据折好塞进内袋，指尖压了压。「主街西头那家我熟路数——先问人还是先看桩子，你说一句，我就动。」\n// 异地 · 罗文 @ 碧石镇:「不说是吧？行——热汤我自己喝，你那份先记账。」我把两枚铜币弹到门房桌上，往酒馆后头挪，挑了张正对炉子、也正对门的位子坐下。等热汤上来，我随口问端碗的：「第三…", "refused": []}, {"id": "N2·7a", "kind": "plan", "input": "先把钩上那缕灰蓝布取下来收好——那不是人手撕的，留着有用；然后我顺着拖痕往东走，看看这印子还新不新、一直通到哪去，真要是头带分量的家伙，我今天就得追上它。", "ms": 6939.7, "narration": "布收进怀里，你顺着拖痕往东，看它通到哪儿。\n灰蓝布取下来收好，不费事。拖痕出了那排桩子就淡，雾里要辨新旧、辨走向，得掷一下：INT，普通难度。", "refused": []}, {"id": "N2·7b", "kind": "resolve", "input": "", "ms": 33807, "narration": "[旅人 INT(追出拖痕的走向与印子新旧): 10+0=10 < 12] → 失败\n\n布从钩上剥下来，湿的，凉，攥在手心里只有一小团。他塞进怀里，贴着胸口。\n拖痕从桩子那儿朝东去，沿着水边的碎石。他跟着走。\n走了二十来步，痕就淡了。碎石缝里断断续续，一段有，一段没。雾贴在水皮上，白得发腻。他蹲下，手贴地，摸到一处凹——再往前，什么也没有。石头是干的，草根是干的，脚底下干净得像没人来过。\n他退回去重新看。痕的方向没变过，一直是朝东，贴着水走。可出了这片碎石，就再找不到它接上哪儿。水声闷在雾里，听不出远近。\n他直起身，往东看。雾里什么也没有，看不见河湾，看不见停船，看不见东边那一头是什么。\n怀里的布还湿着。他把布角翻出来看了一眼：毛边，抽了丝，是织出来的，不是撕下来的。除此之外看不出什么。\n\n// 异地 · 艾琳娜 @ 主街:「先去西头那家。」我把凭据按进内袋，朝赫伦点了下头便往主街走。 「先听他家里人最后一晚说了什么——雾里的痕迹留不住，人的话留得住。」\n// 异地 · 罗文 @ 碧石镇:热汤还没上桌，我先拿勺背敲了敲碗沿，眼睛顺着酒馆扫一圈——谁的手上有第三层的泥，谁就一直盯着门看。「端碗的，」我压低嗓子，「别装忙了，就说一句：最近谁从第三层…", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "回镇里问码头早班的脚夫——雾里追痕追丢了，得先弄清巩最后一晚上到底在值什么班、见没见到东西往东去；@艾琳娜 你那边主街问完，回来咱们对一对。", "ms": 17175.4, "narration": "码头这会儿人不多。早班的脚夫一般聚在主街口等活。你要回镇里找他们，还是在这儿再找找痕迹？\n码头这会儿空着，早班脚夫都在主街口等活。走十分钟回镇上，顺道看看艾琳娜回主街没有。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 47916, "narration": "从码头回主街，木阶往上，雾松了些，能看清十来步。\n主街口那截路面上聚着七八个人，肩上搭着麻绳或空扁担，蹲着的站着的，等早班的活。他们把话压得低，可还是听得见。\n你走过去，问巩——码头值更的那个姓巩的，三夜前那班。\n一个蹲着的汉子把扁担往地上一杵，没立刻答。旁边一个年长些的抬眼打量你，从鞋看到腰上的短剑。\n「巩？他上的是后半夜。桩子那边就他一个人，前半夜是老陈，十一点换的。」\n「那天雾大。后半夜我在街口等船,没听见码头有什么动静。」年轻那个插了一句,「就听见水响。」\n年长的把话头接过去:「他换班往家走,该过这条街。那天没人看见他过。」\n「他家里人第二天早上来问过,公会给挂了张单子。」\n你还要再问,主街西头来了个人。艾琳娜从雾里走出来，斗篷下摆沾着泥，看见这堆人里的你，站住了。\n\n// 异地 · 艾琳娜 @ 主街:「磨盘门槛——就这条街往西数。」我把领口拢紧些，雾里挨家看院门。 见着人就问一句：巩家是不是这儿，他值更最后一晚回家时说过什么。\n// 异地 · 罗文 @ 碧石镇:热汤终于端上来，我没急着喝，先把碗推到桌子中间，让热气正好挡在我们俩中间。「别急着走，」我冲那端碗的抬了抬下巴，「就一句：最近谁从第三层活着回来过？说完了这碗…", "refused": []}, {"id": "N2·9a", "kind": "plan", "input": "（等艾琳娜走近）你先说，巩家那边他最后一晚说了什么——我这边追到碎石滩就断了，拖痕一直朝东贴着水走。@艾琳娜 对了，还有这个：桩子铁钩上刮着一缕灰蓝的织布，不是撕下来的，你眼尖，看是不是谁的号衣料子。", "ms": 32152.3, "narration": "巩家那边和你手上这缕布，都听艾琳娜先答。霍四、阿栗就在旁边听着。\n艾琳娜:「巩家那边只有一句有用：他出门前说去最东那排桩子看水，还提了句'雾里有人叫号子'——家里当他糊涂话听。」「这缕灰蓝不是撕的，是蹭下来的，线粗、上过浆、泡过水，是干粗活穿的号衣料子，不是帆布。」「霍四，你们码头值更穿的是不是这色？是的话我这拍就回东排桩子再刮一遍，拿回来跟你身上缺线的那件对一对。」\n霍四:「值更的号衣就是这灰蓝，浆过的。可码头一半人都穿这色。」艾琳娜想现在回东排桩子再刮一遍，跟霍四身上的对一对。", "refused": []}, {"id": "N2·9b", "kind": "resolve", "input": "", "ms": 82932, "narration": "艾琳娜没再多说。她把袖口拢了拢，转身往东，顺石阶下码头去了。\n脚印在雾里很快淡到只剩一道。\n霍四拄回扁担。\n「旧号衣码头有，镇署收的；新的一批锁在镇署库房。要取要刮，得有个名目。」\n阿栗挑起扁担，朝你点了下头，往等活的人群里去了。\n主街口这堆人很快散开，各自接了活。\n镇上又安静下来。雾贴着石板，湿气从鞋底往上爬。\n东边是码头。西边，巩家的院墙在雾里露出个角，门口压着那块磨盘。\n\n// 异地 · 罗文 @ 碧石镇:「铜板就搁碗边上，」我把手按在碗沿上，让热气从我指缝里冒出来，「不白拿你的——你只要说个名字。第三层那事公会板上写着六十金，总有人得先下去，我宁可跟知道路的人…", "refused": []}, {"id": "N2·10a", "kind": "plan", "input": "巩家的失踪我帮不上——号衣和桩子你们自己查，我要问的是另一桩。@dm 我现在回冒险者公会，直接问柜台：北边那伙狼嚎有没有挂讨伐委托；有就给我接，没有就告诉我是谁接了，我跟他们一起去。", "ms": 5152.7, "narration": "公会就在主街那头，几步路。你去柜台问北边狼嚎的讨伐委托——有就接；没有就问清谁接了、你跟着去。\n回公会说一声就行，走过去一刻钟。柜台答不答、委托挂没挂，得当面问。", "refused": []}, {"id": "N2·10b", "kind": "resolve", "input": "", "ms": 30679, "narration": "[旅人 CHA(向赫伦问出委托底细): 2+0=2 < 12] → 失败\n\n公会大厅冷，炉子只烧到半暖。柜台上摊着册子和几枚印。\n赫伦在柜台后，正把一张完签的单子按进册缝里。你走到柜前，问北边那伙狼嚎的讨伐委托。\n他没立刻抬头。等把印压完，才抬起眼看你。\n「苔墓小径的那张，早从板上摘了。」\n「摘了就是有人接了。承接人不是公会派给谁，是有人自己来签的。」\n你追问是谁，要跟去。\n赫伦把手从册子上收回去。「签的是私单，条款里有一条：不列承接人名字，除非他自己点头。」\n「我不能替你牵这个线。你也不是本镇的登记人，我这儿没你的名。」\n他把册子合上，压住。\n「要找同路的人，去旅店问米拉，去码头问脚夫。别人嘴里的话，公会管不着。」\n\n// 异地 · 艾琳娜 @ 主街:「最东排桩子——就是这根。」我蹲下去，拿刀背把铁钩弯里那点灰蓝重新刮进纸角，卷紧塞回内袋，指腹捻了捻，还是那个上过浆的粗线。 起身时我朝码头那边喊了一声：「霍…\n// 异地 · 罗文 @ 碧石镇:铜板压在碗边没人拿，我也没催——酒馆里静得能听见炉子里的柴在响，那我就等。等谁先坐不住。 「靠门的两位，袖口那青灰泥还没干呢，」我舀了口汤，慢慢咽下去，「第三…", "refused": []}, {"id": "N2·11", "kind": "plan", "input": "赫伦，私单归私单——你只告诉我一件事：那张委托挂到板上的时候写的是清三回，对吧？那么签的人有没有说自己一个人去？@dm 不要名字，我就问这一句。", "ms": 15505, "narration": "「板上就写清三回，没写几个人。他没说带人，也没说一个人。」他翻回一行：「登记留了句——三日前出镇往北，归期没写。」", "refused": []}, {"id": "N2·12a", "kind": "plan", "input": "赫伦，那你忙。@dm 我这就出镇往北，走苔墓小径；路上若见着承接那单的人，就搭个伙，一起找那伙狼嚎动手。", "ms": 6125.9, "narration": "你这就出镇往北，沿苔墓小径走，路上留意有没有承接那单的人。", "refused": []}, {"id": "N2·12b", "kind": "resolve", "input": "", "ms": 31252, "narration": "你把册子的事留在公会，出了门。主街的风比屋里冷，雾还没散。\n穿过主街往北，路面从石板换成了碎石，石子缝里长着黑苔。北门开着半扇。\n门边没有守兵，只有一块重新刷过的告示板，上面贴着旧年头的悬赏，纸边卷了。\n出了门，雾更厚。路只有一条，往北偏西，两旁是低矮的荒草垛和倒下的界桩。\n你走了约一顿饭的工夫，路开始往上爬，脚下渐渐湿了——这就是苔墓小径。\n路面上有 苇的声音不响，但很清楚。他站了起来。影子矮下去，弯成一团，像是抓住了什么。\n\n// 异地 · 罗文 @ 碧石镇:「老板，一碗热汤，多加盐——这种雾天，喉咙比靴子先冷。」我端着碗挑了公会门口那张能同时看见板子和门的桌子，眼睛先扫赏金榜：矿道第三层那单标着阶二，六十金加未切…", "refused": []}, {"id": "PL6·2", "kind": "plan", "input": "我推门进去，斜靠门框挡着雾光，冲老苇点点头：「老掌柜，这丫头是我带的，手脚笨，砸了您的油我赔——她要的灯油呢？」说完眼睛盯死艾琳娜，下巴朝柜台那边偏了一下。", "ms": 23170, "narration": "先弄清她手里攥的是谁的东西,再谈油钱。\n艾琳娜:「我伸的是灯油罐子，不是秤盘底下——罐子滑了，是我手笨，砸碎的油我认。」我把手从柜台那边收回来，摊开，掌心朝上给老苇看，然后转向旅人：「不过你替我认赔之前，先听我把话说完。」\n老苇没接话，铜秤往柜台上一磕。「灯油罐在架子上，离秤盘两步远。你手背朝下压着秤盘，那叫滑了?」", "refused": []}, {"id": "PL6·3", "kind": "plan", "input": "「油钱多少我付，砸坏的罐子也算我的。」我把铜板搁在柜台角上，转身出了门，在雾里等艾琳娜跟出来，压低嗓子：「你差点把我俩都搭进去。听着——我不再踏进那门，你自己等老苇进后屋，或者换别的时候进去，天黑前把那袋钱拿出来。拿不出来，你就自己留在这镇上。」", "ms": 16070, "narration": "雾里这话，艾琳娜得回你。先看清楚铺子里到底有没有那袋钱。\n艾琳娜:「我不替你偷一个我刚砸了油罐的人——我回去是还那罐油，用活儿抵，不是帮你摸人家钱袋。」「你要我冒这个险，先把那袋钱、那个后屋、还有我凭什么信你说清楚。天黑前我先给自己挣个落脚的地方，不是先给你当贼。」\n艾琳娜不干这活:她不偷老苇的钱袋,只肯回去认下油罐、用活儿抵账,先把今晚的落脚谈下来。你的最后通牒她接不接——你定:① 各走各的 ② 陪她回去认账换活儿 ③ 再逼她一次", "refused": []}, {"id": "PL6·4", "kind": "plan", "input": "钱袋就在老苇那杆铜秤底下的抽屉里，后屋门在柜台右手边——你砸油罐那会儿，两样你眼睛都扫过。这一路是谁把你从雾里捞出来的，你心里有数。我要的就这么一件：天黑前办成，我还在北门那边等你；办不成，那罐油的账你自己还，路你自己走。", "ms": 19170, "narration": "油钱你付了，钱袋这事她一直没松口。问她一句：到底办不办。\n艾琳娜:「不办——你从雾里捞我，这份我记着，可这罐油是我自己手滑砸的，账我自己还，路我自己走。」（转身，对着柜台里站起来的老苇，手摊开、掌心朝上）「老掌柜，油是我砸的，不赖别人。我赔——扫货、搬盐、挑水、缝袋子都行，你开个价，拿工抵。」\n她转身回了杂货铺，要拿活儿抵那罐油——你撂下的话她当面拒了。你：① 跟进去 ② 就此走开 ③ 在门口等她", "refused": []}, {"id": "PL6·5a", "kind": "plan", "input": "@dm 我在街对面那口接雨水的木桶边上等到杂货铺打烊，她出来的时候把她堵在檐下——这回不白使唤她，钱袋对半分，她拿多的那半；她今晚本就在柜台跟前进进出出，端着盐罐钥匙串儿，比我方便一百倍。就问她一句，天黑透了、老苇回后屋之后，办不办。", "ms": 9703.5, "narration": "你在木桶边一直等到铺子打烊，把她堵在檐下。对半分，她拿多的那份——办不办，就这一句。\n你等到铺子上板，把她堵在檐下，价码也开了。成不成看她松不松口——掷一下：你的 CHA 对她的 CHA。", "refused": []}, {"id": "PL6·5b", "kind": "resolve", "input": "", "ms": 53197, "narration": "[旅人 CHA 对 艾琳娜(说动她天黑后去动老苇的钱袋): 16+0=16 >= 2] → 成功\n\n她没答话。檐水一滴一滴，砸在你脚边的石板上。\n等她开口，声音比雾还低，领口拢得紧紧的。\n「对半，我拿多的那份——这话是你自己说的，我记住了。」\n「丑话搁前头。这是我替你还那罐油、还雾里那一把的最后一桩。成了，你我两清，往后别再拿这件事叫我一回。」\n「第二，天黑透了你就别挨着铺子。老苇记脸，他记死的是你那张。」\n她推门回去，木门在身后合上，插销落定。\n白天就这么过去。雾散了又聚，日头只在云缝里亮了一小会儿。你在镇上转了几圈，把北门到码头那条路认了一遍。她隔着窗在货架和柜 t": "@赫伦，今晚当真一刻都不行？哪怕你关完公会晚点来，我在河灯旅店坐到打烊——你给个准话，来还是不来。活我也接，先给我雾中失踪者那件。", "ms": 12072.7, "narration": "赫伦:「来不了——公会关门前还有账要理，我不撒谎。」雾中失踪者那件他翻册子给你登记。你先看看委托细节。\n赫伦:「登上了，记你名下——码头区雾里失踪的人，找回遗物或线索，交接完领 25 金。」他合上本子:「今晚不用再问了，不来。」", "refused": []}, {"id": "PL13·4b", "kind": "resolve", "input": "", "ms": 34609, "narration": "赫伦翻开册子,在Q001那行的边上写下你的特征:短剑、旧皮甲、北方口音、不记得名字。\n「失踪的是码头一个挑夫,叫科温。三天前夜里没回窝棚,一块儿干活的人说他往雾里走了一段，再没回来。家属不要尸首，要东西——哪怕是一只鞋、一根绳结。」他用笔杆点了点你，「找着线索回来交接，二十五金入你名下。拿不回来，白跑一趟，不罚你。」\n他把册子合上，压进柜台下的抽屉，锁了一道。\n「再提醒一句，码头区雾大的时候别往里钻。这条街上每年都要少一两个人，没人替他们数。」\n他从墙上撕下一截细绳，绕了两圈系在你腕上——公会的记号绳，绳结是现打的。\n「认这个就行。今晚我还是不来。」\n你出了公会。雾比早上薄了一层，但街面上还是湿的，脚踩在石板上没声。主街往南一段就到码头，往西是集市广场和河灯旅店。腕上的绳结勒得有点紧。\n\n// 异地 · 艾琳娜 @ 北门:「守门的大哥，我不白问——码头失踪的那个，和苔墓小径上的狼嚎，是同一阵雾里出的事吗?」我把肩上湿透的斗篷拢紧了些，等他答话，也在看他的眼睛。\n// 异地 · 罗文 @ 碧石镇:老板把那碗热汤放下来，顺手用抹布蹭着桌子不说话——那种「你问对了但我不想答」的不说话。「行，那我换个问法：这几天有谁从北边下来，鞋上还挂着白霜的？」", "refused": []}, {"id": "PL13·5", "kind": "plan", "input": "@赫伦，我不白约——账我帮你理，墙上那些旧纸条我帮你抄，保证你天黑前收摊。你理完账，顺路拐进河灯旅店喝一杯，就当给新人一个面子，成不成？", "ms": 13663, "narration": "你人已经出了公会，赫伦还在柜台后头——这事得回身推门才谈得上。腕上的记号绳还系着。① 回公会跟他把话说完 ② 先去码头或旅店", "refused": []}, {"id": "PL13·6a", "kind": "plan", "input": "@赫伦，我回来说最后一句：账我帮你理，墙上那些旧纸条我帮你抄，酒你不用陪——收摊后顺路拐进河灯旅店坐一刻钟就成。行还是不行，你给个准话。", "ms": 9475.1, "narration": "你回身推门进公会，把条件摆给赫伦：账你理、旧纸条你抄，他收摊后到河灯旅店坐一刻钟。\n赫伦这人重契约，嘴上人情不顶用——成不成，就看你这句话怎么说进他心里。掷一下 CHA。", "refused": []}, {"id": "PL13·6b", "kind": "resolve", "input": "", "ms": 27914, "narration": "[旅人 CHA(说动赫伦收摊后去河灯旅店坐一刻钟): 3+0=3 < 12] → 失败\n\n你回到公会柜台前，话摆得很实：账你理、旧纸条你抄，他收摊后去河灯旅店坐一刻钟就成。赫伦没急着答，先把算盘珠子拨了一颗，才抬头。\n赫伦:「好意我领。可我不去——不是给你面子的事，是我收了摊就得回屋，账房、码头账、明天的货单，一样都离不开人。」\n他指节敲了敲柜台：「账房上有规矩，外人不碰。纸条也一样，那是契据底子，抄坏一张我赔不起。」\n赫伦:「你要真想把话说到人前，去河灯旅店找米拉。她那里人多，酒也热。我不来，你也别等。」\n他把算盘推回原位，低头接着对账，不再看你。\n\n// 异地 · 艾琳娜 @ 主街:「码头和苔墓——离着两条路，却是同一阵雾里的事，这话我记下了。」我把斗篷帽檐往上推了推，让他看清我的脸，「我要是真从苔墓那边带回点什么，先来北门告诉你一声，不…\n// 异地 · 罗文 @ 西门:「（把铜板压在碗底，汤喝完）不说也行——我不逼人。不过你这炉子边上最近是不是空了一把椅子？北边下来的人，总得有人认得他的靴子。」 老板要是还当我是聋子，那我就…", "refused": []}, {"id": "PL13·7a", "kind": "plan", "input": "那我不缠你了。@dm 我把腕绳收紧，转身去河灯旅店——先找米拉，订个靠里的位子，顺便问她：赫伦收摊后真的一次都不来？要是她也没法子，我就坐到打烊。", "ms": 1885.8, "narration": "你不缠赫伦了，收好腕绳去河灯旅店，订个靠里的位子，问米拉：赫伦收摊后到底来不来。她说没法子，你就坐到打烊。", "refused": []}, {"id": "PL13·7b", "kind": "resolve", "input": "", "ms": 58084, "narration": "你收好腕绳，出公会，沿着主街往河灯旅店走。雾比早上薄了，石子缝里还是往外渗凉气。\n旅店门口挂着两盏河灯，玻璃罩上结满水珠。推门进去，炉火的热气贴上来，混着麦酒和湿木头味。\n米拉在柜台后擦杯子，抬眼看了你一下。\n「靠里的位子？那张，没人。」\n你过去把腕绳搁在桌角，回身问：赫伦收摊后真的一次都不来。\n米拉放下杯子，手在围裙上抹了抹。\n「一次都不来。」\n「他收摊就回后街的屋子，灯点到半夜。不喝酒，不欠人情，也不让人欠他的。回家也不走这条街——你等到打烊也是白等。」\n她隔着柜台看你。\n「不过，公会账房缺手。他那个学徒半个月前走了，三摞账压在他一个人身上。」\n「去年有个外人抄坏一张契据，赔了四个月工钱。他就再不让外人碰了。」\n「你要真想揽，别当面说。写下来：只碰墙上那些旧纸条，按件算钱，抄坏一张赔一张。明天开门前塞公会门缝。他看字不看人。」\n你坐到里侧那张靠墙的桌子。傍晚人渐渐多起来，码头下来的、赶车的，围着炉子说雾和苔墓。\n打烊时分，赫伦没有出现。\n米拉一盏一盏吹灭灯，最后剩柜台上那盏。\n「后间还有通铺，三金一晚。要吗？」\n\n// 异地 · 艾琳娜 @ 冒险者公会:雾里的答案就这么多，再问也是白费脚力。手上两份委托得先在公会挂上名，顺路记下河灯旅店一晚上的价钱——今晚总得有块干的地方睡。\n// 异地 · 罗文 @ 矿工大道:（手插在兜里，从西门往里走，路过门楼那块翡翠原石时抬头扫了一眼——镇标刻得漂亮，可惜不卖钱）「先看赏金榜，再找那帮鞋上带霜的。」 （雾里没什么人，正好没人问我…", "refused": []}, {"id": "PL13·8", "kind": "plan", "input": "通铺要一张。不过先告诉我赫伦后街那屋子怎么走——我去门口把话问完，他若还是不来，我就回来睡。", "ms": 8837, "narration": "米拉:「后街，公会再往北两条巷，蓝布帘那家，灯点到半夜。」「敲了也不开——你:① 现在就去 ② 先睡下，天亮塞字条。通铺三金。」", "refused": []}, {"id": "PL13·9a", "kind": "plan", "input": "继续。", "ms": 7613.1, "narration": "那就这样:三金通铺先定下，你把剑搁屋里，这就去后街、公会往北两条巷，蓝布帘那家敲门。\n通铺三金记下。出门往北两条巷，蓝布帘那家，敲门——掷一下 CHA，看他肯不肯应声。", "refused": []}, {"id": "PL13·9b", "kind": "resolve", "input": "", "ms": 35086, "narration": "[旅人 CHA(敲门后让赫伦应声搭话): 10+0=10 < 12] → 失败\n\n后街没有灯。从公会的侧墙拐进去两条巷，窄得只容一人，墙根积着水，鞋底踩出一串轻响。\n蓝布帘那家在最里头。帘子旧了，边上磨出毛；帘后透出一线黄光。\n你敲门，三下，不轻不重。\n里面没有动静。\n你又敲了两下。灯影晃了晃，挪到门边，停住。没有应声，也没有开。\n你站在门外等。雾从巷口漫进来，贴着裤脚往上爬。那点黄光一直亮着，就是不说话。\n脚底凉透了。你转身往回走。\n河灯旅店的后间是通铺，三金。屋里还有两个赶车的，一个打着鼾，一个翻身朝着墙。你把剑搁在床头，吹灯睡下。\n夜里没别的动静。\n早上七下钟响的时候，窗上还压着雾，只是淡了些。楼下米拉在添炉子。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦先生——我赶在开门前到的，不做无用功：Q001 码头失踪者的遗物线索，Q002 苔墓小径那三趟，两份都写我艾琳娜的名字。」 「报酬照板上印的来，我认字也…\n// 异地 · 罗文 @ 冒险者公会（碧石分部）:（在杂货铺门口停半拍，看了看自己靴帮上那点白霜——有意思，从北边下来的人应该也是这个味道。）「公会那边的赏金榜会说话，那就先听它说。」 （拐上台阶，推开公会那…", "refused": []}, {"id": "PL13·10a", "kind": "plan", "input": "按米拉说的来——我这就写张字条：公会墙上那些旧纸条，我按件算钱抄，抄坏一张赔一张，别 们嘴里那些说不清的第三层响动。", "refused": []}, {"id": "C1·2a", "kind": "plan", "input": "不松手。我侧身让她那一下压在空处，脚下一转，剑贴着石板横扫过去——摊架后面缩着的那几个，一起撂倒，别漏。", "ms": 22042.2, "narration": "短剑扫向摊架后缩着的那几个人。艾琳娜的剑还抵在你肋侧，镇署的人从主街口过来了，脚步声越来越近。这一下扫不扫得成、她拦不拦你，得看她怎么说。\n艾琳娜:「我数到一——手放开，不然我这一剑就直接穿进去。」「老蒲！往摊架底下挪！两个大姐，拖他进去！」\n你这一剑扫向摊架后那几个人；她数到一，就从肋侧把剑送上来。两下同时，镇署的人已经进了广场。\n艾琳娜的手没退——你不松手，她就往肋侧顶进去。要一口气扫倒那几个，掷 STR；她拦不拦得住你，对抗 DEX。", "refused": []}, {"id": "C1·2b", "kind": "resolve", "input": "", "ms": 48748, "narration": "[旅人 STR(扫倒摊架后缩着的人): 5+0=5 < 12] → 失败\n[旅人 DEX 对 艾琳娜(她能否压住你这一剑): 7+2=9 >= 8] → 成功\n\n短剑贴着石板横扫过去。\n刃口先咬进摊架的支柱,木屑和湿布一起翻起来。蜷在下面的两个被旁边的人连拖带拽拉进车底,你这一记从他们脚边擦过去,钉进横木里,卡住了。\n你往回拽剑,手上的力道把石板上的水搅开,鲱鱼和血一起淌到低处。鱼腥味压不住铁味。\n艾琳娜的剑从肋侧送上来。\n你侧身的那一下把她的剑尖带偏,刃口从旧皮甲的接缝上滑过去,只划开一道浅口。她整个人顺势压上来——你重心一沉,脚跟抵着石板滑开半步,她的肩撞了个空,跪伏在湿地上。\n主街口到了三个巡丁,短矛、火把,分开站在摊架两侧,没立刻扑进来。\n「都别再动!中间那个——剑扔地上,手举起来。」\n艾琳娜撑着半边身子起来,喘着气,手里的剑没松。\n「他杀了老蒲。」\n摊架底下有人应了一声,说那老头还压在车下。雾贴着脚面往回升。\n\n// 异地 · 罗文 @ 碧石镇:「冷雾裹着矿尘味，正好把话都闷在屋里。」我把兜帽压低，顺着矿工们下班的脚印拐进公会那扇半掩的门——先看告示板，再听谁在柜台前压着嗓子说话。", "refused": []}, {"id": "C1·3", "kind": "plan", "input": "③，我不扔剑也不跑——我扑向最近那个巡丁，一剑横扫，把艾琳娜和还留在广场上的人一并砍翻，别漏。", "ms": 16404, "narration": "你没扔剑，也没退——转身朝最近那个巡丁扑上去，一剑横着扫出去，把艾琳娜和广场上还站着的人一起圈进刃里。\n艾琳娜:「我不是跟他一伙的——他往巡丁身上扑，我先把他撂了！」「按住他左边！他剑卡过摊架，回手慢！」\n艾琳娜不想跟你打，她要先把你按倒交给巡丁。你:① 照砍 ② 收手让她按住 ③ 冲巡丁一个，回头再对她", "refused": []}]}, {"id": "FILTH", "title": "[物品与开放 schema] 吃脏东西 · 我从水沟里捞起一条烂鱼,整条吃了下去。", "category": "物品与开放 schema", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "bad_status_or_hp_or_ruled": {"pass": false, "got": "hp 24→24 status [] ruling=none"}}, "beats": [{"id": "FILTH·0", "kind": "opening", "input": "开始游戏", "ms": 1593, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自 ": "我朝艾琳娜点点头，没多寒暄，直接推开公会半掩的木门走进去，找到柜台后的人问：「有没有讨伐野兽的委托？我想接。」", "ms": 15514, "narration": "柜台后那位是赫伦。公会挂着什么活、什么价，我先看他们自己怎么写。\n艾琳娜:「讨伐野兽——算我一个。我手上有治伤的本事，配个前排队友不吃亏。柜台这位，同一种委托能登记两个人吗？」\n赫伦:「还没到九点。」他指指委托板:「狼嚎那单昨天就有人接了,挂着进行中。现在只剩码头那单——找失踪者的遗物,二十五金;你俩一起登记也行。」", "refused": []}, {"id": "N2·3", "kind": "plan", "input": "码头那单先放着——狼嚎那单是谁接的？人现在在哪，我去找他搭个伙。", "ms": 18422, "narration": "我问问柜台。狼嚎那单是谁领的，公会总该有登记。\n赫伦:「板上只写『进行中』，没记名字——公会只认交付。」想知道是谁领的，码头和旅店的消息更灵。\n艾琳娜:「先找。找不着就接码头那单——我等不起，兜里没几个铜板，空一天就是亏一天。」「不过要找人就快点问清楚：那人是住镇上，还是已经出镇了？要是出了镇，今天追不追得上。」\n公会这边问不出领单人的名字。要找，旅店米拉或码头的人都比赫伦清楚；不然就先接码头那单。你定：① 去旅店打听 ② 去码头打听 ③ 直接登记码头单", "refused": []}, {"id": "N2·4", "kind": "plan", "input": "继续。", "ms": 6088, "narration": "板上没名字,要打听只能去旅店问米拉、或到码头问人。艾琳娜说先找,找不着就接码头那单。要不就这么办——你先奔哪儿?", "refused": []}, {"id": "N2·5", "kind": "plan", "input": "①，我去旅店找米拉，问清楚狼嚎那单是谁领的、人还在不在镇上。要是她也说不出来，我再想别的办法。", "ms": 16084, "narration": "旅店这边米拉嘴最碎，公会登记簿上没名字，兴许她记得谁领的。\n米拉:「领单的是个外乡人,住了一晚,天没亮就出北门往苔墓小径去了——名字没登记。」追,还是先接码头那单?你定。", "refused": []}, {"id": "N2·6a", "kind": "plan", "input": "追。@dm 我和艾琳娜现在就从北门出发，顺苔墓小径去追那个领了狼嚎单的外乡人。", "ms": 6183.1, "narration": "那就这么办:从北门出去,沿苔墓小径追那个领了狼嚎单的外乡人。\n说定了:你和艾琳娜出北门,顺苔墓小径追那个天没亮就走的外乡人。先掷一次追踪。", "refused": []}, {"id": "N2·6b", "kind": "resolve", "input": "", "ms": 32207, "narration": "[旅人 INT(在雾里的小径上辨认外乡人的去向): 8+0=8 < 15] → 失败\n\n主街走到头,石板缝里结着白霜。北门的门轴一声长响,只开了一半。\n守门的披着旧毡子,呵出一口白气:「这个点出北门?雾天里苔墓那边不安生。」\n出了门,镇子的墙很快被雾吞掉。苔墓小径在草坡间往北弯,越走越窄,两侧的矮灌上挂着水珠。\n头两里你还看得清路面。泥被夜雾泡软了,脚印、车辙、牲口蹄子印一层压一层。\n你蹲下去,用指节拨开浮泥。没有一处印子是新的——或者说,处处都像新的。\n艾琳娜也蹲下来看了会儿,手按在膝上,没说话。\n「出镇的人是走的这条路,这点错不了。」\n「可这一路印子太多。运草的、赶牲口的、前些天进墓的——哪个是今天早上那个,我看不出来。」\n她站起来拍了拍手,往雾里看了一眼。风从墓地方向吹过来,带着湿土和苔的气味。远处有只鸦叫了一声,又没了声。\n\n// 异地 · 罗文 @ 碧石镇:「六十金的矿道异响，写得跟真有人死在里面似的——可越是没人肯细说的东西，越值得多看两眼。」我没急着撕委托单，先侧着耳朵听旁边那桌矿工怎么骂「第三层」。 「要是…", "refused": []}, {"id": "N2·7", "kind": "plan", "input": "艾琳娜，这一路印子太杂了，你能看出今早那个外乡人往哪个方向拐的吗？雾里再瞎追我怕越追越远。", "ms": 74743, "narration": "艾琳娜，这路印子你也看了半天——今早有没有人拐向苔墓，你分得出吗？分不出我们就得换个法子。\n艾琳娜:「看不出来。印子新旧全糊在一起，我要是点头说认得，那是害你。」「换个法子：雾天里走过灌丛会带落水珠，路边矮灌哪一段是干的，那人就往哪拐。\n她说认不出。法子：雾天有人穿过灌丛会带落水珠，哪段矮灌是干的，人就往哪拐——一里内没线索她就回头。你定：① 就这么查 ② 沿小径继续走 ③ 现在就回", "refused": []}, {"id": "N2·8a", "kind": "plan", "input": "继续。", "ms": 17924.4, "narration": "那就沿小径走。你跟不跟、走到哪你肯回头，先定下来。\n艾琳娜:「走，我跟着你。不过丑话说前头——过了墓地边沿再走一里，还看不出个线索，我就掉头回镇，码头那单今天还接得上。」「你要是打算一直往北扎进去，那就直说，我好现在就把你我这段合伙算清楚。」\n那就沿小径往北走。走到墓地边沿再一里还没线索，艾琳娜掉头回镇，到那儿你自己定去留。\n行。她跟你走，过墓地边沿再一里没线索就掉头。路上找痕迹，你掷一下。", "refused": []}, {"id": "N2·8b", "kind": "resolve", "input": "", "ms": 36242, "narration": "[旅人 INT(在小径灌丛与路面痕迹上找出外乡人今早的走向): 4+0=4 < 12] → 失败\n\n你们踩着湿草往北走。雾从脚踝升到腰,小径两旁的矮灌越来越密,枝子上全是水珠,走过去裤腿就湿透。\n你照着艾琳娜说的法子看——哪一段灌丛是干的。走了一里,再看一里,每一丛都在滴水。分不出来。\n又走了半个时辰,路两侧开始出现歪斜的石碑,有的只剩半截,苔封得看不出字。石堆、塌墙、一截陷在土里的石阶。苔墓的边沿到了。\n雾在这里更厚,声音也闷。你们脚下的泥不再有车辙,只有一层松软的落叶和苔。\n艾琳娜蹲下来拨了拨最近的一丛灌,看了很久,摇头。她站起来,拍了拍手上的泥。\n「约好的一里,走完了。看不出。」\n「再往里,就是墓地里面了。这单子是狼嚎,不是找外乡人的——今天下去,我什么也带不回镇。」\n她把斗篷的领子拢紧,往南回头看了一眼。那边的雾里连镇子的影子都没有。\n「我回镇。你要跟来,我等你一段;你要往墓里扎,我拦不住你,也不陪你陪到没命。」\n她转身沿着来路往回走,脚步不快,走几步又停了半拍,像在等你说句什么。雾很快把她吞到只剩一个轮廓。\n\n// 异地 · 罗文 @ 碧石镇:「第三层，六十金。」我把斗篷上的雾水抖在地上，慢慢挪到那桌矿工近旁坐下，冲掌柜要了壶最便宜的热酒——不是给我自己壮胆，是给肯骂人的那位润喉。 「诸位别嫌我多事…", "refused": []}, {"id": "N2·9a", "kind": "plan", "input": "艾琳娜，你回镇吧——我不找外乡人了，我进苔墓找狼；要是天黑前没出来，你就别等我。", "ms": 7939.1, "narration": "照你说的：她回镇，你留下找狼。你往苔墓里面走。", "refused": []}, {"id": "N2·9b", "kind": "resolve", "input": "", "ms": 43635, "narration": "你站在原地，看她的轮廓被雾一点一点合上，直到分不出是人是石。\n背包侧袋里那只罩灯取出来，火绒擦了三次才着。玻璃罩里就一小团黄光，照不出三步远。\n你沿石板往北。塌墙、半截石碑、陷在土里的石阶，雾里全变成同一片灰。走了很久才看见那道门框——石砌的，门楣上苔封得厚，门扇塌了一半，斜插在土里。\n你在门槛外站了一会儿，灯举高，又放下。\n石阶往下七八级。两侧墙贴满苔，摸上去湿冷，指头一按就出水。这里把声音也吸掉，走一步，只有鞋底蹭石的响声。\n底下是一间前室。拱顶压得很低，地上积着一层浅水，脚一落就起涟漪。空气里有水腥、腐叶，还有别的——臊的，活的。\n灯举高。地上的苔被新刨开一大片，散着碎骨和黑色兽粪，几道很深的爪印从这儿一直拖到侧面的门洞里去。\n低语是这时起来的。像有人在很远的地方说话，听不清字，节奏也不像跟你说话。你停下，它也停下；你走，它又起。\n侧面门洞里有东西在拖。湿的东西蹭着石头，一下，一下。两团影子低着身子撑出来，一左一右，正好把你和石阶隔开。\n狼。瘦得肋骨一根根顶在皮下，毛结成一片片，眼睛在灯下返绿。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「一里到了，碑都冒出来了，线索一个没有——按我说的，回头。」 「回镇上。码头那单雾里失踪的还接得上，我去公会把它挂上我的名。」\n// 异地 · 罗文 @ 碧石镇:我把热酒推到那位骂得最凶的矿工面前，自己也倒了半杯，没急着喝——先听他杯子碰桌那一声，掂量他是真怕还是嘴上硬。「别光骂啊，兄弟，」我压低了嗓子，「那响动是石头…", "refused": []}, {"id": "N2·10a", "kind": "plan", "input": "结伴打——两只,别被它们一左一右夹住。我把灯举在左手上晃它们的眼,背贴住墙往侧面门洞那退半步,右手拔刀,等左边那只先扑上来就朝它脖颈劈。", "ms": 2207.6, "narration": "这里没有同伴,就你一个。灯举左手,背贴墙退半步,等左边那只先扑,劈它脖颈。", "refused": []}, {"id": "N2·10b", "kind": "resolve", "input": "", "ms": 27295, "narration": "灯举到左手，玻璃罩挡住半边脸，那一小团黄光在湿墙上晃开一片。两团绿光贴在一起又分开——左边那只偏了偏头，右边那只往后缩了半步。\n你背贴上墙，脚跟往侧面门洞的方向挪了半步。石面又湿又滑，鞋底蹭出一声轻响。\n右手摸到剑柄，抽出来。铁声在前室里很短，被拱顶吃掉。\n左边那只先动了。前爪一压地，肋骨在皮下起伏，低着脖子压过来，嘴里没叫，只有气。\n右边那只绕着水洼走弧线，往你右边月牙一样包。地上的浅水被它踩出一串涟漪。\n你盯着左边那只的脖子，那一小截露在乱毛外头，随它一步步往前挪。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「老板，雾中失踪者那单——还挂在板上吧？我要接。」 「规矩你讲一遍，我照着来。别给我留模棱两可的口子，我今天就得有张签了名的东西。」\n// 异地 · 罗文 @ 碧石镇:「别急着灌，酒跑不了。」我等那矿工的杯子放稳，才把声音压到桌子两边正好听得见的程度，「你就告诉我一件事——那响动，是石头裂开的动静，还是像有东西在里头喘气？」…", "refused": []}, {"id": "N2·11a", "kind": "plan", "input": "我往侧面门洞再退半步，把左边这只引到门框边上，趁它扑过来时刀锋迎它脖颈。", "ms": 3984.0, "narration": "你贴门框再退半步，把左边那只引到框边，等它扑上来时刀锋迎脖颈。灯还举在左手。", "refused": []}, {"id": "N2·11b", "kind": "resolve", "input": "", "ms": 60105, "narration": "[旅人 DEX(侧移引它撞上门框并抢到迎颈一击): 5+2=7 < 12] → 失败\n[旅人 DEX(谁先动): 20+2=22 >= 12] → 成功\n\n灯举在左手里。你贴门框撤那半步，脚跟先落——正踩上一块浮苔。石头在浅水里一滑，你人往侧一栽，肩膀撞在门框上，灯罩晃开，黄光在墙上甩出一道弧。\n就这一晃，左边那只没扑。前爪一收，偏开半步，绕着水洼直取你正面。门框这侧空着，引它撞框那半招落了空。\n刀没停。你比它快——肩还没直起来，剑已从左腰翻出去，刃锋对着乱毛外那截脖子。它低着脑袋，正撞进这道空当。\n右边那只同时在往你另一侧绕，踩水的响声一串追着一串。\n拱顶下的低语还在转，不紧不慢，像在数数。\n你把肩顶住门框，止住那一栽。滑劲还没散，撞疼也顾不上——手腕顺着剑势翻出去。\n它低着脑袋撞进这道空当，刃锋迎上去，两下里撞在一处。\n侧移那半步没成——引它撞门框的算盘落了空，它偏开水洼，直取你正面。可你比它快：肩还没直起来，剑已从左腰翻出去。\n刃锋撞上那截乱毛外的脖子，进得很深。它没叫出声，前爪在湿石上一撑，滑了半尺，软下去。浅水里翻起一团黑。\n右边那只同时扑到。你没腾出手，它咬在你持灯那条臂上——牙隔着袖布咬实，猛地一扯，袖子破了，皮肉开一道。\n它落地就退，压着水往后撤半步，嘴里挂着布片，又绕起来。\n拱顶下那串低语不紧不慢，一，二，像在数你身上开了几道口。\n\n// 异地 · 艾琳娜 @ 冒险者公会:「赫伦老板，Q001——雾中失踪者。挂在板上没人接的那单，我接。」 「登记簿给我，名字写艾琳娜·维尔。要押金或保人你直说，我兜里的钱不多，但手是稳的。」\n// 异地 · 罗文 @ 碧石镇:矿工的手先动了——指节在杯沿上蹭了一下，才去端酒。这就够了，比他说什么都有用。我把杯子往他那边又推了半寸，笑着压低嗓子：「你手抖了，兄弟。我不问第三层有什么了…", "refused": []}, {"id": "N2·12", "kind": "resolve", "input": "我背顶住门框不再动，把灯压到膝边只留一线光，让它看不清我；它再扑就朝它胸口和咽喉之间捅进去。", "ms": 50220, "narration": "你把背整个压死在门框上。脚不再挪，肩膀抵住石面，把两只泥苔鼠所有能走的线都收成一条——正前方。\n左手的灯往下沉，沉到膝边靠近湿石，灯芯压到只剩一线，玻璃罩把光刮成薄薄一片。你半边身子进了暗里，右边墙上那团月牙形的影子没了。\n对面的绿光闪了两下。右边那只绕 雾里照旧醒着，没为你的死活多停一刻。\n\n// 异地 · 罗文 @ 矿工大道:「石津方向来的雾，连门楼的翡翠都啃得发白。」我拍了拍镇标上那层凉水汽，没急着进城——先顺着矿工大道的车辙看两眼，哪条辙印最深、哪块石头被踩得最滑，故事都写在那…", "refused": []}]}, {"id": "S4", "title": "[状态与后果] 睡一夜", "category": "状态与后果", "checks": {"every_beat_plan_or_resolve": {"pass": true, "got": "[\"opening\", \"plan\", \"resolve\", \"plan\", \"plan\", \"resolve\"]"}, "no_state_change_while_planning": {"pass": true, "got": "none"}, "no_dice_while_planning": {"pass": true, "got": "none"}, "slept_past": {"pass": true, "got": "D1 08:30→D2 07:40"}, "tired_gone": {"pass": true, "got": "null"}}, "beats": [{"id": "S4·0", "kind": "opening", "input": "开始游戏", "ms": 1943, "narration": "黎明前的雾像湿布一样压在驿路上。你披着旅行斗篷，靴子沾满泥水，终于看见一扇歪斜的木栅门，门上挂着褪色的牌子：「石津镇 · 欢迎来到灰雾北境」。镇子还没有真正醒来，只有远处旅店窗里漏出一点橙色灯光。你想不起自己是谁——名字、来历、为什么会在这里、该去找谁，都像被雾吃掉了一样。只有身体还记得怎么握剑。\n\n① 自由行动 / ② 和守门人说话 / ③ 直接走向镇中央 / ④ 先观察雾中的街道和旅店灯光", "refused": []}, {"id": "S4·1a", "kind": "plan", "input": "顺着那点灯光走过去，看看是不是旅店。", "ms": 3390.6, "narration": "顺着石板路往那点橙色灯光走，就是河灯旅店，通铺 3 金一晚。", "refused": []}, {"id": "S4·1b", "kind": "resolve", "input": "", "ms": 24803, "narration": "石板缝里积着水，踩下去有细响。雾里先露出挑檐的黑影，再是一盏罩着铁网的灯——门楣上熏黑的木牌写着两个字：河灯。窗纸后面透出暖光，烟囱在轻轻吐烟，是有人在里头生火的样子。\n身后几步远，另一个人的脚步声没有藏。她踩着同一片水洼跟上来，在灯下站住，呵出的白气散得很快。年轻，斗篷旧，肩上挎着个不大的行囊，右手离腰侧的短剑不远。她看你，像在等一个答案，也像在试探你值不值得跟着走一段。\n「那盏灯是守夜人的炉子，还是能收人过夜的地方？」\n雾里没有别的灯。再往镇里去，石板路往两边散开，深处是黑的。\n\n// 异地 · 罗文 @ 西门:「冷雾天最适合听墙角——公会那块告示牌底下永远蹲着几个嘴比矿灯还亮的家伙，我去捞两句真的。」他把酒钱拍在桌上，拎起背包往门口走。", "refused": []}, {"id": "S4·2", "kind": "plan", "input": "这事不急——我先进去问有没有房，累得站不住了。你要住就跟进来。@dm 推开河灯旅店的木门，进去问掌柜要一间房。", "ms": 6264, "narration": "米拉在柜台后擦杯子:「通铺 3 金,单间 8 金。单间睡醒当天,说话办事都顺一点。」你要哪种?", "refused": []}, {"id": "S4·3a", "kind": "plan", "input": "单间，8金。我这就睡，明早再结账也行的话就最好了。", "ms": 17434.4, "narration": "米拉:「行——8金,明早一并算。楼上左手第二间,钥匙在门上。」\n艾琳娜:「我也要歇脚。8金的单间我住不起——米拉，你这里有通铺，或者一顿热汤换柴火、换草药的活计吗？我手稳，认药也认刀口。」\n米拉:「通铺 3 金。没现钱也行——天亮去码头卸货,或到药铺分草,干半天顶一晚。」你上楼睡下,明早一并结账。", "refused": []}, {"id": "S4·3b", "kind": "resolve", "input": "", "ms": 36811, "narration": "楼板在你脚下响了一声，就再没别的声音。窗外河水拍着石岸，隔一阵一下 const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const cls = (ok, n) => !n ? "" : ok === n ? "c-ok" : ok === 0 ? "c-bad" : "c-mid";
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

function mdTable(md) {  // pipe tables + plain lines; enough for the KPI summaries
  const out = []; let rows = [];
  const flush = () => {
    if (!rows.length) return;
    const body = rows.filter(r => !/^\|\s*-/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(x => x.trim()));
    out.push(`<div class="panel scroll"><table><thead><tr>${body[0].map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
      body.slice(1).map(r => `<tr>${r.map((c, i) => `<td class="${i ? "num" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    rows = [];
  };
  for (const ln of md.split("\n")) { if (ln.trim().startsWith("|")) rows.push(ln.trim()); else { flush(); if (ln.trim()) out.push(`<p class="muted">${esc(ln)}</p>`); } }
  flush(); return out.join("");
}

  <footer>Generated by <code>benchmarks/site.py</code>. Each experiment page holds the full transcript of every run.</footer>`;
  const chips = () => {
    $("#cats").innerHTML = [["", "All", cat.cases.length], ...cat.categories.map(c => [c, c, counts[c]])].map(([v, t, n]) =>
      `<button class="chip" data-c="${esc(v)}" aria-pressed="${pick === v}">${esc(t)}<span class="n">${n}</span></button>`).join("");
  };
  const rows = () => {
    const ql = q.toLowerCase();
    const xs = cat.cases.filter(c => (!pick || c.category === pick) &&
      (!ql || [c.id, c.title, c.goal, ...c.checks, ...c.merged].join(" ").toLowerCase().includes(ql)));
    $("#rows").innerHTML = xs.map(c => `<tr><td class="id">${esc(c.id)}</td>
      <td><span class="tag cat">${esc(c.category)}</span><b>${esc(c.title)}</b>${c.merged.length ? ` <span class="muted">(merges ${esc(c.merged.join(", "))})</span>` : ""}
        <div class="goal">${c.goal ? esc(c.goal) : ""}</div></td>
      <td>${c.checks.map(k => `<span class="tag">${esc(k)}</span>`).join("") || `<span class="muted">—</span>`}</td>
      <td class="hide-sm">${(used[c.id] || []).map(e => `<a class="tag" href="${BASE}records/${encodeURIComponent(e)}/index.html">${esc(e)}</a>`).join("") || `<span class="muted">—</span>`}</td></tr>`).join("")
      || `<tr><td colspan="4" class="muted">No case matches.</td></tr>`;
  };
  chips(); rows();
  $("#cats").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; pick = b.dataset.c; chips(); rows(); });
  $("#q").addEventListener("input", e => { q = e.target.value; rows(); });
}

function experiment() {
  const {experiment: m, runs, catalog: cat} = DATA;
  const byId = Object.fromEntries(cat.cases.map(c => [c.id, c]));
  const cases = [...new Set(Object.values(runs).flatMap(r => r.cases.map(c => c.id)))];
  const order = id => { const c = byId[id]; return c ? cat.categories.indexOf(c.category) * 1000 + cat.cases.indexOf(c) : 99999; };
  cases.sort((a, b) => order(a) - order(b));
  const PROC = new Set(cat.process_checks);
  const passOf = (c, k) => k !== "process" ? (c.checks[k] ? c.checks[k].pass : null)
    : (Object.keys(c.checks).some(x => PROC.has(x)) ? Object.entries(c.checks).every(([x, v]) => !PROC.has(x) || v.pass) : null);
  // a run whose last beat is still the talk: what the player agreed to was never settled, so a failed check there says
  // more about the talk than about the state
  const unsettled = c => (c.beats.at(-1) || {}).kind === "plan";
  const tally = (g, cid, k) => { let ok = 0, n = 0, u = 0;
    for (const r of g.runs) { const c = runs[r.label].cases.find(x => x.id === cid); const p = c ? passOf(c, k) : null;
      if (p !== null) { n++; ok += p; if (!p && unsettled(c)) u++; } }
    return [ok, n, u]; };
  let rowsHtml = "";
  for (const cid of cases) {
    const all = [...new Set(m.groups.flatMap(g => g.runs.flatMap(r => Object.keys((runs[r.label].cases.find(x => x.id === cid) || {}).checks || {}))))];
    const keys = [...all.filter(k => !PROC.has(k)), ...(all.some(k => PROC.has(k)) ? ["process"] : [])];
    keys.forEach((k, i) => {
      const t = m.groups.map(g => tally(g, cid, k));
      const differ = new Set(t.map(([a, b]) => b ? (a / b).toFixed(2) : "-")).size > 1;
      rowsHtml += `<tr class="case-row ${differ ? "diff" : ""}" data-case="${esc(cid)}">
        <td class="id">${i ? "" : esc(cid)}</td><td>${i ? "" : `<b>${esc((byId[cid] || {}).title || cid)}</b><br>`}<span class="muted">${esc(k)}</span></td>
        ${t.map(([a, b, u]) => `<td><span class="cell ${cls(a, b)}">${b ? `${a}/${b}` : "—"}</span>${u ? `<span class="unset" title="${u} failed run${u > 1 ? "s" : ""} ended in the talk, never settled">${u} unsettled</span>` : ""}</td>`).join("")}</tr>`;
    });
  }
  $("#app").innerHTML = `
  <header class="top">
    <span class="crumb"><a href="${BASE}index.html">WorldLines Play Suite</a> · experiment · ${esc(m.id)}</span>
    <h1>${esc(m.title)}</h1>
    <p class="lede">${esc(m.question)}</p>
    <div class="facts"><span>date <b>${esc(m.date)}</b></span>
      ${m.groups.map(g => `<span>${esc(g.name)} <b>${esc(g.commit || "")}</b> · ${g.runs.length} run${g.runs.length > 1 ? "s" : ""} · arm ${esc(g.runs[0]?.arm || "")}</span>`).join("")}</div>
  </header>
  ${m.summary_md ? `<h2>Summary</h2><div class="md">${mdTable(m.summary_md)}</div>` : ""}
  <h2>Checks by case</h2>
  <p class="muted" style="font-size:13px;margin:-4px 0 10px">Passed / runs for each group. <i>process</i> = the ${cat.process_checks.length} process checks all passed. Rows where the groups differ are tinted. <i>unsettled</i> = failed runs whose last beat was still the talk (the action was agreed but never settled). Select a row to read the transcripts.</p>
  <div class="panel scroll"><table><thead><tr><th>Case</th><th>Check</th>${m.groups.map(g => `<th>${esc(g.name)}</th>`).join("")}</tr></thead>
  <tbody id="mx">${rowsHtml}</tbody></table></div>
  <h2 id="tx-h">Transcript</h2>
  <div class="panel" id="tx"><p class="muted" style="padding:14px;margin:0">Select a case above.</p></div>
  <footer><a href="${BASE}index.html">← All cases and experiments</a></footer>`;
  let cur = null, sel = null;
  const show = () => {
    const opts = m.groups.flatMap(g => g.runs.map(r => ({g: g.name, r})));
    sel = sel && opts.find(o => o.r.label === sel.r.label) ? sel : opts[0];
    const c = runs[sel.r.label].cases.find(x => x.id === cur);
    $("#tx-h").textContent = `Transcript · ${cur} ${(byId[cur] || {}).title || ""}`;
    $("#tx").innerHTML = `<div class="pick">${opts.map(o => `<button class="chip" data-l="${esc(o.r.label)}" aria-pressed="${o === sel}">${esc(o.g)} · run ${o.r.run}</button>`).join("")}</div>
      ${c ? `<div class="beats">
        ${unsettled(c) ? `<div class="ref">This run ended in the talk: the last thing agreed was never settled.</div>` : ""}
        <div class="muted" style="font-size:13px">${Object.entries(c.checks).map(([k, v]) => `<span class="cell ${v.pass ? "c-ok" : "c-bad"}" title="${esc(v.got)}">${v.pass ? "✓" : "✗"} ${esc(k)}</span>`).join(" ")}</div>
        ${c.beats.map(b => `<div class="beat ${esc(b.kind)}"><div class="meta">${esc(b.id)} · ${esc(b.kind || "beat")} · ${b.ms != null ? (b.ms / 1000).toFixed(1) + " s" : ""}</div>
          <div class="say">${esc(b.input)}</div><div class="prose">${esc(b.narration)}</div>
          ${b.refused.length ? `<div class="ref">refused: ${b.refused.map(esc).join(" · ")}</div>` : ""}</div>`).join("")}</div>`
      : `<p class="muted" style="padding:14px">This run has no ${esc(cur)}.</p>`}`;
  };
  $("#mx").addEventListener("click", e => { const tr = e.target.closest("tr[data-case]"); if (!tr) return; cur = tr.dataset.case; show(); $("#tx-h").scrollIntoView({behavior: "smooth"}); });
  $("#tx").addEventListener("click", e => { const b = e.target.closest(".chip[data-l]"); if (!b) return;
    sel = m.groups.flatMap(g => g.runs.map(r => ({g: g.name, r}))).find(o => o.r.label === b.dataset.l); show(); });
  if (cases.length) { cur = cases[0]; show(); }
}

KIND === "home" ? home() : experiment();
</script>
</body>
</html>
